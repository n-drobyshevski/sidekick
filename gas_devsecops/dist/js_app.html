ware composition analysis: a known CVE in a third-party package at a version.","Fixed by upgrading the dependency \u2014 which means it cannot be fixed at all until a fixed version exists."]},{id:"awaiting-fix",term:"Awaiting a fix",lines:["An open SCA finding whose package has no fixed version published yet.","Counting the wait for a vendor as remediation time measures the vendor, not the team, so these rows are reported separately."]},{id:"two-clocks",term:"The two clocks",lines:["Detection to remediation is one clock; it includes any time spent waiting for a fix to exist.","Actionable time is the second: it starts when a fix becomes available, and is the only one the team controls.","Both are published, because either alone can be read as the whole story."]},{id:"secret-resolved",term:"Resolved (secret)",lines:["A secret finding leaves the register when the credential is out of the code.","That is not the same as the credential being safe: a committed secret stays live until it is rotated, and git history keeps it readable.","Removal and rotation are tracked separately for that reason."]},{id:"coverage",term:"Coverage",lines:["Of everything that deserved remediation, the share that was remediated.","Always published beside efficiency: either one alone can be bought by moving the rule."]},{id:"efficiency",term:"Efficiency",lines:["Of everything that was remediated, the share that deserved it.","Always published beside coverage."]},{id:"validation-state",term:"Validation state",lines:["Whether Wiz has confirmed a detected credential still works: UNKNOWN, VALID, INVALID or ERROR.","VALID means live, INVALID means confirmed dead \u2014 UNKNOWN and ERROR mean nobody has checked, which is neither.",'393,443 of 394,927 secret instances in this tenant read UNKNOWN, so folding that into "not rotated" would misprice 99.6% of the register.']},{id:"rotated",term:"Rotated",lines:["The credential was observed dead: validation state read INVALID and the ledger stamped the date
