page shows the time by which 25% were fixed instead.']},{id:"censoring",term:"Censored",lines:["A still-open finding has been open at least this long; how long it will take is unknown.","Dropping those rows and averaging the rest is how a remediation figure flatters its owner.","The curve keeps them as right-censored observations, which is what makes the half-life honest."]},{id:"disappearance",term:"Dated by disappearance",lines:["A finding dated closed at the first scan that stopped returning it.",'An upper bound: "gone by 12 Aug", never "resolved 12 Aug".',"The API publishes no resolution date for it, so the error is the interval between two scans.","Until two syncs have run and findings have begun to disappear between them, a register dated this way reads near-zero \u2014 an absence of observations, not a fast team."]},{id:"sla-target",term:"SLA target",lines:["The remediation window for a severity, in days.","In SLA means resolved on or before the target \u2014 the comparison is inclusive."]},{id:"sast",term:"SAST",lines:["Static analysis of first-party code: a weakness class (CWE) at a file and line.","Fixed by changing the code, so there is no vendor to wait for."]},{id:"sca",term:"SCA",lines:["Software composition analysis: a known CVE in a third-party package at a version.","Fixed by upgrading the dependency, so it cannot be fixed at all until a fixed version exists."]},{id:"awaiting-fix",term:"Awaiting a fix",lines:["An open SCA finding whose package has no fixed version published yet.","Reported separately: the wait measures the vendor, not the team.","Counting it as remediation time would credit or blame the wrong party.","Not measurable here: SCA is fetched only where a fixed version exists, so none still waiting is seen."]},{id:"two-clocks",term:"The two clocks",lines:["Detection to remediation is one clock, including any wait for a fix to exist.","Actionable time starts once a fix exists \u2014 the only one the team controls.","Both are published, because either alone can be read as the whole story."]},{id:"secret-resolved",term:"Resolved (secret)",lines:["A secret finding leaves the register when the credential is out of the code.","Not the same as safe: it stays live until rotated, and git history keeps it.","Removal and rotation are tracked separately for that reason."]},{id:"coverage",term:"Coverage",lines:["Of everything that deserved remediation, the share that was remediated.","Always published beside efficiency: either one alone can be bought by moving the rule."]},{id:"efficiency",term:"Efficiency",lines:["Of everything that was remediated, the share that deserved it.","Always published beside coverage."]},{id:"validation-state",term:"Validation state",lines:["Whether Wiz confirmed a credential still works: UNKNOWN, VALID, INVALID, ERROR.","VALID is live, INVALID confirmed dead; UNKNOWN and ERROR are neither.",'393,443 of 394,927 secret instances in this tenant read UNKNOWN, so folding that into "not rotated" would misprice 99.6% of the register.']},{id:"rotated",term:"Rotated",lines:["The credential was observed dead: validation state read INVALID and the ledger stamped the date it first did.","Not the same as the secret leaving the code \u2014 see Removed."]},{id:"removed",term:"Removed",lines:["The secret's string left the repository's HEAD.","Removed is not rotated: it is live until Rotated says otherwise.","And it is still readable in git history."]},{id:"time-to-revoke",term:"Time to revoke",lines:["Detection to confirmed-invalid, as median, P90 and share within SLA.","A never-validated secret is excluded, not censored: it supports no claim.","The excluded count is published beside the figure so the denominator can be checked."]},{id:"foothold",term:"Foothold",lines:["An asset \u2014 a repository, or a product made of several \u2014 carrying at least one open high-risk finding.","One is enough: a foothold is a yes/no property of the asset, not a count."]},{id:"capacity",term:"Capacity",lines:["Whether remediation is keeping up with new findings arriving, month by month.","Gaining, keeping up or falling behind \u2014 the close rate against the arrival rate.","Only capacity absorbs inflow, so the verdict compares rates rather than counts, with a dead band around zero."]},{id:"mmcr",term:"Monthly mean closure rate",lines:["Each month's close rate, averaged across the months actually observed.","The denominator is that month's starting backlog, nothing else.","Closings divided by what was already open at the start of that month \u2014 not over new arrivals, and not over the whole register."]},{id:"closed-per-month",term:"Findings closed per month",lines:["Findings closed in a mean calendar month, over the months the rate averages over.","The rate's absolute half, which the rate alone cannot supply.","One in ten a month is four findings on a small register and four hundred on a large one."]},{id:"kev",term:"On KEV",lines:["CISA's Known Exploited Vulnerabilities catalogue: CVEs someone has actually exploited.","Reliable evidence about the CVE, not a claim this finding is reachable here.","It raises the priority of a finding; it does not decide it.","A row Wiz never evaluated against the catalogue is unknown, not absent from it, which is why these counts are reported as a floor."]},{id:"known-exploit",term:"Known exploit",lines:["Public exploit code exists for the CVE.","Weaker than KEV: code published is not exploitation observed.","A CVE can carry this and not be on KEV, and the reverse."]},{id:"epss",term:"EPSS score",lines:["Exploit Prediction Scoring System: the odds a CVE is exploited in the next 30 days.","A FORECAST, not an observation \u2014 what may happen rather than what has.","It is a probability, so a high score on a large register still describes many findings that will never be attacked."]},{id:"ai-verdict",term:"AI triage verdict",lines:["The scanner's own judgement that a static-analysis finding is real.","A vendor opinion, not a measurement: one clause of the high-risk rule, never the whole.","It has never actually fired in this tenant: every SAST node captured so far carries a null aiAnalysis, so a zero beside it means nobody was asked, not that the AI looked and disagreed.","The values that count are EXPLOITABLE, TRUE_POSITIVE, CONFIRMED and VULNERABLE (domain/config.ts's AI_VERDICTS_HIGH). That vocabulary is UNVERIFIED against this tenant, so a register where every row reads unevaluated means either the field is not being returned or those are the wrong strings \u2014 both worth knowing, and neither of them a finding about the code."]},{id:"signal-coverage",term:"Signal coverage",lines:["How much of the column a risk clause rests on was captured, over the rows it applies to.","A measured 0% is a measurement, not a blank.","It separates \u201Cthe AI agreed with nothing\u201D from \u201Cnobody asked the AI\u201D. \u201CNot applicable\u201D is a third statement \u2014 no row in scope has such a column at all.","The clauses are OR'd and overlap, so what each one fired on never sums to the high-risk count."]},{id:"reconstructed",term:"Reconstructed month",lines:["A month rebuilt rather than observed, ending before this register started watching.","Marked so it is not read as measured: the backlog is real, but nobody was watching."]},{id:"unclassified",term:"Unclassified",lines:["A finding the risk rule could not place as high-risk or not.","Reported outside the 2\xD72, never folded into a corner of it.","Most often a secret, which this register refuses to score by severity."]},{id:"cwe-top-25",term:"CWE Top 25",lines:["MITRE's 2024 list of the most dangerous weakness classes, which SAST scores against.","A child weakness folds onto its Top-25 ancestor first.","CWE-23 counts as CWE-22, CWE-80 as CWE-79 \u2014 scanners report leaves and the list is mostly interior nodes."]},{id:"twin",term:"Twin",lines:["One secret at one line, reported once against its repository and once against a branch.","The ledger keys on (secret, path, line) and keeps the earlier birth date.","187 keys in this tenant span both, a median 19.9 days apart.","Keying on Wiz's externalId instead would look unique and quietly double the register."]},{id:"sla-band",term:"SLA band",lines:["An SLA is a band the population is kept inside, not a wall a single finding hits.","Read it as a distribution: how much of the window each open finding has consumed.","And how many are already past it."]},{id:"rail-status",term:"Rail status",lines:["Only exceptions speak: a sync running or failed, nothing to sync with, a register never measured, a scan gone old.","Never-measured outranks old: a register nobody looked at is unmeasured, not stale."]},{id:"compaction",term:"Compaction",lines:["Folds the oldest saved scans into episodes, keeping their totals.","Their per-finding observations are pruned, reclaiming cells and archive bytes.","The most recent scans are never candidates, and the dry run states what would go before anything goes."]},{id:"sealed",term:"Sealed",lines:["A saved scan whose per-finding observations compaction has already pruned.","Its totals stay; the detail behind them is gone.","It cannot be deleted from the Storage page \u2014 the archive it pointed at was reclaimed when it was sealed."]},{id:"episode",term:"Episode",lines:["One finding's settled lifetime \u2014 first seen, how it ended, when.","The clock survives compaction; the per-scan observations behind it do not.","A finding seen again after its episode begins a new one."]},{id:"movement",term:"Movement",lines:["The open backlog now against the same register at the previous sync.","A rising count is worse. The comparison is between two syncs, not two dates.","A register only learns anything on the days it looks.","Each register has its own window: the three share one scan log, and a scan of one of them looked at none of the others."]},{id:"fix-next",term:"Fix next",lines:["Ranked by what cannot wait rather than by severity.","Grouped by repository \u2014 the smallest unit somebody can be asked to own.","The order is: a credential somebody confirmed is live, then a fixable dependency finding already late, then a critical code weakness already late."]},{id:"sla-edge",term:"SLA edge",lines:["The day count splitting one severity's open findings into late and not late.","Its own SLA target, read against the age buckets.","A deadline rarely lands on a bucket's boundary, so a bucket is usually part in and part out; a rule is drawn on the chart only where every severity shares one exact edge."]},{id:"cold-zone",term:"Cold zone",lines:["A repository with open findings and no movement for the whole cold-zone window.","Nothing resolved, removed or rotated on it in that time.","Measured at the last scan, never against today, so the same saved ledger always reads the same. With no movement on record the figure is a lower bound \u2014 see Lower bound.","The window is either a fixed number of days or a share of the estate \u2014 see Cold-zone mode. A repository the scanner has stopped returning is Unobserved instead: counted apart, and never counted as warm."]},{id:"cold-zone-mode",term:"Cold-zone mode",lines:["Fixed window: cold after a set number of idle days, the same number every week.","Relative: the line follows the population, so the idlest share is always cold.","Fixed is the number an operator can be held to. Relative never falls below the floor, and moves as the population moves instead of standing still while it does.","Whichever mode is on, the page prints the line it produced in days, the share it was aiming at and the share it actually drew \u2014 those last two disagree in both directions by design. Set on the Deadlines tab in Settings."]},{id:"lifecycle",term:"Lifecycle",lines:["Where the tenant says a repository is in its life: production, development, end of life.","Read off its lifecycle tag in Wiz and printed as written.","Blank means no lifecycle is known: either the repository carries no such tag, or the tag map has never been refreshed. It is never read as \u201Calive\u201D, and a blank tag excludes a repository from nothing.","Refresh it from Settings > System, which also reports how many repositories the key actually placed."]},{id:"end-of-life",term:"End of life",lines:["A repository the tenant has retired, by its lifecycle tag.","Nobody closes findings on one, so its silence and its clock both mislead.","Settings > Deadlines carries two switches: one leaves these out of the cold zone, the other out of the remediation-speed figures. Both off by default, and neither guesses at an unfamiliar word.","Whichever is on, a retired repository's findings stay in every count of what is open \u2014 the backlog, the density and the severity breakdowns are untouched by either."]},{id:"coldest-share",term:"Coldest share",lines:["In relative mode, the products with the highest share of their repositories cold.","A position relative to the other products, never a verdict about any one of them.","A product with no cold repository is never marked, however small the estate; products tied at the cutoff are all marked rather than split by name.","Ranked over the products that have at least one repository with an open finding. A product with nothing open has no share to rank and carries no position at all."]},{id:"unobserved",term:"Unobserved",lines:["The scanner stopped returning this repository: nothing on it reached the last scan.","On Dependencies and Secrets, 3+ open findings on it close as a drop-out \u2014 not counted as fixes.","So it is tested first, counted apart, and never counted as warm or cold. No finding on it reached the last scan of any register it has rows in. Its Code findings close as fixes rather than as a drop-out: that scan returns open findings only, so a repository whose findings were all fixed looks exactly the same.","Two very different things land here, and the census draws them apart. A repository that was fixed and then archived is unobserved for as long as the ledger remembers it \u2014 nothing open, nothing to do, and on a long-lived register most of the figure. The one worth acting on is a repository the scanner lost while findings were still open on it: that backlog is real and nobody will be told about it again."]},{id:"idle",term:"Idle days",lines:["Days since the last finding resolved, removed or rotated on a repository.","Measured from the last scan, never from today.","Where nothing has ever moved there is no measurement, so the count runs from when we started watching and is published as a lower bound."]},{id:"returned",term:"Returned",lines:["Seen again after it had been resolved. Its clock restarted on this sighting.","The earlier episode is not in this figure: age counts only from the return."]}];function ou(e){let t=String(e||"").trim().toLowerCase();return t&&nu.find(n=>n.id===t)||null}function su(){return nu.slice()}function ib(e){return e.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}function _i(e){return String(e==null?"":e).trim().toLowerCase()}function lb(e,t){if(!t.length)return!0;let n=(e.term+" "+e.lines.join(" ")).toLowerCase();return t.every(o=>new RegExp("\\b"+ib(o)).test(n))}function cb(e,t,n){let o=Array.isArray(e)?e:[],s=_i(t).split(/\s+/).filter(Boolean),r=_i(n),c=[...o.filter(d=>lb(d,s))].sort((d,p)=>d.term.localeCompare(p.term)).map(d=>({id:d.id,term:d.term,lines:d.lines.slice(),linked:!!r&&d.id===r}));return{groups:c.length?[{family:null,entries:c}]:[],match:r&&o.some(d=>d.id===r)?r:null,total:o.length}}function au(e){return"term-"+e}function db(e){let t=a("div",{class:"help-entry"+(e.linked?" help-entry--linked":""),id:au(e.id),tabindex:"-1","aria-current":e.linked?"true":null});t.append(a("div",{class:"help-entry-term"},a("span",{},e.term),e.linked?a("span",{class:"help-entry-linked-tag"},"\u21B3 linked"):null));for(let n of e.lines)t.append(a("p",{class:"help-entry-line"},n));return t}function ub(e,t){H(e);for(let n of t){n.family&&t.length>1&&e.append(a("h2",{class:"section-labe
