eserved it.","Always published beside coverage."]},{id:"validation-state",term:"Validation state",lines:["Whether Wiz has confirmed a detected credential still works: UNKNOWN, VALID, INVALID or ERROR.","VALID means live, INVALID means confirmed dead \u2014 UNKNOWN and ERROR mean nobody has checked, which is neither.",'393,443 of 394,927 secret instances in this tenant read UNKNOWN, so folding that into "not rotated" would misprice 99.6% of the register.']},{id:"rotated",term:"Rotated",lines:["The credential was observed dead: validation state read INVALID and the ledger stamped the date it first did.","Not the same as the secret leaving the code \u2014 see Removed."]},{id:"removed",term:"Removed",lines:["The secret's string left the repository's HEAD.","Removed is not rotated: the credential is live until Rotated says otherwise, and it is still readable in git history."]},{id:"time-to-revoke",term:"Time to revoke",lines:["The clock from detection to confirmed-invalid, reported as median, P90 and share within SLA.","A secret that was never validated is excluded, not censored \u2014 it supports no claim about whether it is still alive.","The excluded count is published beside the figure so the denominator can be checked."]},{id:"foothold",term:"Foothold",lines:["An asset \u2014 a repository or a language group \u2014 carrying at least one open high-risk finding.","One is enough: a foothold is a yes/no property of the asset, not a count."]},{id:"capacity",term:"Capacity",lines:["Whether remediation is keeping up with new findings arriving, read month by month.","A month is gaining, keeping up or falling behind: only capacity absorbs inflow, so the verdict compares the close rate with the arrival rate, not a count, with a dead band around zero."]},{id:"mmcr",term:"Monthly mean closure rate",lines:["Each month's close rate \u2014 closings divided by what was already open at the start of that month \u2014 averaged across the months actually observed.","Not closings over n
