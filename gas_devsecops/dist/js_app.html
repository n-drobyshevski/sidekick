 finding that is still open has been open at least this long, but we do not know how long it will end up taking.","Dropping those rows and averaging what is left is the single most common way a remediation figure flatters its owner.","The curve keeps them as right-censored observations, which is what makes the half-life honest."]},{id:"disappearance",term:"Dated by disappearance",lines:["A finding dated closed at the first scan that stopped returning it, because the API publishes no resolution date for it.",'An upper bound whose error is the interval between two scans: "gone by 12 Aug", never "resolved 12 Aug".',"Until two syncs have run and findings have begun to disappear between them, a register dated this way reads near-zero \u2014 an absence of observations, not a fast team."]},{id:"sla-target",term:"SLA target",lines:["The remediation window for a severity, in days.","In SLA means resolved on or before the target \u2014 the comparison is inclusive."]},{id:"sast",term:"SAST",lines:["Static analysis of first-party code: a weakness class (CWE) at a file and line.","Fixed by changing the code, so there is no vendor to wait for."]},{id:"sca",term:"SCA",lines:["Software composition analysis: a known CVE in a third-party package at a version.","Fixed by upgrading the dependency \u2014 which means it cannot be fixed at all until a fixed version exists."]},{id:"awaiting-fix",term:"Awaiting a fix",lines:["An open SCA finding whose package has no fixed version published yet.","Counting the wait for a vendor as remediation time measures the vendor, not the team, so these rows are reported separately."]},{id:"two-clocks",term:"The two clocks",lines:["Detection to remediation is one clock; it includes any time spent waiting for a fix to exist.","Actionable time is the second: it starts when a fix becomes available, and is the only one the team controls.","Both are published, because either alone can be read as the whole story."]},{id:"secret-resolved",term:"Resolved (secret)",lines:["A secret finding leaves the register when the credential is out of the code.","That is not the same as the credential being safe: a committed secret stays live until it is rotated, and git history keeps it readable.","Removal and rotation are tracked separately for that reason."]},{id:"coverage",term:"Coverage",lines:["Of everything that deserved remediation, the share that was remediated.","Always published beside efficiency: either one alone can be bought by moving the rule."]},{id:"efficiency",term:"Efficiency",lines:["Of everything that was remediated, the share that deserved it.","Always published beside coverage."]},{id:"validation-state",term:"Validation state",lines:["Whether Wiz has confirmed a detected credential still works: UNKNOWN, VALID, INVALID or ERROR.","VALID means live, INVALID means confirmed dead \u2014 UNKNOWN and ERROR mean nobody has checked, which is neither.",'393,443 of 394,927 secret instances in this tenant read UNKNOWN, so folding that into "not rotated" would misprice 99.6% of the register.']},{id:"rotated",term:"Rotated",lines:["The credential was observed dead: validation state read INVALID and the ledger stamped the date it first did.","Not the same as the secret leaving the code \u2014 see Removed."]},{id:"removed",term:"Removed",lines:["The secret's string left the repository's HEAD.","Removed is not rotated: the credential is live until Rotated says otherwise, and it is still readable in git history."]},{id:"time-to-revoke",term:"Time to revoke",lines:["The clock from detection to confirmed-invalid, reported as median, P90 and share within SLA.","A secret that was never validated is excluded, not censored \u2014 it supports no claim about whether it is still alive.","The excluded count is published beside the figure so the denominator can be checked."]},{id:"foothold",term:"Foothold",lines:["An asset \u2014 a repository, or a product made of several \u2014 carrying at least one open high-risk finding.","One is enough: a foothold is a yes/no property of the asset, not a count."]},{id:"capacity",term:"Capacity",lines:["Whether remediation is keeping up with new findings arriving, read month by month.","A month is gaining, keeping up or falling behind: only capacity absorbs inflow, so the verdict compares the close rate with the arrival rate, not a count, with a dead band around zero."]},{id:"mmcr",term:"Monthly mean closure rate",lines:["Each month's close rate \u2014 closings divided by what was already open at the start of that month \u2014 averaged across the months actually observed.","Not closings over new arrivals, and not closings over the whole register: the denominator is that month's starting backlog."]},{id:"closed-per-month",term:"Findings closed per month",lines:["The mean number of findings closed in a calendar month, averaged over exactly the months the closure rate is averaged over.","The rate's absolute half: one in ten a month is four findings on a small register and four hundred on a large one, and the rate alone cannot tell them apart."]},{id:"kev",term:"On KEV",lines:["CISA's Known Exploited Vulnerabilities catalogue: CVEs with reliable evidence that someone, somewhere, has actually exploited them.","Observed exploitation of the CVE \u2014 not a statement that this finding is reachable here. It raises the priority of a finding; it does not decide it.","A row Wiz never evaluated against the catalogue is unknown, not absent from it, which is why these counts are reported as a floor."]},{id:"known-exploit",term:"Known exploit",lines:["Public exploit code exists for the CVE.","A weaker claim than KEV and a different one: code being published is not the same as exploitation having been observed. A CVE can carry this and not be on KEV, and the reverse."]},{id:"epss",term:"EPSS score",lines:["Exploit Prediction Scoring System: the estimated probability that a CVE will be exploited in the next 30 days.","A FORECAST, not an observation \u2014 the one signal here that says what may happen rather than what has. It is a probability, so a high score on a large register still describes many findings that will never be attacked."]},{id:"ai-verdict",term:"AI triage verdict",lines:["The scanner's own judgement that a static-analysis finding is real. A vendor opinion, not a measurement this register made \u2014 which is why it is one clause of the high-risk rule and never the whole of it.","It has never actually fired in this tenant: every SAST node captured so far carries a null aiAnalysis, so a zero beside it means nobody was asked, not that the AI looked and disagreed.","The values that count are EXPLOITABLE, TRUE_POSITIVE, CONFIRMED and VULNERABLE (domain/config.ts's AI_VERDICTS_HIGH). That vocabulary is UNVERIFIED against this tenant, so a register where every row reads unevaluated means either the field is not being returned or those are the wrong strings \u2014 both worth knowing, and neither of them a finding about the code."]},{id:"signal-coverage",term:"Signal coverage",lines:["How much of the column a risk clause rests on was ever captured, over the rows that clause applies to.","A measured 0% is a measurement: it separates \u201Cthe AI agreed with nothing\u201D from \u201Cnobody asked the AI\u201D. \u201CNot applicable\u201D is a third statement \u2014 no row in scope has such a column at all.","The clauses are OR'd and overlap, so what each one fired on never sums to the high-risk count."]},{id:"reconstructed",term:"Reconstructed month",lines:["A month whose figures were rebuilt rather than directly observed, because it ends before this register started watching.","Marked so it is not read as measured \u2014 the backlog it describes is real, but nobody was looking in real time."]},{id:"unclassified",term:"Unclassified",lines:["A finding the risk rule could not place as high-risk or not \u2014 most often a secret, which this register refuses to score by severity.","Reported outside the 2\xD72 rather than folded into a corner, so it can never be mistaken for a quadrant."]},{id:"cwe-top-25",term:"CWE Top 25",lines:["MITRE's 2024 list of the most dangerous software weakness classes, which the SAST risk rule scores against.","A child weakness folds onto its Top-25 ancestor first \u2014 CWE-23 counts as CWE-22, CWE-80 as CWE-79 \u2014 because scanners report leaves and the list is mostly interior nodes."]},{id:"twin",term:"Twin",lines:["One secret at one line, reported once against its repository and once against a branch of it.","The ledger keys on (secret, path, line) and keeps the earlier of the two birth dates \u2014 187 keys in this tenant span both, a median 19.9 days apart.","Keying on Wiz's externalId instead would look unique and quietly double the register."]},{id:"sla-band",term:"SLA band",lines:["An SLA is a band the population is kept inside, not a wall a single finding hits.","Read it as a distribution: how much of the window each open finding has consumed, and how many are already past it."]},{id:"rail-status",term:"Rail status",lines:["Only exceptions speak: a sync running, a sync that failed, nothing to sync with, a register never measured, a scan gone old, or current.","Never-measured outranks old: a register nobody has looked at is unmeasured, not stale."]},{id:"compaction",term:"Compaction",lines:["Folding the oldest saved scans into episodes: their per-finding observations are pruned and the scan's own totals are kept.","It reclaims spreadsheet cells and archive bytes. The most recent scans are never candidates, and the dry run states what would go before anything goes."]},{id:"sealed",term:"Sealed",lines:["A saved scan whose per-finding observations compaction has already pruned. Its totals stay; the detail behind them is gone.","A sealed scan cannot be deleted from the Storage page \u2014 the archive it pointed at was reclaimed when it was sealed."]},{id:"episode",term:"Episode",lines:["One finding's settled lifetime \u2014 first seen, how it ended, when \u2014 kept after the scan that carried it was sealed.","The clock survives compaction; the per-scan observations behind it do not. A finding seen again after its episode begins a new one."]},{id:"movement",term:"Movement",lines:["The open backlog now against the same register at the previous sync. A rising count is worse.","The comparison is between two syncs, not between two calendar dates \u2014 a register only learns anything on the days it looks.","Each register has its own window: the three share one scan log, and a scan of one of them looked at none of the others."]},{id:"fix-next",term:"Fix next",lines:["Ranked by what cannot wait rather than by severity: a credential somebody confirmed is live, then a fixable dependency finding already late, then a critical code weakness already late.","Grouped by repository, because that is the smallest unit somebody can be asked to own."]},{id:"sla-edge",term:"SLA edge",lines:["The day count that splits one severity's open findings into late and not late \u2014 its own SLA target, read against the age buckets.","A deadline rarely lands on a bucket's boundary, so a bucket is usually part in and part out; a rule is drawn on the chart only where every severity shares one exact edge."]},{id:"cold-zone",term:"Cold zone",lines:["A repository with open findings where nothing has moved for at least the cold-zone window: no finding resolved, removed or rotated in that time.","Measured at the last scan, never against today, so the same saved ledger always reads the same. With no movement on record the figure is a lower bound \u2014 see Lower bound.","The window is either a fixed number of days or a share of the estate \u2014 see Cold-zone mode. A repository the scanner has stopped returning is Unobserved instead: counted apart, and never counted as warm."]},{id:"cold-zone-mode",term:"Cold-zone mode",lines:["Fixed window: a repository is cold after a set number of idle days \u2014 the same number on every estate and in every week, and the one an op
