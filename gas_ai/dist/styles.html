<style>
/* Wiz SIDEKICK AI — the DESIGN.md visual system ("The Audit Ledger") with the deep
   crimson brand. Light theme only; neutral field; saturated color rationed to severity
   and state. Two-token severity rule: --sev-* fills for marks/dots, --sev-*-text for
   any colored label. The severity palette is IDENTICAL to the OS-vulns tool; the
   crimson accent (#be123c, rose-700) appears only on interactive/identity surfaces
   (brand, nav, buttons, focus, links, toxic-combo halo) — never as a severity. */

:root {
  --rail-w: 232px;
  --accent: #be123c;
  --accent-hover: #9f1239;
  --ink: #171717;
  --graphite: #0a0a0a;
  --graphite-hover: #27272a;
  --on-graphite: #fafafa;
  --page: #ffffff;
  --surface: #f8f8fa;
  --hairline: #e6e6e9;
  --text-2: rgba(0, 0, 0, 0.65);
  /* Tertiary text: 0.6 alpha clears WCAG AA (~5.4:1 on the surface tint) for the 11-13px
     labels, captions and sub-values it carries. 0.5 resolved to ~3.95:1 and failed — the
     OS-vulns tool found the same and raised it there first. */
  --text-3: rgba(0, 0, 0, 0.6);
  /* Secondary text INSIDE the SVG canvas (node kind, group and edge labels, the AARS
     figure). SVG text can't inherit --text-2 through `color`, and these sit on the pale
     category tints as often as on white, so they carry their own token at ~5.5:1. */
  --svg-text-2: rgba(0, 0, 0, 0.62);

  /* Readable line length for running text. The pane fills the viewport; prose does
     not follow it out to 1800px, where a sentence becomes a scan across the desk. */
  --measure: 84ch;

  --sev-critical: #dc2626;  --sev-critical-text: #b91c1c;
  --sev-high: #ea580c;      --sev-high-text: #c2410c;
  --sev-medium: #d97706;    --sev-medium-text: #b45309;
  --sev-low: #2563eb;       --sev-low-text: #1d4ed8;
  --sev-info: #64748b;      --sev-info-text: #475569;
  --sev-unknown: #475569;   --sev-unknown-text: #334155;

  --ok: #15803d;
  --warn: #a16207;
  --bad: #b91c1c;

  /* Graph node categories — reinforce the kind icon + label, never the only cue. Chosen
     OFF the severity channel (indigo not #2563eb, gold not #d97706) so the severity dot
     reads true; vuln reuses the brand crimson (already the risk/toxic color). Each has a
     saturated `ink` (icon + accent stripe, ≥3:1 graphical), a darker `text`, and a pale
     `tint` fill that keeps --ink node text ≥4.5:1. */
  --cat-asset-ink: #4f46e5;    --cat-asset-text: #4338ca;    --cat-asset-tint: #eef2ff;
  --cat-data-ink: #059669;     --cat-data-text: #047857;     --cat-data-tint: #ecfdf5;
  --cat-iam-ink: #7c3aed;      --cat-iam-text: #6d28d9;      --cat-iam-tint: #f5f3ff;
  --cat-vuln-ink: #be123c;     --cat-vuln-text: #9f1239;     --cat-vuln-tint: #fff1f2;
  --cat-exposure-ink: #ca8a04; --cat-exposure-text: #854d0e; --cat-exposure-tint: #fefce8;

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 10px;
  --radius-xl: 14px;

  /* Detail-sheet geometry. The register's asset record carries issues, compliance
     findings, relationships AND identity, so it runs wider than DESIGN.md's flat
     per-finding Finding Sheet; the widen step is there for the estates where the
     relationship list is the point. */
  --sheet-w: min(600px, 94vw);
  --sheet-w-wide: min(920px, 96vw);

  /* Semantic z-index, for the layers this app actually stacks. Only the values consumed
     below are defined; the route overlay (20), the <=800px top bar (45), the boot splash
     (55) and the toasts (60) stay literals until something needs to reason about them.
     --z-popover outranks --z-sheet on purpose: the searchable combobox portals its list
     to <body> (the panel body scrolls and would clip it), and at <=800px the filter panel
     IS a real .sheet — a popover below it would open behind the panel that owns it. */
  --z-canvas-chrome: 5;
  --z-scrim: 40;
  --z-sheet: 41;
  --z-popover: 52;

  --shadow-card: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-button: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
  --shadow-sheet: -8px 0 24px -8px rgba(0, 0, 0, 0.18), -2px 0 8px -4px rgba(0, 0, 0, 0.1);

  --font: -apple-system, BlinkMacSystemFont, Inter, "Segoe UI", Roboto, "Helvetica Neue",
    sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--font);
  font-size: 0.875rem;
  line-height: 1.5;
  font-feature-settings: "cv02", "cv03", "cv04", "cv11";
}

/* ------------------------------------------------------------------ shell / nav */
/* Fixed viewport-height shell: the rail always fills the viewport (pinning the sync
   zone to the bottom) and the content pane scrolls on its own. */
#app { display: flex; height: 100vh; overflow: hidden; position: relative; }

.sidebar {
  width: var(--rail-w);
  flex: 0 0 var(--rail-w);
  height: 100vh;
  overflow-y: auto;
  background: var(--surface);
  border-right: 1px solid var(--hairline);
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.sidebar .wordmark {
  font-weight: 600;
  font-size: 1rem;
  letter-spacing: -0.02em;
  padding: 4px 10px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.wordmark-dot {
  width: 10px; height: 10px; border-radius: 3px; background: var(--accent);
  display: inline-block;
}
.nav-group {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 12px 10px 4px;
}
.nav-link {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: var(--radius-md);
  color: var(--ink);
  font-size: 13px;
  text-decoration: none;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  cursor: pointer;
  font-family: inherit;
}
.nav-link:hover { background: rgba(0, 0, 0, 0.045); }
/* Active nav reads by position + weight, not a ~2.5% tint alone: a 2px accent rail anchors
   "you are here". Inset shadow keeps color rationing intact (accent = focus/identity). */
.nav-link.active {
  background: rgba(0, 0, 0, 0.07);
  font-weight: 600;
  box-shadow: inset 2px 0 0 var(--accent);
}
.nav-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.sidebar .scan-zone {
  margin-top: auto;
  border-top: 1px solid var(--hairline);
  padding-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.scan-caption { font-size: 12px; color: var(--text-3); }
.scan-buttons { display: flex; gap: 8px; }

/* Collapsible rail — icon-only mode (desktop only; the <=800px top-bar layout further
   down ignores .collapsed). Width rides --rail-w so the flex main pane and the route
   overlay's left edge follow automatically; only the width transitions. */
.sidebar { transition: flex-basis 0.18s ease, width 0.18s ease; }
.nav-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; flex: 0 0 18px; color: var(--text-2);
}
.nav-icon svg { width: 18px; height: 18px; display: block; }
.nav-link.active .nav-icon { color: var(--ink); }
.wordmark-label { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
.rail-toggle {
  margin-left: auto; flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; padding: 0;
  border: 1px solid var(--hairline); border-radius: var(--radius-md);
  background: var(--page); color: var(--text-2); cursor: pointer;
}
.rail-toggle:hover { background: rgba(0, 0, 0, 0.045); }
.rail-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rail-toggle svg { width: 16px; height: 16px; display: block; transition: transform 0.18s ease; }
.sidebar .scan-buttons button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.sidebar .scan-buttons .primary .nav-icon { color: inherit; width: 16px; height: 16px; flex-basis: 16px; }
.sidebar .scan-buttons .primary .nav-icon svg { width: 16px; height: 16px; }
.rail-status-dot { display: none; width: 9px; height: 9px; border-radius: 50%; align-self: center; }
.rail-status-dot.ok { background: var(--ok); }
.rail-status-dot.neutral { background: var(--text-3); }

@media (min-width: 801px) {
  .sidebar.collapsed { padding-left: 8px; padding-right: 8px; }
  .sidebar.collapsed .wordmark-label,
  .sidebar.collapsed .wordmark-dot,
  .sidebar.collapsed .nav-label,
  .sidebar.collapsed .nav-group,
  .sidebar.collapsed .scan-caption,
  .sidebar.collapsed .btn-label,
  .sidebar.collapsed .scan-buttons button:not(.primary) { display: none; }
  .sidebar.collapsed .wordmark { justify-content: center; padding: 4px 0 14px; }
  .sidebar.collapsed .rail-toggle { margin-left: 0; }
  .sidebar.collapsed .rail-toggle svg { transform: rotate(180deg); }
  .sidebar.collapsed .nav-link { justify-content: center; padding: 8px 0; }
  .sidebar.collapsed .scan-buttons { justify-content: center; }
  .sidebar.collapsed .scan-buttons .primary { padding: 8px; }
  .sidebar.collapsed .rail-status-dot { display: block; }
  /* Loading panel in the icon rail: drop the full card chrome and its text/bar/buttons,
     leaving the compact ring indicator centered — the card's phase, counts and controls
     are too wide for 56px, so they collapse to the ring (status) + its Details button. */
  .sidebar.collapsed .scan-progress {
    padding: 6px 0; gap: 0; align-items: center;
    background: transparent; border: none; box-shadow: none;
  }
  .sidebar.collapsed .scan-progress-bar-slot,
  .sidebar.collapsed .scan-progress-counts,
  .sidebar.collapsed .scan-progress-actions { display: none; }
  /* The phase line is the card's aria-live announcement target — visually hide it rather
     than display:none it, so screen readers still hear phase transitions in the icon rail. */
  .sidebar.collapsed .scan-progress-head {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }
  .sidebar.collapsed .scan-progress-mini { display: inline-flex; }
}
/* The rail becomes a horizontal wrapping top-bar here, so icon-collapse doesn't apply. */
@media (max-width: 800px) { .rail-toggle { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .sidebar, .rail-toggle svg { transition: none; }
}

/* Sync progress card (persistent, non-modal; lives in the sync zone while a job runs) */
.scan-progress {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 10px 12px;
  background: var(--page);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}
.scan-progress-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.scan-progress-phase { font-size: 13px; font-weight: 600; color: var(--ink); }
.scan-progress-elapsed { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.scan-progress-counts { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.scan-progress.failed .scan-progress-counts { color: var(--bad); }
/* A run with no progress for minutes: flag it amber on the always-visible card, not only
   behind the details drawer, so a likely-dead sync is legible at a glance. */
.scan-progress.stuck { border-color: rgba(161, 98, 7, 0.4); }
.scan-progress.stuck .scan-progress-phase,
.scan-progress.stuck .scan-progress-counts { color: var(--warn); }
.scan-progress-actions { display: flex; gap: 12px; }

/* Compact collapsed-rail indicator: a ring (spinner / arc / filled) with a centered
   glyph or percent. Hidden by default; the .sidebar.collapsed rule above reveals it. The
   ring is a masked conic-gradient donut so a single element carries both the track and
   the coloured arc; --ring is re-tinted per run state, matching the progress-bar colours. */
.scan-progress-mini {
  display: none; position: relative; align-items: center; justify-content: center;
  width: 100%; padding: 2px 0; border: none; background: none; cursor: pointer;
}
.scan-progress-mini:disabled { cursor: default; }
.scan-progress-mini:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 3px; border-radius: var(--radius-md);
}
.scan-spinner {
  --ring: var(--accent);
  --track: rgba(0, 0, 0, 0.10);
  width: 28px; height: 28px; border-radius: 50%;
  /* Terminal states show a full ring; a running sync with no percent yet spins a 25% arc. */
  background: conic-gradient(var(--ring) 0 100%, var(--track) 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 3.5px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 3.5px));
}
.scan-progress.running .scan-spinner {
  background: conic-gradient(var(--ring) 0 25%, var(--track) 0);
  animation: scan-spin 0.9s linear infinite;
}
/* A known percent freezes the spin into a static arc filled to that share. */
.scan-progress.running .scan-spinner.is-determinate {
  background: conic-gradient(var(--ring) calc(var(--scan-pct, 0) * 1%), var(--track) 0);
  animation: none;
}
.scan-progress.done .scan-spinner { --ring: var(--ok); }
.scan-progress.failed .scan-spinner { --ring: var(--bad); }
.scan-progress.cancelled .scan-spinner { --ring: var(--text-3); }
.scan-progress.stuck .scan-spinner { --ring: var(--warn); }
.scan-progress-mini-pct {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums;
}
.scan-progress.done .scan-progress-mini-pct { color: var(--ok); font-size: 13px; }
.scan-progress.failed .scan-progress-mini-pct { color: var(--bad); font-size: 12px; }
.scan-progress.stuck .scan-progress-mini-pct { color: var(--warn); font-size: 12px; }
@keyframes scan-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  /* No spin: a calm 40% arc still reads as "working" without motion. */
  .scan-progress.running .scan-spinner {
    animation: none; background: conic-gradient(var(--ring) 0 40%, var(--track) 0);
  }
}
.linklike {
  background: none; border: none; padding: 0; font-size: 12px; font-weight: 600;
  color: var(--accent); cursor: pointer;
}
.linklike.danger { color: var(--bad); }
.linklike:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* Track/fill progress bar. Fill is the brand accent — a state color, not severity. */
.progress-track {
  position: relative;
  height: 8px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.07);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--accent);
  transition: width 300ms ease-out;
}
.progress-track.done .progress-fill { background: var(--ok); }
.progress-track.failed .progress-fill { background: var(--bad); }
.progress-track.cancelled .progress-fill { background: var(--text-3); }
/* Indeterminate: a travelling band. Under reduced motion the band is replaced by a
   calm static striped fill so "working" still reads without animation. */
.progress-track.indeterminate .progress-fill {
  width: 40%;
  animation: progress-indeterminate 1.4s ease-in-out infinite;
}
@keyframes progress-indeterminate {
  0% { margin-left: -40%; }
  100% { margin-left: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .progress-track.indeterminate .progress-fill {
    width: 100%;
    margin-left: 0;
    background: repeating-linear-gradient(
      45deg, var(--accent), var(--accent) 8px,
      color-mix(in srgb, var(--accent) 55%, white) 8px,
      color-mix(in srgb, var(--accent) 55%, white) 16px);
  }
}

/* Details drawer: phase stepper + fact grid */
.scan-steps { display: flex; gap: 14px; margin: 4px 0 14px; }
.scan-step { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-3); }
.scan-step.done { color: var(--ok); }
.scan-step.active { color: var(--accent); font-weight: 600; }
.scan-step-dot { font-size: 12px; }
.scan-detail-grid {
  display: grid; grid-template-columns: auto 1fr; gap: 6px 16px;
  margin-top: 14px; font-size: 13px;
}
.scan-detail-grid dt { color: var(--text-3); }
.scan-detail-grid dd { margin: 0; font-variant-numeric: tabular-nums; }
.scan-detail-error {
  margin-top: 14px; padding: 10px 12px; font-size: 13px;
  color: var(--bad); background: rgba(185, 28, 28, 0.06);
  border-radius: var(--radius-md);
}

/* The content pane fills whatever the rail leaves. It used to stop at 1200px, which
   on a wide monitor left a third of the viewport empty AND clipped the inventory
   table's right-hand columns — dead space and lost data at the same time. Line length
   is governed where it belongs instead: on the prose itself (--measure), so the
   layout grids (.kpi-row, .scan-cards) and the tables get the room they can use. */
main {
  flex: 1;
  min-width: 0;
  height: 100vh;
  overflow-y: auto;
  padding: 28px 32px 48px;
}

/* Full-bleed routes (the graph workbench): the page owns the whole content pane. */
main.full-bleed {
  padding: 0;
  max-width: none;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
main.full-bleed > .empty { margin: 28px 32px; }

/* Route-reload overlay: a translucent veil + indeterminate top bar over the content
   pane (the sidebar stays clear and interactive) while the active page refetches. */
.route-overlay {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: var(--rail-w);
  z-index: 20;
  display: flex;
  justify-content: center;
  background: color-mix(in srgb, var(--surface) 72%, transparent);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 140ms ease-out, visibility 0s linear 140ms;
}
.route-overlay.visible {
  opacity: 1;
  visibility: visible;
  pointer-events: auto; /* absorb clicks on stale content while it reloads */
  transition: opacity 140ms ease-out;
}
.route-overlay-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.06);
}
.route-overlay-fill {
  width: 40%;
  height: 100%;
  background: var(--accent);
  animation: progress-indeterminate 1.2s ease-in-out infinite;
}
.route-overlay-label {
  margin-top: 84px;
  align-self: flex-start;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  background: var(--page);
  border: 1px solid var(--hairline);
  border-radius: 999px;
  padding: 5px 12px;
  box-shadow: var(--shadow-card);
}
.route-overlay-label:empty { display: none; }
@media (prefers-reduced-motion: reduce) {
  .route-overlay-fill {
    width: 100%;
    animation: none;
    background: repeating-linear-gradient(
      45deg, var(--accent), var(--accent) 8px,
      color-mix(in srgb, var(--accent) 55%, white) 8px,
      color-mix(in srgb, var(--accent) 55%, white) 16px);
  }
  .route-overlay { transition: none; }
}

/* Boot splash: full-viewport branded veil painted by index.html on first load and recreated
   by bootSplash() on refresh(), faded out once the page skeleton has laid out. Sits above the
   route overlay (20) and sheets (41), below toasts (60). */
.boot-splash {
  position: fixed; inset: 0; z-index: 55;
  display: flex; align-items: center; justify-content: center;
  background: var(--page); opacity: 1; transition: opacity 180ms ease-out;
}
.boot-splash.hiding { opacity: 0; }
.boot-splash-inner {
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  padding: 24px; width: min(280px, 80vw);
}
.boot-brand {
  display: flex; align-items: center; gap: 9px; font-weight: 600;
  font-size: 1.0625rem; letter-spacing: -0.02em; color: var(--ink);
}
.boot-brand .wordmark-dot { width: 11px; height: 11px; }
.boot-splash-bar { width: 100%; }
.boot-splash-note { margin: 0; font-size: 12px; color: var(--text-2); }
@media (prefers-reduced-motion: reduce) { .boot-splash { transition: none; } }

/* Skeleton placeholders: calm opacity pulse only — NO diagonal shimmer sweep (the SaaS tell
   DESIGN.md forbids). Reduced motion → a static hairline block. Blocks are aria-hidden. */
.skeleton {
  background: color-mix(in srgb, var(--ink) 7%, var(--surface));
  border-radius: var(--radius-md); animation: skeleton-pulse 1.6s ease-in-out infinite;
}
@keyframes skeleton-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.skeleton--line { height: 12px; border-radius: 4px; }
.skeleton--title { height: 30px; border-radius: 6px; }
.skeleton--stat { height: 18px; border-radius: 5px; }
.skeleton--pill { height: 30px; border-radius: 999px; }
.skeleton--chart { position: absolute; inset: 0; }
@media (prefers-reduced-motion: reduce) {
  .skeleton {
    animation: none; background: color-mix(in srgb, var(--ink) 5%, var(--surface));
    border: 1px solid var(--hairline);
  }
}

@media (max-width: 800px) {
  #app { flex-direction: column; height: auto; min-height: 100vh; overflow: visible; }
  .sidebar {
    width: auto;
    flex: none;
    height: auto;
    overflow: visible;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    border-right: none;
    border-bottom: 1px solid var(--hairline);
  }
  .sidebar .scan-zone { margin-top: 0; border-top: none; padding-top: 0; }
  /* The top bar must stay above the full-width route overlay so nav + sync controls remain
     visible and clickable during a reload (desktop clears the rail via left:var(--rail-w)). */
  .sidebar { position: relative; z-index: 45; }
  main { height: auto; overflow: visible; padding: 20px 16px 40px; }
  .route-overlay { position: fixed; left: 0; }
  /* Full-bleed workbench degrades to a tall block inside the scrolling page. */
  main.full-bleed { display: block; overflow: visible; height: auto; padding: 0; }
  .workbench { height: auto; }
  /* No room to dock beside a 70vh canvas inside a scrolling page — the filter panel is
     hosted as a modal sheet at this width, so the split is just the canvas. */
  .workbench-split { display: block; }
  .workbench-body { height: min(70vh, 640px); }
  .workbench-controls__group + .workbench-controls__group {
    padding-left: 0; border-left: none;
  }
  .workbench-table { position: static; height: auto; max-height: 70vh; }
  .workbench-controls { margin-left: 0; width: 100%; }
  .workbench-search input[type="search"] { width: 100%; }
  .workbench-search { flex: 1 1 100%; }
}

/* ------------------------------------------------------------------- typography */
h1 { font-size: 1.5rem; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 4px; }
.page-sub { color: var(--text-2); margin: 0 0 20px; max-width: var(--measure); }
/* The explanatory notes under a card's controls (settings, scans) are running text. */
p.small.muted { max-width: var(--measure); }
h2.section-label { font-size: 0.9375rem; font-weight: 600; margin: 28px 0 10px; }
h3 { font-size: 1rem; font-weight: 600; margin: 0 0 8px; }
.label {
  font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text-3);
}
.num, .kpi-value, td.num, .hero-value, .mini-value { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.small { font-size: 12px; }

/* ---------------------------------------------------------------------- buttons */
button, .btn {
  font-family: inherit;
  font-size: 0.875rem;
  border-radius: var(--radius-md);
  min-height: 36px;
  padding: 6px 14px;
  cursor: pointer;
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-button);
}
button:hover, .btn:hover { background: #f1f1f4; border-color: #d9d9de; }
button:focus-visible, .btn:focus-visible, a:focus-visible, input:focus-visible,
select:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
/* Primary buttons are brand crimson here (the OS tool uses graphite) — the sibling
   product's one deliberate identity divergence. */
button.primary {
  background: var(--accent);
  color: #ffffff;
  border: none;
}
button.primary:hover { background: var(--accent-hover); }
button.danger { color: var(--bad); border-color: rgba(185, 28, 28, 0.35); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.link {
  background: none; border: none; box-shadow: none; color: var(--accent);
  padding: 2px 4px; min-height: 0;
}

/* ----------------------------------------------------------------------- inputs */
input[type="text"], input[type="search"], input[type="number"], select {
  font-family: inherit;
  font-size: 0.875rem;
  background: var(--page);
  color: var(--ink);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  min-height: 36px;
  padding: 4px 10px;
}
label.field-label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }

input[type="range"] { accent-color: var(--accent); }

/* Invalid input state — border + focus ring pair the color with the field position, and
   .field-error carries the plain-language reason in text (never color alone). */
input[aria-invalid="true"], select[aria-invalid="true"], textarea[aria-invalid="true"] {
  border-color: var(--bad);
}
input[aria-invalid="true"]:focus-visible, select[aria-invalid="true"]:focus-visible {
  outline-color: var(--bad);
}
.field-error { color: var(--bad); font-size: 12px; margin-top: 4px; }


/* ------------------------------------------------------------------------ cards */
.card {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-xl);
  padding: 16px;
  box-shadow: var(--shadow-card);
}
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 0 0 20px; }
.kpi-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius-xl); padding: 14px 16px; box-shadow: var(--shadow-card); }
.kpi-label { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-3); }
.kpi-value { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; margin-top: 2px; }
.kpi-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }

/* change chips */
.chg { font-size: 12px; font-weight: 600; border-radius: var(--radius-sm); padding: 1px 6px; margin-left: 6px; }
.chg.up { color: var(--bad); background: rgba(185, 28, 28, 0.12); }
.chg.down { color: var(--ok); background: rgba(21, 128, 61, 0.12); }
.chg.flat { color: var(--text-3); background: rgba(0, 0, 0, 0.06); }

/* --------------------------------------------------------------------- severity */
.sev-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.sev-badge {
  display: inline-flex; align-items: center;
  border-radius: 999px; padding: 2px 9px;
  font-size: 12px; font-weight: 600;
}
.sev-CRITICAL { background: rgba(220, 38, 38, 0.14); color: var(--sev-critical-text); }
.sev-CRITICAL .sev-dot { background: var(--sev-critical); }
.sev-HIGH { background: rgba(234, 88, 12, 0.14); color: var(--sev-high-text); }
.sev-HIGH .sev-dot { background: var(--sev-high); }
.sev-MEDIUM { background: rgba(217, 119, 6, 0.14); color: var(--sev-medium-text); }
.sev-MEDIUM .sev-dot { background: var(--sev-medium); }
.sev-LOW { background: rgba(37, 99, 235, 0.14); color: var(--sev-low-text); }
.sev-LOW .sev-dot { background: var(--sev-low); }
.sev-INFO { background: rgba(100, 116, 139, 0.14); color: var(--sev-info-text); }
.sev-INFO .sev-dot { background: var(--sev-info); }
.sev-UNKNOWN { background: rgba(71, 85, 105, 0.14); color: var(--sev-unknown-text); }
.sev-UNKNOWN .sev-dot { background: var(--sev-unknown); }

/* AARS chips reuse the severity tokens directly — the AARS scale carries the same
   values as the Wiz severity scale, and the brand crimson never scores risk. */
.aars-chip {
  display: inline-flex; align-items: center; gap: 5px;
  border-radius: 999px; padding: 2px 9px;
  font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.aars-chip .sev-dot { margin-right: 0; }

/* status pills */
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: rgba(21, 128, 61, 0.12); }
.pill.warn { color: var(--warn); background: rgba(161, 98, 7, 0.12); }
.pill.bad { color: var(--bad); background: rgba(185, 28, 28, 0.12); }
.pill.neutral { color: var(--text-2); background: rgba(0, 0, 0, 0.06); }

.domain-chip {
  display: inline-block; border-radius: var(--radius-sm); padding: 1px 7px;
  font-size: 12px; background: rgba(0, 0, 0, 0.06); color: var(--text-2);
}

/* severity filter pills */
.pill-row { display: flex; flex-wrap: wrap; gap: 6px; }
.sev-pill, .kind-pill {
  border-radius: 999px; padding: 3px 12px; min-height: 0;
  font-size: 12px; font-weight: 600;
  background: var(--page); border: 1px solid var(--hairline); box-shadow: none;
  color: var(--text-2);
}
.sev-pill[aria-pressed="true"].sev-CRITICAL { background: rgba(220,38,38,.14); color: var(--sev-critical-text); border-color: rgba(220,38,38,.3); }
.sev-pill[aria-pressed="true"].sev-HIGH { background: rgba(234,88,12,.14); color: var(--sev-high-text); border-color: rgba(234,88,12,.3); }
.sev-pill[aria-pressed="true"].sev-MEDIUM { background: rgba(217,119,6,.14); color: var(--sev-medium-text); border-color: rgba(217,119,6,.3); }
.sev-pill[aria-pressed="true"].sev-LOW { background: rgba(37,99,235,.14); color: var(--sev-low-text); border-color: rgba(37,99,235,.3); }
.sev-pill[aria-pressed="true"].sev-INFO { background: rgba(100,116,139,.14); color: var(--sev-info-text); border-color: rgba(100,116,139,.3); }

/* Node-type toggle pills: neutral base (shared with .sev-pill), brand crimson when
   selected. This used to be the LOW severity tint + --sev-low-text — byte-identical to a
   pressed .sev-pill.sev-LOW two rules above, which sits directly above it in the filter
   panel, so a selected "AI Agent" and a selected "LOW" were indistinguishable. Selection
   is an interactive state, not a severity; the accent is the token for that. */
.kind-pill[aria-pressed="true"] {
  background: rgba(190, 18, 60, .10); color: var(--accent-hover); border-color: rgba(190, 18, 60, .28);
}
.kind-filter { display: flex; flex-direction: column; gap: 12px; }
.pill-group-label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
  color: var(--text-3); margin-bottom: 5px;
}

/* -------------------------------------------------------------------- help tip */
/* Hover/focus definition card (ui.js helpTip) — the neutral popover recipe, and the
   replacement for `title=` anywhere the explanation actually matters. */
.helptip { position: relative; cursor: help; }
.helptip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-sm); }
.helptip-bubble {
  position: absolute; left: 0; top: calc(100% + 8px); z-index: var(--z-popover);
  width: max-content; max-width: 268px; padding: 10px;
  display: flex; flex-direction: column; gap: 5px;
  background: var(--page); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  font-size: 12px; font-weight: 400; line-height: 1.45;
  letter-spacing: 0; text-transform: none; text-align: left; white-space: normal;
  opacity: 0; pointer-events: none; transform: translateY(-2px);
  transition: opacity 0.14s ease, transform 0.14s ease;
}
.helptip-line { display: block; }
.helptip:hover > .helptip-bubble,
.helptip:focus-within > .helptip-bubble { opacity: 1; pointer-events: auto; transform: translateY(0); }
@media (prefers-reduced-motion: reduce) {
  .helptip-bubble { transition: none; transform: none; }
  .helptip:hover > .helptip-bubble, .helptip:focus-within > .helptip-bubble { transform: none; }
}

/* ------------------------------------------------------------------- combobox */
/* Searchable dropdown (ui.js filterCombobox). The trigger matches the app's field look;
   the list is portaled to <body> because the panel it lives in scrolls and would clip it. */
.combobox { position: relative; }
.combobox-trigger {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; min-height: 36px; padding: 4px 10px;
  font-family: var(--font); font-size: 0.875rem; font-weight: 400; text-align: left;
  background: var(--page); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: var(--radius-md); box-shadow: none;
}
.combobox-trigger:hover { background: #f1f1f4; }
.combobox-trigger-text { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.combobox-caret { font-size: 0.7rem; color: var(--text-3); flex: 0 0 auto; }
.combobox-pop {
  position: fixed; z-index: var(--z-popover);
  display: flex; flex-direction: column; gap: 6px;
  padding: 6px; background: var(--page); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sheet);
  font-family: var(--font);
}
.combobox-search { width: 100%; margin: 0; }
/* The list scrolls (max-height set inline by position()) so the search input stays pinned. */
.combobox-list { list-style: none; margin: 0; padding: 2px; overflow-y: auto; }
.combobox-option {
  display: flex; align-items: baseline; gap: 8px;
  padding: 6px 8px; border-radius: var(--radius-sm);
  font-size: 0.8125rem; line-height: 1.3; color: var(--ink); cursor: pointer;
}
.combobox-option:hover, .combobox-option.active { background: var(--surface); }
/* Selected: weight AND color together, never color alone — aria-selected already carries
   it for assistive tech. */
.combobox-option[aria-selected="true"] { font-weight: 600; color: var(--accent); }
.combobox-option-hint { margin-left: auto; font-size: 11px; color: var(--text-3); flex: 0 0 auto; }
.combobox-option--last-pinned { border-bottom: 1px solid var(--hairline); margin-bottom: 2px; padding-bottom: 8px; }
.combobox-group {
  padding: 8px 8px 3px; font-size: 11px; font-weight: 600;
  letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-3);
}
.combobox-empty { padding: 6px 8px; font-size: 0.8125rem; color: var(--text-3); cursor: default; }

/* ------------------------------------------------------------------- segmented */
/* One joined group of aria-pressed buttons — the exclusive-choice recipe, shared by the
   Graph|Table view toggle, the Depth stops, and the zoom capsule. aria-pressed (not
   role=radiogroup) to match the pill vocabulary above: a conformant radiogroup needs a
   roving tabindex plus arrow cycling, and running two patterns for one visual recipe on
   one page is exactly the invented-control problem. Pressed reads as weight + surface +
   an inset hairline, never color alone. */
.segmented {
  display: inline-flex; align-items: stretch;
  border: 1px solid var(--hairline); border-radius: var(--radius-md);
  background: var(--page); overflow: hidden;
}
.segmented > button {
  min-height: 34px; padding: 4px 12px;
  border: none; border-radius: 0; box-shadow: none;
  background: none; color: var(--text-2); font-weight: 500;
}
.segmented > button + button { border-left: 1px solid var(--hairline); }
.segmented > button:hover { background: rgba(0, 0, 0, 0.035); }
/* Inset replaces the base button's rest shadow rather than stacking on it — a surface is
   a whisper or a lift, never both (DESIGN.md, Whisper-Or-Lift). Neutral on purpose: an
   accent inset would read as the decorative side-stripe the system forbids. */
.segmented > button[aria-pressed="true"] {
  background: var(--surface); color: var(--ink); font-weight: 600;
  box-shadow: inset 0 -2px 0 0 rgba(0, 0, 0, 0.28);
}
.segmented > button:focus-visible { outline-offset: -2px; z-index: 1; }


/* ------------------------------------------------------- AI Inventory: posture header */
/* Three levels rather than eight peers: the hero says what the estate IS, the strip says
   what shape its risk has, the stat list carries the supporting facts. Hero and strip are
   deliberately borderless — DESIGN.md's Hero Stat takes its dominance from size and
   position, never from a card, a gradient or an accent stripe. */
.inv-header {
  display: grid;
  grid-template-columns: minmax(150px, 0.45fr) minmax(320px, 2fr);
  gap: 20px 36px; align-items: start;
  margin: 0 0 18px; padding-bottom: 4px; border-bottom: 1px solid var(--hairline);
}
.inv-hero .hero-value { font-size: 2rem; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; }
.inv-hero-sub { font-size: 12px; color: var(--text-3); margin-top: 3px; }

/* The distribution strip. The track is a graphic; the keys under it are the controls, so
   the cross-filter has a real keyboard path (a canvas would not). */
.sev-strip { display: flex; flex-direction: column; gap: 8px; }
.sev-strip-track {
  display: flex; height: 10px; border-radius: 999px; overflow: hidden;
  background: rgba(0, 0, 0, 0.07);
}
.sev-strip-seg { min-width: 3px; transition: opacity 140ms ease-out; }
.sev-strip-seg.sev-CRITICAL { background: var(--sev-critical); }
.sev-strip-seg.sev-HIGH { background: var(--sev-high); }
.sev-strip-seg.sev-MEDIUM { background: var(--sev-medium); }
.sev-strip-seg.sev-LOW { background: var(--sev-low); }
.sev-strip-seg.sev-INFO { background: var(--sev-info); }
/* While filtered the other bands recede but never vanish: the share you picked has to stay
   readable against the whole estate, which is the point of showing a distribution. */
.sev-strip.is-filtered .sev-strip-seg[data-on="false"] { opacity: 0.22; }
.sev-strip-keys { display: flex; flex-wrap: wrap; gap: 2px 12px; }
.sev-key {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 1px solid transparent; box-shadow: none; min-height: 0;
  padding: 3px 7px; border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 600; color: var(--text-2);
}
.sev-key:hover { background: rgba(0, 0, 0, 0.045); border-color: transparent; }
.sev-key .sev-dot { margin-right: 0; vertical-align: 0; }
.sev-key-count { color: var(--ink); }
/* Selected reads as selected without relying on colour: a tick plus the tint. */
.sev-key[aria-pressed="true"] { background: rgba(0, 0, 0, 0.06); color: var(--ink); }
.sev-key[aria-pressed="true"]::after { content: "✓"; font-size: 10px; color: var(--text-3); }
.sev-strip-note { font-size: 12px; color: var(--text-3); margin: 0; }

/* The facts that used to be cards, as one full-width strip under the hero: four equal
   cells divided by hairlines. Borderless like the hero — the header is one surface with
   three levels of emphasis, not a row of competing boxes. */
.stat-list {
  grid-column: 1 / -1;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
  gap: 0; padding: 14px 0 16px; margin-top: 2px;
  background: none; border: none; border-top: 1px solid var(--hairline);
  border-radius: 0; box-shadow: none;
}
.stat-row { display: flex; flex-direction: column; gap: 2px; padding: 0 18px; }
.stat-row + .stat-row { border-left: 1px solid var(--hairline); }
.stat-row .stat-name {
  font-size: 12px; font-weight: 600; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--text-3);
}
.stat-row .stat-figure { display: flex; align-items: center; gap: 9px; }
.stat-row .stat-sub { font-size: 11px; color: var(--text-3); }
.stat-row .mini-value { font-size: 1.125rem; font-weight: 600; letter-spacing: -0.01em; }
.pillar-track.stat-meter { flex: 0 0 52px; width: 52px; height: 6px; }
@media (max-width: 620px) {
  .stat-row { padding: 10px 0; }
  .stat-row + .stat-row { border-left: none; border-top: 1px solid var(--hairline); }
}

/* ------------------------------------------------------------- AI Inventory: toolbar */
.inv-toolbar {
  display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center;
  padding: 10px 12px; border: 1px solid var(--hairline); border-radius: var(--radius-lg);
  background: var(--surface);
}
.inv-toolbar-end { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.inv-toolbar .count { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
/* The graph's chips row is a full-bleed bar under a sticky top bar; in the page flow it
   needs neither the 16px inset nor the bottom rule. */
.filter-chips.inv-chips { padding: 10px 0 0; border-bottom: none; }
.saved-views { display: inline-flex; align-items: center; gap: 6px; }
.saved-views select { max-width: 180px; }

/* Segmented view-mode control: two aria-pressed buttons sharing one border. */
.viewmode { display: inline-flex; }
.viewmode button { border-radius: 0; box-shadow: none; }
.viewmode button:first-child { border-radius: var(--radius-md) 0 0 var(--radius-md); }
.viewmode button:last-child { border-radius: 0 var(--radius-md) var(--radius-md) 0; margin-left: -1px; }
.viewmode button[aria-pressed="true"] {
  background: rgba(0, 0, 0, 0.07); border-color: #d9d9de; font-weight: 600;
}

/* --------------------------------------------------- AI Inventory: in-row micro-viz */
/* The score as a quantity beside the chip that gives its level. Neutral graphite fill on
   purpose: the level is already coloured on the chip, and fifty tinted bars down a page is
   the wall of colour PRODUCT.md rejects. */
.aars-cell, .issue-cell { display: inline-flex; align-items: center; gap: 8px; }
.pillar-track.score-meter { flex: 0 0 40px; width: 40px; height: 5px; }
td .pillar-track { background: rgba(0, 0, 0, 0.09); }
/* Open issues split by severity. Here colour IS the content — the mix of levels is the
   whole point — so it is rationed, not decorative, and the aria-label names the counts. */
.issue-bars { display: inline-flex; height: 5px; border-radius: 999px; overflow: hidden; }
.issue-bar { min-width: 2px; }
.issue-bar.sev-CRITICAL { background: var(--sev-critical); }
.issue-bar.sev-HIGH { background: var(--sev-high); }
.issue-bar.sev-MEDIUM { background: var(--sev-medium); }
.issue-bar.sev-LOW { background: var(--sev-low); }
.issue-bar.sev-INFO { background: var(--sev-info); }
.issue-bar.sev-UNKNOWN { background: var(--sev-unknown); }

/* ----------------------------------------------------------- AI Inventory: card view */
/* The same marks as a table row, laid out for scanning by name instead of by column.
   Card whisper only, never a float (the Whisper-Or-Lift Rule). */
.asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 12px; }
.asset-card {
  display: flex; flex-direction: column; align-items: stretch; gap: 8px;
  padding: 12px 14px; min-height: 0; text-align: left; font: inherit; color: inherit;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius-xl); box-shadow: var(--shadow-card);
}
.asset-card:hover { background: #f1f1f4; border-color: #d9d9de; }
.asset-card-head { display: flex; align-items: center; gap: 8px; }
.asset-card-icon { flex: 0 0 16px; color: var(--text-3); }
.asset-card-icon .gnode-icon { stroke: currentColor; fill: none; stroke-width: 1.4; }
.asset-card-name {
  flex: 1; min-width: 0; font-weight: 600; font-size: 13px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.asset-card .pillar-track.score-meter { width: auto; flex: 1 1 auto; }
.asset-card-marks { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.asset-card-marks:empty { display: none; }
.asset-card-meta { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12px; color: var(--text-3); }

@media (max-width: 1180px) { .inv-header { grid-template-columns: 1fr 1fr; } }
@media (max-width: 760px) { .inv-header { grid-template-columns: 1fr; gap: 18px; } }

/* ----------------------------------------------------------------------- tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--hairline); border-radius: var(--radius-lg); }
table.data {
  border-collapse: collapse; width: 100%;
  font-size: 13px;
}
table.data th {
  text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--text-3);
  background: var(--surface);
  padding: 8px 10px; border-bottom: 1px solid var(--hairline);
  position: sticky; top: 0;
  white-space: nowrap;
}
/* Sortable column headers (graph table view): the whole label is the button. */
.th-sort {
  display: inline-flex; align-items: center; gap: 4px;
  background: none; border: none; box-shadow: none; padding: 0; min-height: 0;
  font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text-3); cursor: pointer; border-radius: 3px;
}
.th-sort:hover { color: var(--ink); background: none; }
.th-sort-glyph { font-size: 9px; }
table.data td {
  padding: 7px 10px; border-bottom: 1px solid var(--hairline);
  white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis;
}
table.data tbody tr:last-child td { border-bottom: none; }
table.data tbody tr:hover { background: rgba(0, 0, 0, 0.025); }
table.data tbody tr.clickable { cursor: pointer; }
td.num { text-align: right; }
a { color: var(--accent); }

.pager { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; color: var(--text-2); }

/* Page-size select + pager under a paged table. */
.table-footer { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
.table-footer .pager { margin-top: 0; }
.table-footer select { font-size: 13px; }
/* A page fetched from the server: the old rows stay legible but read as superseded. */
.table-host[aria-busy="true"] { opacity: 0.5; transition: opacity 120ms ease; }
@media (prefers-reduced-motion: reduce) {
  .table-host[aria-busy="true"] { transition: none; }
}

/* ------------------------------------------------------------------ chart cards */
.chart-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius-xl); padding: 16px; box-shadow: var(--shadow-card); }
.chart-card h3 { margin-bottom: 10px; }
.chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.chart-box { position: relative; height: 240px; }
/* Two charts side by side, stacking below the width where a plot stops being readable. */
.chart-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
/* The line under a chart title: what the chart leaves out, or what it's still waiting for. */
.chart-note { margin: -4px 0 10px; font-size: 12px; color: var(--text-3); }
/* Stands in for the plot when there aren't enough points to draw one — matched to the
   chart-box height so the card doesn't resize when the first real line arrives. */
.chart-empty {
  display: flex; align-items: center; justify-content: center; text-align: center;
  height: 200px; padding: 0 24px;
  font-size: 13px; color: var(--text-3);
  border: 1px dashed var(--hairline); border-radius: var(--radius-lg);
}

/* -------------------------------------------------- security graph workbench */
/* Full-page canvas: slim top bar + chips row + a body the SVG fills entirely. */
.workbench { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.workbench-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--hairline);
  background: var(--surface);
}
.workbench-title { font-size: 1rem; margin: 0; }
.workbench-meta {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  font-size: 12px; color: var(--text-2);
}
/* Counts + "Load more", bottom-left over the canvas. Needs the panel treatment the
   legend has, since it sits on top of edges and cards rather than on a bar. Hidden when
   empty so an empty or errored view doesn't leave a bare box floating in the corner. */
.workbench-meta.overlay {
  position: absolute; left: 10px; bottom: 10px; z-index: var(--z-canvas-chrome);
  gap: 8px; padding: 7px 10px; font-size: 11px;
  max-width: min(560px, calc(100% - 120px));
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
}
/* Two permanent children now (a live-region half and a controls half), so the container
   is never `:empty` — the hide is a class the page sets instead. */
.workbench-meta.overlay.is-empty { display: none; }
.workbench-meta-status,
.workbench-meta-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.workbench-meta-actions:empty { display: none; }
/* Three hairline-ruled zones — what to draw, how to narrow it, how to read it — instead
   of five identical controls in one uniform gap. The rules are dropped below the wrap
   breakpoint, where the groups stack and a vertical hairline would orphan at a row end. */
.workbench-controls {
  margin-left: auto;
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
}
.workbench-controls__group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.workbench-controls__group + .workbench-controls__group {
  padding-left: 14px; border-left: 1px solid var(--hairline);
}
.workbench-search input[type="search"] { width: 170px; }

/* A native select with its dimension named beside it, so "Rows" and "Smart order" stop
   floating with nothing attached. The label is aria-hidden — the select keeps its own
   aria-label, and reading the word twice helps nobody. */
.select-field {
  display: inline-flex; align-items: center;
  border: 1px solid var(--hairline); border-radius: var(--radius-md);
  background: var(--page); overflow: hidden;
}
.select-field-label {
  padding: 0 2px 0 10px; font-size: 12px; color: var(--text-3); white-space: nowrap;
}
.select-field select {
  border: none; border-radius: 0; background: none; padding-left: 4px;
}
.select-field:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.select-field select:focus-visible { outline: none; }
.filter-count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; padding: 0 5px; margin-left: 7px;
  border-radius: 999px; background: rgba(0, 0, 0, 0.07);
  font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
  color: var(--text-2); line-height: 17px;
}
.filter-count:empty { display: none; }

/* Applied-filter chips: one per active value. The band keeps its height whether or not
   anything is applied — it sits between the bar and the canvas, so showing/hiding it
   moved the whole picture the first time a filter was applied. Empty, it says so rather
   than leaving a bare gap between two hairlines. */
.filter-chips {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  min-height: 37px;
  padding: 8px 16px; border-bottom: 1px solid var(--hairline);
}
.filter-chips-empty { font-size: 12px; color: var(--text-3); }
/* Two targets in one pill: the label opens the panel at that filter's section, the ✕
   clears it. The chip used to be a single delete button, so clicking the thing you wanted
   to change destroyed it. Both children reset the base button recipe — left alone they
   would nest two 36px bordered, shadowed surfaces inside a 22px pill. */
.filter-chip {
  display: inline-flex; align-items: center;
  padding: 0 4px 0 0; border-radius: 999px;
  border: 1px solid var(--hairline);
  font-size: 12px; font-weight: 600;
}
/* Neutral chip surface, scoped so it stops overriding the severity tint below. Both are
   single-class selectors and this rule is the later one, so unscoped it won the cascade
   and every CRITICAL chip rendered as a gray pill — the tint and the darkened text token
   were dead code, and the dot was the only severity cue left. */
.filter-chip:not([class*="sev-"]) { background: var(--page); color: var(--text-2); }
.filter-chip .sev-dot { margin-right: 0; }
.filter-chip-body, .filter-chip-x {
  min-height: 0; border: none; background: none; box-shadow: none;
  color: inherit; font: inherit; border-radius: 999px;
}
.filter-chip-body { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 9px; }
.filter-chip-body:hover, .filter-chip-x:hover { background: rgba(0, 0, 0, 0.05); }
.filter-chip-key { font-weight: 500; opacity: 0.8; }
.filter-chip-value { font-weight: 600; }
.filter-chip-x { padding: 3px 6px; font-size: 10px; color: var(--text-2); }
.filter-chip-x:hover { color: var(--ink); }
/* A lens the page seeded itself, not a filter anyone applied — shown and clearable, but
   visibly quieter, and excluded from the count badge. */
.filter-chip.is-default { border-style: dashed; }
.filter-chip.is-default .filter-chip-value { font-weight: 500; }
.filter-clear-all { font-size: 12px; }

/* Canvas and filter panel as flex siblings. The panel narrows the canvas instead of
   covering it — these filters apply live, so a scrim over the graph being filtered was the
   one thing the page could not afford. .workbench-body stays the containing block, so the
   corner overlays, the table, the empty states and the boot skeleton all follow it in. */
.workbench-split { display: flex; flex: 1; min-height: 0; }
.filter-panel-host { display: contents; }
.filter-panel {
  flex: 0 0 min(360px, 40%);
  display: flex; flex-direction: column; min-height: 0;
  background: var(--page);
  border-left: 1px solid var(--hairline);
}
.filter-panel-header {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 16px; border-bottom: 1px solid var(--hairline);
  flex: 0 0 auto;
}
.filter-panel-title { font-size: 0.9375rem; font-weight: 600; margin: 0; }
.filter-panel-body { padding: 14px 16px 24px; overflow-y: auto; flex: 1 1 auto; }

.workbench-body {
  flex: 1; min-width: 0; min-height: 0; position: relative;
  background: var(--page); overflow: hidden;
}
.workbench-body svg { display: block; width: 100%; height: 100%; cursor: grab; user-select: none; -webkit-user-select: none; }
.workbench-body svg.panning { cursor: grabbing; }
.workbench-body.updating > svg,
.workbench-body.updating > .workbench-table { opacity: 0.55; transition: opacity 120ms ease-out; }
.workbench-table {
  /* Bottom padding clears the counts overlay, which floats above this in table view. */
  position: absolute; inset: 0; overflow-y: auto; padding: 12px 16px 60px;
}
.workbench-empty { padding: 32px; max-width: 640px; margin: 0 auto; width: 100%; }
/* emptyState() is message + hint only, so the way out of a dead end lives beside it. */
.workbench-empty-action { display: flex; justify-content: center; margin-top: 14px; }

/* Zoom: one capsule for the scale (with a readout — zoom was a state you could change but
   not read), Fit beside it as the separate action it is. */
.graph-zoom {
  position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: var(--z-canvas-chrome);
}
.graph-zoom .segmented, .graph-zoom-fit { background: var(--page); box-shadow: var(--shadow-card); }
.graph-zoom-scale > button { min-width: 32px; font-weight: 600; }
.graph-zoom-pct {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 52px; padding: 0 4px; font-size: 12px; color: var(--text-2);
  border-left: 1px solid var(--hairline); border-right: 1px solid var(--hairline);
}
.graph-zoom-fit { font-weight: 600; }

.gedge { stroke: rgba(0, 0, 0, 0.22); stroke-width: 1.25; fill: none; }
.gedge.negated { stroke: var(--sev-high); stroke-dasharray: 5 4; }
.gedge.dimmed { opacity: 0.18; }
.gv-arrow-head { fill: rgba(0, 0, 0, 0.3); }

/* Grouped-mode cluster hulls: hairline boxes + muted uppercase labels. Quiet by
   design — structure, not color (the Rationed Ink Rule). */
.ggroup-box { fill: rgba(0, 0, 0, 0.015); stroke: var(--hairline); stroke-width: 1; }
.ggroup-label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
  text-transform: uppercase; fill: var(--svg-text-2);
}
.gedge-label {
  font-size: 10px; fill: var(--svg-text-2);
  paint-order: stroke; stroke: #ffffff; stroke-width: 3; stroke-linejoin: round;
}

.gnode { cursor: pointer; }
.gnode.dragging { cursor: grabbing; }
.gnode-box {
  fill: var(--surface);
  stroke: var(--hairline);
  stroke-width: 1;
  rx: 10;
}
.gnode:hover .gnode-box { stroke: rgba(0, 0, 0, 0.3); }
.gnode:focus { outline: none; }
.gnode:focus-visible .gnode-box { stroke: var(--accent); stroke-width: 2; }
.gnode-name { font-size: 12px; font-weight: 600; fill: var(--ink); }
.gnode-kind { font-size: 10px; fill: var(--svg-text-2); letter-spacing: 0.04em; }
.gnode-icon { fill: none; stroke: rgba(0, 0, 0, 0.6); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
/* The AARS figure on a node card: a number in a column of node cards, so tabular. */
.gnode-aars { font-size: 10px; font-weight: 600; fill: var(--svg-text-2); font-variant-numeric: tabular-nums; }
/* Severity label on a node card. The Two-Token Severity Rule: the DOT is painted from the
   server palette (a graphical mark at >=3:1, and a deployment may retint it), the LABEL
   takes the darkened text token so it clears 4.5:1 on the pale category tints underneath.
   That is a deliberate divergence — if a deployment customises palette.colors, the dot
   moves and the label does not. */
.gnode-chip-text { font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
.gnode-sev-CRITICAL { fill: var(--sev-critical-text); }
.gnode-sev-HIGH { fill: var(--sev-high-text); }
.gnode-sev-MEDIUM { fill: var(--sev-medium-text); }
.gnode-sev-LOW { fill: var(--sev-low-text); }
.gnode-sev-INFO { fill: var(--sev-info-text); }
.gnode-sev-UNKNOWN { fill: var(--sev-unknown-text); }
/* Node category color: a pale tinted box + saturated icon + a left accent stripe. Color
   only reinforces the icon + label (never the sole cue). Applied to fill/icon/stripe, NOT
   the box stroke — so hover and the crimson focus-visible ring keep working over the tint. */
.gnode-accent { display: none; }
.gnode[data-category] .gnode-accent { display: block; }
.gnode[data-category="asset"] .gnode-box { fill: var(--cat-asset-tint); }
.gnode[data-category="asset"] .gnode-icon { stroke: var(--cat-asset-ink); }
.gnode[data-category="asset"] .gnode-accent { fill: var(--cat-asset-ink); }
.gnode[data-category="data"] .gnode-box { fill: var(--cat-data-tint); }
.gnode[data-category="data"] .gnode-icon { stroke: var(--cat-data-ink); }
.gnode[data-category="data"] .gnode-accent { fill: var(--cat-data-ink); }
.gnode[data-category="iam"] .gnode-box { fill: var(--cat-iam-tint); }
.gnode[data-category="iam"] .gnode-icon { stroke: var(--cat-iam-ink); }
.gnode[data-category="iam"] .gnode-accent { fill: var(--cat-iam-ink); }
.gnode[data-category="vuln"] .gnode-box { fill: var(--cat-vuln-tint); }
.gnode[data-category="vuln"] .gnode-icon { stroke: var(--cat-vuln-ink); }
.gnode[data-category="vuln"] .gnode-accent { fill: var(--cat-vuln-ink); }
.gnode[data-category="exposure"] .gnode-box { fill: var(--cat-exposure-tint); }
.gnode[data-category="exposure"] .gnode-icon { stroke: var(--cat-exposure-ink); }
.gnode[data-category="exposure"] .gnode-accent { fill: var(--cat-exposure-ink); }
/* neutral (SUMMARY): no tint, no stripe — keep the existing collapse-pill look. */
.gnode[data-category="neutral"] .gnode-accent { display: none; }
/* Toxic-combination member: crimson halo ring + "TC" glyph badge — the halo is brand
   crimson (membership marker), while severity stays on the dot+label chip. */
.gnode-halo { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 2 3; }
.gnode-tc-badge { fill: var(--accent); }
.gnode-tc-text { font-size: 9px; font-weight: 700; fill: #ffffff; }
/* Summary (collapse) pill */
.gnode.summary .gnode-box { fill: rgba(0, 0, 0, 0.04); stroke-dasharray: 4 3; }
.gnode.summary .gnode-name { fill: var(--text-2); }
/* Search: everything that doesn't match dims; matches keep full treatment. */
.gnode.dimmed { opacity: 0.3; }

/* Legend: a collapsible <details> disclosure, hidden by default. */
.graph-legend {
  font-size: 12px; color: var(--text-2);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-lg); background: var(--surface); margin-top: 10px;
}
.graph-legend.overlay {
  position: absolute; right: 10px; bottom: 10px; z-index: var(--z-canvas-chrome);
  margin: 0; font-size: 11px;
  max-width: min(640px, calc(100% - 140px));
  box-shadow: var(--shadow-card);
}
/* Toggle pill: the whole box collapses to this. Native marker replaced by a
   chevron that rotates on open. */
.legend-toggle {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; font-weight: 600; color: var(--ink);
  border-radius: inherit;
}
.legend-toggle::-webkit-details-marker { display: none; }
.legend-toggle::after {
  content: ""; margin-left: auto; width: 6px; height: 6px;
  border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
  transform: rotate(-45deg); transform-origin: 55% 55%;
  transition: transform 150ms ease-out;
}
.graph-legend[open] > .legend-toggle::after { transform: rotate(45deg); }
/* Collapsed, the overlay is a compact labelled pill sized like the zoom controls — the
   word plus its chevron, not a bare glyph. */
.graph-legend.overlay > .legend-toggle {
  gap: 8px; padding: 6px 12px; min-height: 34px; margin-left: auto;
}
.graph-legend.overlay:not([open]) { border-radius: 999px; }
.graph-legend[open] > .legend-toggle { border-bottom: 1px solid var(--hairline); }
.legend-body {
  display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
  padding: 9px 10px 10px;
}
.graph-legend.overlay .legend-body { gap: 10px; }
.graph-legend .legend-item { display: inline-flex; align-items: center; gap: 6px; }
@media (prefers-reduced-motion: reduce) {
  .legend-toggle::after { transition: none; }
}
.legend-swatch-group {
  width: 16px; height: 12px; border-radius: 4px;
  border: 1px solid #d9d9de; background: rgba(0, 0, 0, 0.015); display: inline-block;
}
.legend-swatch-halo {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px dashed var(--accent); display: inline-block;
}
.legend-swatch-negated {
  width: 22px; height: 0; border-top: 2px dashed var(--sev-high); display: inline-block;
}
.legend-swatch-cat {
  width: 12px; height: 12px; border-radius: 3px; display: inline-block;
  background: var(--swatch, var(--hairline));
}

/* AARS pillar bars (asset sheet) */
.pillar-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 12px; }
.pillar-row .pillar-name { width: 120px; color: var(--text-2); }
.pillar-row .pillar-val { width: 44px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.pillar-track { flex: 1; height: 8px; border-radius: 999px; background: rgba(0, 0, 0, 0.07); overflow: hidden; }
/* display:block so the fill works as a <span> too — a percentage width on an inline box
   is ignored, which silently renders every meter as an empty track. */
.pillar-fill { display: block; height: 100%; border-radius: 999px; background: var(--graphite); }

/* --------------------------------------------------------------- detail sheet */
/* Three zones: a pinned header carrying the record's identity, a scrolling body, and a
   footer created only when a consumer asks for one. The one real elevation in the system
   (DESIGN.md's Sheet overlay) lifts the drawer; nothing inside it floats. */
.sheet-scrim {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.28); z-index: var(--z-scrim);
  opacity: 0; transition: opacity 180ms ease-out;
}
.sheet-scrim.open { opacity: 1; }
.sheet {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: var(--z-sheet);
  width: var(--sheet-w);
  background: var(--page);
  box-shadow: var(--shadow-sheet);
  transform: translateX(100%);
  transition: transform 220ms ease-out, width 160ms ease-out;
  display: flex; flex-direction: column;
}
.sheet--wide { width: var(--sheet-w-wide); }
.sheet.open { transform: translateX(0); }
/* Severity accent on the header only, absolutely positioned so header and body text keep
   one left edge. Header-height, not full-height: a floor-to-ceiling red bar is exactly the
   security-vendor theater PRODUCT.md rejects. */
.sheet[data-sev] .sheet-header::before {
  content: ""; position: absolute; top: 0; left: 0; height: 100%; width: 3px;
  background: var(--sev-unknown);
}
.sheet-header { position: relative; }
.sheet[data-sev="CRITICAL"] .sheet-header::before { background: var(--sev-critical); }
.sheet[data-sev="HIGH"] .sheet-header::before { background: var(--sev-high); }
.sheet[data-sev="MEDIUM"] .sheet-header::before { background: var(--sev-medium); }
.sheet[data-sev="LOW"] .sheet-header::before { background: var(--sev-low); }
.sheet[data-sev="INFO"] .sheet-header::before { background: var(--sev-info); }

.sheet-header {
  padding: 14px 18px 12px;
  border-bottom: 1px solid transparent;
  transition: border-color 120ms linear;
  display: flex; flex-direction: column; gap: 8px;
  flex: 0 0 auto;
}
/* The affordance for "there is more below" is a hairline, never an ambient shadow. */
.sheet.is-scrolled .sheet-header { border-bottom-color: var(--hairline); }
.sheet-headrow {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
}
.sheet-heading { min-width: 0; }
.sheet-title { font-size: 1rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.sheet-title:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
.sheet-subtitle { margin-top: 2px; }
.sheet-back {
  align-self: flex-start; display: inline-flex; align-items: center;
  min-height: 0; padding: 0;
}
.sheet-headactions { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; margin: -4px -4px 0 0; }
.sheet-close, .sheet-widen {
  flex: 0 0 auto; border: none; background: none; cursor: pointer; box-shadow: none;
  min-height: 28px; width: 28px; height: 28px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-3); border-radius: var(--radius-sm);
}
.sheet-close:hover, .sheet-widen:hover { background: rgba(0, 0, 0, 0.045); color: var(--ink); border-color: transparent; }
.sheet-close:active, .sheet-widen:active { background: rgba(0, 0, 0, 0.075); }
.sheet-widen[aria-pressed="true"] { color: var(--ink); background: rgba(0, 0, 0, 0.06); }
.sheet-close:focus-visible, .sheet-widen:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* Chips sit in the header so the verdict survives scrolling the evidence. */
.sheet-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.sheet-chips:empty { display: none; }
.sheet-chip-label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text-3);
}
.sheet-chip-label + * { margin-right: 4px; }

.sheet-body {
  padding: 4px 18px 24px; overflow-y: auto; flex: 1 1 auto;
  overscroll-behavior: contain;
}
.sheet-footer {
  flex: 0 0 auto; padding: 12px 18px; border-top: 1px solid var(--hairline);
  background: var(--page);
  display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px;
}
/* Legacy in-body action row (sync-progress drawer): wrap rather than force a
   horizontal scrollbar inside the drawer at phone widths. */
.sheet-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

/* The record's headline number — the one hero value per sheet, and always a data value. */
.sheet-verdict { display: flex; align-items: baseline; gap: 10px; margin: 12px 0 2px; }
.aars-total {
  font-size: 2rem; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.sheet-caption { color: var(--text-3); font-size: 12px; margin: 2px 0 0; }

/* List rows. `button` where the row leads somewhere, so it is reachable by keyboard. */
.sheet-list { display: flex; flex-direction: column; }
.sheet-row {
  display: block; width: 100%; text-align: left; font: inherit; color: inherit;
  background: none; border: none; border-bottom: 1px solid var(--hairline);
  border-radius: 0; box-shadow: none; min-height: 0;
  padding: 9px 8px 10px; margin: 0 -8px;
}
.sheet-row:last-child, .sheet-list > :last-child { border-bottom: none; }
button.sheet-row { cursor: pointer; }
button.sheet-row:hover { background: rgba(0, 0, 0, 0.03); border-color: var(--hairline); }
button.sheet-row:active { background: rgba(0, 0, 0, 0.05); }
button.sheet-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.sheet-row-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.sheet-row-title { font-size: 13px; margin-top: 4px; }
.sheet-row-note {
  font-size: 12px; color: var(--text-2); margin-top: 2px; max-width: var(--measure);
}
.sheet-row .fw-tags { margin-top: 6px; }
.sheet-fix { margin-top: 8px; }
.sheet-fix-label {
  display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--text-3);
}
.sheet-fix-body {
  margin: 3px 0 0; font-size: 12px; color: var(--text-2); white-space: pre-wrap;
  max-width: var(--measure);
}
.sheet-rel-dir { color: var(--text-3); }
.sheet-rel .sheet-row-head { gap: 6px; }
.sheet-more { margin-top: 10px; }

/* Skeleton stack: the placeholder is shaped like the record that is coming. */
.sheet-loading .sheet-section > .skeleton + .skeleton { margin-top: 8px; }

.tag-strip { display: flex; flex-wrap: wrap; gap: 4px; }

/* Error state: a failure reads as a failure, with a way out. */
.empty--error { border-style: solid; border-color: rgba(185, 28, 28, 0.28); text-align: left; padding: 16px; }
.empty-actions { margin-top: 12px; }
.empty-detail { margin-top: 10px; color: var(--text-3); }
.empty-detail summary { cursor: pointer; font-size: 12px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  border: 0;
}
/* The sheet owns the viewport while it is open; ≤800px un-hides #app's overflow. */
html.sheet-open, html.sheet-open body { overflow: hidden; }
.scan-stall-note {
  margin: 12px 0 4px; padding: 8px 10px; font-size: 13px;
  color: var(--warn); background: rgba(161, 98, 7, 0.08);
  border: 1px solid rgba(161, 98, 7, 0.18); border-radius: var(--radius-md);
}
.sheet-section { margin-bottom: 18px; }
.sheet-section .label { margin-bottom: 6px; display: block; }
/* One scroll, but you always know which section you are in. Sticks directly under the
   header (which is outside the scroll container), over the page ground so rows pass
   behind it rather than through it. */
h3.sheet-section-title {
  position: sticky; top: 0; z-index: 1;
  margin: 0 0 6px; padding: 8px 0 5px;
  background: var(--page);
}
/* Filter panel body — the docked panel, or the modal sheet below 800px. Hairline-ruled
   sections; every control applies immediately. */
.filter-fields { display: flex; flex-direction: column; }
.filter-fields select { width: 100%; }
.filter-section { padding: 16px 0 4px; border-top: 1px solid var(--hairline); }
.filter-section:first-child { border-top: none; padding-top: 4px; }
.filter-section-head {
  display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px;
}
/* The section title doubles as the jump target for a filter chip's label, so it is
   programmatically focusable. Its ring is inset — a section heading has no border of its
   own to sit outside of, and an outset ring would collide with the rule above it. */
.filter-section-head .label { margin: 0; }
.filter-section-focus:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
.filter-section-count {
  margin-left: 6px; font-variant-numeric: tabular-nums;
  font-weight: 600; color: var(--accent-hover);
}
.filter-section-count:empty { display: none; }
.filter-section-head .link { margin-left: auto; font-size: 12px; }
.filter-section .field-hint { color: var(--text-3); }
.depth-field { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.filter-fields-footer {
  margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hairline);
}

/* Collapsible group inside the panel (the node-type categories). Shares the legend's
   chevron so the page has one disclosure, not two. */
.disclosure > .disclosure-toggle {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px; padding: 4px 0;
  border-radius: var(--radius-sm);
}
.disclosure > .disclosure-toggle::-webkit-details-marker { display: none; }
.disclosure > .disclosure-toggle::after {
  content: ""; margin-left: auto; width: 6px; height: 6px;
  border-right: 1.5px solid var(--text-3); border-bottom: 1.5px solid var(--text-3);
  transform: rotate(-45deg); transform-origin: 55% 55%;
  transition: transform 150ms ease-out;
}
.disclosure[open] > .disclosure-toggle::after { transform: rotate(45deg); }
.disclosure > .disclosure-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.disclosure .pill-group-label { margin-bottom: 0; }
.pill-group-count {
  font-size: 11px; font-weight: 600; color: var(--text-3);
  font-variant-numeric: tabular-nums;
}
.disclosure > .pill-row { padding: 6px 0 10px; }
@media (prefers-reduced-motion: reduce) {
  .disclosure > .disclosure-toggle::after { transition: none; }}

/* Facet rows: one filter option, how many rows it would still leave, and a bar for that
   count. Toggle buttons rather than checkboxes because the stylesheet has exactly one
   binary vocabulary and it is aria-pressed — a lone checkbox here would read as a
   different kind of control. The drawn box supplies the checkbox affordance and is the
   non-colour state cue. */
.facet-group { display: flex; flex-direction: column; gap: 4px; }
.facet-group[hidden] { display: none; }
.facet-group-head { display: flex; align-items: baseline; gap: 8px; }
.facet-group-label {
  font-size: 12px; font-weight: 600; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--text-3);
}
.facet-group-hint { font-size: 11px; color: var(--text-3); }
.facet-search-wrap { margin: 2px 0 4px; }
.facet-search { width: 100%; min-height: 30px; font-size: 12px; }
.facet-list { display: flex; flex-direction: column; }
.facet-subhead {
  font-size: 11px; font-weight: 600; color: var(--text-3);
  margin: 8px 0 2px; padding-left: 6px;
}
.facet-row {
  display: grid; grid-template-columns: 14px 1fr 44px auto; align-items: center; gap: 9px;
  width: 100%; text-align: left; padding: 5px 6px; min-height: 30px;
  border: 1px solid transparent; background: none; box-shadow: none;
  border-radius: var(--radius-sm); font-size: 13px; font-weight: 400; color: var(--ink);
}
.facet-row:hover { background: rgba(0, 0, 0, 0.04); border-color: transparent; }
.facet-row[aria-pressed="true"] { background: rgba(0, 0, 0, 0.05); font-weight: 600; }
.facet-box {
  width: 14px; height: 14px; border: 1px solid var(--hairline); border-radius: 4px;
  background: var(--page);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; line-height: 1; color: transparent;
}
/* The checkbox affordance without a checkbox's second style vocabulary. The tick is a
   glyph rather than a CSS gradient — the gradient version reads as a caret at 14px. */
.facet-box::before { content: "✓"; }
.facet-row[aria-pressed="true"] .facet-box {
  background: var(--accent); border-color: var(--accent); color: #ffffff;
}
.facet-label {
  display: flex; align-items: center; gap: 6px; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.facet-label .sev-dot { margin-right: 0; flex: 0 0 8px; }
.facet-count { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
/* Neutral on purpose: a facet count is a quantity, not a severity, and the Rationed Ink
   Rule spends colour only on risk. */
.facet-bar { height: 3px; border-radius: 999px; background: rgba(0, 0, 0, 0.07); }
.facet-bar-fill { display: block; height: 100%; border-radius: 999px; background: rgba(0, 0, 0, 0.32); }
/* Zero yield: dimmed AND carrying a visible 0 — never dimming alone, which reads as
   "broken" rather than "empty" (the same rule .rule-dead follows). aria-disabled, not
   disabled, so the option stays focusable and its 0 stays discoverable. */
.facet-row[aria-disabled="true"] { opacity: 0.45; }
.facet-row[aria-disabled="true"]:hover { background: none; }
.facet-empty { margin: 4px 6px; }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--text-3); margin: 0; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
/* Below the phone breakpoint a 150px label column leaves ~129px for the value, which
   wraps "Unknown (inherited from host)" across four lines. Stack instead. */
@media (max-width: 640px) {
  .kv { grid-template-columns: 1fr; gap: 0 0; }
  .kv dt { margin-top: 8px; }
  .kv dt:first-child { margin-top: 0; }
  .pillar-row { flex-wrap: wrap; }
  .pillar-row .pillar-name { width: auto; flex: 1 1 auto; }
  .pillar-track { flex: 1 1 100%; order: 3; }
}
.raw-json {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius-lg); padding: 10px; font-size: 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space: pre-wrap; word-break: break-all; max-height: 320px; overflow: auto;
}

/* ---------------------------------------------------------------------- dialogs */
dialog {
  border: 1px solid var(--hairline);
  border-radius: var(--radius-xl);
  padding: 20px;
  max-width: min(560px, 94vw);
  box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.2);
  font-family: var(--font);
}
dialog::backdrop { background: rgba(0, 0, 0, 0.28); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

/* ----------------------------------------------------------------------- toasts */
#toasts { position: fixed; bottom: 18px; right: 18px; z-index: 60; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--graphite); color: var(--on-graphite);
  border-radius: var(--radius-lg); padding: 10px 16px; font-size: 13px;
  box-shadow: 0 6px 18px -6px rgba(0, 0, 0, 0.35);
  animation: toast-in 200ms ease-out;
  max-width: 380px;
}
.toast.warn { background: #3f2d04; }
.toast.error { background: #450a0a; }
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ------------------------------------------------------------------ empty state */
.empty {
  border: 1px dashed var(--hairline); border-radius: var(--radius-xl);
  padding: 40px 24px; text-align: center; color: var(--text-2);
}

/* ------------------------------------------------------------- scan-coverage cards */
.scan-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.scan-card {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius-xl); padding: 16px; box-shadow: var(--shadow-card);
  display: flex; flex-direction: column; gap: 8px;
}
.scan-card h3 { margin: 0; display: flex; align-items: center; gap: 8px; }
.scan-card .scan-stat { font-size: 12px; font-weight: 600; color: var(--text-2); font-variant-numeric: tabular-nums; }
.scan-card p { margin: 0; font-size: 13px; color: var(--text-2); }
.scan-card .scan-callout {
  font-size: 12px; color: var(--warn);
  background: rgba(161, 98, 7, 0.08); border-radius: var(--radius-md); padding: 6px 8px;
}
.scan-card .scan-link { margin-top: auto; font-size: 12px; font-weight: 600; }

/* ------------------------------------------------------ toxic combinations page */

/* The graph's kind icons on an HTML surface (see kindIconSvg in icons.js), stroked in
   currentColor so a chip's icon and its label are always the same colour.
   The stroke has to be set on the inner <g>, not on this <svg>: .gnode-icon paints that
