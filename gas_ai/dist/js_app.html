025 LLM07 System Prompt Leakage \u2192 2026 LLM08, renamed Hidden Context Exposure; 2025 LLM10 Unbounded Consumption \u2192 2026 LLM06. Only LLM01 and LLM02 keep their number. A connector emitting 2026 codes into this cascade would be priced against the wrong risk \u2014 check the vintage before trusting a code.",entries:[["LLM01","Prompt Injection","Crafted input alters the model's behaviour, bypassing its instructions or safety rules."],["LLM02","Sensitive Information Disclosure","The model reveals PII, secrets or proprietary data in its output."],["LLM03","Supply Chain","Compromised third-party models, datasets, adapters or plugins enter the stack."],["LLM04","Data and Model Poisoning","Tampered training or fine-tuning data corrupts behaviour or plants a backdoor."],["LLM05","Improper Output Handling","Model output passes downstream unvalidated, enabling XSS, SSRF or code execution."],["LLM06","Excessive Agency","The model holds more permission, tooling or autonomy than its task needs."],["LLM07","System Prompt Leakage","The system prompt leaks, exposing secrets or the logic needed to bypass controls."],["LLM08","Vector and Embedding Weaknesses","Flaws in RAG vectors and embeddings leak data or inject content via retrieval."],["LLM09","Misinformation","The model emits confident, fabricated or wrong output that users act on."],["LLM10","Unbounded Consumption","Unmetered inference lets attackers drain cost and capacity, or extract the model."]]},{group:"OWASP Agentic (ASI)",vintage:"2026 edition",standing:"Published 1.0 (announced December 2025). It does NOT supersede the T-numbered list: \u201CAgentic AI \u2014 Threats and Mitigations\u201D is a parallel companion, updated to v1.1 in the same release and now running T1\u2013T17, not T1\u2013T15. The two are different layers \u2014 ASI is the ranked risk list, T is the granular attack pathway \u2014 and OWASP ships the official cross-map in ASI 2026 Appendix A. A scanner emitting T13 spans ASI10 and ASI04.",entries:[["ASI01","Agent Goal Hijack","Untrusted content redirects the agent's objective while it believes it serves the user."],["ASI02","Tool Misuse & Exploitation","Legitimate tools weaponised via deceptive input, poisoned metadata or unsafe chaining."],["ASI03","Identity & Privilege Abuse","Over-broad delegated credentials turn any hijack into unauthorised action."],["ASI04","Agentic Supply Chain Vulnerabilities","Compromised frameworks, MCP servers or tool schemas the agent dynamically trusts."],["ASI05","Unexpected Code Execution (RCE)","Agent-generated or agent-triggered code runs outside its sandbox or validation boundary."],["ASI06","Memory & Context Poisoning","Data planted in persistent memory or retrieval steers behaviour in later sessions."],["ASI07","Insecure Inter-Agent Communication","Agent-to-agent messages spoofed, replayed or tampered with for lack of auth."],["ASI08","Cascading Failures","One agent's error or compromise fans out through connected workflows at scale."],["ASI09","Human-Agent Trust Exploitation","Agents manipulate the human approval step by controlling what the reviewer is shown."],["ASI10","Rogue Agents","Agents operating outside policy while appearing legitimate, via drift or compromise."]]},{group:"OWASP ML",vintage:"draft v0.3",standing:"Still officially a draft and modified frequently. These codes are DERIVED \u2014 the sync builds ML_ plus the finding's title, so they carry no ordinal and the ML0n below is a mapping this page states, not one the data contains.",entries:[["ML_INPUT_MANIPULATION","Input Manipulation Attack (ML01)","Adversarial inputs perturbed just enough to force a wrong prediction."],["ML_DATA_POISONING","Data Poisoning Attack (ML02)","Training data tampered with so the model learns attacker-chosen behaviour."],["ML_MODEL_INVERSION","Model Inversion Attack (ML03)","Querying the model to reconstruct sensitive training records."],["ML_MEMBERSHIP_INFERENCE","Membership Inference Attack (ML04)","Determining whether a specific record was in the training set."],["ML_MODEL_THEFT","Model Theft (ML05)","Extracting or exfiltrating model weights or behaviour via queries or access."],["ML_SUPPLY_CHAIN","AI Supply Chain Attacks (ML06)","Compromised packages, datasets or pre-trained models enter the pipeline."],["ML_TRANSFER_LEARNING","Transfer Learning Attack (ML07)","A backdoored base model carries its malicious behaviour into the fine-tune."],["ML_MODEL_SKEWING","Model Skewing (ML08)","Manipulating the feedback or retraining loop to shift outputs over time."],["ML_OUTPUT_INTEGRITY","Output Integrity Attack (ML09)","Tampering with model output in transit or at the interface, not the model itself."],["ML_MODEL_POISONING","Model Poisoning (ML10)","Directly altering model parameters or weights to make it misbehave."]]},{group:"Wiz 5Rs",vintage:"vendor taxonomy",standing:"Wiz's own data-security response taxonomy \u2014 no public canonical spec, and these are RESPONSE ACTIONS rather than risks, so they are a different kind of thing from the OWASP entries above. The sync's issue enrichment does not read 5Rs mappings at all: these codes reach the cascade only through failing config findings.",entries:[["FIVE_RS","A failing 5Rs control","Any 5Rs control the asset fails, without naming which of the five."],["5R_REDUCE","Reduce","Stop data sprawl by finding and deleting shadow data."],["5R_RESTRICT","Restrict","Map and remove any over-privileged access."],["5R_RELABEL","Relabel","Label cloud assets with their data sensitivity."],["5R_RELOCATE","Relocate","Ensure data jurisdiction complies with your needs."],["5R_RECONFIGURE","Reconfigure","Ensure configurations such as encryption and retention are set."]]},{group:"Local to this model",vintage:"synthesised on sync",standing:"Not a framework code. The enrichment pass raises these itself, so they are stable by definition and change only when this app changes. NO_GUARDRAIL is always raised; DEPRECATED_MODEL and INACTIVE_AGENT are read off the asset's own status and only reach the cascade when their gap source is switched on in the rule \u2014 until then a row pricing them can never fire.",entries:[["NO_GUARDRAIL","No guardrail attached","Guardrail coverage flagged the asset \u2014 the LLM01 / ASI01 gap."],["DEPRECATED_MODEL","Deprecated model","The asset runs a model the provider has retired, e.g. text-embedding-005."],["INACTIVE_AGENT","Dormant agent","Inactive, but still holding its privileges and data reach \u2014 the ASI10 Rogue Agents shape."]]},{group:Tl,vintage:"match a whole vocabulary",standing:"Not codes an asset carries \u2014 these are what a \u201Cstarts with\u201D rule matches on. Price the family once here, then put any exact carve-out ABOVE it.",entries:[["LLM","The OWASP LLM family","Matches every LLM code. Exact rows for single entries must sit above this one."],["ASI","The OWASP Agentic family","Matches every ASI code."],["ML","The OWASP ML family","Matches every derived ML_ code."],["5R","The Wiz 5Rs family","Matches every 5R_ code. Note FIVE_RS does not start with 5R."]]}],Rl=Object.create(null),Jh=[];for(let t of Ya){let e=t.group===Tl;for(let[n,s,i]of t.entries){let a={code:n,title:s,blurb:i,group:t.group,vintage:t.vintage,standing:t.standing,isFamily:e};Rl[n]=a,e||Jh.push(a)}}function Ps(t){return String(t==null?"":t).trim().toUpperCase()}function di(t){return Rl[Ps(t)]||null}function k0(t){let e=Ps(t);return e?Jh.filter(n=>n.code.indexOf(e)===0):[]}function Qh(t,e){let n=t||[],s=n[e];if(!s||s.match!=="prefix")return 0;let i=Ps(s.code);if(!i)return 0;let a=0;for(let r=0;r<e;r++){let l=n[r];l&&Ps(l.code).indexOf(i)===0&&a++}return a}function ef(t,e,n){let s=n||{},i=Ps(t);if(!i)return{shape:"\u25C7",known:!1,text:"no code yet"};if(e==="prefix"){let r=k0(i),l={};for(let h of r)l[h.group+" "+h.vintage]=!0;let c=Object.keys(l),d=c.length===1?c[0]:"";if(!r.length)return{shape:"\u25C7",known:!1,text:"not in the codebook \xB7 matches any code starting "+i};let u=["family \xB7 "+r.length+(r.length===1?" code":" codes")],p=Number(s.pricedAbove)||0;return p&&u.push(p+" priced above"),d&&u.push(d),{shape:"\u25E7",known:!0,text:u.join(" \xB7 ")}}let a=Rl[i];if(!a||a.isFamily){let r=a&&a.isFamily?"a family prefix \u2014 matches nothing as an exact rule":"tenant code",l=s.fallbackPoints,c=typeof l=="number"?" \xB7 prices at the fallback, "+l:"";return{shape:"\u25C7",known:!1,text:"not in the codebook \xB7 "+r+c}}return{shape:"\u25CF",known:!0,text:"exact \xB7 "+a.title+" \xB7 "+a.group+" "+a.vintage}}function tf(t){let e=t||{},n=[];for(let s of Ya){let i=s.group+" \xB7 "+s.vintage;for(let[a,r,l]of s.entries){let c=e[a],d=typeof c=="number"&&c>0?" \u2014 "+c+(c===1?" asset":" assets"):"";n.push({value:a,label:a+" \xB7 "+r,hint:l+d,group:i})}}return n}function nf(t){let e=t||{},n=[];for(let s of Object.keys(e)){if(Rl[s])continue;let i=e[s];n.push({value:s,label:s,hint:"seen on "+i+(i===1?" asset":" assets")+" \u2014 not in the codebook",group:"Seen in this tenant \xB7 not in the codebook"})}return n.sort((s,i)=>e[i.value]-e[s.value]||s.value.localeCompare(i.value))}var sf=[{id:"aars-score",measure:"Findings score",type:"impact",measurementMethod:"Objective",goal:"One comparable number per AI asset for what has already been FOUND on it, priced from what a sync actually collected \u2014 never asserted.",formula:"computeAars(aarsInput, aarsRule): four pillars, summed and clamped to 0\u2013100.",dataSource:"ai_assets.aars, ai_assets.aars_input_json",reportingFormat:"AI Inventory register, beside its percentile; asset detail sheet's verdict number and pillar bars.",revisionDue:"2027-08-13"},{id:"aars-band",measure:"Findings score level",type:"impact",measurementMethod:"Objective",goal:"The score's own level, re-derived from the rule in force on every read. Context beside a score and a distribution over the landscape \u2014 not a per-asset decision, because on this landscape its top level holds most of the scored assets.",formula:"bandRanges(rule.bands) applied to the stored aars \u2014 no re-sync required.",dataSource:"ai_assets.aars, ai_assets.aars_severity",reportingFormat:"AI Inventory register and asset sheet (as a plain word); the level strip and trend chart (as a distribution); AARS Rules page (as a rule diagnostic, the one surface that still tints it).",revisionDue:"2027-08-13"},{id:"aars-percentile",measure:"Findings score percentile",type:"impact",measurementMethod:"Objective",goal:"Where one asset's score sits in the landscape that was actually scored \u2014 the placement an analyst can read, given that the score's levels barely separate assets on this landscape.",formula:"midrankPercentiles(scores) = (count below + count equal / 2) / N, whole percent. Tied scores share one percentile by construction.",dataSource:"ai_assets.aars",reportingFormat:"AI Inventory register (leads the score cell); asset detail sheet's verdict line, with the population size; security graph node badge.",revisionDue:"2027-08-13"},{id:"aars-distinct-scores",measure:"distinctScores",type:"effectiveness",measurementMethod:"Objective",goal:"Measures the MODEL's separating power, not the landscape's risk \u2014 a rule can render a confident number for every asset while carrying zero ranking information.",formula:"new Set(scores).size, over every scored asset in the preview.",dataSource:"ai_assets.aars",reportingFormat:"AARS Rules page, rule-preview Discrimination panel.",revisionDue:"2027-08-13"},{id:"aars-tie-rate",measure:"tieRate",type:"effectiveness",measurementMethod:"Objective",goal:"Same as distinctScores, at the scale of PAIRS: 1.0 means every pair of scored assets shares a value, so any ordering within the landscape is arbitrary.",formula:"\u03A3 C(n_k,2) / C(N,2) over the distinct-value groups (rankStats.tieRate).",dataSource:"ai_assets.aars",reportingFormat:"AARS Rules page, rule-preview Discrimination panel.",revisionDue:"2027-08-13"},{id:"aars-effective-cardinality",measure:"effectiveCardinality",type:"effectiveness",measurementMethod:"Objective",goal:"Same as distinctScores, weighted by population \u2014 one outlier score does not claim the same discrimination credit an even split would.",formula:"exp(Shannon entropy) over the score distribution (rankStats.effectiveCardinality).",dataSource:"ai_assets.aars",reportingFormat:"AARS Rules page, rule-preview Discrimination panel.",revisionDue:"2027-08-13"},{id:"aars-pillar-saturation",measure:"Pillar saturation",type:"effectiveness",measurementMethod:"Objective",goal:"Locates WHICH pillar of the model has stopped discriminating \u2014 a pillar pinned at its cap for most of the landscape still renders a plausible total score.",formula:"Assets at or above each pillar's cap (aarsRule.ts's ruleDiscrimination).",dataSource:"ai_assets.aars_pillars_json",reportingFormat:"AARS Rules page, rule-preview Discrimination panel.",revisionDue:"2027-08-13"},{id:"problem-outcome-distribution",measure:"Problem outcome distribution",type:"impact",measurementMethod:"Subjective",goal:"How open issues and failing findings split across Act/Attend/Track*/Track.",formula:"countProblemOutcomes(rows) over OUTCOME_VALUES, zero-filled. One input axis (exploitation) can be set via an LLM rater's verdict \u2014 see measurementMethod.",dataSource:"ai_issues.problem_outcome, ai_findings.problem_outcome",reportingFormat:"Priorities page KPI row; Priority column throughout.",revisionDue:"2027-08-13"},{id:"problem-axis-unknown-rate",measure:"Per-axis unknown rate",type:"implementation",measurementMethod:"Objective",goal:"THE MOST IMPORTANT MEASURE ON THIS PAGE. A high value does NOT mean the landscape is safe \u2014 it means the model cannot prioritise, because the evidence one axis needs was never collected. Reading it as reassurance is the misuse this exists to prevent.",formula:"Fraction of the decided population unresolved on each axis (treeDiscrimination.unknownRate).",dataSource:"ai_issues.problem_input_json, ai_findings.problem_input_json",reportingFormat:"AARS Rules page, Problem tree tab's preview.",revisionDue:"2027-08-13"},{id:"posture-tier-distribution",measure:"Posture tier distribution",type:"impact",measurementMethod:"Objective",goal:"How many assets sit in each capability-envelope tier (1 best, 4 worst) \u2014 independent of what has been found on the asset.",formula:"countPostureTiers(nodes) over TIER_VALUES, zero-filled.",dataSource:"ai_assets.posture_tier",reportingFormat:"AI Inventory Posture column; Priorities page's ranking.",revisionDue:"2027-08-13"},{id:"issue-sla-tally",measure:"SLA tally",type:"efficiency",measurementMethod:"Objective",goal:"How much of the open-issue register is racing a clock \u2014 past-due, due-soon or no deadline at all, kept apart.",formula:"slaState(dueAt, now) bucketed per issue (comboDigest.ts).",dataSource:"ai_issues.due_at",reportingFormat:"Toxic Combinations KPI row; Priorities page's SLA tiebreak.",revisionDue:"2027-08-13"},{id:"compliance-gaps",measure:"complianceGaps",type:"effectiveness",measurementMethod:"Objective",goal:"How many cloud-configuration controls are failing right now \u2014 one definition, shared by every page that counts it.",formula:"isOpenGap(finding) filter, then a count.",dataSource:"ai_findings.result, ai_findings.status",reportingFormat:"AI Inventory KPI row; Cloud Configuration register header.",revisionDue:"2027-08-13"},{id:"compliance-gaps-unlinked",measure:"complianceGapsUnlinked",type:"implementation",measurementMethod:"Objective",goal:"How much of complianceGaps this app can attribute to a modeled AI asset \u2014 a fact about THIS APP's own graph coverage, not about Wiz's controls.",formula:"Open gaps whose resourceId is not a key in the current asset set.",dataSource:"ai_findings.resource_id, ai_assets.id",reportingFormat:"AI Inventory KPI row, beside complianceGaps.",revisionDue:"2027-08-13"},{id:"guardrail-coverage-pct",measure:"guardrailCoveragePct",type:"implementation",measurementMethod:"Objective",goal:"Share of SCANNED AI agents with no missing-guardrail finding raised \u2014 an absence of evidence, not a confirmed control, and reported beside the count the scan never reached rather than folded in with it.",formula:"protectedAgents (guardrailMissing === false) / (agents - guardrailUnknownAgents) \xD7 100, rounded; null when nothing was scanned.",dataSource:"ai_assets.guardrail_missing, ai_assets.kind",reportingFormat:"Wiz Scans coverage area, beside protectedAgents and guardrailUnknownAgents.",revisionDue:"2027-08-13"},{id:"posture-scope-split",measure:"posture tiers, withheld, out of scope",type:"implementation",measurementMethod:"Objective",goal:"How much of the register the posture lattice actually rates \u2014 and for the rest, which of the two reasons applies. Withheld is a coverage gap someone can close; out of scope says this lattice does not describe this kind of asset, and nothing can.",formula:"censusPostureTiers(nodes): tier counts (zeros kept) plus withheld, outOfScope and total, split on whether the node carries a posture vector at all.",dataSource:"sync_history.posture_tier_json, ai_assets.posture_tier, ai_assets.posture_input_json",reportingFormat:"Inventory posture header; the Posture column reason per row; the posture trend series.",revisionDue:"2027-08-13"},{id:"derivation-version-currency",measure:"derivation version, ledger vs code",type:"implementation",measurementMethod:"Objective",goal:"Whether the stored facts were collected by the normalizer now running. The one staleness Recompute cannot repair, because the old value was destroyed at ingest \u2014 so the warning names a full sync as its remedy.",formula:"derivationIsStale(settings, DERIVATION_VERSION); an unstamped ledger reads stale, the opposite default to the three rule-version markers.",dataSource:"sync_history.derivation_version, settings.key, settings.value_json",reportingFormat:"Staleness banner; break markers on every sync_history trend series.",revisionDue:"2027-08-13"},{id:"toxic-combo-patterns-active",measure:"patternsActive / patte "Wiz was asked for a relationship and found none. Rather than leave the gap off the picture, the edge is drawn dashed and labelled with what is missing. The guardrail gap is the one this app raises: a PROTECTED_BY edge that does not exist.",drawnOn:["graph"],mark:()=>o("span",{class:"help-dash","aria-hidden":"true"}),link:{label:"Open the graph",route:"graph",params:{}}},{id:"risk-as-node",term:"Risk is a node",aka:"not a flag on a card",family:"graph",blurb:"Sensitive-data reach, internet exposure, excessive rights and the guardrail gap are drawn as nodes hanging off the asset they describe, on the path \u2014 because that is what an attack path is. They are derived when the graph is READ and never stored, so an already-synced graph gains them without a re-sync.",drawnOn:["graph"],mark:()=>hi("EXCESSIVE_ACCESS_FINDING"),link:{label:"Open the graph",route:"graph",params:{}}},{id:"graph-query",term:"The query builder",aka:"FIND \u2026 THAT \u2026",family:"graph",blurb:"A query reads FIND <entity> THAT <relationship> <entity>, and each further step walks one more hop along the graph. In the table a ROW IS A PATH, not an asset: an agent bound to two service accounts is two rows carrying the same name, and every shown step adds a group of columns rather than a column. The eye keeps a step in the traversal but drops its columns, an optional step keeps rows that would otherwise be dropped with the group left empty, and NOT asserts the relationship is absent \u2014 which is how you ask for an agent with no guardrail. The pickers only offer relationships this tenant's graph actually holds, so a query that can match nothing is hard to build.",drawnOn:["graph"],mark:()=>o("span",{class:"pill neutral"},"FIND"),link:{label:"Open the graph",route:"graph",params:{}}},{id:"depth-budget",term:"Depth and node budget",aka:"what bounds a view",family:"graph",blurb:"Depth bounds how far the traversal walks from its starting points. The node budget is a hard ceiling on one view, counting the collapse stubs it also draws. Both keep the server payload light; a view that hits the ceiling says so and offers Load more, which widens that one view without changing the default.",drawnOn:["graph","settings"],mark:()=>o("span",{class:"pill neutral"},"budget"),fromSettings:!0,count:t=>{let e=t.boot.settings;return e?{n:Ve(e.maxNodes),value:"depth "+Ve(e.defaultDepth)+" \xB7 "+Ve(e.maxNodes),unit:"nodes per view",route:"settings",params:{}}:null}},{id:"summary-stub",term:"The collapse stub",aka:"\u201C+N more\u201D",family:"graph",blurb:"A high-fanout neighbour set collapsed into one pill, which expands on demand. The stub counts against the node budget like any other node, which is why a capped view still shows them: the budget buys paths, not a field of disconnected dots.",drawnOn:["graph"],mark:()=>hi("SUMMARY"),link:{label:"Open the graph",route:"graph",params:{}}},{id:"missing-guardrail",term:"MISSING_GUARDRAIL",aka:"\u201Cno guardrail\u201D",family:"signal",blurb:"No guardrail is attached to this agent or model. Wiz tests the PROTECTED_BY relationship on every agent, and an absent edge raises this node. It is the strongest single amplifier in the toxic combinations.",drawnOn:["graph","inventory"],mark:()=>hi("MISSING_GUARDRAIL"),count:t=>{let e=t.kpis;if(!e||e.protectedAgents===void 0||!e.agents)return null;let n=Ve(e.agents)-Ve(e.protectedAgents);return{n,value:n+" of "+Ve(e.agents),unit:"agents unprotected",route:"inventory",params:{flags:"guardrail"}}}},{id:"data-finding",term:"DATA_FINDING",aka:"what Wiz found in the data",family:"signal",blurb:"Wiz's DSPM verdict on one bucket or database \u2014 what class of sensitive data is in it, and how severe. Drawn as one node per datastore carrying the count, because a store with two hundred findings is one fact about that store, not two hundred nodes. These are what turn \u201Cthis agent can reach sensitive data\u201D into a path you can walk: agent \u2192 execution identity \u2192 datastore \u2192 findings.",drawnOn:["graph"],mark:()=>hi("DATA_FINDING"),count:t=>{let e=t.kpis;return!e||e.dataFindings===void 0?null:{n:Ve(e.dataFindings),value:String(Ve(e.dataFindings)),unit:Ds(Ve(e.dataFindings),"finding")+" on reachable stores",route:"graph",params:{kinds:"DATA_FINDING"}}}},{id:"sensitive-data",term:"SENSITIVE_DATA",aka:"classified-data reach, unresolved",family:"signal",blurb:"The FALLBACK marker: Wiz says this asset can reach data classified as PII, PHI or PCI, but no path to the store could be walked \u2014 the tenant rejected the traversal, or the grant is expressed some way it does not follow. Where the path IS walkable the chain is drawn instead and this marker is suppressed, so one asset never tells the same story twice. Its mark is the data-finding gem, left unfinished.",drawnOn:["graph"],mark:()=>hi("SENSITIVE_DATA"),count:t=>{let e=t.kpis;return!e||e.sensitiveAccess===void 0?null:{n:Ve(e.sensitiveAccess),value:String(Ve(e.sensitiveAccess)),unit:"AI "+Ds(Ve(e.sensitiveAccess),"asset")+" reach it",route:"graph",params:{kinds:"SENSITIVE_DATA"}}}},{id:"internet-exposure",term:"INTERNET_EXPOSURE",aka:"network reachability",family:"signal",blurb:"The asset or the host underneath it is reachable from the internet. Managed agents report it directly; hosted agents inherit it from the VM or service beneath them, which Wiz reports as UNDETERMINED until that host is checked. Undetermined is counted separately and never folded into \u201Cnot exposed\u201D.",drawnOn:["graph"],mark:()=>hi("INTERNET_EXPOSURE"),count:t=>{let e=t.kpis;if(!e||e.internetExposed===void 0)return null;let n=Ve(e.internetUnknown);return{n:Ve(e.internetExposed),value:String(Ve(e.internetExposed)),unit:"reachable"+(n?" \xB7 "+n+" undetermined":""),route:"graph",params:{kinds:"INTERNET_EXPOSURE"}}}},{id:"excessive-privilege",term:"EXCESSIVE_PRIVILEGE",aka:"excessive rights",family:"signal",blurb:"The identity an AI asset runs as holds admin or high-privilege permissions. The individual excessive-access and lateral-movement findings on those service accounts are synced and drawn beside the identity, but nothing totals them, so the figure here counts assets and identities carrying the flag.",drawnOn:["graph"],mark:()=>hi("EXCESSIVE_PRIVILEGE"),count:t=>{let e=t.kpis;return!e||e.highPrivilege===void 0?null:{n:Ve(e.highPrivilege),value:String(Ve(e.highPrivilege)),unit:"carry a privilege flag",route:"graph",params:{kinds:"EXCESSIVE_PRIVILEGE"}}}},{id:"agentic-identity",term:"Agentic identity",aka:"a service account an agent runs as",family:"signal",blurb:"An identity whose purpose is to execute agent work rather than to represent a person. It is the join between an agent and everything that agent can reach, which is why over-broad rights on one turn any hijack into unauthorised action.",drawnOn:["graph","inventory"],mark:()=>hi("SERVICE_ACCOUNT"),count:t=>{let e=t.kpis;return!e||e.agenticIdentities===void 0?null:{n:Ve(e.agenticIdentities),value:String(Ve(e.agenticIdentities)),unit:Ve(e.agenticIdentities)===1?"agentic identity":"agentic identities",route:"inventory",params:{flags:"agentic"}}}},{id:"aars",term:"Findings score",aka:"AARS \u2014 the identifier every column and route still uses",family:"score",blurb:"One number per asset, 0 to 100, summed across four pillars and clamped. It is this app's own score, not a Wiz field: it prices what the sync collected, so the model that produces it is editable and its inputs are persisted beside every score. It counts what has already been FOUND \u2014 issues, compliance gaps, data exposure \u2014 which is why it is not called a risk score; forward-looking consequence is the posture tier's job. Surfaces show it as a percentile of the scored landscape, because the raw number is only meaningful against the other assets.",drawnOn:["inventory","graph","aars"],mark:()=>Pi(78,92,"HIGH"),count:t=>{let e=t.kpis;return!e||e.aarsScored===void 0?null:{n:Ve(e.aarsScored),value:String(Ve(e.aarsScored)),unit:"assets scored",route:"inventory",params:{}}}},{id:"aars-percentile",term:"AARS percentile",aka:"rank within this landscape",family:"score",blurb:"Where this asset's score falls among every OTHER scored asset in the landscape, 0 to 100, using midrank so a tied score is shared rather than arbitrarily broken. It is the lead read for one asset on the Inventory table and the asset sheet \u2014 a rank survives the population shift that an absolute band does not, and it MOVES whenever the landscape does, even when this asset's own score has not changed at all.",drawnOn:["inventory"],mark:()=>zd(92,78)},{id:"aars-band",term:"Findings score level",aka:"context beside a score, not a verdict",family:"score",blurb:"The level a score falls into. Bands are re-derived from the stored score on every read, so moving a threshold applies at once and retroactively \u2014 no re-sync, no rescore. Changing the POINT model is the other thing entirely, and strands the stored scores until they are recomputed. A level is not a queue: on this landscape the top one holds most of the scored assets and two hold none, so it is drawn tinted only on the AARS Rules page, where the thresholds themselves are the subject, and plain everywhere else. Its two honest readings are the distribution the trend charts over time and the occupancy the rule editor reports.",drawnOn:["aars","inventory"],mark:()=>Xe("HIGH"),fromSettings:!0,count:t=>{let e=t.boot.aarsRule;if(!e||!e.bands)return null;let n=["critical","high","medium","low"].map(s=>e.bands[s]).filter(s=>typeof s=="number");return n.length!==4?null:{n:n.length,value:n.join(" / "),unit:"thresholds in force",route:"aars",params:{}}}},{id:"pillar-a",term:"Pillar A",aka:"toxic-combination participation",family:"score",blurb:"Points for the combinations an asset is in, priced by the worst severity among them and lifted by a multiplier once there is more than one issue. How that multiplier scales is itself a choice: flat applies it once, log2 grows it with the issue count so a tenth issue still moves the number. Capped, so no single pillar can carry the whole score.",drawnOn:["aars"],mark:()=>o("span",{class:"pill neutral"},"A"),fromSettings:!0,count:t=>{let e=t.boot.aarsRule&&t.boot.aarsRule.pillarCaps;return!e||e.toxic===void 0?null:{n:Ve(e.toxic),value:"cap "+Ve(e.toxic),unit:"of 100",route:"aars",params:{}}}},{id:"pillar-b",term:"Pillar B",aka:"compliance gaps",family:"score",blurb:"Points for the framework codes an asset's failing findings violate, priced by an ORDERED cascade \u2014 first match wins, ending in a fallback for codes the codebook does not carry. Its quantity is order, not magnitude, which is why that pillar is the one edited as a table. How the matched prices COMBINE is a second choice: summing them pins most assets to the cap, because Wiz maps one underlying risk onto an OWASP LLM code and an ASI code and an ML title, so root-sum-square is offered to soften that triple charge and keep the pillar discriminating.",drawnOn:["aars","inventory"],mark:()=>o("span",{class:"pill neutral"},"B"),count:t=>{let e=t.kpis;return!e||e.complianceGaps===void 0?null:{n:Ve(e.complianceGaps),value:String(Ve(e.complianceGaps)),unit:"failing findings priced",route:"aars",params:{}}}},{id:"pillar-c",term:"Pillar C",aka:"data exposure",family:"score",blurb:"Points for what classified data the asset can reach, lifted by the 5Rs amplifier. The amplifier is the one number on the model that is not a policy choice \u2014 it is a systemic signal, so it applies to every data point regardless of asset. This pillar's ceiling is DERIVED (top tier through the amplifier) rather than set.",drawnOn:["aars"],mark:()=>o("span",{class:"pill neutral"},"C"),fromSettings:!0,count:t=>{let e=t.boot.aarsRule&&t.boot.aarsRule.pillarCaps;return!e||e.data===void 0?null:{n:Ve(e.data),value:"cap "+Ve(e.data),unit:"of 100",route:"aars",params:{}}}},{id:"pillar-d",term:"Pillar D",aka:"internet reachability",family:"score",blurb:"Points for whether the asset is reachable from the internet. Its three states are not a severity ramp: UNDETERMINED is an epistemic state, not a middling amount of exposure \u2014 Wiz reports it for a hosted agent because reachability is inherited from the host underneath and was never evaluated on the agent itself. It prices BELOW confirmed and ABOVE none, which is the honest reading of \u201Cthis needs checking\u201D, and it must never be collapsed into either neighbour.",drawnOn:["aars","graph"],mark:()=>o("span",{class:"pill neutral"},"D"),more:"Priced at zero in the spec rule, which scores exposure nowhere even though the graph draws it as a first-class node. The calibrated preset turns it on.",link:{label:"Open AARS Rules",route:"aars",params:{}}},{id:"gap-sources",term:"Gap sources",aka:"what may raise a gap",family:"score",blurb:"Separate from what a gap COSTS: which derivations are allowed to raise one at all. Every source is off by default, because switching one on re-prices assets and the applied table in the spec is normative for the default rule. They exist because three rows of the default cascade price codes nothing in the live pipeline emits \u2014 not shadowed, unreachable, with the signal each needs already in the sheets.",drawnOn:["aars"],mark:()=>o("span",{class:"pill neutral"},"\xB1"),link:{label:"Open AARS Rules",route:"aars",params:{}}},{id:"rescore",term:"Recompute scores",aka:"not a sync",family:"score",blurb:"Re-runs the enrichment over data already in the sheet and makes ZERO Wiz API calls. It writes no sync-history row, because a rescore is not a sync and the trend must not gain a point for a landscape that never moved. Trend points carry the rule version they were scored under, so a threshold edit reads as a break rather than as movement.",drawnOn:["aars"],mark:()=>o("span",{class:"pill neutral"},"\u21BB"),link:{label:"Open AARS Rules",route:"aars",params:{}}},{id:"problem-tree",term:"Problem tree",aka:"ACT \xB7 Attend \xB7 Track* \xB7 Track",family:"score",blurb:"A 54-leaf decision tree \u2014 exploitation \xD7 technical impact \xD7 system exposure \xD7 mission \u2014 that routes one issue or finding into one of four queues, first match wins over an ordered cascade. It answers a different question than the findings score: not a rank, a queue, and it is built so most leaves land in Track or Track* and only a documented, auditable minority reach Act. The AARS Rules page carries its editor on a second tab.",drawnOn:["aars","problems"],mark:()=>an("ACT"),link:{label:"Open the Problem tree tab",route:"aars",params:{}}},{id:"posture-tier",term:"Posture tier",aka:"a capability envelope, not a sum of problems",family:"score",blurb:"1 to 4, 4 worst \u2014 a first-match cascade over capability \xD7 containment \xD7 consequence, the same mechanism the Problem tree uses, aimed at a different question: not what has been FOUND on an asset, but what it could DO and what stands in its way. An agent with zero open issues and unrestricted access to sensitive data is not a low tier just because nothing has been found yet \u2014 this is the one reading on the Inventory that is not an aggregate of the findings score or of the Problem tree's outcomes, deliberately drawn beside them rather than blended in.",drawnOn:["aars","inventory","problems"],mark:()=>Sn(4),link:{label:"Open the Posture tab",route:"aars",params:{}}},{id:"posture-axes",term:"Capability \xB7 containment \xB7 consequence",aka:"the posture lattice's three axes",family:"score",blurb:"Capability: identity power and data reach (BROAD/SCOPED/MINIMAL). Containment: how much stands between the asset and the outside world (WEAK/PARTIAL/STRONG) \u2014 a clear guardrail scan alone reads PARTIAL, never STRONG, until a confirmed non-exposure corroborates it. Consequence: what a realized failure would cost (SEVERE/MODERATE/LIMITED). 27 cells; a lethal-trifecta row (private data reach \u2227 untrusted-content ingress \u2227 external egress) sits first in the default cascade and is reported UNREACHABLE rather than fed a guess \u2014 this app has no live signal for two of its three legs.",drawnOn:["aars"],mark:()=>o("span",{class:"pill neutral"},"27"),link:{label:"Open the Posture tab",route:"aars",params:{}}},{id:"priorities-rank",term:"The Priorities ranking",aka:"issues \u222A findings, one queue",family:"score",blurb:"Every unresolved issue and every open configuration finding, unioned into one list and ranked on one scale \u2014 the thing neither Toxic Combinations (one pattern) nor Cloud Configuration (findings only) can show. Worst-first at five levels: the Problem tree's outcome, then the asset's posture tier, then how soon it is due, then the amplification vector (identity power, data reach, whether language is the control channel), then id for stability. Nothing in the union is ever dropped for lacking a verdict \u2014 a row the tree never reached still gets a place, ranked last.",drawnOn:["problems"],mark:()=>o("span",{class:"pill neutral"},"1\u20135"),link:{label:"Open Priorities",route:"problems",params:{}}},{id:"severity",term:"Severity",aka:"six levels",family:"severity",blurb:"Critical, High, Medium, Low, Info, Unknown. Unknown is a local normalisation bucket, never a value the API returns. Every severity on every screen is a coloured DOT plus the level WORD \u2014 the red, orange and amber sit close enough together that the redundant cue is load-bearing, not decorative.",drawnOn:["combos","inventory","graph","problems"],mark:()=>Xe("CRITICAL"),count:t=>{let e=t.boot.counts;return!e||e.openIssues===void 0?null:{n:Ve(e.openIssues),value:String(Ve(e.openIssues)),unit:"open "+Ds(Ve(e.openIssues),"issue"),route:"combos",params:{}}}},{id:"adjusted-severity",term:"Adjusted severity",aka:"versus native",family:"severity",blurb:"What the 5Rs amplifier re-rates an issue to when the asset fails a data-security control. The severity Wiz returned \u2014 the NATIVE one \u2014 sits beside it, never instead of it, so an adjusted figure can always be traced back to what the scan
