t of the ten entries \u2014 this model is written against 2025, so a code here means what 2025 says it means. Five codes MEAN DIFFERENT THINGS across the two vintages, and two pairs effectively swap: 2025 LLM03 Supply Chain \u2192 2026 LLM04, while 2026 LLM03 is Excessive Agency (2025 LLM06); 2025 LLM05 Improper Output Handling \u2192 2026 LLM10, while 2026 LLM05 is Data and Model Poisoning (2025 LLM04); 2025 LLM07 System Prompt Leakage \u2192 2026 LLM08, renamed Hidden Context Exposure; 2025 LLM10 Unbounded Consumption \u2192 2026 LLM06. Only LLM01 and LLM02 keep their number. A connector emitting 2026 codes into this cascade would be priced against the wrong risk \u2014 check the vintage before trusting a code.",entries:[["LLM01","Prompt Injection","Crafted input alters the model's behaviour, bypassing its instructions or safety rules."],["LLM02","Sensitive Information Disclosure","The model reveals PII, secrets or proprietary data in its output."],["LLM03","Supply Chain","Compromised third-party models, datasets, adapters or plugins enter the stack."],["LLM04","Data and Model Poisoning","Tampered training or fine-tuning data corrupts behaviour or plants a backdoor."],["LLM05","Improper Output Handling","Model output passes downstream unvalidated, enabling XSS, SSRF or code execution."],["LLM06","Excessive Agency","The model holds more permission, tooling or autonomy than its task needs."],["LLM07","System Prompt Leakage","The system prompt leaks, exposing secrets or the logic needed to bypass controls."],["LLM08","Vector and Embedding Weaknesses","Flaws in RAG vectors and embeddings leak data or inject content via retrieval."],["LLM09","Misinformation","The model emits confident, fabricated or wrong output that users act on."],["LLM10","Unbounded Consumption","Unmetered inference lets attackers drain cost and capacity, or extract the model."]]},{group:"OWASP Agentic (ASI)",vintage:"2026 edition",standing:"Published 1.0 (announced December 2025). It does NOT super versarial inputs perturbed just enough to force a wrong prediction."],["ML_DATA_POISONING","Data Poisoning Attack (ML02)","Training data tampered with so the model learns attacker-chosen behaviour."],["ML_MODEL_INVERSION","Model Inversion Attack (ML03)","Querying the model to reconstruct sensitive training records."],["ML_MEMBERSHIP_INFERENCE","Membership Inference Attack (ML04)","Determining whether a specific record was in the training set."],["ML_MODEL_THEFT","Model Theft (ML05)","Extracting or exfiltrating model weights or behaviour via queries or access."],["ML_SUPPLY_CHAIN","AI Supply Chain Attacks (ML06)","Compromised packages, datasets or pre-trained models enter the pipeline."],["ML_TRANSFER_LEARNING","Transfer Learning Attack (ML07)","A backdoored base model carries its malicious behaviour into the fine-tune."],["ML_MODEL_SKEWING","Model Skewing (ML08)","Manipulating the feedback or retraining loop to shift outputs over time."],["ML_OUTPUT_INTEGRITY","Output Integrity Attack (ML09)","Tampering with model output in transit or at the interface, not the model itself."],["ML_MODEL_POISONING","Model Poisoning (ML10)","Directly altering model parameters or weights to make it misbehave."]]},{group:"Wiz 5Rs",vintage:"vendor taxonomy",standing:"Wiz's own data-security response taxonomy \u2014 no public canonical spec, and these are RESPONSE ACTIONS rather than risks, so they are a different kind of thing from the OWASP entries above. The sync's issue enrichment does not read 5Rs mappings at all: these codes reach the cascade only through failing config findings.",entries:[["FIVE_RS","A failing 5Rs control","Any 5Rs control the asset fails, without naming which of the five."],["5R_REDUCE","Reduce","Stop data sprawl by finding and deleting shadow data."],["5R_RESTRICT","Restrict","Map and remove any over-privileged access."],["5R_RELABEL","Relabel","Label cloud assets with their data sensitivity."],["5R_RELOCATE","Relocate","Ensure data jurisdiction complies with you
