025 LLM07 System Prompt Leakage \u2192 2026 LLM08, renamed Hidden Context Exposure; 2025 LLM10 Unbounded Consumption \u2192 2026 LLM06. Only LLM01 and LLM02 keep their number. A connector emitting 2026 codes into this cascade would be priced against the wrong risk \u2014 check the vintage before trusting a code.",entries:[["LLM01","Prompt Injection","Crafted input alters the model's behaviour, bypassing its instructions or safety rules."],["LLM02","Sensitive Information Disclosure","The model reveals PII, secrets or proprietary data in its output."],["LLM03","Supply Chain","Compromised third-party models, datasets, adapters or plugins enter the stack."],["LLM04","Data and Model Poisoning","Tampered training or fine-tuning data corrupts behaviour or plants a backdoor."],["LLM05","Improper Output Handling","Model output passes downstream unvalidated, enabling XSS, SSRF or code execution."],["LLM06","Excessive Agency","The model holds more permission, tooling or autonomy than its task needs."],["LLM07","System Prompt Leakage","The system prompt leaks, exposing secrets or the logic needed to bypass controls."],["LLM08","Vector and Embedding Weaknesses","Flaws in RAG vectors and embeddings leak data or inject content via retrieval."],["LLM09","Misinformation","The model emits confident, fabricated or wrong output that users act on."],["LLM10","Unbounded Consumption","Unmetered inference lets attackers drain cost and capacity, or extract the model."]]},{group:"OWASP Agentic (ASI)",vintage:"2026 edition",standing:"Published 1.0 (announced December 2025). It does NOT supersede the T-numbered list: \u201CAgentic AI \u2014 Threats and Mitigations\u201D is a parallel companion, updated to v1.1 in the same release and now running T1\u2013T17, not T1\u2013T15. The two are different layers \u2014 ASI is the ranked risk list, T is the granular attack pathway \u2014 and OWASP ships the official cross-map in ASI 2026 Appendix A. A scanner emitting T13 spans ASI10 and ASI04.",entries:[["ASI01","Agent Goal Hijack","Untrusted content redirects the agent's objective while it believes it serves the user."],["ASI02","Tool Misuse & Exploitation","Legitimate tools weaponised via deceptive input, poisoned metadata or unsafe chaining."],["ASI03","Identity & Privilege Abuse","Over-broad delegated credentials turn any hijack into unauthorised action."],["ASI04","Agentic Supply Chain Vulnerabilities","Compromised frameworks, MCP servers or tool schemas the agent dynamically trusts."],["ASI05","Unexpected Code Execution (RCE)","Agent-generated or agent-triggered code runs outside its sandbox or validation boundary."],["ASI06","Memory & Context Poisoning","Data planted in persistent memory or retrieval steers behaviour in later sessions."],["ASI07","Insecure Inter-Agent Communication","Agent-to-agent messages spoofed, replayed or tampered with for lack of auth."],["ASI08","Cascading Failures","One agent's error or compromise fans out through connected workflows at scale."],["ASI09","Human-Agent Trust Exploitation","Agents manipulate the human approval step by controlling what the reviewer is shown."],["ASI10","Rogue Agents","Agents operating outside policy while appearing legitimate, via drift or compromise."]]},{group:"OWASP ML",vintage:"draft v0.3",standing:"Still officially a draft and modified frequently. These codes are DERIVED \u2014 the sync builds ML_ plus the finding's title, so they carry no ordinal and the ML0n below is a mapping this page states, not one the data contains.",entries:[["ML_INPUT_MANIPULATION","Input Manipulation Attack (ML01)","Adversarial inputs perturbed just enough to force a wrong prediction."],["ML_DATA_POISONING","Data Poisoning Attack (ML02)","Training data tampered with so the model learns attacker-chosen behaviour."],["ML_MODEL_INVERSION","Model Inversion Attack (ML03)","Querying the model to reconstruct sensitive training records."],["ML_MEMBERSHIP_INFERENCE","Membership Inference Attack (ML04)","Determining whether a specific record was in the training set."],["ML_MODEL_THEFT","Model Theft (ML05)","Extracting or exfiltrating model weights or behaviour via queries or access."],["ML_SUPPLY_CHAIN","AI Supply Chain Attacks (ML06)","Compromised packages, datasets or pre-trained models enter the pipeline."],["ML_TRANSFER_LEARNING","Transfer Learning Attack (ML07)","A backdoored base model carries its malicious behaviour into the fine-tune."],["ML_MODEL_SKEWING","Model Skewing (ML08)","Manipulating the feedback or retraining loop to shift outputs over time."],["ML_OUTPUT_INTEGRITY","Output Integrity Attack (ML09)","Tampering with model output in transit or at the interface, not the model itself."],["ML_MODEL_POISONING","Model Poisoning (ML10)","Directly altering model parameters or weights to make it misbehave."]]},{group:"Wiz 5Rs",vintage:"vendor taxonomy",standing:"Wiz's own data-security response taxonomy \u2014 no public canonical spec, and these are RESPONSE ACTIONS rather than risks, so they are a different kind of thing from the OWASP entries above. The sync's issue enrichment does not read 5Rs mappings at all: these codes reach the cascade only through failing config findings.",entries:[["FIVE_RS","A failing 5Rs control","Any 5Rs control the asset fails, without naming which of the five."],["5R_REDUCE","Reduce","Stop data sprawl by finding and deleting shadow data."],["5R_RESTRICT","Restrict","Map and remove any over-privileged access."],["5R_RELABEL","Relabel","Label cloud assets with their data sensitivity."],["5R_RELOCATE","Relocate","Ensure data jurisdiction complies with your needs."],["5R_RECONFIGURE","Reconfigure","Ensure configurations such as encryption and retention are set."]]},{group:"Local to this model",vintage:"synthesised on sync",standing:"Not a framework code. The enrichment pass raises these itself, so they are stable by definition and change only when this app changes. NO_GUARDRAIL is always raised; DEPRECATED_MODEL and INACTIVE_AGENT are read off the asset's own status and only reach the cascade when their gap source is switched on in the rule \u2014 until then a row pricing them can never fire.",entries:[["NO_GUARDRAIL","No guardrail attached","Guardrail coverage flagged the asset \u2014 the LLM01 / ASI01 gap."],["DEPRECATED_MODEL","Deprecated model","The asset runs a model the provider has retired, e.g. text-embedding-005."],["INACTIVE_AGENT","Dormant agent","Inactive, but still holding its privileges and data reach \u2014 the ASI10 Rogue Agents shape."]]},{group:_l,vintage:"match a whole vocabulary",standing:"Not codes an asset carries \u2014 these are what a \u201Cstarts with\u201D rule matches on. Price the family once here, then put any exact carve-out ABOVE it.",entries:[["LLM","The OWASP LLM family","Matches every LLM code. Exact rows for single entries must sit above this one."],["ASI","The OWASP Agentic family","Matches every ASI code."],["ML","The OWASP ML family","Matches every derived ML_ code."],["5R","The Wiz 5Rs family","Matches every 5R_ code. Note FIVE_RS does not start with 5R."]]}],Al=Object.create(null),Vh=[];for(let t of Ga){let e=t.group===_l;for(let[n,s,i]of t.entries){let a={code:n,title:s,blurb:i,group:t.group,vintage:t.vintage,standing:t.standing,isFamily:e};Al[n]=a,e||Vh.push(a)}}function Os(t){return String(t==null?"":t).trim().toUpperCase()}function ai(t){return Al[Os(t)]||null}function a0(t){let e=Os(t);return e?Vh.filter(n=>n.code.indexOf(e)===0):[]}function Hh(t,e){let n=t||[],s=n[e];if(!s||s.match!=="prefix")return 0;let i=Os(s.code);if(!i)return 0;let a=0;for(let r=0;r<e;r++){let l=n[r];l&&Os(l.code).indexOf(i)===0&&a++}return a}function Uh(t,e,n){let s=n||{},i=Os(t);if(!i)return{shape:"\u25C7",known:!1,text:"no code yet"};if(e==="prefix"){let r=a0(i),l={};for(let h of r)l[h.group+" "+h.vintage]=!0;let c=Object.keys(l),d=c.length===1?c[0]:"";if(!r.length)return{shape:"\u25C7",known:!1,text:"not in the codebook \xB7 matches any code starting "+i};let u=["family \xB7 "+r.length+(r.length= ed aars \u2014 no re-sync required.",dataSource:"ai_assets.aars, ai_assets.aars_severity",reportingFormat:"AI Inventory register and asset sheet (as a plain word); the level strip and trend chart (as a distribution); AARS Rules page (as a rule diagnostic, the one surface that still tints it).",revisionDue:"2027-08-13"},{id:"aars-percentile",measure:"Findings score percentile",type:"impact",measurementMethod:"Objective",goal:"Where one asset's score sits in the landscape that was actually scored \u2014 the placement an analyst can read, given that the score's levels barely separate assets on this landscape.",formula:"midrankPercentiles(scores) = (count below + count equal / 2) / N, whole percent. Tied scores share one percentile by construction.",dataSource:"ai_assets.aars",reportingFormat:"AI Inventory register (leads the score cell); asset detail sheet's verdict line, with the population size; security graph node badge.",revisionDue:"2027-08-13"},{id:"aars-distinct-scores",measure:"distinctScores",type:"effectiveness",measurementMethod:"Objective",goal:"Measures the MODEL's separating power, not the landscape's risk \u2014 a rule can render a confident number for every asset while carrying zero ranking information.",formula:"new Set(scores).size, over every scored asset in the preview.",dataSource:"ai_assets.aars",reportingFormat:"AARS Rules page, rule-preview Discrimination panel.",revisionDue:"2027-08-13"},{id:"aars-tie-rate",measure:"tieRate",type:"effectiveness",measurementMethod:"Objective",goal:"Same as distinctScores, at the scale of PAIRS: 1.0 means every pair of scored assets shares a value, so any ordering within the landscape is arbitrary.",formula:"\u03A3 C(n_k,2) / C(N,2) over the distinct-value groups (rankStats.tieRate).",dataSource:"ai_assets.aars",reportingFormat:"AARS Rules page, rule-preview Discrimination panel.",revisionDue:"2027-08-13"},{id:"aars-effective-cardinality",measure:"effectiveCardinality",type:"effectiveness",measurementMethod:"Objective",goal:"Same as distinctScores, weighted by population \u2014 one outlier score does not claim the same discrimination credit an even split would.",formula:"exp(Shannon entropy) over the score distribution (rankStats.effectiveCardinality).",dataSource:"ai_assets.aars",reportingFormat:"AARS Rules page, rule-preview Discrimination panel.",revisionDue:"2027-08-13"},{id:"aars-pillar-saturation",measure:"Pillar saturation",type:"effectiveness",measurementMethod:"Objective",goal:"Locates WHICH pillar of the model has stopped discriminating \u2014 a pillar pinned at its cap for most of the landscape still renders a plausible total score.",formula:"Assets at or above each pillar's cap (aarsRule.ts's ruleDiscrimination).",dataSource:"ai_assets.aars_pillars_json",reportingFormat:"AARS Rules page, rule-preview Discrimination panel.",revisionDue:"2027-08-13"},{id:"problem-outcome-distribution",measure:"Problem outcome distribution",type:"impact",measurementMethod:"Subjective",goal:"How open issues and failing findings split across Act/Attend/Track*/Track.",formula:"countProblemOutcomes(rows) over OUTCOME_VALUES, zero-filled. One input axis (exploitation) can be set via an LLM rater's verdict \u2014 see measurementMethod.",dataSource:"ai_issues.problem_outcome, ai_findings.problem_outcome",reportingFormat:"Priorities page KPI row; Priority column throughout.",revisionDue:"2027-08-13"},{id:"problem-axis-unknown-rate",measure:"Per-axis unknown rate",type:"implementation",measurementMethod:"Objective",goal:"THE MOST IMPORTANT MEASURE ON THIS PAGE. A high value does NOT mean the landscape is safe \u2014 it means the model cannot prioritise, because the evidence one axis needs was never collected. Reading it as reassurance is the misuse this exists to prevent.",formula:"Fraction of the decided population unresolved on each axis (treeDiscrimination.unknownRate).",dataSource:"ai_issues.problem_input_json, ai_findings.problem_input_json",reportingFormat:"AARS Rules page, Problem tree tab's preview.",revisionDue:"2027-08-13"},{id:"posture-tier-distribution",measure:"Posture tier distribution",type:"impact",measurementMethod:"Objective",goal:"How many assets sit in each capability-envelope tier (1 best, 4 worst) \u2014 independent of what has been found on the asset.",formula:"countPostureTiers(nodes) over TIER_VALUES, zero-filled.",dataSource:"ai_assets.posture_tier",reportingFormat:"AI Inventory Posture column; Priorities page's ranking.",revisionDue:"2027-08-13"},{id:"issue-sla-tally",measure:"SLA tally",type:"efficiency",measurementMethod:"Objective",goal:"How much of the open-issue register is racing a clock \u2014 past-due, due-soon or no deadline at all, kept apart.",formula:"slaState(dueAt, now) bucketed per issue (comboDigest.ts).",dataSource:"ai_issues.due_at",reportingFormat:"Toxic Combinations KPI row; Priorities page's SLA tiebreak.",revisionDue:"2027-08-13"},{id:"compliance-gaps",measure:"complianceGaps",type:"effectiveness",measurementMethod:"Objective",goal:"How many cloud-configuration controls are failing right now \u2014 one definition, shared by every page that counts it.",formula:"isOpenGap(finding) filter, then a count.",dataSource:"ai_findings.result, ai_findings.status",reportingFormat:"AI Inventory KPI row; Cloud Configuration register header.",revisionDue:"2027-08-13"},{id:"compliance-gaps-unlinked",measure:"complianceGapsUnlinked",type:"implementation",measurementMethod:"Objective",goal:"How much of complianceGaps this app can attribute to a modeled AI asset \u2014 a fact about THIS APP's own graph coverage, not about Wiz's controls.",formula:"Open gaps whose resourceId is not a key in the current asset set.",dataSource:"ai_findings.resource_id, ai_assets.id",reportingFormat:"AI Inventory KPI row, beside complianceGaps.",revisionDue:"2027-08-13"},{id:"guardrail-coverage-pct",measure:"guardrailCoveragePct",type:"implementation",measurementMethod:"Objective",goal:"Share of managed AI agents with no missing-guardrail finding raised \u2014 an absence of evidence, not a confirmed control (see the record's own caveat).",formula:"protectedAgents / agents \xD7 100, rounded; null when there are no agents.",dataSource:"ai_assets.guardrail_missing, ai_assets.kind",reportingFormat:"Wiz Scans coverage area.",revisionDue:"2027-08-13"},{id:"toxic-combo-patterns-active",measure:"patternsActive / patternsTotal",type:"impact",measurementMethod:"Objective",goal:"How many of the four modelled toxic-combination patterns currently have an open issue firing.",formula:"Count of REGISTER_GROUPS with at least one matching unresolved issue.",dataSource:"ai_issues.combo_group, ai_issues.status",reportingFormat:"Toxic Combinations page KPI row.",revisionDue:"2027-08-13"},{id:"framework-average-posture",measure:"averagePosture",type:"effectiveness",measurementMethod:"Objective",goal:"One number for landscape-wide compliance across every synced framework \u2014 unscored frameworks are excluded rather than read as zero.",formula:"Mean posture_pct across framework rows whose state resolves to 'scored'.",dataSource:"ai_framework_posture.posture_pct",reportingFormat:"Compliance Posture page's headline strip.",revisionDue:"2027-08-13"},{id:"action-concentration-ratio",measure:"Action concentration",type:"impact",measurementMethod:"Objective",goal:"Whether the landscape has LEVERAGE to exploit \u2014 whether a handful of fixes closes most of the open board. A ratio near 1:1 is not a healthy reading: it means every problem is its own distinct fix and ranking actions buys nothing over ranking problems.",formula:"concentrationRatio over rankActionsByCover's marginal set-cover: distinct actions, the union total they sum back to, and the share the top 10 alone close.",dataSource:"ai_issues.rule_id, ai_findings.rule_short_id, ai_findings.rule_id",reportingFormat:"Priorities page's action list header and its cumulative-cover curve.",revisionDue:"2027-08-13"},{id:"landscape-reach-stages",measure:"Landscape reach stage ladd g consequence is the posture tier's job. Surfaces show it as a percentile of the scored landscape, because the raw number is only meaningful against the other assets.",drawnOn:["inventory","graph","aars"],mark:()=>Pd(78,92,"HIGH"),count:t=>{let e=t.kpis;return!e||e.aarsScored===void 0?null:{n:je(e.aarsScored),value:String(je(e.aarsScored)),unit:"assets scored",route:"inventory",params:{}}}},{id:"aars-percentile",term:"AARS percentile",aka:"rank within this landscape",family:"score",blurb:"Where this asset's score falls among every OTHER scored asset in the landscape, 0 to 100, using midrank so a tied score is shared rather than arbitrarily broken. It is the lead read for one asset on the Inventory table and the asset sheet \u2014 a rank survives the population shift that an absolute band does not, and it MOVES whenever the landscape does, even when this asset's own score has not changed at all.",drawnOn:["inventory"],mark:()=>Nd(92,78)},{id:"aars-band",term:"Findings score level",aka:"context beside a score, not a verdict",family:"score",blurb:"The level a score falls into. Bands are re-derived from the stored score on every read, so moving a threshold applies at once and retroactively \u2014 no re-sync, no rescore. Changing the POINT model is the other thing entirely, and strands the stored scores until they are recomputed. A level is not a queue: on this landscape the top one holds most of the scored assets and two hold none, so it is drawn tinted only on the AARS Rules page, where the thresholds themselves are the subject, and plain everywhere else. Its two honest readings are the distribution the trend charts over time and the occupancy the rule editor reports.",drawnOn:["aars","inventory"],mark:()=>Ye("HIGH"),fromSettings:!0,count:t=>{let e=t.boot.aarsRule;if(!e||!e.bands)return null;let n=["critical","high","medium","low"].map(s=>e.bands[s]).filter(s=>typeof s=="number");return n.length!==4?null:{n:n.length,value:n.join(" / "),unit:"thresholds in force",route:
