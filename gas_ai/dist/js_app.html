s page only \u2014 the model editor, its rule preview and its sandbox. It left the AI Inventory register and the asset detail sheet with the rest of the derived verdicts; both read counts now.",revisionDue:"2027-08-13"},{id:"aars-band",measure:"Findings score level",type:"impact",measurementMethod:"Objective",goal:"The score's own level, re-derived from the rule in force on every read. Context beside a score and a distribution over the landscape \u2014 not a per-asset decision, because on this landscape its top level holds most of the scored assets.",formula:"bandRanges(rule.bands) applied to the stored aars \u2014 no re-sync required.",dataSource:"ai_assets.aars, ai_assets.aars_severity",reportingFormat:"Scoring Models page only, as a rule diagnostic \u2014 band occupancy and the preview's movers. The inventory's level strip and level trend are gone; that page charts open issues, cloud findings and posture fails over time instead.",revisionDue:"2027-08-13"},{id:"aars-distinct-scores",measure:"distinctScores",type:"effectiveness",measurementMethod:"Objective",goal:"Measures the MODEL's separating power, not the landscape's risk \u2014 a rule can render a confident number for every asset while carrying zero ranking information.",formula:"new Set(scores).size, over every scored asset in the preview.",dataSource:"ai_assets.aars",reportingFormat:"Scoring Models page, rule-preview Discrimination panel.",revisionDue:"2027-08-13"},{id:"aars-tie-rate",measure:"tieRate",type:"effectiveness",measurementMethod:"Objective",goal:"Same as distinctScores, at the scale of PAIRS: 1.0 means every pair of scored assets shares a value, so any ordering within the landscape is arbitrary.",formula:"\u03A3 C(n_k,2) / C(N,2) over the distinct-value groups (rankStats.tieRate).",dataSource:"ai_assets.aars",reportingFormat:"Scoring Models page, rule-preview Discrimination panel.",revisionDue:"2027-08-13"},{id:"aars-effective-cardinality",measure:"effectiveCardinality",type:"effectiveness",measurementMethod:"Objective",goal:"Same as distinctScores, weighted by population \u2014 one outlier score does not claim the same discrimination credit an even split would.",formula:"exp(Shannon entropy) over the score distribution (rankStats.effectiveCardinality).",dataSource:"ai_assets.aars",reportingFormat:"Scoring Models page, rule-preview Discrimination panel.",revisionDue:"2027-08-13"},{id:"aars-pillar-saturation",measure:"Pillar saturation",type:"effectiveness",measurementMethod:"Objective",goal:"Locates WHICH pillar of the model has stopped discriminating \u2014 a pillar pinned at its cap for most of the landscape still renders a plausible total score.",formula:"Assets at or above each pillar's cap (aarsRule.ts's ruleDiscrimination).",dataSource:"ai_assets.aars_pillars_json",reportingFormat:"Scoring Models page, rule-preview Discrimination panel.",revisionDue:"2027-08-13"},{id:"problem-outcome-distribution",measure:"Problem outcome distribution",type:"impact",measurementMethod:"Subjective",goal:"How open issues and failing findings split across Act/Attend/Track*/Track.",formula:"countProblemOutcomes(rows) over OUTCOME_VALUES, zero-filled. One input axis (exploitation) can be set via an LLM rater's verdict \u2014 see measurementMethod.",dataSource:"ai_issues.problem_outcome, ai_findings.problem_outcome",reportingFormat:"Scoring Models page, Problem tree tab's preview. It was the Priorities KPI row and a Priority column on three registers; those now read Wiz's severity.",revisionDue:"2027-08-13"},{id:"problem-axis-unknown-rate",measure:"Per-axis unknown rate",type:"implementation",measurementMethod:"Objective",goal:"THE MOST IMPORTANT MEASURE ON THIS PAGE. A high value does NOT mean the landscape is safe \u2014 it means the model cannot prioritise, because the evidence one axis needs was never collected. Reading it as reassurance is the misuse this exists to prevent.",formula:"Fraction of the decided population unresolved on each axis (treeDiscrimination.unknownRate).",dataSource:"ai_issues.problem_input_json, ai_findings.problem_input_json",reportingFormat:"Scoring Models page, Problem tree tab's preview.",revisionDue:"2027-08-13"},{id:"posture-tier-distribution",measure:"Posture tier distribution",type:"impact",measurementMethod:"Objective",goal:"How many assets sit in each capability-envelope tier (1 best, 4 worst) \u2014 independent of what has been found on the asset.",formula:"countPostureTiers(nodes) over TIER_VALUES, zero-filled.",dataSource:"ai_assets.posture_tier",reportingFormat:"Scoring Models page, Posture tab's preview. It was an inventory column, an inventory headline and a level of the Priorities ranking; none of the three reads it now.",revisionDue:"2027-08-13"},{id:"issue-sla-tally",measure:"SLA tally",type:"efficiency",measurementMethod:"Objective",goal:"How much of the open-issue register is racing a clock \u2014 past-due, due-soon or no deadline at all, kept apart.",formula:"slaState(dueAt, now) bucketed per issue (comboDigest.ts).",dataSource:"ai_issues.due_at",reportingFormat:"Toxic Combinations KPI row; Priorities page's ranking, where the SLA clock is now the second level rather than the third.",revisionDue:"2027-08-13"},{id:"issue-half-life",measure:"Issue half-life",type:"effectiveness",measurementMethod:"Objective",goal:"How long an issue actually survives in this register once it has been seen \u2014 the one figure here computed from the register's own two dates rather than from a snapshot of today.",formula:"Kaplan\u2013Meier over first_seen_at to disappeared_at, with every still-open row kept in as right-censored at its last sighting (issueSurvival.kaplanMeier). The median is the half-life; where survival never falls that far the longest lifetime observed is published as a lower bound instead.",dataSource:"ai_issue_ledger.first_seen_at, ai_issue_ledger.disappeared_at",reportingFormat:"Priorities page header, as the half-life hero and its qualifier. A departure is dated by the sync that first stopped seeing the row, so every event time is an upper bound whose error is the sync interval; a reopened row is excluded and counted, because the ledger records no per-episode start.",revisionDue:"2027-08-13"},{id:"compliance-gaps",measure:"complianceGaps",type:"effectiveness",measurementMethod:"Objective",goal:"How many cloud-configuration controls are failing right now \u2014 one definition, shared by every page that counts it.",formula:"isOpenGap(finding) filter, then a count.",dataSource:"ai_findings.result, ai_findings.status",reportingFormat:"AI Inventory KPI row; Cloud Configuration register header.",revisionDue:"2027-08-13"},{id:"compliance-gaps-unlinked",measure:"complianceGapsUnlinked",type:"implementation",measurementMethod:"Objective",goal:"How much of complianceGaps this app can attribute to a modeled AI asset \u2014 a fact about THIS APP's own graph coverage, not about Wiz's controls.",formula:"Open gaps whose resourceId is not a key in the current asset set.",dataSource:"ai_findings.resource_id, ai_assets.id",reportingFormat:"AI Inventory KPI row, beside complianceGaps.",revisionDue:"2027-08-13"},{id:"guardrail-coverage-pct",measure:"guardrailCoveragePct",type:"implementation",measurementMethod:"Objective",goal:"Share of SCANNED AI agents with no missing-guardrail finding raised \u2014 an absence of evidence, not a confirmed control, and reported beside the count the scan never reached rather than folded in with it.",formula:"protectedAgents (guardrailMissing === false) / (agents - guardrailUnknownAgents) \xD7 100, rounded; null when nothing was scanned.",dataSource:"ai_assets.guardrail_missing, ai_assets.kind",reportingFormat:"Wiz Scans coverage area, beside protectedAgents and guardrailUnknownAgents.",revisionDue:"2027-08-13"},{id:"posture-scope-split",measure:"posture tiers, withheld, out of scope",type:"implementation",measurementMethod:"Objective",goal:"How much of the register the posture lattice actually rates \u2014 and for the rest, which of the two reasons applies. Withheld is a coverage gap someone can close; out of scope says this lattice does not describe this kind of asset, and nothing can.",formula:"censusPostureTiers(nodes): tier counts (zeros kept) plus withheld, outOfScope and total, split on whether the node carries a posture vector at all.",dataSource:"sync_history.posture_tier_json, ai_assets.posture_tier, ai_assets.posture_input_json",reportingFormat:"Inventory posture header; the Posture column reason per row; the posture trend series.",revisionDue:"2027-08-13"},{id:"derivation-version-currency",measure:"derivation version, ledger vs code",type:"implementation",measurementMethod:"Objective",goal:"Whether the stored facts were collected by the normalizer now running. The one staleness Recompute cannot repair, because the old value was destroyed at ingest \u2014 so the warning names a full sync as its remedy.",formula:"derivationIsStale(settings, DERIVATION_VERSION); an unstamped ledger reads stale, the opposite default to the three rule-version markers.",dataSource:"sync_history.derivation_version, settings.key, settings.value_json",reportingFormat:"Staleness banner; break markers on every sync_history trend series.",revisionDue:"2027-08-13"},{id:"toxic-combo-patterns-active",measure:"patternsActive / patternsTotal",type:"impact",measurementMethod:"Objective",goal:"How many of the four modelled toxic-combination patterns currently have an open issue firing.",formula:"Count of REGISTER_GROUPS with at least one matching unresolved issue.",dataSource:"ai_issues.combo_group, ai_issues.status",reportingFormat:"Toxic Combinations page KPI row.",revisionDue:"2027-08-13"},{id:"framework-average-posture",measure:"averagePosture",type:"effectiveness",measurementMethod:"Objective",goal:"One number for landscape-wide compliance across every synced framework \u2014 unscored frameworks are excluded rather than read as zero.",formula:"Mean posture_pct across framework rows whose state resolves to 'scored'.",dataSource:"ai_framework_posture.posture_pct",reportingFormat:"Compliance Posture page's headline strip.",revisionDue:"2027-08-13"},{id:"action-concentration-ratio",measure:"Action concentration",type:"impact",measurementMethod:"Objective",goal:"Whether the landscape has LEVERAGE to exploit \u2014 whether a handful of fixes closes most of the open board. A ratio near 1:1 is not a healthy reading: it means every problem is its own distinct fix and ranking actions buys nothing over ranking problems.",formula:"concentrationRatio over rankActionsByCover's marginal set-cover: distinct actions, the union total they sum back to, and the share the top 10 alone close.",dataSource:"ai_issues.rule_id, ai_findings.rule_short_id, ai_findings.rule_id",reportingFormat:"Priorities page's action list header and its cumulative-cover curve.",revisionDue:"2027-08-13"},{id:"landscape-reach-stages",measure:"Landscape reach stage ladder",type:"impact",measurementMethod:"Objective",goal:"What fraction of the AI landscape a sync actually touched, in paired counts \u2014 never a bare percentage, so a stage with nothing behind it (\u20180 of 22 attributed\u2019) cannot be misread as a clean result.",formula:"estateReach(...).stages: in register, observed, enriched, decided \u2014 each { covered, total } over the AI-kinded register. Four, not five: business-impact tagging left the ladder (it arrives on the inventory hop, so it does not depend on the stages above it), and \u2018decided\u2019 no longer accepts a bare AARS score, which every AI-kinded asset carries and which made the stage a permanent 100%.",dataSource:"ai_assets.kind, ai_assets.worst_open_problem, ai_edges.type, ai_assets.exposure_evidence_json, ai_assets.human_access_json, ai_issues.status, ai_findings.result",reportingFormat:"Wiz Scans page, Landscape reach section; AI Inventory headline card.",revisionDue:"2027-08-13"},{id:"landscape-impact-tagged",measure:"Impact-tagged share",type:"implementation",measurementMethod:"Objective",goal:"How much of the AI register carries a Wiz business-impact tier \u2014 the tenant's project-tagging discipline, not this pipeline's reach. It sat in the reach ladder until a live tenant printed 95% of it above 1% observed.",formula:"estateReach(...).impactTagged: AI-kinded rows with a non-empty business_impact, over all AI-kinded rows.",dataSource:"ai_assets.business_impact, ai_assets.kind",reportingFormat:"Wiz Scans page, Landscape reach section \u2014 beside the ladder, not in it.",revisionDue:"2027-08-13"},{id:"sync-step-yield",measure:"Rows returned per sync step",type:"implementation",measurementMethod:"Objective",goal:"Tell a step that ran and matched nothing apart from a step that was never reached. The skipped list records refusals and the truncated list records page caps; a step the tenant accepts that returns zero rows was in neither.",formula:"Raw response rows per step id, summed across pages and resume hops, persisted with the commit. Present with 0 means ran-and-empty; absent means not recorded.",dataSource:"settings.key / settings.value_json \u2014 the settings tab is a key/value store, and this reading lives under the last_step_rows key, beside last_skipped_steps and last_truncated_steps.",reportingFormat:"Wiz Scans page, each area's drill-down \u2014 a pill beside the existing skipped and truncated pills.",revisionDue:"2027-08-13"},{id:"landscape-reach-edge-census",measure:"Edge census",type:"implementation",measurementMethod:"Objective",goal:"Which of the 23 declared graph relationship types this deployment has ever populated \u2014 a dead type quietly removes a class of question the graph looks able to answer.",formula:"estateReach(...).edges: ai_edges.type censused against EDGE_TYPES, the same logic registerScopeDiagnostic already runs by hand.",dataSource:"ai_edges.type",reportingFormat:"Wiz Scans page, Landscape reach section's edge census.",revisionDue:"2027-08-13"},{id:"landscape-reach-axis-known-rate",measure:"Per-axis known %",type:"implementation",measurementMethod:"Objective",goal:"THE SAME WARNING AS Per-axis unknown rate, restated positively: a high known% does NOT mean the landscape is safe \u2014 it means the decision tree cannot prioritise on that axis until it does not. An empty population reads 0%, never a false 100%.",formula:"1 \u2212 treeDiscrimination(decided).unknownRate per axis, inverted at reach.ts's own boundary; 0 when nothing has ever been decided.",dataSource:"ai_issues.problem_input_json, ai_findings.problem_input_json",reportingFormat:"Wiz Scans page, Landscape reach section's axis-coverage panel.",revisionDue:"2027-08-13"}];var gx=[{id:"graph",title:"Reading the graph"},{id:"signal",title:"Risk signals"},{id:"score",title:"The score"},{id:"severity",title:"Severity"},{id:"coverage",title:"Coverage and freshness"},{id:"lifecycle",title:"The issue lifecycle"},{id:"framework",title:"Framework vocabularies"},{id:"measures",title:"Measure specifications"}],ko={graph:"Security Graph",inventory:"AI Inventory",problems:"Priorities",combos:"Toxic Combinations",config:"Cloud Configuration",aars:"Scoring Models",scans:"Wiz Scans",data:"Data",settings:"Settings"},Ye=e=>Number(e||0);function Mg(e,t){return n("span",{class:"help-glyph"+(t?" "+t:""),"aria-hidden":"true"},e)}function wa(e){return n("span",{class:"help-kindmark","aria-hidden":"true"},wn(e,18))}var xo=[{id:"node-kind",term:"Node kind",aka:"tint, icon and word",family:"graph",blurb:"Every node says what it is three times over: a pale category tint, a saturated kind icon, and the kind spelled out underneath. The tint is the CATEGORY \u2014 five of them \u2014 and the icon and the word are the KIND. Every kind draws its own mark, so a glyph names one thing and one thing only. Colour is still never the only cue: the icon rides beside the label, never instead of it.",drawnOn:["graph","inventory","scans"],mark:()=>wa("AI_AGENT"),strip:()=>fa.map(e=>({cat:e,label:Ns[e]})),more:"The full list of kinds, grouped by category and searchable, is the AI Inventory filter drawer \u2014 where each one also says how many assets it would leave.",count:e=>{let t=e.boot.filterOptions&&e.boot.filterOptions.kinds||[];return t.length?{n:t.length,value:String(t.length),unit:"kinds in this landscape",route:"inventory",params:{panel:"filters"}}:null}},{id:"toxic-combination",term:"Toxic combination",aka:"TC",family:"graph",blurb:"A multi-condition pattern that only fires when risks COMBINE \u2014 a privileged agent that can also reach classified data is not two findings, it is one path. Members carry a crimson halo and a TC badge on the graph.",drawnOn:["combos","graph","inventory"],mark:()=>n("span",{class:"help-tc","aria-hidden":"true"},"TC"),count:e=>{let t=e.digest&&e.digest.totals;return t?{n:Ye(t.patternsActive),value:Ye(t.patternsActive)+" of "+Ye(t.patternsTotal),unit:"patterns firing",route:"combos",params:{}}:null}},{id:"tc-halo",term:"The crimson halo",aka:"membership, never severity",family:"graph",blurb:"Crimson is this app's identity colour. On the graph it marks toxic-combination membership and nothing else \u2014 it is always paired with the TC badge and an aria-label suffix, so it never carries meaning by colour alone. Severity stays on the dot-and-word chip, in the shared palette.",drawnOn:["graph"],mark:()=>n("span",{class:"help-halo","aria-hidden":"true"}),count:e=>{let t=e.digest&&e.digest.totals;return t?{n:Ye(t.assetsAffected),value:String(Ye(t.assetsAffected)),unit:"assets in a combination",route:"inventory",params:{flags:"combo"}}:null}},{id:"negated-edge",term:"A dashed edge is an absence",aka:"the negated relationship",family:"graph",blurb:"Wiz was asked for a relationship and found none. Rather than leave the gap off the picture, the edge is drawn dashed and labelled with what is missing. The guardrail gap is the one this app raises: a PROTECTED_BY edge that does not exist.",drawnOn:["graph"],mark:()=>n("span",{class:"help-dash","aria-hidden":"true"}),link:{label:"Open the graph",route:"graph",params:{}}},{id:"risk-as-node",term:"Risk is a node",aka:"not a flag on a card",family:"graph",blurb:"Sensitive-data reach, internet exposure, excessive rights and the guardrail gap are drawn as nodes hanging off the asset they describe, on the path \u2014 because that is what an attack path is. They are derived when the graph is READ and never stored, so an already-synced graph gains them without a re-sync.",drawnOn:["graph"],mark:()=>wa("EXCESSIVE_ACCESS_FINDING"),link:{label:"Open the graph",route:"graph",params:{}}},{id:"graph-query",term:"The query builder",aka:"FIND \u2026 THAT \u2026",family:"graph",blurb:"A query reads FIND <entity> THAT <relationship> <entity>, and each further step walks one more hop along the graph. In the table a ROW IS A PATH, not an asset: an agent bound to two service accounts is two rows carrying the same name, and every shown step adds a group of columns rather than a column. The eye keeps a step in the traversal but drops its columns, an optional step keeps rows that would otherwise be dropped with the group left empty, and NOT asserts the relationship is absent \u2014 which is how you ask for an agent with no guardrail. The pickers only offer relationships this tenant's graph actually holds, so a query that can match nothing is hard to build.",drawnOn:["graph"],mark:()=>n("span",{class:"pill neutral"},"FIND"),link:{label:"Open the graph",route:"graph",params:{}}},{id:"depth-budget",term:"Depth and node budget",aka:"what bounds a view",family:"graph",blurb:"Depth bounds how far the traversal walks from its starting points. The node budget is a hard ceiling on one view, counting the collapse stubs it also draws. Both keep the server payload light; a view that hits the ceiling says so and offers Load more, which widens that one view without changing the default.",drawnOn:["graph","settings"],mark:()=>n("span",{class:"pill neutral"},"budget"),fromSettings:!0,count:e=>{let t=e.boot.settings;return t?{n:Ye(t.maxNodes),value:"depth "+Ye(t.defaultDepth)+" \xB7 "+Ye(t.maxNodes),unit:"nodes per view",route:"settings",params:{tab:"graph"}}:null}},{id:"summary-stub",term:"The collapse stub",aka:"\u201C+N more\u201D",family:"graph",blurb:"A high-fanout neighbour set collapsed into one pill, which expands on demand. The stub counts against the node budget like any other node, which is why a capped view still shows them: the budget buys paths, not a field of disconnected dots.",drawnOn:["graph"],mark:()=>wa("SUMMARY"),link:{label:"Open the graph",route:"graph",params:{}}},{id:"missing-guardrail",term:"MISSING_GUARDRAIL",aka:"\u201Cno guardrail\u201D",family:"signal",blurb:"No guardrail is attached to this agent or model. Wiz tests the PROTECTED_BY relationship on every agent, and an absent edge raises this node. It is the strongest single amplifier in the toxic combinations.",drawnOn:["graph","inventory"],mark:()=>wa("MISSING_GUARDRAIL"),count:e=>{let t=e.kpis;if(!t||t.protectedAgents===void 0||!t.agents)return null;let s=Ye(t.agents)-Ye(t.protectedAgents);return{n:s,value:s+" of "+Ye(t.agents),unit:"agents unprotected",route:"inventory",params:{flags:"guardrail"}}}},{id:"data-finding",term:"DATA_FINDING",aka:"what Wiz found in the data",family:"signal",blurb:"Wiz's DSPM verdict on one bucket or database \u2014 what class of sensitive data is in it, and how severe. Drawn as one node per datastore carrying the count, because a store with two hundred findings is one fact about that store, not two hundred nodes. These are what turn \u201Cthis agent can reach sensitive data\u201D into a path you can walk: agent \u2192 execution identity \u2192 datastore \u2192 findings.",drawnOn:["graph"],mark:()=>wa("DATA_FINDING"),count:e=>{let t=e.kpis;return!t||t.dataFindings===void 0?null:{n:Ye(t.dataFindings),value:String(Ye(t.dataFindings)),unit:vs(Ye(t.dataFindings),"finding")+" on reachable stores",route:"graph",params:{kinds:"DATA_FINDING"}}}},{id:"sensitive-data",term:"SENSITIVE_DATA",aka:"classified-data reach, unresolved",family:"signal",blurb:"The FALLBACK marker: Wiz says this asset can reach data classified as PII, PHI or PCI, but no path to the store could be walked \u2014 the tenant rejected the traversal, or the grant is expressed some way it does not follow. Where the path IS walkable the chain is drawn instead and this marker is suppressed, so one asset never tells the same story twice. Its mark is the data-finding gem, left unfinished.",drawnOn:["graph"],mark:()=>wa("SENSITIVE_DATA"),count:e=>{let t=e.kpis;return!t||t.sensitiveAccess===void 0?null:{n:Ye(t.sensitiveAccess),value:String(Ye(t.sensitiveAccess)),unit:"AI "+vs(Ye(t.sensitiveAccess),"asset")+" reach it",route:"graph",params:{kinds:"SENSITIVE_DATA"}}}},{id:"internet-exposure",term:"INTERNET_EXPOSURE",aka:"network reachability",family:"signal",blurb:"The asset or the host underneath it is reachable from the internet. Managed agents report it directly; hosted agents inherit it from the VM or service beneath them, which Wiz reports as UNDETERMINED until that host is checked. Undetermined is counted separately and never folded into \u201Cnot exposed\u201D.",drawnOn:["graph"],mark:()=>wa("INTERNET_EXPOSURE"),count:e=>{let t=e.kpis;if(!t||t.internetExposed===void 0)return null;let s=Ye(t.internetUnknown);return{n:Ye(t.internetExposed),value:String(Ye(t.internetExposed)),unit:"reachable"+(s?" \xB7 "+s+" undetermined":""),route:"graph",params:{kinds:"INTERNET_EXPOSURE"}}}},{id:"excessive-privilege",term:"EXCESSIVE_PRIVILEGE",aka:"excessive rights",family:"signal",blurb:"The identity an AI asset runs as holds admin or high-privilege permissions. The individual excessive-access and lateral-movement findings on those service accounts are synced and drawn beside the identity, but nothing totals them, so the figure here counts assets and identities carrying the flag.",drawnOn:["graph"],mark:()=>wa("EXCESSIVE_PRIVILEGE"),count:e=>{let t=e.kpis;return!t||t.highPrivilege===void 0?null:{n:Ye(t.highPrivilege),value:String(Ye(t.highPrivilege)),unit:"carry a privilege flag",route:"graph",params:{kinds:"EXCESSIVE_PRIVILEGE"}}}},{id:"agentic-identity",term:"Agentic identity",aka:"a service account an agent runs as",family:"signal",blurb:"An identity whose purpose is to execute agent work rather than to represent a person. It is the join between an agent and everything that agent can reach, which is why over-broad rights on one turn any hijack into unauthorised action.",drawnOn:["graph","inventory"],mark:()=>wa("SERVICE_ACCOUNT"),count:e=>{let t=e.kpis;return!t||t.agenticIdentities===void 0?null:{n:Ye(t.agenticIdentities),value:String(Ye(t.agenticIdentities)),unit:Ye(t.agenticIdentities)===1?"agentic identity":"agentic identities",route:"inventory",params:{flags:"agentic"}}}},{id:"aars",term:"Findings score",aka:"AARS \u2014 the identifier every column and route still uses",family:"score",blurb:"One number per asset, 0 to 100, summed across four pillars and clamped. It is this app's own score, not a Wiz field: it prices what the sync collected, so the model that produces it is editable and its inputs are persisted beside every score. It counts what has already been FOUND \u2014 issues, compliance gaps, data exposure \u2014 which is why it is not called a risk score; forward-looking consequence is the posture tier's job. The raw number is only meaningful against the other assets, which is why the Scoring Models page reads it as a distribution rather than one asset at a time. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>mo(78,"HIGH"),count:e=>{let t=e.kpis;return!t||t.aarsScored===void 0?null:{n:Ye(t.aarsScored),value:String(Ye(t.aarsScored)),unit:"assets scored",route:"inventory",params:{}}}},{id:"aars-band",term:"Findings score level",aka:"context beside a score, not a verdict",family:"score",blurb:"The level a score falls into. Bands are re-derived from the stored score on every read, so moving a threshold applies at once and retroactively \u2014 no re-sync, no rescore. Changing the POINT model is the other thing entirely, and strands the stored scores until they are recomputed. A level is not a queue: on this landscape the top one holds most of the scored assets and two hold none, so it is drawn tinted only on the AARS Rules page, where the thresholds themselves are the subject, and plain everywhere else. Its two honest readings are the distribution the trend charts over time and the occupancy the rule editor reports. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>ct("HIGH"),fromSettings:!0,count:e=>{let t=e.boot.aarsRule;if(!t||!t.bands)return null;let s=["critical","high","medium","low"].map(a=>t.bands[a]).filter(a=>typeof a=="number");return s.length!==4?null:{n:s.length,value:s.join(" / "),unit:"thresholds in force",route:"aars",params:{}}}},{id:"pillar-a",term:"Pillar A",aka:"toxic-combination participation",family:"score",blurb:"Points for the combinations an asset is in, priced by the worst severity among them and lifted by a multiplier once there is more than one issue. How that multiplier scales is itself a choice: flat applies it once, log2 grows it with the issue count so a tenth issue still moves the number. Capped, so no single pillar can carry the whole score. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"A"),fromSettings:!0,count:e=>{let t=e.boot.aarsRule&&e.boot.aarsRule.pillarCaps;return!t||t.toxic===void 0?null:{n:Ye(t.toxic),value:"cap "+Ye(t.toxic),unit:"of 100",route:"aars",params:{}}}},{id:"pillar-b",term:"Pillar B",aka:"compliance gaps",family:"score",blurb:"Points for the framework codes an asset's failing findings violate, priced by an ORDERED cascade \u2014 first match wins, ending in a fallback for codes the codebook does not carry. Its quantity is order, not magnitude, which is why that pillar is the one edited as a table. How the matched prices COMBINE is a second choice: summing them pins most assets to the cap, because Wiz maps one underlying risk onto an OWASP LLM code and an ASI code and an ML title, so root-sum-square is offered to soften that triple charge and keep the pillar discriminating. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"B"),count:e=>{let t=e.kpis;return!t||t.complianceGaps===void 0?null:{n:Ye(t.complianceGaps),value:String(Ye(t.complianceGaps)),unit:"failing findings priced",route:"aars",params:{}}}},{id:"pillar-c",term:"Pillar C",aka:"data exposure",family:"score",blurb:"Points for what classified data the asset can reach, lifted by the 5Rs amplifier. The amplifier is the one number on the model that is not a policy choice \u2014 it is a systemic signal, so it applies to every data point regardless of asset. This pillar's ceiling is DERIVED (top tier through the amplifier) rather than set. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"C"),fromSettings:!0,count:e=>{let t=e.boot.aarsRule&&e.boot.aarsRule.pillarCaps;return!t||t.data===void 0?null:{n:Ye(t.data),value:"cap "+Ye(t.data),unit:"of 100",route:"aars",params:{}}}},{id:"pillar-d",term:"Pillar D",aka:"internet reachability",family:"score",blurb:"Points for whether the asset is reachable from the internet. Its three states are not a severity ramp: UNDETERMINED is an epistemic state, not a middling amount of exposure \u2014 Wiz reports it for a hosted agent because reachability is inherited from the host underneath and was never evaluated on the agent itself. It prices BELOW confirmed and ABOVE none, which is the honest reading of \u201Cthis needs checking\u201D, and it must never be collapsed into either neighbour. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"D"),more:"Priced at zero in the spec rule, which scores exposure nowhere even though the graph draws it as a first-class node. The calibrated preset turns it on.",link:{label:"Open Scoring Models",route:"aars",params:{}}},{id:"gap-sources",term:"Gap sources",aka:"what may raise a gap",family:"score",blurb:"Separate from what a gap COSTS: which derivations are allowed to raise one at all. Every source is off by default, because switching one on re-prices assets and the applied table in the spec is normative for the default rule. They exist because three rows of the default cascade price codes nothing in the live pipeline emits \u2014 not shadowed, unreachable, with the signal each needs already in the sheets. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"\xB1"),link:{label:"Open Scoring Models",route:"aars",params:{}}},{id:"rescore",term:"Recompute scores",aka:"not a sync",family:"score",blurb:"Re-runs the enrichment over data already in the sheet and makes ZERO Wiz API calls. It writes no sync-history row, because a rescore is not a sync and the trend must not gain a point for a landscape that never moved. Trend points carry the rule version they were scored under, so a threshold edit reads as a break rather than as movement. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"\u21BB"),link:{label:"Open Scoring Models",route:"aars",params:{}}},{id:"problem-tree",term:"Problem tree",aka:"ACT \xB7 Attend \xB7 Track* \xB7 Track",family:"score",blurb:"A 54-leaf decision tree \u2014 exploitation \xD7 technical impact \xD7 system exposure \xD7 mission \u2014 that routes one issue or finding into one of four queues, first match wins over an ordered cascade. It answers a different question than the findings score: not a rank, a queue, and it is built so most leaves land in Track or Track* and only a documented, auditable minority reach Act. The AARS Rules page carries its editor on a second tab. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>Xs("ACT"),link:{label:"Open the Problem tree tab",route:"aars",params:{}}},{id:"posture-tier",term:"Posture tier",aka:"a capability envelope, not a sum of problems",family:"score",blurb:"1 to 4, 4 worst \u2014 a first-match cascade over capability \xD7 containment \xD7 consequence, the same mechanism the Problem tree uses, aimed at a different question: not what has been FOUND on an asset, but what it could DO and what stands in its way. An agent with zero open issues and unrestricted access to sensitive data is not a low tier just because nothing has been found yet \u2014 this is the one reading on the Inventory that is not an aggregate of the findings score or of the Problem tree's outcomes, deliberately drawn beside them rather than blended in. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>ba(4),link:{label:"Open the Posture tab",route:"aars",params:{}}},{id:"posture-axes",term:"Capability \xB7 containment \xB7 consequence",aka:"the posture lattice's three axes",family:"score",blurb:"Capability: identity power and data reach (BROAD/SCOPED/MINIMAL). Containment: how much stands between the asset and the outside world (WEAK/PARTIAL/STRONG) \u2014 a clear guardrail scan alone reads PARTIAL, never STRONG, until a confirmed non-exposure corroborates it. Consequence: what a realized failure would cost (SEVERE/MODERATE/LIMITED). 27 cells; a lethal-trifecta row (private data reach \u2227 untrusted-content ingress \u2227 external egress) sits first in the default cascade and is reported UNREACHABLE rather than fed a guess \u2014 this app has no live signal for two of its three legs. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"27"),link:{label:"Open the Posture tab",route:"aars",params:{}}},{id:"priorities-rank",term:"The Priorities ranking",aka:"issues \u222A findings, one queue",family:"score",blurb:"Every unresolved issue and every open configuration finding, unioned into one list and ranked on one scale \u2014 the thing neither Toxic Combinations (one pattern) nor Cloud Configuration (findings only) can show. Worst-first at five levels: the Problem tree's outcome, then the asset's posture tier, then how soon it is due, then the amplification vector (identity power, data reach, whether language is the control channel), then id for stability. Nothing in the union is ever dropped for lacking a verdict \u2014 a row the tree never reached still gets a place, ranked last. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"1\u20135"),link:{label:"Open Priorities",route:"problems",params:{}}},{id:"open-issues",term:"Open issues",aka:"the count the register ranks by",family:"score",blurb:"How many unresolved Wiz issues are attached to this asset \u2014 OPEN and IN_PROGRESS both, because an issue somebody has started is still open work. It is a count of things Wiz reported, not a grade this app computed, which is why it is the register's default sort and the graph's neighbour ordering. The bar beside it splits the same issues by severity, so one stray High and a pile of them do not draw the same mark.",drawnOn:["inventory","graph","combos","problems"],mark:()=>n("span",{class:"num"},"4"),count:e=>{let t=e.kpis;return!t||t.openIssues===void 0?null:{n:Ye(t.openIssues),value:String(Ye(t.openIssues)),unit:"open issues",route:"inventory",params:{}}}},{id:"cloud-findings",term:"Cloud findings",aka:"failing configuration findings, per asset",family:"score",blurb:"Failing cloud-configuration findings evaluated against this asset \u2014 the one definition of a failing control this app has: result FAIL, status OPEN, not tombstoned. MOST FINDINGS BELONG TO NO ASSET. They are evaluated against a region, an access policy or a service account no agent runs as, none of which the AI inventory holds, so this column reads lower than the register's total by design and the inventory header says how many are off-inventory.",drawnOn:["inventory","graph","config"],mark:()=>n("span",{class:"num"},"2"),count:e=>{let t=e.kpis;return!t||t.complianceGaps===void 0?null:{n:Ye(t.complianceGaps),value:String(Ye(t.complianceGaps)),unit:"failing controls",route:"config",params:{}}}},{id:"posture-fails",term:"Compliance posture fails",aka:"distinct policies with a failing evaluation",family:"score",blurb:"How many framework policies have at least one failing evaluation, deduped by policy id \u2014 one control mapped to six subcategories is one thing to fix, not six \u2014 and counted over the rules judged AI-relevant. IT HAS NO PER-ASSET GRAIN AND NEVER WILL: Wiz reports posture per framework, category, subcategory and policy, never per resource, so there is no such thing as one asset's posture fails. It appears in page headers and in no table column.",drawnOn:["inventory","compliance"],mark:()=>n("span",{class:"num"},"5"),count:e=>{let t=e.kpis&&e.kpis.frameworkPosture;return!t||!t.frameworks?null:{n:Ye(t.failingPolicies),value:String(Ye(t.failingPolicies)),unit:"failing policies",route:"compliance",params:{}}}},{id:"rank-terms",term:"Priorities rank terms",aka:"rule \xB7 clock \xB7 exploitation \xB7 adjacency",family:"score",blurb:"The four readings the Priorities rank score blends, each edited on Settings' Register tab and each optional. RULE: the operator's own judgement that a source rule matters this much, unset by default. CLOCK: due-date urgency, or \u2014 once a preset turns on the fallback \u2014 a row's age when it carries no due date. EXPLOITATION: a ladder folded up from an issue's linked findings \u2014 on the CISA KEV catalog, an exploit exists, EPSS clears a threshold, or none observed \u2014 where 'none' reads mid-low rather than zero, because an observed absence is still a measurement. ADJACENCY: how close the row sits to the AI estate, direct, adjacent, or UNLINKED \u2014 read as 'no known link', never 'unrelated', because attribution edges are sparse and an unlinked row is mostly a statement about how far the attribution pass has reached, not a claim the row has nothing to do with AI. A term nobody could measure on a given row LEAVES THE BLEND rather than scoring zero, so a sparsely-attributed row is never sunk to the floor for lacking a reading the register never took. The shipped weights and every preset are a starting point for an evaluation harness to move, not a final answer.",drawnOn:["settings"],mark:()=>n("span",{class:"pill neutral"},"4 terms"),link:{label:"Open Settings \u2192 Register",route:"settings",params:{tab:"register"}}},{id:"rank-leads-sort",term:"Rank leads the Priorities order",aka:"rank_leads_sort",family:"score",blurb:"Off by default: the Priorities page orders worst-first by Wiz severity, then due date, then age, then id, the order it has always used \u2014 the iron rule applies here too, so a model's own number does not lead the register until an evaluation harness's own figures say it should. On: the blended rank score (see the rank terms it reads) leads instead, worst first, with a row the model could not score sorting last and falling through to the same four levels beneath it, so nothing in the queue is ever dropped for lacking a rank. The toggle lives on Settings' Register tab beside the terms it would put in charge.",drawnOn:["settings"],mark:()=>n("span",{class:"pill neutral"},"off by default"),link:{label:"Open Settings \u2192 Register",route:"settings",params:{tab:"register"}}},{id:"priorities-order",term:"The Priorities order",aka:"worst severity, then soonest due, then oldest",family:"score",blurb:"Worst-first, four levels. Wiz's own severity leads \u2014 the loudest fact about a problem this app did not invent \u2014 then the nearest due date (overdue counts as soonest, no deadline sorts last), then how long the row has been open, oldest first, then id, so two rows that agree on the first three still sort the same way every time. This is the order the page has always used. Settings' \"Rank leads the Priorities order\" can put the blended rank score in charge instead \u2014 off by default \u2014 and that entry says what changes and why the switch exists.",drawnOn:["problems"],mark:()=>n("span",{class:"pill neutral"},"1\u20134")},{id:"severity",term:"Severity",aka:"six levels",family:"severity",blurb:"Critical, High, Medium, Low, Info, Unknown. Unknown is a local normalisation bucket, never a value the API returns. Every severity on every screen is a coloured DOT plus the level WORD \u2014 the red, orange and amber sit close enough together that the redundant cue is load-bearing, not decorative.",drawnOn:["combos","inventory","graph","problems","config","compliance"],mark:()=>ct("CRITICAL"),count:e=>{let t=e.boot.counts;return!t||t.openIssues===void 0?null:{n:Ye(t.openIssues),value:String(Ye(t.openIssues)),unit:"open "+vs(Ye(t.openIssues),"issue"),route:"combos",params:{}}}},{id:"adjusted-severity",term:"Adjusted severity",aka:"versus native",family:"severity",blurb:"What the 5Rs amplifier re-rates an issue to when the asset fails a data-security control. The severity Wiz returned \u2014 the NATIVE one \u2014 sits beside it, never instead of it, so an adjusted figure can always be traced back to what the scanner actually said.",drawnOn:["combos","inventory"],mark:()=>ct("MEDIUM"),count:e=>{let t=e.digest&&e.digest.totals;return!t||t.reRated===void 0?null:{n:Ye(t.reRated),value:Ye(t.reRated)+" of "+Ye(t.totalOpen),unit:"open issues re-rated",route:"combos",params:{}}}},{id:"priority",term:"Priority",aka:"the problem tree's outcome, not a severity",family:"severity",blurb:"The Problem tree's queue for this issue or finding \u2014 Act, Attend, Track* or Track. It is a SEPARATE reading from the severity beside it, not a restatement of it: an issue can be Critical and still read Track if nothing here confirms it is actually exploitable, reachable or mission-relevant, and a coverage gap in the axes that would confirm that reads Track* rather than being silently dropped. A dash means undecided \u2014 a resolved row, or one this rule never reached. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>Xs("TRACK_STAR"),link:{label:"Open the Problem tree tab",route:"aars",params:{}}},{id:"two-token",term:"Why the label is darker than the dot",aka:"the two-token rule",family:"severity",blurb:"Each level carries two colours: a vivid FILL for dots, marks and chart segments, and a darker TEXT token for any coloured label. The fill is tuned to read as a graphical mark on white; the text token is tuned to clear 4.5:1 on the pale tint behind it. Setting a label in the fill colour would fail contrast, so the split is deliberate and must not be collapsed.",drawnOn:["inventory","combos","graph","problems"],mark:()=>n("span",{class:"help-twotoken","aria-hidden":"true"})},{id:"coverage-state",term:"Coverage state",aka:"\u25CF Reporting \xB7 \u25D0 Partial \xB7 \u25CB Not scanned",family:"coverage",blurb:"How well one Wiz scan area is backed by this deployment. Reporting means a figure from the last sync; Partial means queried and stored but not totalled here; Not scanned means no query runs at all. The state is DERIVED wherever a resolver can decide it, so a missing figure steps back to Partial on its own rather than asserting a number it cannot compute.",drawnOn:["scans","compliance","inventory"],mark:()=>Mg("\u25CF","ok"),count:e=>{let t=e.tally;if(!t)return null;let s=Ye(t.live)+Ye(t.partial)+Ye(t.unscanned);return s?{n:Ye(t.live),value:Ye(t.live)+" of "+s,unit:"areas reporting",route:"scans",params:{}}:null}},{id:"dry-run",term:"Dry-run",aka:"the bundled sample landscape",family:"coverage",blurb:"With no Wiz credentials configured, \u201CSync now\u201D persists a bundled sample dataset instead of querying a tenant, and the whole app works. Every page says which mode produced the figures it is showing, because a number from a sample and a number from your landscape are not the same kind of thing.",drawnOn:["settings","data"],mark:()=>Me("neutral","Dry-run"),link:{label:"Check the connection",route:"settings",params:{tab:"system"}}},{id:"sync",term:"Sync",aka:"and its commit record",family:"coverage",blurb:"One pass of the Wiz query battery, normalised and enriched once, then written wholesale. The sync-history row is written LAST and is the commit record: no history row means the sync never happened. It runs on demand and daily at 05:00 Europe/Paris, and resumes itself if one execution runs long.",drawnOn:["data","problems","scans"],mark:()=>n("span",{class:"pill neutral"},"\u21BB"),count:e=>{let t=e.boot.latestSync;return!t||t.node_count===void 0?null:{n:Ye(t.node_count),value:String(Ye(t.node_count)),unit:"records in the last sync",route:"data",params:{}}}},{id:"register-scope",term:"Register scope",aka:"which Wiz risk categories the issue register collects",family:"coverage",blurb:"Which Wiz risk categories the issue register collects, chosen on Settings' Register tab. One category is mandatory and cannot be unchecked \u2014 it is what makes this an AI register at all \u2014 and every other candidate category is opt-in. Every issue-shaped figure this app publishes (Priorities, AARS pillar A, Toxic Combinations, the register itself) counts only the rows one frameworkCategory filter returned, and nothing on an issue records which category fetched it, so a row is only ever counted under the categories a sync had selected AT THE TIME IT RAN. Widening the scope changes what every one of those figures counts, not how many rows it holds \u2014 and the stored register keeps counting the OLD categories until the next sync applies the new one.",drawnOn:["settings","scans","problems"],mark:()=>Me("neutral","Scope"),link:{label:"Open Settings \u2192 Register",route:"settings",params:{tab:"register"}}},{id:"first-seen",term:"First seen by this register",aka:"the ledger's own birth date, not Wiz's",family:"lifecycle",blurb:"The first sync that returned this issue. It is this register's OWN observation, and it is deliberately not Wiz's created date: an issue can have existed in the tenant for a year before the first sync here looked, and every lifecycle figure on this page measures from the date a sync actually recorded. Nothing backfills it \u2014 a row that predates the ledger has no earlier sighting to claim, and inventing one would be a measurement nobody took.",drawnOn:["combos","inventory","config","problems"],mark:()=>Me("neutral","First seen")},{id:"movement",term:"Movement",aka:"how the open backlog changed between two syncs",family:"lifecycle",blurb:"The open issue backlog now, against what it was at an earlier sync \u2014 replayed from the transition counts each sync recorded, never from two independently stored totals. It needs TWO syncs before it can say anything, and a further seven days before the week-ago row appears; until then the page says so rather than showing a difference of nothing. Findings are not counted here: they never enter the lifecycle ledger, so no sync has ever recorded one arriving or leaving.",drawnOn:["data","problems"],mark:()=>Me("neutral","\xB1")},{id:"disappearance",term:"Gone by",aka:"a departure dated by absence",family:"lifecycle",blurb:"Wiz never tells this register that an issue was fixed, so a departure is dated by the first sync that stopped seeing it. That date is an UPPER BOUND, and its error is the interval between syncs: an issue closed the morning after a Monday sync is dated Tuesday. It is also the reason a longer gap between syncs makes every departure look later than it was, rather than making fewer of them.",drawnOn:["data","combos","inventory"],mark:()=>Me("neutral","Gone")},{id:"episode",term:"Episode",aka:"an issue that left the register and came back",family:"lifecycle",blurb:"An issue that disappeared and was seen again starts a new episode, and the count is what tells a genuine re-detection apart from one long open row. The register does NOT record when each episode began \u2014 only how many there have been \u2014 so the gap between one episode and the next cannot be priced, and no clock here spans two of them.",drawnOn:["combos","inventory"],mark:()=>Me("neutral","\u21A9")},{id:"half-life",term:"Issue half-life",aka:"how long an issue survives in this register",family:"lifecycle",blurb:"The point by which half of every issue this register has ever recorded had left it, measured from the sync that first saw the row to the sync that first stopped seeing it. It is a survival estimate rather than an average of the ones that closed: an average would drop every issue still open, and the ones still open are usually the slow ones the figure exists to catch. A shorter half-life means the register is being worked through rather than merely counted.",drawnOn:["problems"],mark:()=>Me("neutral","\xBD")},{id:"censoring",term:"Still open, still counted",aka:"right-censoring",family:"lifecycle",blurb:"An issue that has not left the register has no departure date, and dropping it from the half-life would be the whole defect: those are the rows that have survived longest. So each one stays in as a partial observation \u2014 it is known to have lasted at least as long as the gap between its first and its last sighting, and it holds the estimate up for exactly that span before dropping out. That span runs to the LAST SIGHTING, not to today, which is why the figure only moves when a sync moves it and not merely because the page was opened later.",drawnOn:["problems"],mark:()=>Me("neutral","+")},{id:"lower-bound",term:"At least N days",aka:"the half-life the register has not reached yet",family:"lifecycle",blurb:"On a young register most issues are still open, so the survival estimate never falls to half and there is no half-life to report. Rather than print a centre nobody measured, the page publishes the longest lifetime it actually observed and says the half-life is at least that. The number will grow with the register until enough issues have left for the curve to cross, at which point it is replaced by the measured figure rather than added to it.",drawnOn:["problems"],mark:()=>Me("neutral","\u2265")},{id:"returned",term:"Returned",aka:"how many came back in this one sync",family:"lifecycle",blurb:"How many issues this one sync saw again after an earlier sync had stopped seeing them \u2014 the Gone column's mirror. It is a COUNT FOR THE SYNC, not a per-issue reading: an issue that returns twice in its life adds one to the Returned tally on each of the two syncs that caught it, and this count no more records when either absence began than Episode does \u2014 see Episode for the per-issue number this same event bumps on the row itself.",drawnOn:["data"],mark:()=>Me("neutral","Returned")},{id:"rail-status",term:"The rail status dot",aka:"one dot, one sentence",family:"lifecycle",blurb:'What the dot at the foot of the nav rail is currently saying, ranked by how actionable it is: a sync running right now beats one that just failed, which beats a register that has never been synced at all, which beats one whose sync date this app could not even read, which beats one that ran too long ago, which beats one that is current. A register nobody has ever synced is UNMEASURED, not stale, so "never synced" always outranks it. Dry-run decorates whichever of those states fired as an extra sentence \u2014 it never replaces the reading, because a dry-run register still has its own real sync history to be stale or current about.',drawnOn:["data"],mark:()=>Me("neutral","\u25CF")},{id:"stale",term:"Stale",aka:"more than two days since the last sync",family:"lifecycle",blurb:"The latest sync finished more than two days ago. The threshold is short on purpose: this register is meant to run daily, so two missed days already means the page is answering yesterday's question, and the dot says so before a reader has to notice the date themselves. A register that has never synced at all is never called stale \u2014 it is unmeasured, which the rail status dot ranks as the more urgent of the two.",drawnOn:["data"],mark:()=>Me("warn","Stale")},{id:"gap-shapes",term:"\u25CF exact \xB7 \u25E7 family \xB7 \u25C7 unknown",aka:"how a pricing rule matches",family:"framework",blurb:"On the AARS Rules cascade, each row says in words what it matches. A filled dot is one named entry. A half-filled square is a prefix covering a whole vocabulary, and the row states how many codes it catches and how many are priced above it. A diamond is a code the codebook does not carry \u2014 a tenant-specific finding id, priced by the fallback.",drawnOn:["aars"],mark:()=>Mg("\u25
