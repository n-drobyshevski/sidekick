 output."],["LLM03","Supply Chain","Compromised third-party models, datasets, adapters or plugins enter the stack."],["LLM04","Data and Model Poisoning","Tampered training or fine-tuning data corrupts behaviour or plants a backdoor."],["LLM05","Improper Output Handling","Model output passes downstream unvalidated, enabling XSS, SSRF or code execution."],["LLM06","Excessive Agency","The model holds more permission, tooling or autonomy than its task needs."],["LLM07","System Prompt Leakage","The system prompt leaks, exposing secrets or the logic needed to bypass controls."],["LLM08","Vector and Embedding Weaknesses","Flaws in RAG vectors and embeddings leak data or inject content via retrieval."],["LLM09","Misinformation","The model emits confident, fabricated or wrong output that users act on."],["LLM10","Unbounded Consumption","Unmetered inference lets attackers drain cost and capacity, or extract the model."]]},{group:"OWASP Agentic (ASI)",vintage:"2026 edition",standing:"Published 1.0 (announced December 2025). It does NOT supersede the T-numbered list: \u201CAgentic AI \u2014 Threats and Mitigations\u201D is a parallel companion, updated to v1.1 in the same release and now running T1\u2013T17, not T1\u2013T15. The two are different layers \u2014 ASI is the ranked risk list, T is the granular attack pathway \u2014 and OWASP ships the official cross-map in ASI 2026 Appendix A. A scanner emitting T13 spans ASI10 and ASI04.",entries:[["ASI01","Agent Goal Hijack","Untrusted content redirects the agent's objective while it believes it serves the user."],["ASI02","Tool Misuse & Exploitation","Legitimate tools weaponised via deceptive input, poisoned metadata or unsafe chaining."],["ASI03","Identity & Privilege Abuse","Over-broad delegated credentials turn any hijack into unauthorised action."],["ASI04","Agentic Supply Chain Vulnerabilities","Compromised frameworks, MCP servers or tool schemas the agent dynamically trusts."],["ASI05","Unexpected Code Execution (RCE)","Agent-generated or agent-triggered code runs outside its sandbox or validation boundary."],["ASI06","Memory & Context Poisoning","Data planted in persistent memory or retrieval steers behaviour in later sessions."],["ASI07","Insecure Inter-Agent Communication","Agent-to-agent messages spoofed, replayed or tampered with for lack of auth."],["ASI08","Cascading Failures","One agent's error or compromise fans out through connected workflows at scale."],["ASI09","Human-Agent Trust Exploitation","Agents manipulate the human approval step by controlling what the reviewer is shown."],["ASI10","Rogue Agents","Agents operating outside policy while appearing legitimate, via drift or compromise."]]},{group:"OWASP ML",vintage:"draft v0.3",standing:"Still officially a draft and modified frequently. These codes are DERIVED \u2014 the sync builds ML_ plus the finding's title, so they carry no ordinal and the ML0n below is a mapping this page states, not one the data contains.",entries:[["ML_INPUT_MANIPULATION","Input Manipulation Attack (ML01)","Adversarial inputs perturbed just enough to force a wrong prediction."],["ML_DATA_POISONING","Data Poisoning Attack (ML02)","Training data tampered with so the model learns attacker-chosen behaviour."],["ML_MODEL_INVERSION","Model Inversion Attack (ML03)","Querying the model to reconstruct sensitive training records."],["ML_MEMBERSHIP_INFERENCE","Membership Inference Attack (ML04)","Determining whether a specific record was in the training set."],["ML_MODEL_THEFT","Model Theft (ML05)","Extracting or exfiltrating model weights or behaviour via queries or access."],["ML_SUPPLY_CHAIN","AI Supply Chain Attacks (ML06)","Compromised packages, datasets or pre-trained models enter the pipeline."],["ML_TRANSFER_LEARNING","Transfer Learning Attack (ML07)","A backdoored base model carries its malicious behaviour into the fine-tune."],["ML_MODEL_SKEWING","Model Skewing (ML08)","Manipulating the feedback or retraining loop to shift outputs over time."],["ML_OUTPUT_INTEGRITY","Output Integrity Attack (ML09)","Tampering with model output in transit or at the interface, not the model itself."],["ML_MODEL_POISONING","Model Poisoning (ML10)","Directly altering model parameters or weights to make it misbehave."]]},{group:"Wiz 5Rs",vintage:"vendor taxonomy",standing:"Wiz's own data-security response taxonomy \u2014 no public canonical spec, and these are RESPONSE ACTIONS rather than risks, so they are a different kind of thing from the OWASP entries above. The sync's issue enrichment does not read 5Rs mappings at all: these codes reach the cascade only through failing config findings.",entries:[["FIVE_RS","A failing 5Rs control","Any 5Rs control the asset fails, without naming which of the five."],["5R_REDUCE","Reduce","Stop data sprawl by finding and deleting shadow data."],["5R_RESTRICT","Restrict","Map and remove any over-privileged access."],["5R_RELABEL","Relabel","Label cloud assets with their data sensitivity."],["5R_RELOCATE","Relocate","Ensure data jurisdiction complies with your needs."],["5R_RECONFIGURE","Reconfigure","Ensure configurations such as encryption and retention are set."]]},{group:"Local to this model",vintage:"synthesised on sync",standing:"Not a framework code. The enrichment pass raises these itself, so they are stable by definition and change only when this app changes. NO_GUARDRAIL is always raised; DEPRECATED_MODEL and INACTIVE_AGENT are read off the asset's own status and only reach the cascade when their gap source is switched on in the rule \u2014 until then a row pricing them can never fire.",entries:[["NO_GUARDRAIL","No guardrail attached","Guardrail coverage flagged the asset \u2014 the LLM01 / ASI01 gap."],["DEPRECATED_MODEL","Deprecated model","The asset runs a model the provider has retired, e.g. text-embedding-005."],["INACTIVE_AGENT","Dormant agent","Inactive, but still holding its privileges and data reach \u2014 the ASI10 Rogue Agents shape."]]},{group:El,vintage:"match a whole vocabulary",standing:"Not codes an asset carries \u2014 these are what a \u201Cstarts with\u201D rule matches on. Price the family once here, then put any exact carve-out ABOVE it.",entries:[["LLM","The OWASP LLM family","Matches every LLM code. Exact rows for single entries must sit above this one."],["ASI","The OWASP Agentic family","Matches every ASI code."],["ML","The OWASP ML family","Matches every derived ML_ code."],["5R","The Wiz 5Rs family","Matches every 5R_ code. Note FIVE_RS does not start with 5R."]]}],Cl=Object.create(null),ig=[];for(let t of Wa){let e=t.group===El;for(let[n,s,i]of t.entries){let a={code:n,title:s,blurb:i,group:t.group,vintage:t.vintage,standing:t.standing,isFamily:e};Cl[n]=a,e||ig.push(a)}}function Rs(t){return String(t==null?"":t).trim().toUpperCase()}function Xo(t){return Cl[Rs(t)]||null}function $0(t){let e=Rs(t);return e?ig.filter(n=>n.code.indexOf(e)===0):[]}function ag(t,e){let n=t||[],s=n[e];if(!s||s.match!=="prefix")return 0;let i=Rs(s.code);if(!i)return 0;let a=0;for(let r=0;r<e;r++){let l=n[r];l&&Rs(l.code).indexOf(i)===0&&a++}return a}function og(t,e,n){let s=n||{},i=Rs(t);if(!i)return{shape:"\u25C7",known:!1,text:"no code yet"};if(e==="prefix"){let r=$0(i),l={};for(let h of r)l[h.group+" "+h.vintage]=!0;let c=Object.keys(l),d=c.length===1?c[0]:"";if(!r.length)return{shape:"\u25C7",known:!1,text:"not in the codebook \xB7 matches any code starting "+i};let u=["family \xB7 "+r.length+(r.length===1?" code":" codes")],p=Number(s.pricedAbove)||0;return p&&u.push(p+" priced above"),d&&u.push(d),{shape:"\u25E7",known:!0,text:u.join(" \xB7 ")}}let a=Cl[i];if(!a||a.isFamily){let r=a&&a.isFamily?"a family prefix \u2014 matches nothing as an exact rule":"tenant code",l=s.fallbackPoints,c=typeof l=="number"?" \xB7 prices at the fallback, "+l:"";return{shape:"\u25C7",known:!1,text:"not in the codebook \xB7 "+r+c}}return{shape:"\u25CF",known:!0,text:"exact \xB7 "+a.title+" \xB7 "+a.group+" "+a.vintage}}function rg(t){let e=t||{},n=[];for(le s:{flags:"combo"}}:null}},{id:"negated-edge",term:"A dashed edge is an absence",aka:"the negated relationship",family:"graph",blurb:"Wiz was asked for a relationship and found none. Rather than leave the gap off the picture, the edge is drawn dashed and labelled with what is missing. The guardrail gap is the one this app raises: a PROTECTED_BY edge that does not exist.",drawnOn:["graph"],mark:()=>o("span",{class:"help-dash","aria-hidden":"true"}),link:{label:"Open the graph",route:"graph",params:{}}},{id:"risk-as-node",term:"Risk is a node",aka:"not a flag on a card",family:"graph",blurb:"Sensitive-data reach, internet exposure, excessive rights and the guardrail gap are drawn as nodes hanging off the asset they describe, on the path \u2014 because that is what an attack path is. They are derived when the graph is READ and never stored, so an already-synced graph gains them without a re-sync.",drawnOn:["graph"],mark:()=>Xs("EXCESSIVE_ACCESS_FINDING"),link:{label:"Open the graph",route:"graph",params:{}}},{id:"graph-query",term:"The query builder",aka:"FIND \u2026 THAT \u2026",family:"graph",blurb:"A query reads FIND <entity> THAT <relationship> <entity>, and each further step walks one more hop along the graph. In the table a ROW IS A PATH, not an asset: an agent bound to two service accounts is two rows carrying the same name, and every shown step adds a group of columns rather than a column. The eye keeps a step in the traversal but drops its columns, an optional step keeps rows that would otherwise be dropped with the group left empty, and NOT asserts the relationship is absent \u2014 which is how you ask for an agent with no guardrail. The pickers only offer relationships this tenant's graph actually holds, so a query that can match nothing is hard to build.",drawnOn:["graph"],mark:()=>o("span",{class:"pill neutral"},"FIND"),link:{label:"Open the graph",route:"graph",params:{}}},{id:"depth-budget",term:"Depth and node budget",aka:"what bounds a view",family:"graph",blurb:"Depth bounds how far the traversal walks from its starting points. The node budget is a hard ceiling on one view, counting the collapse stubs it also draws. Both keep the server payload light; a view that hits the ceiling says so and offers Load more, which widens that one view without changing the default.",drawnOn:["graph","settings"],mark:()=>o("span",{class:"pill neutral"},"budget"),fromSettings:!0,count:t=>{let e=t.boot.settings;return e?{n:ze(e.maxNodes),value:"depth "+ze(e.defaultDepth)+" \xB7 "+ze(e.maxNodes),unit:"nodes per view",route:"settings",params:{}}:null}},{id:"summary-stub",term:"The collapse stub",aka:"\u201C+N more\u201D",family:"graph",blurb:"A high-fanout neighbour set collapsed into one pill, which expands on demand. The stub counts against the node budget like any other node, which is why a capped view still shows them: the budget buys paths, not a field of disconnected dots.",drawnOn:["graph"],mark:()=>Xs("SUMMARY"),link:{label:"Open the graph",route:"graph",params:{}}},{id:"missing-guardrail",term:"MISSING_GUARDRAIL",aka:"\u201Cno guardrail\u201D",family:"signal",blurb:"No guardrail is attached to this agent or model. Wiz tests the PROTECTED_BY relationship on every agent, and an absent edge raises this node. It is the strongest single amplifier in the toxic combinations.",drawnOn:["graph","inventory"],mark:()=>Xs("MISSING_GUARDRAIL"),count:t=>{let e=t.kpis;if(!e||e.protectedAgents===void 0||!e.agents)return null;let n=ze(e.agents)-ze(e.protectedAgents);return{n,value:n+" of "+ze(e.agents),unit:"agents unprotected",route:"inventory",params:{flags:"guardrail"}}}},{id:"data-finding",term:"DATA_FINDING",aka:"what Wiz found in the data",family:"signal",blurb:"Wiz's DSPM verdict on one bucket or database \u2014 what class of sensitive data is in it, and how severe. Drawn as one node per datastore carrying the count, because a store with two hundred findings is one fact about that store, not two hundred nodes. These are what turn \u201Cthis agent can reach sensitive data\u201D into a path you can walk: agent \u2192 execution identity \u2192 datastore \u2192 findings.",drawnOn:["graph"],mark:()=>Xs("DATA_FINDING"),count:t=>{let e=t.kpis;return!e||e.dataFindings===void 0?null:{n:ze(e.dataFindings),value:String(ze(e.dataFindings)),unit:di(ze(e.dataFindings),"finding")+" on reachable stores",route:"graph",params:{kinds:"DATA_FINDING"}}}},{id:"sensitive-data",term:"SENSITIVE_DATA",aka:"classified-data reach, unresolved",family:"signal",blurb:"The FALLBACK marker: Wiz says this asset can reach data classified as PII, PHI or PCI, but no path to the store could be walked \u2014 the tenant rejected the traversal, or the grant is expressed some way it does not follow. Where the path IS walkable the chain is drawn instead and this marker is suppressed, so one asset never tells the same story twice. Its mark is the data-finding gem, left unfinished.",drawnOn:["graph"],mark:()=>Xs("SENSITIVE_DATA"),count:t=>{let e=t.kpis;return!e||e.sensitiveAccess===void 0?null:{n:ze(e.sensitiveAccess),value:String(ze(e.sensitiveAccess)),unit:"AI "+di(ze(e.sensitiveAccess),"asset")+" reach it",route:"graph",params:{kinds:"SENSITIVE_DATA"}}}},{id:"internet-exposure",term:"INTERNET_EXPOSURE",aka:"network reachability",family:"signal",blurb:"The asset or the host underneath it is reachable from the internet. Managed agents report it directly; hosted agents inherit it from the VM or service beneath them, which Wiz reports as UNDETERMINED until that host is checked. Undetermined is counted separately and never folded into \u201Cnot exposed\u201D.",drawnOn:["graph"],mark:()=>Xs("INTERNET_EXPOSURE"),count:t=>{let e=t.kpis;if(!e||e.internetExposed===void 0)return null;let n=ze(e.internetUnknown);return{n:ze(e.internetExposed),value:String(ze(e.internetExposed)),unit:"reachable"+(n?" \xB7 "+n+" undetermined":""),route:"graph",params:{kinds:"INTERNET_EXPOSURE"}}}},{id:"excessive-privilege",term:"EXCESSIVE_PRIVILEGE",aka:"excessive rights",family:"signal",blurb:"The identity an AI asset runs as holds admin or high-privilege permissions. The individual excessive-access and lateral-movement findings on those service accounts are synced and drawn beside the identity, but nothing totals them, so the figure here counts assets and identities carrying the flag.",drawnOn:["graph"],mark:()=>Xs("EXCESSIVE_PRIVILEGE"),count:t=>{let e=t.kpis;return!e||e.highPrivilege===void 0?null:{n:ze(e.highPrivilege),value:String(ze(e.highPrivilege)),unit:"carry a privilege flag",route:"graph",params:{kinds:"EXCESSIVE_PRIVILEGE"}}}},{id:"agentic-identity",term:"Agentic identity",aka:"a service account an agent runs as",family:"signal",blurb:"An identity whose purpose is to execute agent work rather than to represent a person. It is the join between an agent and everything that agent can reach, which is why over-broad rights on one turn any hijack into unauthorised action.",drawnOn:["graph","inventory"],mark:()=>Xs("SERVICE_ACCOUNT"),count:t=>{let e=t.kpis;return!e||e.agenticIdentities===void 0?null:{n:ze(e.agenticIdentities),value:String(ze(e.agenticIdentities)),unit:ze(e.agenticIdentities)===1?"agentic identity":"agentic identities",route:"inventory",params:{flags:"agentic"}}}},{id:"aars",term:"Findings score",aka:"AARS \u2014 the identifier every column and route still uses",family:"score",blurb:"One number per asset, 0 to 100, summed across four pillars and clamped. It is this app's own score, not a Wiz field: it prices what the sync collected, so the model that produces it is editable and its inputs are persisted beside every score. It counts what has already been FOUND \u2014 issues, compliance gaps, data exposure \u2014 which is why it is not called a risk score; forward-looking consequence is the posture tier's job. Surfaces show it as a percentile of the scored landscape, because the raw number is only meaningful against the other assets.",drawnOn:["inventory","graph","aars"],mark:()=>hi(78,92,"HIGH"),count:t=>{let e=t.kpis;return!e||e.aarsScored===void 0?null:{n:ze(e.aarsScored),value:String(ze(e.aarsScored)),unit:"assets scored",route:"inventory",params:{}}}},{id:"aars-percentile",term:"AARS percentile",aka:"rank within this landscape",family:"score",blurb:"Where this asset's score falls among every OTHER scored asset in the landscape, 0 to 100, using midrank so a tied score is shared rather than arbitrarily broken. It is the lead read for one asset on the Inventory table and the asset sheet \u2014 a rank survives the population shift that an absolute band does not, and it MOVES whenever the landscape does, even when this asset's own score has not changed at all.",drawnOn:["inventory"],mark:()=>aarsPercentileMark(92,78)},{id:"aars-band",term:"Findings score level",aka:"context beside a score, not a verdict",family:"score",blurb:"The level a score falls into. Bands are re-derived from the stored score on every read, so moving a threshold applies at once and retroactively \u2014 no re-sync, no rescore. Changing the POINT model is the other thing entirely, and strands the stored scores until they are recomputed. A level is not a queue: on this landscape the top one holds most of the scored assets and two hold none, so it is drawn tinted only on the AARS Rules page, where the thresholds themselves are the subject, and plain everywhere else. Its two honest readings are the distribution the trend charts over time and the occupancy the rule editor reports.",drawnOn:["aars","inventory"],mark:()=>Ge("HIGH"),fromSettings:!0,count:t=>{let e=t.boot.aarsRule;if(!e||!e.bands)return null;let n=["critical","high","medium","low"].map(s=>e.bands[s]).filter(s=>typeof s=="number");return n.length!==4?null:{n:n.length,value:n.join(" / "),unit:"thresholds in force",route:"aars",params:{}}}},{id:"pillar-a",term:"Pillar A",aka:"toxic-combination participation",family:"score",blurb:"Points for the combinations an asset is in, priced by the worst severity among them and lifted by a multiplier once s",params:{}}}},{id:"pillar-d",term:"Pillar D",aka:"internet reachability",family:"score",blurb:"Points for whether the asset is reachable from the internet. Its three states are not a severity ramp: UNDETERMINED is an epistemic state, not a middling amount of exposure \u2014 Wiz reports it for a hosted agent because reachability is inherited from the host underneath and was never evaluated on the agent itself. It prices BELOW confirmed and ABOVE none, which is the honest reading of \u201Cthis needs checking\u201D, and it must never be collapsed into either neighbour.",drawnOn:["aars","graph"],mark:()=>o("span",{class:"pill neutral"},"D"),more:"Priced at zero in the spec rule, which scores exposure nowhere even though the graph draws it as a first-class node. The calibrated preset turns it on.",link:{label:"Open AARS Rules",route:"aars",params:{}}},{id:"gap-sources",term:"Gap sources",aka:"what may raise a gap",family:"score",blurb:"Separate from what a gap COSTS: which derivations are allowed to raise one at all. Every source is off by default, because switching one on re-prices assets and the applied table in the spec is normative for the default rule. They exist because three rows of the default cascade price codes nothing in the live pipeline emits \u2014 not shadowed, unreachable, with the signal each needs already in the sheets.",drawnOn:["aars"],mark:()=>o("span",{class:"pill neutral"},"\xB1"),link:{label:"Open AARS Rules",route:"aars",params:{}}},{id:"rescore",term:"Recompute scores",aka:"not a sync",family:"score",blurb:"Re-runs the enrichment over data already in the sheet and makes ZERO Wiz API calls. It writes no sync-history row, because a rescore is not a sync and the trend must not gain a point for a landscape that never moved. Trend points carry the rule version they were scored under, so a threshold edit reads as a break rather than as movement.",drawnOn:["aars"],mark:()=>o("span",{class:"pill neutral"},"\u21BB"),link:{label:"Open AARS Rules",route:"aars",params:{}}},{id:"problem-tree",term:"Problem tree",aka:"ACT \xB7 Attend \xB7 Track \u2605 \xB7 Track",family:"score",blurb:"A 54-leaf decision tree \u2014 exploitation \xD7 technical impact \xD7 system exposure \xD7 mission \u2014 that routes one issue or finding into one of four queues, first match wins over an ordered cascade. It answers a different question than the findings score: not a rank, a queue, and it is built so most leaves land in Track or Track \u2605 and only a documented, auditable minority reach Act. The AARS Rules page carries its editor on a second tab.",drawnOn:["aars","problems"],mark:()=>Kt("ACT"),link:{label:"Open the Problem tree tab",route:"aars",params:{}}},{id:"posture-tier",term:"Posture tier",aka:"a capability envelope, not a sum of problems",family:"score",blurb:"1 to 4, 4 worst \u2014 a first-match cascade over capability \xD7 containment \xD7 consequence, the same mechanism the Problem tree uses, aimed at a different question: not what has been FOUND on an asset, but what it could DO and what stands in its way. An agent with zero open issues and unrestricted access to sensitive data is not a low tier just because nothing has been found yet \u2014 this is the one reading on the Inventory that is not an aggregate of the findings score or of the Problem tree's outcomes, deliberately drawn beside them rather than blended in.",drawnOn:["aars","inventory","problems"],mark:()=>bn(4),link:{label:"Open the Posture tab",route:"aars",params:{}}},{id:"posture-axes",term:"Capability \xB7 containment \xB7 consequence",aka:"the posture lattice's three axes",family:"score",blurb:"Capability: identity power and data reach (BROAD/SCOPED/MINIMAL). Containment: how much stands between the asset and the outside world (WEAK/PARTIAL/STRONG) \u2014 a clear guardrail scan alone reads PARTIAL, never STRONG, until a confirmed non-exposure corroborates it. Consequence: what a realized failure would cost (SEVERE/MODERATE/LIMITED). 27 cells; a lethal-trifec
