tput passes downstream unvalidated, enabling XSS, SSRF or code execution."],["LLM06","Excessive Agency","The model holds more permission, tooling or autonomy than its task needs."],["LLM07","System Prompt Leakage","The system prompt leaks, exposing secrets or the logic needed to bypass controls."],["LLM08","Vector and Embedding Weaknesses","Flaws in RAG vectors and embeddings leak data or inject content via retrieval."],["LLM09","Misinformation","The model emits confident, fabricated or wrong output that users act on."],["LLM10","Unbounded Consumption","Unmetered inference lets attackers drain cost and capacity, or extract the model."]]},{group:"OWASP Agentic (ASI)",vintage:"2026 edition",standing:"Published 1.0 (announced December 2025). It does NOT supersede the T-numbered list: \u201CAgentic AI \u2014 Threats and Mitigations\u201D is a parallel companion, updated to v1.1 in the same release and now running T1\u2013T17, not T1\u2013T15. The two are different layers \u2014 ASI is the ranked risk list, T is the granular attack pathway \u2014 and OWASP ships the official cross-map in ASI 2026 Appendix A. A scanner emitting T13 spans ASI10 and ASI04.",entries:[["ASI01","Agent Goal Hijack","Untrusted content redirects the agent's objective while it believes it serves the user."],["ASI02","Tool Misuse & Exploitation","Legitimate tools weaponised via deceptive input, poisoned metadata or unsafe chaining."],["ASI03","Identity & Privilege Abuse","Over-broad delegated credentials turn any hijack into unauthorised action."],["ASI04","Agentic Supply Chain Vulnerabilities","Compromised frameworks, MCP servers or tool schemas the agent dynamically trusts."],["ASI05","Unexpected Code Execution (RCE)","Agent-generated or agent-triggered code runs outside its sandbox or validation boundary."],["ASI06","Memory & Context Poisoning","Data planted in persistent memory or retrieval steers behaviour in later sessions."],["ASI07","Insecure Inter-Agent Communication","Agent-to-agent messages spoofed, replayed or tampered with for lack of auth."],["ASI08","Cascading Failures","One agent's error or compromise fans out through connected workflows at scale."],["ASI09","Human-Agent Trust Exploitation","Agents manipulate the human approval step by controlling what the reviewer is shown."],["ASI10","Rogue Agents","Agents operating outside policy while appearing legitimate, via drift or compromise."]]},{group:"OWASP ML",vintage:"draft v0.3",standing:"Still officially a draft and modified frequently. These codes are DERIVED \u2014 the sync builds ML_ plus the finding's title, so they carry no ordinal and the ML0n below is a mapping this page states, not one the data contains.",entries:[["ML_INPUT_MANIPULATION","Input Manipulation Attack (ML01)","Adversarial inputs perturbed just enough to force a wrong prediction."],["ML_DATA_POISONING","Data Poisoning Attack (ML02)","Training data tampered with so the model learns attacker-chosen behaviour."],["ML_MODEL_INVERSION","Model Inversion Attack (ML03)","Querying the model to reconstruct sensitive training records."],["ML_MEMBERSHIP_INFERENCE","Membership Inference Attack (ML04)","Determining whether a specific record was in the training set."],["ML_MODEL_THEFT","Model Theft (ML05)","Extracting or exfiltrating model weights or behaviour via queries or access."],["ML_SUPPLY_CHAIN","AI Supply Chain Attacks (ML06)","Compromised packages, datasets or pre-trained models enter the pipeline."],["ML_TRANSFER_LEARNING","Transfer Learning Attack (ML07)","A backdoored base model carries its malicious behaviour into the fine-tune."],["ML_MODEL_SKEWING","Model Skewing (ML08)","Manipulating the feedback or retraining loop to shift outputs over time."],["ML_OUTPUT_INTEGRITY","Output Integrity Attack (ML09)","Tampering with model output in transit or at the interface, not the model itself."],["ML_MODEL_POISONING","Model Poisoning (ML10)","Directly altering model parameters or weights to make it misbehave."]]},{group:"Wiz 5Rs",vint
