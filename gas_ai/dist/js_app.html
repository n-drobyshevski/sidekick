urn[Lt("overview","Overview",null,null,!1),Lt("fix","Remediation","Remediation",null,!a),Lt("accepted","Accepted risk","Remediation",o,o===0),Lt("iac","Infrastructure as code","Remediation",r,r===0),Lt("rule","The control","Context",null,!s.ruleDescription),Lt("policy","Policy","Context",null,!s.opaPolicy),Lt("resource","Resource","Context",null,!s.resourceId),Lt("asset","Affected asset","Context",null,!t.asset),Lt("projects","Projects","Context",i,i===0),Lt("facts","Facts","Context",null,!1)]}var dl="Family prefixes",No=[{group:"OWASP LLM Top 10",vintage:"2025 edition",standing:"Published. The 2026 edition (released 3 August 2026) renumbers eight of the ten entries \u2014 this model is written against 2025, so a code here means what 2025 says it means. Five codes MEAN DIFFERENT THINGS across the two vintages, and two pairs effectively swap: 2025 LLM03 Supply Chain \u2192 2026 LLM04, while 2026 LLM03 is Excessive Agency (2025 LLM06); 2025 LLM05 Improper Output Handling \u2192 2026 LLM10, while 2026 LLM05 is Data and Model Poisoning (2025 LLM04); 2025 LLM07 System Prompt Leakage \u2192 2026 LLM08, renamed Hidden Context Exposure; 2025 LLM10 Unbounded Consumption \u2192 2026 LLM06. Only LLM01 and LLM02 keep their number. A connector emitting 2026 codes into this cascade would be priced against the wrong risk \u2014 check the vintage before trusting a code.",entries:[["LLM01","Prompt Injection","Crafted input alters the model's behaviour, bypassing its instructions or safety rules."],["LLM02","Sensitive Information Disclosure","The model reveals PII, secrets or proprietary data in its output."],["LLM03","Supply Chain","Compromised third-party models, datasets, adapters or plugins enter the stack."],["LLM04","Data and Model Poisoning","Tampered training or fine-tuning data corrupts behaviour or plants a backdoor."],["LLM05","Improper Output Handling","Model output passes downstream unvalidated, enabling XSS, SSRF or code execution."],["LLM06","Excessive Agency","The model holds more permission, tooling or autonomy than its task needs."],["LLM07","System Prompt Leakage","The system prompt leaks, exposing secrets or the logic needed to bypass controls."],["LLM08","Vector and Embedding Weaknesses","Flaws in RAG vectors and embeddings leak data or inject content via retrieval."],["LLM09","Misinformation","The model emits confident, fabricated or wrong output that users act on."],["LLM10","Unbounded Consumption","Unmetered inference lets attackers drain cost and capacity, or extract the model."]]},{group:"OWASP Agentic (ASI)",vintage:"2026 edition",standing:"Published 1.0 (announced December 2025). It does NOT supersede the T-numbered list: \u201CAgentic AI \u2014 Threats and Mitigations\u201D is a parallel companion, updated to v1.1 in the same release and now running T1\u2013T17, not T1\u2013T15. The two are different layers \u2014 ASI is the ranked risk list, T is the granular attack pathway \u2014 and OWASP ships the official cross-map in ASI 2026 Appendix A. A scanner emitting T13 spans ASI10 and ASI04.",entries:[["ASI01","Agent Goal Hijack","Untrusted content redirects the agent's objective while it believes it serves the user."],["ASI02","Tool Misuse & Exploitation","Legitimate tools weaponised via deceptive input, poisoned metadata or unsafe chaining."],["ASI03","Identity & Privilege Abuse","Over-broad delegated credentials turn any hijack into unauthorised action."],["ASI04","Agentic Supply Chain Vulnerabilities","Compromised frameworks, MCP servers or tool schemas the agent dynamically trusts."],["ASI05","Unexpected Code Execution (RCE)","Agent-generated or agent-triggered code runs outside its sandbox or validation boundary."],["ASI06","Memory & Context Poisoning","Data planted in persistent memory or retrieval steers behaviour in later sessions."],["ASI07","Insecure Inter-Agent Communication","Agent-to-agent messages spoofed, replayed or tampered with for lack of auth."],["ASI08","Cascading Failures","One agent's error or c  applied to the stored aars \u2014 no re-sync required.",dataSource:"ai_assets.aars, ai_assets.aars_severity",reportingFormat:"Scoring Models page only, as a rule diagnostic \u2014 band occupancy and the preview's movers. The inventory's level strip and level trend are gone; that page charts open issues, cloud findings and posture fails over time instead.",revisionDue:"2027-08-13"},{id:"aars-distinct-scores",measure:"distinctScores",type:"effectiveness",measurementMethod:"Objective",goal:"Measures the MODEL's separating power, not the landscape's risk \u2014 a rule can render a confident number for every asset while carrying zero ranking information.",formula:"new Set(scores).size, over every scored asset in the preview.",dataSource:"ai_assets.aars",reportingFormat:"Scoring Models page, rule-preview Discrimination panel.",revisionDue:"2027-08-13"},{id:"aars-tie-rate",measure:"tieRate",type:"effectiveness",measurementMethod:"Objective",goal:"Same as distinctScores, at the scale of PAIRS: 1.0 means every pair of scored assets shares a value, so any ordering within the landscape is arbitrary.",formula:"\u03A3 C(n_k,2) / C(N,2) over the distinct-value groups (rankStats.tieRate).",dataSource:"ai_assets.aars",reportingFormat:"Scoring Models page, rule-preview Discrimination panel.",revisionDue:"2027-08-13"},{id:"aars-effective-cardinality",measure:"effectiveCardinality",type:"effectiveness",measurementMethod:"Objective",goal:"Same as distinctScores, weighted by population \u2014 one outlier score does not claim the same discrimination credit an even split would.",formula:"exp(Shannon entropy) over the score distribution (rankStats.effectiveCardinality).",dataSource:"ai_assets.aars",reportingFormat:"Scoring Models page, rule-preview Discrimination panel.",revisionDue:"2027-08-13"},{id:"aars-pillar-saturation",measure:"Pillar saturation",type:"effectiveness",measurementMethod:"Objective",goal:"Locates WHICH pillar of the model has stopped discriminating \u2014 a pillar pinned at its cap for most of the landscape still renders a plausible total score.",formula:"Assets at or above each pillar's cap (aarsRule.ts's ruleDiscrimination).",dataSource:"ai_assets.aars_pillars_json",reportingFormat:"Scoring Models page, rule-preview Discrimination panel.",revisionDue:"2027-08-13"},{id:"problem-outcome-distribution",measure:"Problem outcome distribution",type:"impact",measurementMethod:"Subjective",goal:"How open issues and failing findings split across Act/Attend/Track*/Track.",formula:"countProblemOutcomes(rows) over OUTCOME_VALUES, zero-filled. One input axis (exploitation) can be set via an LLM rater's verdict \u2014 see measurementMethod.",dataSource:"ai_issues.problem_outcome, ai_findings.problem_outcome",reportingFormat:"Scoring Models page, Problem tree tab's preview. It was the Priorities KPI row and a Priority column on three registers; those now read Wiz's severity.",revisionDue:"2027-08-13"},{id:"problem-axis-unknown-rate",measure:"Per-axis unknown rate",type:"implementation",measurementMethod:"Objective",goal:"THE MOST IMPORTANT MEASURE ON THIS PAGE. A high value does NOT mean the landscape is safe \u2014 it means the model cannot prioritise, because the evidence one axis needs was never collected. Reading it as reassurance is the misuse this exists to prevent.",formula:"Fraction of the decided population unresolved on each axis (treeDiscrimination.unknownRate).",dataSource:"ai_issues.problem_input_json, ai_findings.problem_input_json",reportingFormat:"Scoring Models page, Problem tree tab's preview.",revisionDue:"2027-08-13"},{id:"posture-tier-distribution",measure:"Posture tier distribution",type:"impact",measurementMethod:"Objective",goal:"How many assets sit in each capability-envelope tier (1 best, 4 worst) \u2014 independent of what has been found on the asset.",formula:"countPostureTiers(nodes) over TIER_VALUES, zero-filled.",dataSource:"ai_assets.posture_tier",reportingFormat:"Scoring Models page, Posture tab's preview. It was an inventory column, an inventory headline and a level of the Priorities ranking; none of the three reads it now.",revisionDue:"2027-08-13"},{id:"issue-sla-tally",measure:"SLA tally",type:"efficiency",measurementMethod:"Objective",goal:"How much of the open-issue register is racing a clock \u2014 past-due, due-soon or no deadline at all, kept apart.",formula:"slaState(dueAt, now) bucketed per issue (comboDigest.ts).",dataSource:"ai_issues.due_at",reportingFormat:"Toxic Combinations KPI row; Priorities page's ranking, where the SLA clock is now the second level rather than the third.",revisionDue:"2027-08-13"},{id:"compliance-gaps",measure:"complianceGaps",type:"effectiveness",measurementMethod:"Objective",goal:"How many cloud-configuration controls are failing right now \u2014 one definition, shared by every page that counts it.",formula:"isOpenGap(finding) filter, then a count.",dataSource:"ai_findings.result, ai_findings.status",reportingFormat:"AI Inventory KPI row; Cloud Configuration register header.",revisionDue:"2027-08-13"},{id:"compliance-gaps-unlinked",measure:"complianceGapsUnlinked",type:"implementation",measurementMethod:"Objective",goal:"How much of complianceGaps this app can attribute to a modeled AI asset \u2014 a fact about THIS APP's own graph coverage, not about Wiz's controls.",formula:"Open gaps whose resourceId is not a key in the current asset set.",dataSource:"ai_findings.resource_id, ai_assets.id",reportingFormat:"AI Inventory KPI row, beside complianceGaps.",revisionDue:"2027-08-13"},{id:"guardrail-coverage-pct",measure:"guardrailCoveragePct",type:"implementation",measurementMethod:"Objective",goal:"Share of SCANNED AI agents with no missing-guardrail finding raised \u2014 an absence of evidence, not a confirmed control, and reported beside the count the scan never reached rather than folded in with it.",formula:"protectedAgents (guardrailMissing === false) / (agents - guardrailUnknownAgents) \xD7 100, rounded; null when nothing was scanned.",dataSource:"ai_assets.guardrail_missing, ai_assets.kind",reportingFormat:"Wiz Scans coverage area, beside protectedAgents and guardrailUnknownAgents.",revisionDue:"2027-08-13"},{id:"posture-scope-split",measure:"posture tiers, withheld, out of scope",type:"implementation",measurementMethod:"Objective",goal:"How much of the register the posture lattice actually rates \u2014 and for the rest, which of the two reasons applies. Withheld is a coverage gap someone can close; out of scope says this lattice does not describe this kind of asset, and nothing can.",formula:"censusPostureTiers(nodes): tier counts (zeros kept) plus withheld, outOfScope and total, split on whether the node carries a posture vector at all.",dataSource:"sync_history.posture_tier_json, ai_assets.posture_tier, ai_assets.posture_input_json",reportingFormat:"Inventory posture header; the Posture column reason per row; the posture trend series.",revisionDue:"2027-08-13"},{id:"derivation-version-currency",measure:"derivation version, ledger vs code",type:"implementation",measurementMethod:"Objective",goal:"Whether the stored facts were collected by the normalizer now running. The one staleness Recompute cannot repair, because the old value was destroyed at ingest \u2014 so the warning names a full sync as its remedy.",formula:"derivationIsStale(settings, DERIVATION_VERSION); an unstamped ledger reads stale, the opposite default to the three rule-version markers.",dataSource:"sync_history.derivation_version, settings.key, settings.value_json",reportingFormat:"Staleness banner; break markers on every sync_history trend series.",revisionDue:"2027-08-13"},{id:"toxic-combo-patterns-active",measure:"patternsActive / patternsTotal",type:"impact",measurementMethod:"Objective",goal:"How many of the four modelled toxic-combination patterns currently have an open issue firing.",formula:"Count of REGISTER_GROUPS with at least one matching unresolved issue.",dataSource:"ai_issues.combo_group, ai_issues.status",reportingFormat:"Toxic Combinations page KPI row.",revisionDue:"2027-08-13"},{id:"framework-average-posture",measure:"averagePosture",type:"effectiveness",measurementMethod:"Objective",goal:"One number for landscape-wide compliance across every synced framework \u2014 unscored frameworks are excluded rather than read as zero.",formula:"Mean posture_pct across framework rows whose state resolves to 'scored'.",dataSource:"ai_framework_posture.posture_pct",reportingFormat:"Compliance Posture page's headline strip.",revisionDue:"2027-08-13"},{id:"action-concentration-ratio",measure:"Action concentration",type:"impact",measurementMethod:"Objective",goal:"Whether the landscape has LEVERAGE to exploit \u2014 whether a handful of fixes closes most of the open board. A ratio near 1:1 is not a healthy reading: it means every problem is its own distinct fix and ranking actions buys nothing over ranking problems.",formula:"concentrationRatio over rankActionsByCover's marginal set-cover: distinct actions, the union total they sum back to, and the share the top 10 alone close.",dataSource:"ai_issues.rule_id, ai_findings.rule_short_id, ai_findings.rule_id",reportingFormat:"Priorities page's action list header and its cumulative-cover curve.",revisionDue:"2027-08-13"},{id:"landscape-reach-stages",measure:"Landscape reach stage ladder",type:"impact",measurementMethod:"Objective",goal:"What fraction of the AI landscape a sync actually touched, in paired counts \u2014 never a bare percentage, so a stage with nothing behind it (\u20180 of 22 attributed\u2019) cannot be misread as a clean result.",formula:"estateReach(...).stages: in register, observed, enriched, decided \u2014 each { covered, total } over the AI-kinded register. Four, not five: business-impact tagging left the ladder (it arrives on the inventory hop, so it does not depend on the stages above it), and \u2018decided\u2019 no longer accepts a bare AARS score, which every AI-kinded asset carries and which made the stage a nd the icon and the word are the KIND. Every kind draws its own mark, so a glyph names one thing and one thing only. Colour is still never the only cue: the icon rides beside the label, never instead of it.",drawnOn:["graph","inventory"],mark:()=>ta("AI_AGENT"),strip:()=>Ys.map(e=>({cat:e,label:hs[e]})),more:"The full list of kinds, grouped by category and searchable, is the AI Inventory filter drawer \u2014 where each one also says how many assets it would leave.",count:e=>{let t=e.boot.filterOptions&&e.boot.filterOptions.kinds||[];return t.length?{n:t.length,value:String(t.length),unit:"kinds in this landscape",route:"inventory",params:{panel:"filters"}}:null}},{id:"toxic-combination",term:"Toxic combination",aka:"TC",family:"graph",blurb:"A multi-condition pattern that only fires when risks COMBINE \u2014 a privileged agent that can also reach classified data is not two findings, it is one path. Members carry a crimson halo and a TC badge on the graph.",drawnOn:["combos","graph","inventory"],mark:()=>n("span",{class:"help-tc","aria-hidden":"true"},"TC"),count:e=>{let t=e.digest&&e.digest.totals;return t?{n:We(t.patternsActive),value:We(t.patternsActive)+" of "+We(t.patternsTotal),unit:"patterns firing",route:"combos",params:{}}:null}},{id:"tc-halo",term:"The crimson halo",aka:"membership, never severity",family:"graph",blurb:"Crimson is this app's identity colour. On the graph it marks toxic-combination membership and nothing else \u2014 it is always paired with the TC badge and an aria-label suffix, so it never carries meaning by colour alone. Severity stays on the dot-and-word chip, in the shared palette.",drawnOn:["graph"],mark:()=>n("span",{class:"help-halo","aria-hidden":"true"}),count:e=>{let t=e.digest&&e.digest.totals;return t?{n:We(t.assetsAffected),value:String(We(t.assetsAffected)),unit:"assets in a combination",route:"inventory",params:{flags:"combo"}}:null}},{id:"negated-edge",term:"A dashed edge is an absence",aka:"the negated relationship",family:"graph",blurb:"Wiz was asked for a relationship and found none. Rather than leave the gap off the picture, the edge is drawn dashed and labelled with what is missing. The guardrail gap is the one this app raises: a PROTECTED_BY edge that does not exist.",drawnOn:["graph"],mark:()=>n("span",{class:"help-dash","aria-hidden":"true"}),link:{label:"Open the graph",route:"graph",params:{}}},{id:"risk-as-node",term:"Risk is a node",aka:"not a flag on a card",family:"graph",blurb:"Sensitive-data reach, internet exposure, excessive rights and the guardrail gap are drawn as nodes hanging off the asset they describe, on the path \u2014 because that is what an attack path is. They are derived when the graph is READ and never stored, so an already-synced graph gains them without a re-sync.",drawnOn:["graph"],mark:()=>ta("EXCESSIVE_ACCESS_FINDING"),link:{label:"Open the graph",route:"graph",params:{}}},{id:"graph-query",term:"The query builder",aka:"FIND \u2026 THAT \u2026",family:"graph",blurb:"A query reads FIND <entity> THAT <relationship> <entity>, and each further step walks one more hop along the graph. In the table a ROW IS A PATH, not an asset: an agent bound to two service accounts is two rows carrying the same name, and every shown step adds a group of columns rather than a column. The eye keeps a step in the traversal but drops its columns, an optional step keeps rows that would otherwise be dropped with the group left empty, and NOT asserts the relationship is absent \u2014 which is how you ask for an agent with no guardrail. The pickers only offer relationships this tenant's graph actually holds, so a query that can match nothing is hard to build.",drawnOn:["graph"],mark:()=>n("span",{class:"pill neutral"},"FIND"),link:{label:"Open the graph",route:"graph",params:{}}},{id:"depth-budget",term:"Depth and node budget",aka:"what bounds a view",family:"graph",blurb:"Depth bounds how far the traversal walks from its starting points. The node budget is a hard ceiling on one view, counting the collapse stubs it also draws. Both keep the server payload light; a view that hits the ceiling says so and offers Load more, which widens that one view without changing the default.",drawnOn:["graph","settings"],mark:()=>n("span",{class:"pill neutral"},"budget"),fromSettings:!0,count:e=>{let t=e.boot.settings;return t?{n:We(t.maxNodes),value:"depth "+We(t.defaultDepth)+" \xB7 "+We(t.maxNodes),unit:"nodes per view",route:"settings",params:{tab:"graph"}}:null}},{id:"summary-stub",term:"The collapse stub",aka:"\u201C+N more\u201D",family:"graph",blurb:"A high-fanout neighbour set collapsed into one pill, which expands on demand. The stub counts against the node budget like any other node, which is why a capped view still shows them: the budget buys paths, not a field of disconnected dots.",drawnOn:["graph"],mark:()=>ta("SUMMARY"),link:{label:"Open the graph",route:"graph",params:{}}},{id:"missing-guardrail",term:"MISSING_GUARDRAIL",aka:"\u201Cno guardrail\u201D",family:"signal",blurb:"No guardrail is attached to this agent or model. Wiz tests the PROTECTED_BY relationship on every agent, and an absent edge raises this node. It is the strongest single amplifier in the toxic combinations.",drawnOn:["graph","inventory"],mark:()=>ta("MISSING_GUARDRAIL"),count:e=>{let t=e.kpis;if(!t||t.protectedAgents===void 0||!t.agents)return null;let s=We(t.agents)-We(t.protectedAgents);return{n:s,value:s+" of "+We(t.agents),unit:"agents unprotected",route:"inventory",params:{flags:"guardrail"}}}},{id:"data-finding",term:"DATA_FINDING",aka:"what Wiz found in the data",family:"signal",blurb:"Wiz's DSPM verdict on one bucket or database \u2014 what class of sensitive data is in it, and how severe. Drawn as one node per datastore carrying the count, because a store with two hundred findings is one fact about that store, not two hundred nodes. These are what turn \u201Cthis agent can reach sensitive data\u201D into a path you can walk: agent \u2192 execution identity \u2192 datastore \u2192 findings.",drawnOn:["graph"],mark:()=>ta("DATA_FINDING"),count:e=>{let t=e.kpis;return!t||t.dataFindings===void 0?null:{n:We(t.dataFindings),value:String(We(t.dataFindings)),unit:fs(We(t.dataFindings),"finding")+" on reachable stores",route:"graph",params:{kinds:"DATA_FINDING"}}}},{id:"sensitive-data",term:"SENSITIVE_DATA",aka:"classified-data reach, unresolved",family:"signal",blurb:"The FALLBACK marker: Wiz says this asset can reach data classified as PII, PHI or PCI, but no path to the store could be walked \u2014 the tenant rejected the traversal, or the grant is expressed some way it does not follow. Where the path IS walkable the chain is drawn instead and this marker is suppressed, so one asset never tells the same story twice. Its mark is the data-finding gem, left unfinished.",drawnOn:["graph"],mark:()=>ta("SENSITIVE_DATA"),count:e=>{let t=e.kpis;return!t||t.sensitiveAccess===void 0?null:{n:We(t.sensitiveAccess),value:String(We(t.sensitiveAccess)),unit:"AI "+fs(We(t.sensitiveAccess),"asset")+" reach it",route:"graph",params:{kinds:"SENSITIVE_DATA"}}}},{id:"internet-exposure",term:"INTERNET_EXPOSURE",aka:"network reachability",family:"signal",blurb:"The asset or the host underneath it is reachable from the internet. Managed agents report it directly; hosted agents inherit it from the VM or service beneath them, which Wiz reports as UNDETERMINED until that host is checked. Undetermined is counted separately and never folded into \u201Cnot exposed\u201D.",drawnOn:["graph"],mark:()=>ta("INTERNET_EXPOSURE"),count:e=>{let t=e.kpis;if(!t||t.internetExposed===void 0)return null;let s=We(t.internetUnknown);return{n:We(t.internetExposed),value:String(We(t.internetExposed)),unit:"reachable"+(s?" \xB7 "+s+" undetermined":""),route:"graph",params:{kinds:"INTERNET_EXPOSURE"}}}},{id:"excessive-privilege",term:"EXCESSIVE_PRIVILEGE",aka:"excessive rights",family:"signal",blurb:"The identity an AI asset runs as holds admin or high-privilege permissions. The individual excessive-access and lateral-movement findings on those service accounts are synced and drawn beside the identity, but nothing totals them, so the figure here counts assets and identities carrying the flag.",drawnOn:["graph"],mark:()=>ta("EXCESSIVE_PRIVILEGE"),count:e=>{let t=e.kpis;return!t||t.highPrivilege===void 0?null:{n:We(t.highPrivilege),value:String(We(t.highPrivilege)),unit:"carry a privilege flag",route:"graph",params:{kinds:"EXCESSIVE_PRIVILEGE"}}}},{id:"agentic-identity",term:"Agentic identity",aka:"a service account an agent runs as",family:"signal",blurb:"An identity whose purpose is to execute agent work rather than to represent a person. It is the join between an agent and everything that agent can reach, which is why over-broad rights on one turn any hijack into unauthorised action.",drawnOn:["graph","inventory"],mark:()=>ta("SERVICE_ACCOUNT"),count:e=>{let t=e.kpis;return!t||t.agenticIdentities===void 0?null:{n:We(t.agenticIdentities),value:String(We(t.agenticIdentities)),unit:We(t.agenticIdentities)===1?"agentic identity":"agentic identities",route:"inventory",params:{flags:"agentic"}}}},{id:"aars",term:"Findings score",aka:"AARS \u2014 the identifier every column and route still uses",family:"score",blurb:"One number per asset, 0 to 100, summed across four pillars and clamped. It is this app's own score, not a Wiz field: it prices what the sync collected, so the model that produces it is editable and its inputs are persisted beside every score. It counts what has already been FOUND \u2014 issues, compliance gaps, data exposure \u2014 which is why it is not called a risk score; forward-looking consequence is the posture tier's job. The raw number is only meaningful against the other assets, which is why the Scoring Models page reads it as a distribution rather than one asset at a time. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>Ka(78,"HIGH"),count:e=>{let t=e.kpis;return!t||t.aarsScored===void 0?null:{n:We(t.aarsScored),value:String(We(t.aarsScored)),unit:"assets scored",route:"inventory",params:{}}}},{id:"aars-band",term:"Findings score level",aka:"context beside a score, not a verdict",family:"score",blurb:"The level a score falls into. Bands are re-derived from the stored score on every read, so moving a threshold applies at once and retroactively \u2014 no re-sync, no rescore. Changing the POINT model is the other thing entirely, and strands the stored scores until they are recomputed. A level is not a queue: on this landscape the top one holds most of the scored assets and two hold none, so it is drawn tinted only on the AARS Rules page, where the thresholds themselves are the subject, and plain everywhere else. Its two honest readings are the distribution the trend charts over time and the occupancy the rule editor reports. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>Qe("HIGH"),fromSettings:!0,count:e=>{let t=e.boot.aarsRule;if(!t||!t.bands)return null;let s=["critical","high","medium","low"].map(a=>t.bands[a]).filter(a=>typeof a=="number");return s.length!==4?null:{n:s.length,value:s.join(" / "),unit:"thresholds in force",route:"aars",params:{}}}},{id:"pillar-a",term:"Pillar A",aka:"toxic-combination participation",family:"score",blurb:"Points for the combinations an asset is in, priced by the worst severity among them and lifted by a multiplier once there is more than one issue. How that multiplier scales is itself a choice: flat applies it once, log2 grows it with the issue count so a tenth issue still moves the number. Capped, so no single pillar can carry the whole score. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"A"),fromSettings:!0,count:e=>{let t=e.boot.aarsRule&&e.boot.aarsRule.pillarCaps;return!t||t.toxic===void 0?null:{n:We(t.toxic),value:"cap "+We(t.toxic),unit:"of 100",route:"aars",params:{}}}},{id:"pillar-b",term:"Pillar B",aka:"compliance gaps",family:"score",blurb:"Points for the framework codes an asset's failing findings violate, priced by an ORDERED cascade \u2014 first match wins, ending in a fallback for codes the codebook does not carry. Its quantity is order, not magnitude, which is why that pillar is the one edited as a table. How the matched prices COMBINE is a second choice: summing them pins most assets to the cap, because Wiz maps one underlying risk onto an OWASP LLM code and an ASI code and an ML title, so root-sum-square is offered to soften that triple charge and keep the pillar discriminating. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"B"),count:e=>{let t=e.kpis;return!t||t.complianceGaps===void 0?null:{n:We(t.complianceGaps),value:String(We(t.complianceGaps)),unit:"failing findings priced",route:"aars",params:{}}}},{id:"pillar-c",term:"Pillar C",aka:"data exposure",family:"score",blurb:"Points for what classified data the asset can reach, lifted by the 5Rs amplifier. The amplifier is the one number on the model that is not a policy choice \u2014 it is a systemic signal, so it applies to every data point regardless of asset. This pillar's ceiling is DERIVED (top tier through the amplifier) rather than set. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"C"),fromSettings:!0,count:e=>{let t=e.boot.aarsRule&&e.boot.aarsRule.pillarCaps;return!t||t.data===void 0?null:{n:We(t.data),value:"cap "+We(t.data),unit:"of 100",route:"aars",params:{}}}},{id:"pillar-d",term:"Pillar D",aka:"internet reachability",family:"score",blurb:"Points for whether the asset is reachable from the internet. Its three states are not a severity ramp: UNDETERMINED is an epistemic state, not a middling amount of exposure \u2014 Wiz reports it for a hosted agent because reachability is inherited from the host underneath and was never evaluated on the agent itself. It prices BELOW confirmed and ABOVE none, which is the honest reading of \u201Cthis needs checking\u201D, and it must never be collapsed into either neighbour. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"D"),more:"Priced at zero in the spec rule, which scores exposure nowhere even though the graph draws it as a first-class node. The calibrated preset turns it on.",link:{label:"Open Scoring Models",route:"aars",params:{}}},{id:"gap-sources",term:"Gap sources",aka:"what may raise a gap",family:"score",blurb:"Separate from what a gap COSTS: which derivations are allowed to raise one at all. Every source is off by default, because switching one on re-prices assets and the applied table in the spec is normative for the default rule. They exist because three rows of the default cascade price codes nothing in the live pipeline emits \u2014 not shadowed, unreachable, with the signal each needs already in the sheets. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"\xB1"),link:{label:"Open Scoring Models",route:"aars",params:{}}},{id:"rescore",term:"Recompute scores",aka:"not a sync",family:"score",blurb:"Re-runs the enrichment over data already in the
