sinformation","The model emits confident, fabricated or wrong output that users act on."],["LLM10","Unbounded Consumption","Unmetered inference lets attackers drain cost and capacity, or extract the model."]]},{group:"OWASP Agentic (ASI)",vintage:"2026 edition",standing:"Published 1.0 (announced December 2025). It does NOT supersede the T-numbered list: \u201CAgentic AI \u2014 Threats and Mitigations\u201D is a parallel companion, updated to v1.1 in the same release and now running T1\u2013T17, not T1\u2013T15. The two are different layers \u2014 ASI is the ranked risk list, T is the granular attack pathway \u2014 and OWASP ships the official cross-map in ASI 2026 Appendix A. A scanner emitting T13 spans ASI10 and ASI04.",entries:[["ASI01","Agent Goal Hijack","Untrusted content redirects the agent's objective while it believes it serves the user."],["ASI02","Tool Misuse & Exploitation","Legitimate tools weaponised via deceptive input, poisoned metadata or unsafe chaining."],["ASI03","Identity & Privilege Abuse","Over-broad delegated credentials turn any hijack into unauthorised action."],["ASI04","Agentic Supply Chain Vulnerabilities","Compromised frameworks, MCP servers or tool schemas the agent dynamically trusts."],["ASI05","Unexpected Code Execution (RCE)","Agent-generated or agent-triggered code runs outside its sandbox or validation boundary."],["ASI06","Memory & Context Poisoning","Data planted in persistent memory or retrieval steers behaviour in later sessions."],["ASI07","Insecure Inter-Agent Communication","Agent-to-agent messages spoofed, replayed or tampered with for lack of auth."],["ASI08","Cascading Failures","One agent's error or compromise fans out through connected workflows at scale."],["ASI09","Human-Agent Trust Exploitation","Agents manipulate the human approval step by controlling what the reviewer is shown."],["ASI10","Rogue Agents","Agents operating outside policy while appearing legitimate, via drift or compromise."]]},{group:"OWASP ML",vin
