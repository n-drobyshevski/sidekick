heck the vintage before trusting a code.",entries:[["LLM01","Prompt Injection","Crafted input alters the model's behaviour, bypassing its instructions or safety rules."],["LLM02","Sensitive Information Disclosure","The model reveals PII, secrets or proprietary data in its output."],["LLM03","Supply Chain","Compromised third-party models, datasets, adapters or plugins enter the stack."],["LLM04","Data and Model Poisoning","Tampered training or fine-tuning data corrupts behaviour or plants a backdoor."],["LLM05","Improper Output Handling","Model output passes downstream unvalidated, enabling XSS, SSRF or code execution."],["LLM06","Excessive Agency","The model holds more permission, tooling or autonomy than its task needs."],["LLM07","System Prompt Leakage","The system prompt leaks, exposing secrets or the logic needed to bypass controls."],["LLM08","Vector and Embedding Weaknesses","Flaws in RAG vectors and embeddings leak data or inject content via retrieval."],["LLM09","Misinformation","The model emits confident, fabricated or wrong output that users act on."],["LLM10","Unbounded Consumption","Unmetered inference lets attackers drain cost and capacity, or extract the model."]]},{group:"OWASP Agentic (ASI)",vintage:"2026 edition",standing:"Published 1.0 (announced December 2025). It does NOT supersede the T-numbered list: \u201CAgentic AI \u2014 Threats and Mitigations\u201D is a parallel companion, updated to v1.1 in the same release and now running T1\u2013T17, not T1\u2013T15. The two are different layers \u2014 ASI is the ranked risk list, T is the granular attack pathway \u2014 and OWASP ships the official cross-map in ASI 2026 Appendix A. A scanner emitting T13 spans ASI10 and ASI04.",entries:[["ASI01","Agent Goal Hijack","Untrusted content redirects the agent's objective while it believes it serves the user."],["ASI02","Tool Misuse & Exploitation","Legitimate tools weaponised via deceptive input, poisoned metadata or unsafe chaining."],["ASI03","Identity & Privilege Abuse","Over-broad delegated credentials turn any hijack into unauthorised action."],["ASI04","Agentic Supply Chain Vulnerabilities","Compromised frameworks, MCP servers or tool schemas the agent dynamically trusts."],["ASI05","Unexpected Code Execution (RCE)","Agent-generated or agent-triggered code runs outside its sandbox or validation boundary."],["ASI06","Memory & Context Poisoning","Data planted in persistent memory or retrieval steers behaviour in later sessions."],["ASI07","Insecure Inter-Agent Communication","Agent-to-agent messages spoofed, replayed or tampered with for lack of auth."],["ASI08","Cascading Failures","One agent's error or compromise fans out through connected workflows at scale."],["ASI09","Human-Agent Trust Exploitation","Agents manipulate the human approval step by controlling what the reviewer is shown."],["ASI10","Rogue Agents","Agents operating outside policy while appearing legitimate, via drift or compromise."]]},{group:"OWASP ML",vintage:"draft v0.3",standing:"Still officially a draft and modified frequently. These codes are DERIVED \u2014 the sync builds ML_ plus the finding's title, so they carry no ordinal and the ML0n below is a mapping this page states, not one the data contains.",entries:[["ML_INPUT_MANIPULATION","Input Manipulation Attack (ML01)","Adversarial inputs perturbed just enough to force a wrong prediction."],["ML_DATA_POISONING","Data Poisoning Attack (ML02)","Training data tampered with so the model learns attacker-chosen behaviour."],["ML_MODEL_INVERSION","Model Inversion Attack (ML03)","Querying the model to reconstruct sensitive training records."],["ML_MEMBERSHIP_INFERENCE","Membership Inference Attack (ML04)","Determining whether a specific record was in the training set."],["ML_MODEL_THEFT","Model Theft (ML05)","Extracting or exfiltrating model weights or behaviour via queries or access."],["ML_SUPPLY_CHAIN","AI Supply Chain Attacks (ML06)","Compromised packages, datasets or pre-trained models enter the pipeline."],["ML_TRANSFER_LEARNING","Transfer Learning Attack (ML07)","A backdoored base model carries its malicious behaviour into the fine-tune."],["ML_MODEL_SKEWING","Model Skewing (ML08)","Manipulating the feedback or retraining loop to shift outputs over time."],["ML_OUTPUT_INTEGRITY","Output Integrity Attack (ML09)","Tampering with model output in transit or at the interface, not the model itself."],["ML_MODEL_POISONING","Model Poisoning (ML10)","Directly altering model parameters or weights to make it misbehave."]]},{group:"Wiz 5Rs",vintage:"vendor taxonomy",standing:"Wiz's own data-security response taxonomy \u2014 no public canonical spec, and these are RESPONSE ACTIONS rather than risks, so they are a different kind of thing from the OWASP entries above. The sync's issue enrichment does not read 5Rs mappings at all: these codes reach the cascade only through failing config findings.",entries:[["FIVE_RS","A failing 5Rs control","Any 5Rs control the asset fails, without naming which of the five."],["5R_REDUCE","Reduce","Stop data sprawl by finding and deleting shadow data."],["5R_RESTRICT","Restrict","Map and remove any over-privileged access."],["5R_RELABEL","Relabel","Label cloud assets with their data sensitivity."],["5R_RELOCATE","Relocate","Ensure data jurisdiction complies with your needs."],["5R_RECONFIGURE","Reconfigure","Ensure configurations such as encryption and retention are set."]]},{group:"Local to this model",vintage:"synthesised on sync",standing:"Not a framework code. The enrichment pass raises these itself, so they are stable by definition and change only when this app changes. NO_GUARDRAIL is always raised; DEPRECATED_MODEL and INACTIVE_AGENT are read off the asset's own status and only reach the cascade when their gap source is switched on in the rule \u2014 until then a row pricing them can never fire.",entries:[["NO_GUARDRAIL","No guardrail attached","Guardrail coverage flagged the asset \u2014 the LLM01 / ASI01 gap."],["DEPRECATED_M status",reportingFormat:"Toxic Combinations page KPI row.",revisionDue:"2027-08-13"},{id:"framework-average-posture",measure:"averagePosture",type:"effectiveness",measurementMethod:"Objective",goal:"One number for estate-wide compliance across every synced framework \u2014 unscored frameworks are excluded rather than read as zero.",formula:"Mean posture_pct across framework rows whose state resolves to 'scored'.",dataSource:"ai_framework_posture.posture_pct",reportingFormat:"Compliance Posture page's headline strip.",revisionDue:"2027-08-13"},{id:"action-concentration-ratio",measure:"Action concentration",type:"impact",measurementMethod:"Objective",goal:"Whether the estate has LEVERAGE to exploit \u2014 whether a handful of fixes closes most of the open board. A ratio near 1:1 is not a healthy reading: it means every problem is its own distinct fix and ranking actions buys nothing over ranking problems.",formula:"concentrationRatio over rankActionsByCover's marginal set-cover: distinct actions, the union total they sum back to, and the share the top 10 alone close.",dataSource:"ai_issues.rule_id, ai_findings.rule_short_id, ai_findings.rule_id",reportingFormat:"Priorities page's action list header and its cumulative-cover curve.",revisionDue:"2027-08-13"},{id:"estate-reach-stages",measure:"Estate reach stage ladder",type:"impact",measurementMethod:"Objective",goal:"What fraction of the AI estate a sync actually touched, in paired counts \u2014 never a bare percentage, so a stage with nothing behind it (\u20180 of 22 attributed\u2019) cannot be misread as a clean result.",formula:"estateReach(...).stages: in register, observed, enriched, attributed, decided \u2014 each { covered, total } over the AI-kinded register.",dataSource:"ai_assets.kind, ai_assets.business_impact, ai_assets.worst_open_problem, ai_assets.aars, ai_edges.type, ai_issues.status, ai_findings.result",reportingFormat:"Wiz Scans page, Estate reach section; AI Inventory headline card.",revisionDue:"2027-08-13"},{id:"estate-reach-edge-census",measure:"Edge census",type:"implementation",measurementMethod:"Objective",goal:"Which of the 23 declared graph relationship types this deployment has ever populated \u2014 a dead type quietly removes a class of question the graph looks able to answer.",formula:"estateReach(...).edges: ai_edges.type censused against EDGE_TYPES, the same logic registerScopeDiagnostic already runs by hand.",dataSource:"ai_edges.type",reportingFormat:"Wiz Scans page, Estate reach section's edge census.",revisionDue:"2027-08-13"},{id:"estate-reach-axis-known-rate",measure:"Per-axis known %",type:"implementation",measurementMethod:"Objective",goal:"THE SAME WARNING AS Per-axis unknown rate, restated positively: a high known% does NOT mean the estate is safe \u2014 it means the decision tree cannot prioritise on that axis until it does not. An empty population reads 0%, never a false 100%.",formula:"1 \u2212 treeDiscrimination(decided).unknownRate per axis, inverted at reach.ts's own boundary; 0 when nothing has ever been decided.",dataSource:"ai_issues.problem_input_json, ai_findings.problem_input_json",reportingFormat:"Wiz Scans page, Estate reach section's axis-coverage panel.",revisionDue:"2027-08-13"}];var tx=[{id:"graph",title:"Reading the graph"},{id:"signal",title:"Risk signals"},{id:"score",title:"The score"},{id:"severity",title:"Severity"},{id:"coverage",title:"Coverage and freshness"},{id:"framework",title:"Framework vocabularies"},{id:"measures",title:"Measure specifications"}],Oi={graph:"Security Graph",inventory:"AI Inventory",problems:"Priorities",combos:"Toxic Combinations",config:"Cloud Configuration",aars:"AARS Rules",scans:"Wiz Scans",data:"Data",settings:"Settings"},Be=t=>Number(t||0);function Wh(t,e){return o("span",{class:"help-glyph"+(e?" "+e:""),"aria-hidden":"true"},t)}function Vn(t){return o("span",{class:"help-kindmark","aria-hidden":"true"},Ut(t,18))}var ui=[{id:"node-kind",term:"Node kind",aka:"tint, icon and word",family:"graph",blurb:"Every node says what it is three times over: a pale category tint, a saturated kind icon, and the kind spelled out underneath. The tint is the CATEGORY \u2014 five of them \u2014 and the icon and the word are the KIND. Every kind draws its own mark, so a glyph names one thing and one thing only. Colour is still never the only cue: the icon rides beside the label, never instead of it.",drawnOn:["graph","inventory"],mark:()=>Vn("AI_AGENT"),strip:()=>zn.map(t=>({cat:t,label:cn[t]})),more:"The full list of kinds, grouped by category and searchable, is the AI Inventory filter drawer \u2014 where each one also says how many assets it would leave.",count:t=>{let e=t.boot.filterOptions&&t.boot.filterOptions.kinds||[];return e.length?{n:e.length,value:String(e.length),unit:"kinds in this estate",route:"inventory",params:{panel:"filters"}}:null}},{id:"toxic-combination",term:"Toxic combination",aka:"TC",family:"graph",blurb:"A multi-condition pattern that only fires when risks COMBINE \u2014 a privileged agent that can also reach classified data is not two findings, it is one path. Members carry a crimson halo and a TC badge on the graph.",drawnOn:["combos","graph","inventory"],mark:()=>o("span",{class:"help-tc","aria-hidden":"true"},"TC"),count:t=>{let e=t.digest&&t.digest.totals;return e?{n:Be(e.patternsActive),value:Be(e.patternsActive)+" of "+Be(e.patternsTotal),unit:"patterns firing",route:"combos",params:{}}:null}},{id:"tc-halo",term:"The crimson halo",aka:"membership, never severity",family:"graph",blurb:"Crimson is this app's identity colour. On the graph it marks toxic-combination membership and nothing else \u2014 it is always paired with the TC badge and an aria-label suffix, so it never carries meaning by colour alone. Severity stays on the dot-and-word chip, in the shared palette.",drawnOn:["graph"],mark:()=>o("span",{class:"help-halo","aria-hidden":"true"}),count:t=>{let e=t.digest&&t.digest.totals;return e?{n:Be(e.assetsAffected),value:String(Be(e.assetsAffected)),unit:"assets in a combination",route:"inventory",params:{flags:"combo"}}:null}},{id:"negated-edge",term:"A dashed edge is an absence",aka:"the negated relationship",family:"graph",blurb:"Wiz was asked for a relationship and found none. Rather than leave the gap off the picture, the edge is drawn dashed and labelled with what is missing. The guardrail gap is the one this app raises: a PROTECTED_BY edge that does not exist.",drawnOn:["graph"],mark:()=>o("span",{class:"help-dash","aria-hidden":"true"}),link:{label:"Open the graph",route:"graph",params:{}}},{id:"risk-as-node",term:"Risk is a node",aka:"not a flag on a card",family:"graph",blurb:"Sensitive-data reach, internet exposure, excessive rights and the guardrail gap are drawn as nodes hanging off the asset they describe, on the path \u2014 because that is what an attack path is. They are derived when the graph is READ and never stored, so an already-synced graph gains them without a re-sync.",drawnOn:["graph"],mark:()=>Vn("EXCESSIVE_ACCESS_FINDING"),link:{label:"Open the graph",route:"graph",params:{}}},{id:"graph-query",term:"The query builder",aka:"FIND \u2026 THAT \u2026",family:"graph",blurb:"A query reads FIND <entity> THAT <relationship> <entity>, and each further step walks one more hop along the graph. In the table a ROW IS A PATH, not an asset: an agent bound to two service accounts is two rows carrying the same name, and every shown step adds a group of columns rather than a column. The eye keeps a step in the traversal but drops its columns, an optional step keeps rows that would otherwise be dropped with the group left empty, and NOT asserts the relationship is absent \u2014 which is how you ask for an agent with no guardrail. The pickers only offer relationships this tenant's graph actually holds, so a query that can match nothing is hard to build.",drawnOn:["graph"],mark:()=>o("span",{class:"pill neutral"},"FIND"),link:{label:"Open the graph",route:"graph",params:{}}},{id:"depth-budget",term:"Depth and node budget",aka:"what bounds a view",family:"graph",blurb:"Depth bounds how far the traversal walks from its starting points. The node budget is a hard ceiling on one view, counting the collapse stubs it also draws. Both keep the server payload light; a view that hits the ceiling says so and offers Load more, which widens that one view without changing the default.",drawnOn:["graph","settings"],mark:()=>o("span",{class:"pill neutral"},"budget"),fromSettings:!0,count:t=>{let e=t.boot.settings;return e?{n:Be(e.maxNodes),value:"depth "+Be(e.defaultDepth)+" \xB7 "+Be(e.maxNodes),unit:"nodes per view",route:"settings",params:{}}:null}},{id:"summary-stub",term:"The collapse stub",aka:"\u201C+N more\u201D",family:"graph",blurb:"A high-fanout neighbour set collapsed into one pill, which expands on demand. The stub counts against the node budget like any other node, which is why a capped view still shows them: the budget buys paths, not a field of disconnected dots.",drawnOn:["graph"],mark:()=>Vn("SUMMARY"),link:{label:"Open the graph",route:"graph",params:{}}},{id:"missing-guardrail",term:"MISSING_GUARDRAIL",aka:"\u201Cno guardrail\u201D",family:"signal",blurb:"No guardrail is attached to this agent or model. Wiz tests the PROTECTED_BY relationship on every agent, and an absent edge raises this node. It is the strongest single amplifier in the toxic combinations.",drawnOn:["graph","inventory"],mark:()=>Vn("MISSING_GUARDRAIL"),count:t=>{let e=t.kpis;if(!e||e.protectedAgents===void 0||!e.agents)return null;let s=Be(e.agents)-Be(e.protectedAgents);return{n:s,value:s+" of "+Be(e.agents),unit:"agents unprotected",route:"inventory",params:{flags:"guardrail"}}}},{id:"data-finding",term:"DATA_FINDING",aka:"what Wiz found in the data",family:"signal",blurb:"Wiz's DSPM verdict on one bucket or database \u2014 what class of sensitive data is in it, and how severe. Drawn as one node per datastore carrying the count, because a store with two hundred findings is one fact about that store, not two hundred nodes. These are what turn \u201Cthis agent can reach sensitive data\u201D into a path you can walk: agent \u2192 execution identity \u2192 datastore \u2192 findings.",drawnOn:["graph"],mark:()=>Vn("DATA_FINDING"),count:t=>{let e=t.kpis;return!e||e.dataFindings===void 0?null:{n:Be(e.dataFindings),value:String(Be(e.dataFindings)),unit:si(Be(e.dataFindings),"finding")+" on reachable stores",route:"graph",params:{kinds:"DATA_FINDING"}}}},{id:"sensitive-data",term:"SENSITIVE_DATA",aka:"classified-data reach, unresolved",family:"signal",blurb:"The FALLBACK marker: Wiz says this asset can reach data classified as PII, PHI or PCI, but no path to the store could be walked \u2014 the tenant rejected the traversal, or the grant is expressed some way it does not follow. Where the path IS walkable the chain is drawn instead and this marker is suppressed, so one asset never tells the same story twice. Its mark is the data-finding gem, left unfinished.",drawnOn:["graph"],mark:()=>Vn("SENSITIVE_DATA"),count:t=>{let e=t.kpis;return!e||e.sensitiveAccess===void 0?null:{n:Be(e.sensitiveAccess),value:String(Be(e.sensitiveAccess)),unit:"AI "+si(Be(e.sensitiveAccess),"asset")+" reach it",route:"graph",params:{kinds:"SENSITIVE_DATA"}}}},{id:"internet-exposure",term:"INTERNET_EXPOSURE",aka:"network reachability",family:"signal",blurb:"The asset or the host underneath it is reachable from the internet. Managed agents report it directly; hosted agents inherit it from the VM or service beneath them, which Wiz reports as UNDETERMINED until that host is checked. Undetermined is counted separately and never folded into \u201Cnot exposed\u201D.",drawnOn:["graph"],mark:()=>Vn("INTERNET_EXPOSURE"),count:t=>{let e=t.kpis;if(!e||e.internetExposed===void 0)return null;let s=Be(e.internetUnknown);return{n:Be(e.internetExposed),value:String(Be(e.internetExposed)),unit:"reachable"+(s?" \xB7 "+s+" undetermined":""),route:"graph",params:{kinds:"INTERNET_EXPOSURE"}}}},{id:"excessive-privilege",term:"EXCESSIVE_PRIVILEGE",aka:"excessive rights",family:"signal",blurb:"The identity an AI asset runs as holds admin or high-privilege permissions. The individual excessive-access and lateral-movement findings on those service accounts are synced and drawn beside the identity, but nothing totals them, so the figure here counts assets and identities carrying the flag.",drawnOn:["graph"],mark:()=>Vn("EXCESSIVE_PRIVILEGE"),count:t=>{let e=t.kpis;return!e||e.highPrivilege===void 0?null:{n:Be(e.highPrivilege),value:String(Be(e.highPrivilege)),unit:"carry a privilege flag",route:"graph",params:{kinds:"EXCESSIVE_PRIVILEGE"}}}},{id:"agentic-identity",term:"Agentic identity",aka:"a service account an agent runs as",family:"signal",blurb:"An identity whose purpose is to execute agent work rather than to represent a person. It is the join between an agent and everything that agent can reach, which is why over-broad rights on one turn any hijack into unauthorised action.",drawnOn:["graph","inventory"],mark:()=>Vn("SERVICE_ACCOUNT"),count:t=>{let e=t.kpis;return!e||e.agenticIdentities===void 0?null:{n:Be(e.agenticIdentities),value:String(Be(e.agenticIdentities)),unit:Be(e.agenticIdentities)===1?"agentic identity":"agentic identities",route:"inventory",params:{flags:"agentic"}}}},{id:"aars",term:"AARS",aka:"AI Asset Risk Score",family:"score",blurb:"One number per asset, 0 to 100, summed across four pillars and clamped. It is this app's own score, not a Wiz field: it prices what the sync collected, so the model that produces it is editable and its inputs are persisted beside every score.",drawnOn:["inventory","graph","aars"],mark:()=>Ys(78,"HIGH"),count:t=>{let e=t.kpis;return!e||e.criticalAars===void 0?null:{n:Be(e.criticalAars),value:String(Be(e.criticalAars)),unit:"assets score Critical",route:"inventory",params:{aarsSeverities:"CRITICAL"}}}},{id:"aars-band",term:"AARS band",aka:"the score's own severity",family:"score",blurb:"The level a score falls into. Bands are re-derived from the stored score on every read, so moving a threshold applies at once and retroactively \u2014 no re-sync, no rescore. Changing the POINT model is the other thing entirely, and strands the stored scores until they are recomputed.",drawnOn:["aars","inventory"],mark:()=>ze("HIGH"),fromSettings:!0,count:t=>{let e=t.boot.aarsRule;if(!e||!e.bands)return null;let s=["critical","high","medium","low"].map(n=>e.bands[n]).filter(n=>typeof n=="number");return s.length!==4?null:{n:s.length,value:s.join(" / "),unit:"thresholds in force",route:"aars",params:{}}}},{id:"pillar-a",term:"Pillar A",aka:"toxic-combination participation",family:"score",blurb:"Points for the combinations an asset is in, priced by the worst severity among them and lifted by a multiplier once there is more than one issue. How that multiplier scales is itself a choice: flat applies it once, log2 grows it with the issue count so a tenth issue still moves the number. Capped, so no single pillar can carry the whole score.",drawnOn:["aars"],mark:()=>o("span",{class:"pill neutral"},"A"),fromSettings:!0,count:t=>{let e=t.boot.aarsRule&&t.boot.aarsRule.pillarCaps;return!e||e.toxic===void 0?null:{n:Be(e.toxic),value:"cap "+Be(e.toxic),unit:"of 100",route:"aars",params:{}}}},{id:"pillar-b",term:"Pillar B",aka:"compliance gaps",family:"score",blurb:"Points for the framework codes an asset's failing findings violate, priced by an ORDERED cascade \u2014 first match wins, ending in a fallback for codes the codebook does not carry. Its quantity is order, not magnitude, which is why that pillar is the one edited as a table. How the matched prices COMBINE is a second choice: summing them pins most assets to the cap, because Wiz maps one underlying risk onto an OWASP LLM code and an ASI code and an ML title, so root-sum-square is offered to soften that triple charge and keep the pillar discriminating.",drawnOn:["aars","inventory"],mark:()=>o("span",{class:"pill neutral"},"B"),count:t=>{let e=t.kpis;return!e||e.complianceGaps===void 0?null:{n:Be(e.complianceGaps),value:String(Be(e.complianceGaps)),unit:"failing findings priced",route:"aars",params:{}}}},{id:"pillar-c",term:"Pillar C",aka:"data exposure",family:"score",blurb:"Points for what classified data the asset can reach, lifted by the 5Rs amplifier. The amplifier is the one number on the model that is not a policy choice \u2014 it is a systemic signal, so it applies to every data point regardless of asset. This pillar's ceiling is DERIVED (top tier through the amplifier) rather than set.",drawnOn:["aars"],mark:()=>o("span",{class:"pill neutral"},"C"),fromSettings:!0,count:t=>{let e=t.boot.aarsRule&&t.boot.aarsRule.pillarCaps;return!e||e.data===void 0?null:{n:Be(e.data),value:"cap "+Be(e.data),unit:"of 100",route:"aars",params:{}}}},{id:"pillar-d",term:"Pillar D",aka:"internet reachability",family:"score",blurb:"Points for whether the asset is reachable from the internet. Its three states are not a severity ramp: UNDETERMINED is an epistemic state, not a middling amount of exposure \u2014 Wiz reports it for a hosted agent because reachability is inherited from the host underneath and was never evaluated on the agent itself. It prices BELOW confirmed and ABOVE none, which is the honest reading of \u201Cthis needs checking\u201D, and it must never be collapsed into either neighbour.",drawnOn:["aars","graph"],mark:()=>o("span",{class:"pill neutral"},"D"),more:"Priced at zero in the spec rule, which scores exposure nowhere even though the graph draws it as a first-class node. The calibrated preset turns it on.",link:{label:"Open AARS Rules",route:"aars",params:{}}},{id:"gap-sources",term:"Gap sources",aka:"what may raise a gap",family:"score",blurb:"Separate from what a gap COSTS: which derivations are allowed to raise one at all. Every source is off by default, because switching one on re-prices assets and the applied table in the spec is normative for the default rule. They exist because three rows of the default cascade price codes nothing in the live pipeline emits \u2014 not shadowed, unreachable, with the signal each needs already in the sheets.",drawnOn:["aars"],mark:()=>o("span",{class:"pill neutral"},"\xB1"),link:{label:"Open AARS Rules",route:"aars",params:{}}},{id:"rescore",term:"Recompute scores",aka:"not a sync",family:"score",blurb:"Re-runs the enrichment over data already in the sheet and makes ZERO Wiz API calls. It writes no sync-history row, because a rescore is not a sync and the trend must not gain a point for an estate that never moved. Trend points carry the rule version they were scored under, so a threshold edit reads as a break rather than as movement.",drawnOn:["aars"],mark:()=>o("span",{class:"pill neutral"},"\u21BB"),link:{label:"Open AARS Rules",route:"aars",params:{}}},{id:"problem-tree",term:"Problem tree",aka:"ACT \xB7 Attend \xB7 Track \u2605 \xB7 Track",family:"score",blurb:"A 54-leaf decision tree \u2014 exploitation \xD7 technical impact \xD7 system exposure \xD7 mission \u2014 that routes one issue or finding into one of four queues, first match wins over an ordered cascade. It answers a different question than AARS: not a rank, a queue, and it is built so most leaves land in Track or Track \u2605 and only a documented, auditable minority reach Act. The AARS Rules page carries its editor on a second tab.",drawnOn:["aars","problems"],mark:()=>us("ACT"),link:{label:"Open the Problem tree tab",route:"aars",params:{}}},{id:"posture-tier",term:"Posture tier",aka:"a capability envelope, not a sum of problems",family:"score",blurb:"1 to 4, 4 worst \u2014 a first-match cascade over capability \xD7 containment \xD7 consequence, the same mechanism the Problem tree uses, aimed at a different question: not what has been FOUND on an asset, but what it could DO and what stands in its way. An agent with zero open issues and unrestricted access to sensitive data is not a low tier just because nothing has been found yet \u2014 this is th
