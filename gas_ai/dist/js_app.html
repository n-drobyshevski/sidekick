ep their number. A connector emitting 2026 codes into this cascade would be priced against the wrong risk \u2014 check the vintage before trusting a code.",entries:[["LLM01","Prompt Injection","Crafted input alters the model's behaviour, bypassing its instructions or safety rules."],["LLM02","Sensitive Information Disclosure","The model reveals PII, secrets or proprietary data in its output."],["LLM03","Supply Chain","Compromised third-party models, datasets, adapters or plugins enter the stack."],["LLM04","Data and Model Poisoning","Tampered training or fine-tuning data corrupts behaviour or plants a backdoor."],["LLM05","Improper Output Handling","Model output passes downstream unvalidated, enabling XSS, SSRF or code execution."],["LLM06","Excessive Agency","The model holds more permission, tooling or autonomy than its task needs."],["LLM07","System Prompt Leakage","The system prompt leaks, exposing secrets or the logic needed to bypass controls."],["LLM08","Vector and Embedding Weaknesses","Flaws in RAG vectors and embeddings leak data or inject content via retrieval."],["LLM09","Misinformation","The model emits confident, fabricated or wrong output that users act on."],["LLM10","Unbounded Consumption","Unmetered inference lets attackers drain cost and capacity, or extract the model."]]},{group:"OWASP Agentic (ASI)",vintage:"2026 edition",standing:"Published 1.0 (announced December 2025). It does NOT supersede the T-numbered list: \u201CAgentic AI \u2014 Threats and Mitigations\u201D is a parallel companion, updated to v1.1 in the same release and now running T1\u2013T17, not T1\u2013T15. The two are different layers \u2014 ASI is the ranked risk list, T is the granular attack pathway \u2014 and OWASP ships the official cross-map in ASI 2026 Appendix A. A scanner emitting T13 spans ASI10 and ASI04.",entries:[["ASI01","Agent Goal Hijack","Untrusted content redirects the agent's objective while it believes it serves the user."],["ASI02","Tool Misuse & Exploitation","Legitimate tools weaponised via deceptive input, poisoned metadata or unsafe chaining."],["ASI03","Identity & Privilege Abuse","Over-broad delegated credentials turn any hijack into unauthorised action."],["ASI04","Agentic Supply Chain Vulnerabilities","Compromised frameworks, MCP servers or tool schemas the agent dynamically trusts."],["ASI05","Unexpected Code Execution (RCE)","Agent-generated or agent-triggered code runs outside its sandbox or validation boundary."],["ASI06","Memory & Context Poisoning","Data planted in persistent memory or retrieval steers behaviour in later sessions."],["ASI07","Insecure Inter-Agent Communication","Agent-to-agent messages spoofed, replayed or tampered with for lack of auth."],["ASI08","Cascading Failures","One agent's error or compromise fans out through connected workflows at scale."],["ASI09","Human-Agent Trust Exploitation","Agents manipulate the human approval step by controlling what the reviewer is shown."],["ASI10","Rogue Agents","Agents operating outside policy while appearing legitimate, via drift or compromise."]]},{group:"OWASP ML",vintage:"draft v0.3",standing:"Still officially a draft and modified frequently. These codes are DERIVED \u2014 the sync builds ML_ plus the finding's title, so they carry no ordinal and the ML0n below is a mapping this page states, not one the data contains.",entries:[["ML_INPUT_MANIPULATION","Input Manipulation Attack (ML01)","Adversarial inputs perturbed just enough to force a wrong prediction."],["ML_DATA_POISONING","Data Poisoning Attack (ML02)","Training data tampered with so the model learns attacker-chosen behaviour."],["ML_MODEL_INVERSION","Model Inversion Attack (ML03)","Querying the model to reconstruct sensitive training records."],["ML_MEMBERSHIP_INFERENCE","Membership Inference Attack (ML04)","Determining whether a specific record was in the training set."],["ML_MODEL_THEFT","Model Theft (ML05)","Extracting or exfiltrating model weights or behaviour via queries or access."], :"implementation",measurementMethod:"Objective",goal:"How much of complianceGaps this app can attribute to a modeled AI asset \u2014 a fact about THIS APP's own graph coverage, not about Wiz's controls.",formula:"Open gaps whose resourceId is not a key in the current asset set.",dataSource:"ai_findings.resource_id, ai_assets.id",reportingFormat:"AI Inventory KPI row, beside complianceGaps.",revisionDue:"2027-08-13"},{id:"guardrail-coverage-pct",measure:"guardrailCoveragePct",type:"implementation",measurementMethod:"Objective",goal:"Share of SCANNED AI agents with no missing-guardrail finding raised \u2014 an absence of evidence, not a confirmed control, and reported beside the count the scan never reached rather than folded in with it.",formula:"protectedAgents (guardrailMissing === false) / (agents - guardrailUnknownAgents) \xD7 100, rounded; null when nothing was scanned.",dataSource:"ai_assets.guardrail_missing, ai_assets.kind",reportingFormat:"Wiz Scans coverage area, beside protectedAgents and guardrailUnknownAgents.",revisionDue:"2027-08-13"},{id:"posture-scope-split",measure:"posture tiers, withheld, out of scope",type:"implementation",measurementMethod:"Objective",goal:"How much of the register the posture lattice actually rates \u2014 and for the rest, which of the two reasons applies. Withheld is a coverage gap someone can close; out of scope says this lattice does not describe this kind of asset, and nothing can.",formula:"censusPostureTiers(nodes): tier counts (zeros kept) plus withheld, outOfScope and total, split on whether the node carries a posture vector at all.",dataSource:"sync_history.posture_tier_json, ai_assets.posture_tier, ai_assets.posture_input_json",reportingFormat:"Inventory posture header; the Posture column reason per row; the posture trend series.",revisionDue:"2027-08-13"},{id:"derivation-version-currency",measure:"derivation version, ledger vs code",type:"implementation",measurementMethod:"Objective",goal:"Whether the stored facts we dings.rule_short_id, ai_findings.rule_id",reportingFormat:"Priorities page's action list header and its cumulative-cover curve.",revisionDue:"2027-08-13"},{id:"landscape-reach-stages",measure:"Landscape reach stage ladder",type:"impact",measurementMethod:"Objective",goal:"What fraction of the AI landscape a sync actually touched, in paired counts \u2014 never a bare percentage, so a stage with nothing behind it (\u20180 of 22 attributed\u2019) cannot be misread as a clean result.",formula:"estateReach(...).stages: in register, observed, enriched, decided \u2014 each { covered, total } over the AI-kinded register. Four, not five: business-impact tagging left the ladder (it arrives on the inventory hop, so it does not depend on the stages above it), and \u2018decided\u2019 no longer accepts a bare AARS score, which every AI-kinded asset carries and which made the stage a permanent 100%.",dataSource:"ai_assets.kind, ai_assets.worst_open_problem, ai_edges.type, ai_assets.exposure_evidence_json, ai_assets.human_access_json, ai_issues.status, ai_findings.result",reportingFormat:"Wiz Scans page, Landscape reach section; AI Inventory headline card.",revisionDue:"2027-08-13"},{id:"landscape-impact-tagged",measure:"Impact-tagged share",type:"implementation",measurementMethod:"Objective",goal:"How much of the AI register carries a Wiz business-impact tier \u2014 the tenant's project-tagging discipline, not this pipeline's reach. It sat in the reach ladder until a live tenant printed 95% of it above 1% observed.",formula:"estateReach(...).impactTagged: AI-kinded rows with a non-empty business_impact, over all AI-kinded rows.",dataSource:"ai_assets.business_impact, ai_assets.kind",reportingFormat:"Wiz Scans page, Landscape reach section \u2014 beside the ladder, not in it.",revisionDue:"2027-08-13"},{id:"sync-step-yield",measure:"Rows returned per sync step",type:"implementation",measurementMethod:"Objective",goal:"Tell a step that ran and matched nothing apart from a step that was never reached. The skipped list records refusals and the truncated list records page caps; a step the tenant accepts that returns zero rows was in neither.",formula:"Raw response rows per step id, summed across pages and resume hops, persisted with the commit. Present with 0 means ran-and-empty; absent means not recorded.",dataSource:"settings.key / settings.value_json \u2014 the settings tab is a key/value store, and this reading lives under the last_step_rows key, beside last_skipped_steps and last_truncated_steps.",reportingFormat:"Wiz Scans page, each area's drill-down \u2014 a pill beside the existing skipped and truncated pills.",revisionDue:"2027-08-13"},{id:"landscape-reach-edge-census",measure:"Edge census",type:"implementation",measurementMethod:"Objective",goal:"Which of the 23 declared graph relationship types this deployment has ever populated \u2014 a dead type quietly removes a class of question the graph looks able to answer.",formula:"estateReach(...).edges: ai_edges.type censused against EDGE_TYPES, the same logic registerScopeDiagnostic already runs by hand.",dataSource:"ai_edges.type",reportingFormat:"Wiz Scans page, Landscape reach section's edge census.",revisionDue:"2027-08-13"},{id:"landscape-reach-axis-known-rate",measure:"Per-axis known %",type:"implementation",measurementMethod:"Objective",goal:"THE SAME WARNING AS Per-axis unknown rate, restated positively: a high known% does NOT mean the landscape is safe \u2014 it means the decision tree cannot prioritise on that axis until it does not. An empty population reads 0%, never a false 100%.",formula:"1 \u2212 treeDiscrimination(decided).unknownRate per axis, inverted at reach.ts's own boundary; 0 when nothing has ever been decided.",dataSource:"ai_issues.problem_input_json, ai_findings.problem_input_json",reportingFormat:"Wiz Scans page, Landscape reach section's axis-coverage panel.",revisionDue:"2027-08-13"}];var v0=[{id:"graph",title:"Reading the graph"},{id:"signal",title:"Risk signa table a ROW IS A PATH, not an asset: an agent bound to two service accounts is two rows carrying the same name, and every shown step adds a group of columns rather than a column. The eye keeps a step in the traversal but drops its columns, an optional step keeps rows that would otherwise be dropped with the group left empty, and NOT asserts the relationship is absent \u2014 which is how you ask for an agent with no guardrail. The pickers only offer relationships this tenant's graph actually holds, so a query that can match nothing is hard to build.",drawnOn:["graph"],mark:()=>n("span",{class:"pill neutral"},"FIND"),link:{label:"Open the graph",route:"graph",params:{}}},{id:"depth-budget",term:"Depth and node budget",aka:"what bounds a view",family:"graph",blurb:"Depth bounds how far the traversal walks from its starting points. The node budget is a hard ceiling on one view, counting the collapse stubs it also draws. Both keep the server payload light; a view that hits the ceiling says so and offers Load more, which widens that one view without changing the default.",drawnOn:["graph","settings"],mark:()=>n("span",{class:"pill neutral"},"budget"),fromSettings:!0,count:e=>{let t=e.boot.settings;return t?{n:ze(t.maxNodes),value:"depth "+ze(t.defaultDepth)+" \xB7 "+ze(t.maxNodes),unit:"nodes per view",route:"settings",params:{tab:"graph"}}:null}},{id:"summary-stub",term:"The collapse stub",aka:"\u201C+N more\u201D",family:"graph",blurb:"A high-fanout neighbour set collapsed into one pill, which expands on demand. The stub counts against the node budget like any other node, which is why a capped view still shows them: the budget buys paths, not a field of disconnected dots.",drawnOn:["graph"],mark:()=>ia("SUMMARY"),link:{label:"Open the graph",route:"graph",params:{}}},{id:"missing-guardrail",term:"MISSING_GUARDRAIL",aka:"\u201Cno guardrail\u201D",family:"signal",blurb:"No guardrail is attached to this agent or model. Wiz tests the PROTECTED_BY relationship on every agent, and an absent edge raises this node. It is the strongest single amplifier in the toxic combinations.",drawnOn:["graph","inventory"],mark:()=>ia("MISSING_GUARDRAIL"),count:e=>{let t=e.kpis;if(!t||t.protectedAgents===void 0||!t.agents)return null;let s=ze(t.agents)-ze(t.protectedAgents);return{n:s,value:s+" of "+ze(t.agents),unit:"agents unprotected",route:"inventory",params:{flags:"guardrail"}}}},{id:"data-finding",term:"DATA_FINDING",aka:"what Wiz found in the data",family:"signal",blurb:"Wiz's DSPM verdict on one bucket or database \u2014 what class of sensitive data is in it, and how severe. Drawn as one node per datastore carrying the count, because a store with two hundred findings is one fact about that store, not two hundred nodes. These are what turn \u201Cthis agent can reach sensitive data\u201D into a path you can walk: agent \u2192 execution identity \u2192 datastore \u2192 findings.",drawnOn:["graph"],mark:()=>ia("DATA_FINDING"),count:e=>{let t=e.kpis;return!t||t.dataFindings===void 0?null:{n:ze(t.dataFindings),value:String(ze(t.dataFindings)),unit:ws(ze(t.dataFindings),"finding")+" on reachable stores",route:"graph",params:{kinds:"DATA_FINDING"}}}},{id:"sensitive-data",term:"SENSITIVE_DATA",aka:"classified-data reach, unresolved",family:"signal",blurb:"The FALLBACK marker: Wiz says this asset can reach data classified as PII, PHI or PCI, but no path to the store could be walked \u2014 the tenant rejected the traversal, or the grant is expressed some way it does not follow. Where the path IS walkable the chain is drawn instead and this marker is suppressed, so one asset never tells the same story twice. Its mark is the data-finding gem, left unfinished.",drawnOn:["graph"],mark:()=>ia("SENSITIVE_DATA"),count:e=>{let t=e.kpis;return!t||t.sensitiveAccess===void 0?null:{n:ze(t.sensitiveAccess),value:String(ze(t.sensitiveAccess)),unit:"AI "+ws(ze(t.sensitiveAccess),"asset")+" reach it",route:"graph",params:{kinds:"SENSITIVE_DATA"}}}},{id:"internet-exposure",term:"INTERNET_EXPOSURE",aka:"network reachability",family:"signal",blurb:"The asset or the host underneath it is reachable from the internet. Managed agents report it directly; hosted agents inherit it from the VM or service beneath them, which Wiz reports as UNDETERMINED until that host is checked. Undetermined is counted separately and never folded into \u201Cnot exposed\u201D.",drawnOn:["graph"],mark:()=>ia("INTERNET_EXPOSURE"),count:e=>{let t=e.kpis;if(!t||t.internetExposed===void 0)return null;let s=ze(t.internetUnknown);return{n:ze(t.internetExposed),value:String(ze(t.internetExposed)),unit:"reachable"+(s?" \xB7 "+s+" undetermined":""),route:"graph",params:{kinds:"INTERNET_EXPOSURE"}}}},{id:"excessive-privilege",term:"EXCESSIVE_PRIVILEGE",aka:"excessive rights",family:"signal",blurb:"The identity an AI asset runs as holds admin or high-privilege permissions. The individual excessive-access and lateral-movement findings on those service accounts are synced and drawn beside the identity, but nothing totals them, so the figure here counts assets and identities carrying the flag.",drawnOn:["graph"],mark:()=>ia("EXCESSIVE_PRIVILEGE"),count:e=>{let t=e.kpis;return!t||t.highPrivilege===void 0?null:{n:ze(t.highPrivilege),value:String(ze(t.highPrivilege)),unit:"carry a privilege flag",route:"graph",params:{kinds:"EXCESSIVE_PRIVILEGE"}}}},{id:"agentic-identity",term:"Agentic identity",aka:"a service account an agent runs as",family:"signal",blurb:"An identity whose purpose is to execute agent work rather than to represent a person. It is the join between an agent and everything that agent can reach, which is why over-broad rights on one turn any hijack into unauthorised action.",drawnOn:["graph","inventory"],mark:()=>ia("SERVICE_ACCOUNT"),count:e=>{let t=e.kpis;return!t||t.agenticIdentities===void 0?null:{n:ze(t.agenticIdentities),value:String(ze(t.agenticIdentities)),unit:ze(t.agenticIdentities)===1?"agentic identity":"agentic identities",route:"inventory",params:{flags:"agentic"}}}},{id:"aars",term:"Findings score",aka:"AARS \u2014 the identifier every column and route still uses",family:"score",blurb:"One number per asset, 0 to 100, summed across four pillars and clamped. It is this app's own score, not a Wiz field: it prices what the sync collected, so the model that produces it is editable and its inputs are persisted beside every score. It counts what has already been FOUND \u2014 issues, compliance gaps, data exposure \u2014 which is why it is not called a risk score; forward-looking consequence is the posture tier's job. The raw number is only meaningful against the other assets, which is why the Scoring Models page reads it as a distribution rather than one asset at a time. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>so(78,"HIGH"),count:e=>{let t=e.kpis;return!t||t.aarsScored===void 0?null:{n:ze(t.aarsScored),value:String(ze(t.aarsScored)),unit:"assets scored",route:"inventory",params:{}}}},{id:"aars-band",term:"Findings score level",aka:"context beside a score, not a verdict",family:"score",blurb:"The level a score falls into. Bands are re-derived from the stored score on every read, so moving a threshold applies at once and retroactively \u2014 no re-sync, no rescore. Changing the POINT model is the other thing entirely, and strands the stored scores until they are recomputed. A level is not a queue: on this landscape the top one holds most of the scored assets and two hold none, so it is drawn tinted only on the AARS Rules page, where the thresholds themselves are the subject, and plain everywhere else. Its two honest readings are the distribution the trend charts over time and the occupancy the rule editor reports. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>at("HIGH"),fromSettings:!0,count:e=>{let t=e.boot.aarsRule;if(!t||!t.bands)return null;let s=["critical","high","medium","low"].map(a=>t.bands[a]).filter(a=>typeof a=="number");return s.length!==4?null:{n:s.length,value:s.join(" / "),unit:"thresholds in force",route:"aars",params:{}}}},{id:"pillar-a",term:"Pillar A",aka:"toxic-combination participation",family:"score",blurb:"Points for the combinations an asset is in, priced by the worst severity among them and lifted by a multiplier once there is more than one issue. How that multiplier scales is itself a choice: flat applies it once, log2 grows it with the issue count so a tenth issue still moves the number. Capped, so no single pillar can carry the whole score. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"A"),fromSettings:!0,count:e=>{let t=e.boot.aarsRule&&e.boot.aarsRule.pillarCaps;return!t||t.toxic===void 0?null:{n:ze(t.toxic),value:"cap "+ze(t.toxic),unit:"of 100",route:"aars",params:{}}}},{id:"pillar-b",term:"Pillar B",aka:"compliance gaps",family:"score",blurb:"Points for the framework codes an asset's failing findings violate, priced by an ORDERED cascade \u2014 first match wins, ending in a fallback for codes the codebook does not carry. Its quantity is order, not magnitude, which is why that pillar is the one edited as a table. How the matched prices COMBINE is a second choice: summing them pins most assets to the cap, because Wiz maps one underlying risk onto an OWASP LLM code and an ASI code and an ML title, so root-sum-square is offered to soften that triple charge and keep the pillar discriminating. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"B"),count:e=>{let t=e.kpis;return!t||t.complianceGaps===void 0?null:{n:ze(t.complianceGaps),value:String(ze(t.complianceGaps)),unit:"failing findings priced",route:"aars",params:{}}}},{id:"pillar-c",term:"Pillar C",aka:"data exposure",family:"score",blurb:"Points for what classified data the asset can reach, lifted by the 5Rs amplifier. The amplifier is the one number on the model that is not a policy choice \u2014 it is a systemic signal, so it applies to every data point regardless of asset. This pillar's ceiling is DERIVED (top tier through the amplifier) rather than set. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"C"),fromSettings:!0,count:e=>{let t=e.boot.aarsRule&&e.boot.aarsRule.pillarCaps;return!t||t.data===void 0?null:{n:ze(t.data),value:"cap "+ze(t.data),unit:"of 100",route:"aars",params:{}}}},{id:"pillar-d",term:"Pillar D",aka:"internet reachability",family:"score",blurb:"Points for whether the asset is reachable from the internet. Its three states are not a severity ramp: UNDETERMINED is an epistemic state, not a middling amount of exposure \u2014 Wiz reports it for a hosted agent because reachability is inherited from the host underneath and was never evaluated on the agent itself. It prices BELOW confirmed and ABOVE none, which is the honest reading of \u201Cthis needs checking\u201D, and it must never be collapsed into either neighbour. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"D"),more:"Priced at zero in the spec rule, which scores exposure nowhere even though the graph draws it as a first-class node. The calibrated preset turns it on.",link:{label:"Open Scoring Models",route:"aars",params:{}}},{id:"gap-sources",term:"Gap sources",aka:"what may raise a gap",family:"score",blurb:"Separate from what a gap COSTS: which derivations are allowed to raise one at all. Every source is off by default, because switching one on re-prices assets and the applied table in the spec is normative for the default rule. They exist because three rows of the default cascade price codes nothing in the live pipeline emits \u2014 not shadowed, unreachable, with the signal each needs already in the sheets. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"\xB1"),link:{label:"Open Scoring Models",route:"aars",params:{}}},{id:"rescore",term:"Recompute scores",aka:"not a sync",family:"score",blurb:"Re-runs the enrichment over data already in the sheet and makes ZERO Wiz API calls. It writes no sync-history row, because a rescore is not a sync and the trend must not gain a point for a landscape that never moved. Trend points carry the rule version they were scored under, so a threshold edit reads as a break rather than as movement. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"\u21BB"),link:{label:"Open Scoring Models",route:"aars",params:{}}},{id:"problem-tree",term:"Problem tree",aka:"ACT \xB7 Attend \xB7 Track* \xB7 Track",family:"score",blurb:"A 54-leaf decision tree \u2014 exploitation \xD7 technical impact \xD7 system exposure \xD7 mission \u2014 that routes one issue or finding into one of four queues, first match wins over an ordered cascade. It answers a different question than the findings score: not a rank, a queue, and it is built so most leaves land in Track or Track* and only a documented, auditable minority reach Act. The AARS Rules page carries its editor on a second tab. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>$s("ACT"),link:{label:"Open the Problem tree tab",route:"aars",params:{}}},{id:"posture-tier",term:"Posture tier",aka:"a capability envelope, not a sum of problems",family:"score",blurb:"1 to 4, 4 worst \u2014 a first-match cascade over capability \xD7 containment \xD7 consequence, the same mechanism the Problem tree uses, aimed at a different question: not what has been FOUND on an asset, but what it could DO and what stands in its way. An agent with zero open issues and unrestricted access to sensitive data is not a low tier just because nothing has been found yet \u2014 this is the one reading on the Inventory that is not an aggregate of the findings score or of the Problem tree's outcomes, deliberately drawn beside them rather than blended in. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>oa(4),link:{label:"Open the Posture tab",route:"aars",params:{}}},{id:"posture-axes",term:"Capability \xB7 containment \xB7 consequence",aka:"the posture lattice's three axes",family:"score",blurb:"Capability: identity power and data reach (BROAD/SCOPED/MINIMAL). Containment: how much stands between the asset and the outside world (WEAK/PARTIAL/STRONG) \u2014 a clear guardrail scan alone reads PARTIAL, never STRONG, until a confirmed non-exposure corroborates it. Consequence: what a realized failure would cost (SEVERE/MODERATE/LIMITED). 27 cells; a lethal-trifecta row (private data reach \u2227 untrusted-content ingress \u2227 external egress) sits first in the default cascade and is reported UNREACHABLE rather than fed a guess \u2014 this app has no live signal for two of its three legs. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"27"),link:{label:"Open the Posture tab",route:"aars",params:{}}},{id:"priorities-rank",term:"The Priorities ranking",aka:"issues \u222A findings, one queue",family:"score",blurb:"Every unresolved issue and every open configuration finding, unioned into one list and ranked on one scale \u2014 the thing neither Toxic Combinations (one pattern) nor Cloud Configuration (findings only) can show. Worst-first at five levels: the Problem tree's outcome, then the asset's posture tier, then how soon it is due, then the amplification vector (identity power, data reach, whether language is the control channel), then id for stability. Nothing in the union is ever dropped for lacking a verdict \u2014 a row the tree never reached still gets a place, ranked last. EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it.",drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"1\u20135"),link:{label:"Open Priorities",route:"problems",params:{}}},{id:"open-issues",term:"Open issues",aka:"the count the register ranks by",family:"score",blurb:"How many unresolved Wiz issues are attached to this asset \u2014 OPEN and IN_PROGRESS both, because an issue somebody has started is still open work. It is a count of things Wiz reported, not a grade this app computed, which is why it is the register's default sort and the graph's neighbour ordering. The bar beside it splits the same issues by severity, so one stray High and a pile of them do not draw the same mark.",drawnOn:["inventory","graph","combos","problems"],mark:()=>n("span",{class:"num"},"4"),count:e=>{let t=e.kpis;return!t||t.openIssues===void 0?null:{n:ze(t.openIssues),value:String(ze(t.openIssues)),unit:"open issues",route:"inventory",params:{}}}},{id:"cloud-findings",term:"Cloud findings",aka:"failing configuration findings, per asset",family:"score",blurb:"Failing cloud-configuration findings evaluated against this asset \u2014 the one definition of a failing control this app has: result FAIL, status OPEN, not tombstoned. MOST FINDINGS BELONG TO NO ASSET. They are evaluated against a region, an access policy or a service account no agent runs as, none of which the AI inventory holds, so this column reads lower than the register's total by design and the inventory header says how many are off-inventory.",drawnOn:["inventory","graph","config"],mark:()=>n("span",{class:"num"},"2"),count:e=>{let t=e.kpis;return!t||t.complianceGaps===void 0?null:{n:ze(t.complianceGaps),value:String(ze(t.complianceGaps)),unit:"failing controls",route:"config",params:{}}}},{id:"posture-fails",term:"Compliance posture fails",aka:"distinct policies with a failing evaluation",family:"score",blurb:"How many framework policies have at least one failing evaluation, deduped by policy id \u2014 one control mapped to six subcategories is one thing to fix, not six \u2014 and counted over the rules judged AI-relevant. IT HAS NO PER-ASSET GRAIN AND NEVER WILL: Wiz reports posture per framework, category, subcategory and policy, never per resource, so there is no such thing as one asset's posture fails. It appears in page headers and in no table column.",drawnOn:["inventory","compliance"],mark:()=>n("span",{class:"num"},"5"),count:e=>{let t=e.kpis&&e.kpis.frameworkPosture;return!t||!t.frameworks?null:{n:ze(t.failingPolicies),value:String(ze(t.failingPolicies)),unit:"failing policies",route:"compliance",params:{}}}},{id:"rank-terms",term:"Priorities rank terms",aka:"rule \xB7 clock \xB7 exploitation \xB7 adjacency",family:"score",blurb:"The four readings the Priorities rank score blends, each edited on Settings' Register tab and each optional. RULE: the operator's own judgement that a source rule matters this much, unset by default. CLOCK: due-date urgency, or \u2014 once a preset
