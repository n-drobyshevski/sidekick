ars"],mark:()=>n("span",{class:"pill neutral"},"D"),more:"Priced at zero in the spec rule, which scores exposure nowhere even though the graph draws it as a first-class node. The calibrated preset turns it on.",link:{label:"Open Scoring Models",route:"aars",params:{}}},{id:"gap-sources",term:"Gap sources",aka:"what may raise a gap",family:"score",lines:["EXPERIMENTAL. Which derivations may raise a gap at all \u2014 not what a gap COSTS.","Every source is off by default, because switching one on re-prices assets.","The applied table in the spec is normative for the default rule.","They exist because three rows of the default cascade price codes nothing in the live pipeline emits \u2014 not shadowed, unreachable, with the signal each needs already in the sheets.","EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it."],drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"\xB1"),link:{label:"Open Scoring Models",route:"aars",params:{}}},{id:"rescore",term:"Recompute scores",aka:"not a sync",family:"score",lines:["EXPERIMENTAL. Re-runs enrichment over the sheet and makes ZERO Wiz API calls.","It writes no sync-history row, because a rescore is not a sync.","The trend must not gain a point for a landscape that never moved.","Trend points carry the rule version they were scored under, so a threshold edit reads as a break rather than as movement.","EXPERIMENTAL, and confined to the Scoring Models page: it is computed and stored on every sync, but nothing else in this app ranks, filters or sorts by it."],drawnOn:["aars"],mark:()=>n("span",{class:"pill neutral"},"\u21BB"),link:{label:"Open Scoring Models",route:"aars",params:{}}},{id:"problem-tree",term:"Problem tree",aka:"ACT \xB7 Attend \xB7 Track* \xB7 Track",family:"score",lines:["EXPERIMENTAL. A 54-leaf decision tree routing one issue into one of four queues.","Not a rank, a queue \u2014 which is the question the ch optional.","RULE: the operator's own judgement that a source rule matters this much, unset by default.","CLOCK: due-date urgency, or \u2014 once a preset turns on the fallback \u2014 a row's age when it carries no due date.","EXPLOITATION: a ladder folded up from an issue's linked findings \u2014 on the CISA KEV catalog, an exploit exists, EPSS clears a threshold, or none observed \u2014 where 'none' reads mid-low rather than zero, because an observed absence is still a measurement.","ADJACENCY: how close the row sits to the AI estate, direct, adjacent, or UNLINKED \u2014 read as 'no known link', never 'unrelated', because attribution edges are sparse and an unlinked row is mostly a statement about how far the attribution pass has reached, not a claim the row has nothing to do with AI.","A term nobody could measure on a given row LEAVES THE BLEND rather than scoring zero, so a sparsely-attributed row is never sunk to the floor for lacking a reading the register never took.","The shipped weights and every preset are a starting point for an evaluation harness to move, not a final answer."],drawnOn:["settings"],mark:()=>n("span",{class:"pill neutral"},"4 terms"),link:{label:"Open Settings \u2192 Register",route:"settings",params:{tab:"register"}}},{id:"rank-leads-sort",term:"Rank leads the Priorities order",aka:"rank_leads_sort",family:"score",lines:["Off by default: Priorities orders by Wiz severity, then due date, then age, then id.","On: the blended rank score leads instead, worst first.","The iron rule applies here too, so a model's own number does not lead the register until an evaluation harness's own figures say it should.","A row the model could not score sorts last and falls through to the same four levels beneath it, so nothing in the queue is ever dropped for lacking a rank.","The toggle lives on Settings' Register tab beside the terms it would put in charge."],drawnOn:["settings"],mark:()=>n("span",{class:"pill neutral"},"off by default"),link:{label:"Open Settings \u2192 Register",route:"settings",params:{tab:"register"}}},{id:"priorities-order",term:"The Priorities order",aka:"worst severity, then soonest due, then oldest",family:"score",lines:["Worst-first, four levels: severity, then due date, then age, then id.","Wiz's own severity leads \u2014 the loudest fact about a problem this app did not invent.","Overdue counts as soonest and no deadline sorts last; age runs oldest first; id makes two rows that agree on the first three sort the same way every time.","This is the order the page has always used.",'Settings\' "Rank leads the Priorities order" can put the blended rank score in charge instead \u2014 off by default \u2014 and that entry says what changes and why the switch exists.'],drawnOn:["problems"],mark:()=>n("span",{class:"pill neutral"},"1\u20134")},{id:"severity",term:"Severity",aka:"six levels",family:"severity",lines:["Critical, High, Medium, Low, Info, Unknown.","Unknown is a local normalisation bucket, never a value the API returns.","Every severity on every screen is a coloured DOT plus the level WORD \u2014 the red, orange and amber sit close enough together that the redundant cue is load-bearing, not decorative."],drawnOn:["combos","inventory","graph","problems","config","compliance"],mark:()=>ut("CRITICAL"),count:e=>{let t=e.boot.counts;return!t||t.openIssues===void 0?null:{n:Je(t.openIssues),value:String(Je(t.openIssues)),unit:"open "+Es(Je(t.openIssues),"issue"),route:"combos",params:{}}}},{id:"adjusted-severity",term:"Adjusted severity",aka:"versus native",family:"severity",lines:["What the 5Rs amplifier re-rates an issue to when the asset fails a data control.","The NATIVE severity Wiz returned sits beside it, never instead of it.","So an adjusted figure can always be traced back to what the scanner actually said."],drawnOn:["combos","inventory"],mark:()=>ut("MEDIUM"),count:e=>{let t=e.digest&&e.digest.totals;return!t||t.reRated===void 0?null:{n:Je(t.reRated),value:Je(t.reRated)+" of "+Je( nges what every one of those figures counts, not how many rows it holds \u2014 and the stored register keeps counting the OLD categories until the next sync applies the new one."],drawnOn:["settings","scans","problems"],mark:()=>Ie("neutral","Scope"),link:{label:"Open Settings \u2192 Register",route:"settings",params:{tab:"register"}}},{id:"first-seen",term:"First seen by this register",aka:"the ledger's own birth date, not Wiz's",family:"lifecycle",lines:["The first sync that returned this issue.","This register's OWN observation, deliberately not Wiz's created date.","An issue can have existed in the tenant for a year before the first sync here looked, and every lifecycle figure on this page measures from the date a sync recorded.","Nothing backfills it \u2014 a row that predates the ledger has no earlier sighting to claim, and inventing one would be a measurement nobody took."],drawnOn:["combos","inventory","config","problems"],mark:()=>Ie("neutral","First seen")},{id:"movement",term:"Movement",aka:"how the open backlog changed between two syncs",family:"lifecycle",lines:["The open backlog now against what it was at an earlier sync.","It needs TWO syncs before it can say anything, and seven days for the week-ago row.","Replayed from the transition counts each sync recorded, never from two independently stored totals. Until then the page says so rather than showing a difference of nothing.","Findings are not counted here: they never enter the lifecycle ledger, so no sync has ever recorded one arriving or leaving."],drawnOn:["data","problems"],mark:()=>Ie("neutral","\xB1")},{id:"disappearance",term:"Gone by",aka:"a departure dated by absence",family:"lifecycle",lines:["Wiz never says an issue was fixed, so a departure is dated by the first sync to miss it.","An UPPER BOUND whose error is the interval between syncs.","An issue closed the morning after a Monday sync is dated Tuesday.","It is also the reason a longer gap between syncs makes every departure look later
