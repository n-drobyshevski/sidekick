s the two vintages, and two pairs effectively swap: 2025 LLM03 Supply Chain \u2192 2026 LLM04, while 2026 LLM03 is Excessive Agency (2025 LLM06); 2025 LLM05 Improper Output Handling \u2192 2026 LLM10, while 2026 LLM05 is Data and Model Poisoning (2025 LLM04); 2025 LLM07 System Prompt Leakage \u2192 2026 LLM08, renamed Hidden Context Exposure; 2025 LLM10 Unbounded Consumption \u2192 2026 LLM06. Only LLM01 and LLM02 keep their number. A connector emitting 2026 codes into this cascade would be priced against the wrong risk \u2014 check the vintage before trusting a code.",entries:[["LLM01","Prompt Injection","Crafted input alters the model's behaviour, bypassing its instructions or safety rules."],["LLM02","Sensitive Information Disclosure","The model reveals PII, secrets or proprietary data in its output."],["LLM03","Supply Chain","Compromised third-party models, datasets, adapters or plugins enter the stack."],["LLM04","Data and Model Poisoning","Tampered training or fine-tuning data corrupts behaviour or plants a backdoor."],["LLM05","Improper Output Handling","Model output passes downstream unvalidated, enabling XSS, SSRF or code execution."],["LLM06","Excessive Agency","The model holds more permission, tooling or autonomy than its task needs."],["LLM07","System Prompt Leakage","The system prompt leaks, exposing secrets or the logic needed to bypass controls."],["LLM08","Vector and Embedding Weaknesses","Flaws in RAG vectors and embeddings leak data or inject content via retrieval."],["LLM09","Misinformation","The model emits confident, fabricated or wrong output that users act on."],["LLM10","Unbounded Consumption","Unmetered inference lets attackers drain cost and capacity, or extract the model."]]},{group:"OWASP Agentic (ASI)",vintage:"2026 edition",standing:"Published 1.0 (announced December 2025). It does NOT supersede the T-numbered list: \u201CAgentic AI \u2014 Threats and Mitigations\u201D is a parallel companion, updated to v1.1 in the same release and now
