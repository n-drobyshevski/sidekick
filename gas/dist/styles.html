  font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none;
  color: var(--text-3);
}
.rule-card__remove, .cond-remove {
  min-height: 0; padding: 2px 7px; font-size: 12px; line-height: 1;
  background: none; border: 1px solid transparent; box-shadow: none;
  color: var(--text-3); border-radius: var(--radius-sm);
}
.rule-card__remove:hover, .cond-remove:hover {
  background: rgba(0, 0, 0, 0.05); color: var(--ink); border-color: var(--hairline);
}

/* OR divider between rule cards: a centered chip on a hairline (the rules are OR-ed). */
.rule-or { display: flex; align-items: center; gap: 10px; margin: 10px 2px; }
.rule-or::before, .rule-or::after {
  content: ""; flex: 1; height: 1px; background: var(--hairline);
}
.rule-or__chip {
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--text-3);
}

/* Condition row: a fixed IF/AND connector + type select on line one; the fields wrap to
   their own line, indented under the select, so tag / regex / value-picker all align. */
.cond-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.cond-conn {
  flex: 0 0 auto; min-width: 30px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: var(--text-3);
}
.cond-row select { min-height: 32px; }
.cond-remove { margin-left: auto; }
.cond-fields {
  flex: 1 1 100%; margin-left: 38px;
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
}
.cond-fields input { min-height: 32px; }

/* Dashed "add" affordances (real buttons, not text links). */
.btn-add, .add-rule-btn {
  font-weight: 600; color: var(--text-2);
  background: var(--page); border: 1px dashed var(--hairline); box-shadow: none;
}
.btn-add:hover, .add-rule-btn:hover {
  background: var(--surface); border-color: var(--text-3); color: var(--ink);
}
.btn-add { margin-top: 2px; min-height: 30px; padding: 4px 12px; font-size: 12px; }
.add-rule-btn { margin-top: 12px; width: 100%; min-height: 36px; font-size: 13px; }

/* Pinned live-match preview between the scrolling rules and the Cancel/Apply actions. */
dialog.domains-dialog .dialog-preview {
  flex: 0 0 auto; padding: 12px 20px; border-top: 1px solid var(--hairline);
}
.rule-preview {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  min-height: 36px; padding: 8px 12px;
  background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius-md);
}
.rule-preview__text { min-width: 0; }

/* Value picker polish: hover on selectable rows; the "in <domain>" owner reads as a chip. */
.sub-picker label { padding: 3px 6px; border-radius: var(--radius-sm); }
.sub-picker label:hover:not(.claimed) { background: var(--surface); }
.sub-owner {
  background: rgba(0, 0, 0, 0.06); border-radius: var(--radius-sm); padding: 1px 6px;
}

/* Attribution: a table that runs edge-to-edge inside a .settings-panel card (cancels the
   panel's 20px horizontal padding and drops the wrap's side borders) — a "card with a title
   and a full-bleed table" instead of a card-border-around-a-table-border double frame. */
.settings-panel .panel-flush {
  margin: 4px -20px 0; border-left: none; border-right: none; border-radius: 0;
}

/* --------------------------------------------------------------- reduced motion */
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ------------------------------------------------------- program performance page */
/* Coverage / efficiency / capacity. Deliberately the quietest page in the app: every
   figure here is a count or a rate, none of them is a severity, so the Rationed Ink rule
   says none of them gets colour. Hierarchy comes from size, position, and hairlines. */

/* The uncertainty range beside a rate, and the "1 in N" gloss under a close rate: a step
   down from the figure it qualifies, so it reads as a qualifier rather than a second number. */
.prog-range {
  font-size: 0.72em;
  font-weight: 500;
  color: var(--text-3);
  margin-left: 8px;
  letter-spacing: 0;
}

/* A short explanatory line under a section. Prose measure, not full bleed. */
.note {
  font-size: 12px;
  color: var(--text-3);
  max-width: 78ch;
  margin: 8px 0 0;
  line-height: 1.5;
}
.note--warn {
  color: var(--text-2);
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

/* The confusion matrix. Row headers carry the classification, column headers the outcome,
   so each cell's meaning is readable from its position alone — no colour coding. */
.prog-matrix th[scope="row"] {
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
}
.prog-matrix td { padding: 0; }
.prog-matrix td:last-child { padding: 10px 12px; }
/* The unclassified row sits below a heavier rule: outside the 2x2, not a fifth quadrant. */
.prog-unknown-row > * { border-top: 2px solid var(--hairline); }
.prog-unknown-row th[scope="row"] { color: var(--text-2); font-weight: 500; }

/* Each matrix cell is a button into the findings behind it — the drill-down that makes the
   count checkable. Full-bleed inside its td so the whole cell is the hit target. */
.prog-cell {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 100%;
  padding: 10px 12px;
  background: none;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  text-align: left;
  cursor: pointer;
  min-height: 0;
  height: auto;
}
.prog-cell:hover:not(:disabled) { background: var(--surface-1, rgba(0, 0, 0, 0.03)); }
.prog-cell:disabled { cursor: default; opacity: 0.55; }
.prog-cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.prog-cell-count { font-size: 1.25rem; font-weight: 600; line-height: 1.1; }
.prog-cell-word { font-size: 12px; color: var(--text-3); }
/* TP/FP/FN/TN kept as a subordinate tag beside the plain-English label — present for the
   reader who knows the shorthand, never the only cue for the reader who doesn't. */
.prog-cell-abbr {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text-3);
  border: 1px solid var(--hairline);
  border-radius: 3px;
  padding: 0 4px;
  margin-right: 6px;
}

/* The classifier card: the rule as a sentence, then its clauses with their hit counts. */
.prog-rule-card {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-xl);
  padding: 16px;
  box-shadow: var(--shadow-card);
  margin-bottom: 16px;
}
.prog-rule-sentence { margin: 0 0 10px; font-size: 14px; }
.prog-clauses { list-style: none; margin: 0; padding: 0; }
.prog-clauses li {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 6px 0;
  border-top: 1px solid var(--hairline);
  font-size: 13px;
}
.prog-clause-name { flex: 1; }

/* Methodology block — always present, closed by default, prose-width. */
.prog-method {
  margin: 28px 0 8px;
  border-top: 1px solid var(--hairline);
  padding-top: 14px;
}
.prog-method > summary {
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
}
.prog-method > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.prog-method-list { margin: 14px 0 0; max-width: 78ch; font-size: 13px; }
.prog-method-list dt {
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-top: 14px;
}
.prog-method-list dd { margin: 4px 0 0; color: var(--text-2); line-height: 1.55; }
.prog-method-list code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 4px;
  padding: 1px 5px;
}

/* Settings → Access. The roster rows: one address per line, its remove control at the end,
   and the owner's row locked because they are admitted by identity rather than by membership. */
.access-list { display: flex; flex-direction: column; gap: 2px; }
.access-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: var(--radius-md, 8px);
}
.access-row:hover { background: var(--surface-2, #f8fafc); }
.access-row__email { flex: 1; min-width: 0; overflow-wrap: anywhere; }
/* No hover affordance and no remove control — nothing here is actionable. */
.access-row--locked { background: var(--surface-2, #f8fafc); }
.access-row--locked:hover { background: var(--surface-2, #f8fafc); }

/* ================================================================ settings page (rebuild) */
/* Five task tabs + one batched save bar over settingsModel.SETTING_FIELDS, replacing a page of
   competing per-panel Saves. See src/client/js/pages/settings.js and settingsReadouts.js. */

/* -------------------------------------------------------------- settings: tab strip */
/* ui.js tabList. The selected tab reads by a 2px accent underline AND weight 600 — never the
   underline alone — and a dirty tab gets a painted dot (tabList also appends "unsaved changes"
   to its accessible name, so the cue survives for a screen reader with the tab out of view). */
.tabstrip {
  display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--hairline);
  margin-bottom: 20px;
}
.tabstrip__tab {
  position: relative; background: none; border: none; box-shadow: none;
  border-radius: var(--radius-md) var(--radius-md) 0 0;
  padding: 9px 14px; min-height: 38px; font: inherit; font-size: 0.875rem;
  color: var(--text-2); cursor: pointer; white-space: nowrap; flex: none;
  display: inline-flex; align-items: center; gap: 7px;
}
.tabstrip__tab:hover { background: var(--wash-hover); color: var(--ink); }
.tabstrip__tab[aria-selected="true"] {
  color: var(--ink); font-weight: 600;
  box-shadow: inset 0 -2px 0 0 var(--accent);
}
.tabstrip__tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabstrip__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }

/* -------------------------------------------------------------- settings: save bar */
/* ui.js saveBar: one dirty state for the whole page, hidden until there is something to save.
   Sticky within `main` (main is the scrolling ancestor, not the viewport) so it stays reachable
   however far a control behind an inactive tab has scrolled. Card whisper only — this is still
   a card, not a modal — per the no-heavier-shadow rule. */
.savebar {
  position: sticky; bottom: 16px; z-index: var(--z-popover);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-top: 20px; padding: 12px 16px;
  background: var(--page); border: 1px solid var(--hairline); border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
}
/* Same trap as .nav-flyout[hidden] above: the display:flex is an author rule and beats the UA's
   [hidden] { display: none }, so without this the bar sits on screen permanently offering to
   save nothing. The JS sets .hidden correctly — it was the stylesheet that overrode it. */
.savebar[hidden] { display: none; }
.savebar__what { font-size: 13px; color: var(--text-2); }
.savebar__what strong { color: var(--ink); }
.savebar__spacer { flex: 1 1 auto; }
.savebar__tab { font-size: 13px; padding: 0 2px; }

/* -------------------------------------------------------------- settings: why-this-matters */
/* ui.js disclosure: the long paragraph a panel used to show unconditionally, closed by default.
   The one-line description above it stays visible either way. */
details.why { margin: 6px 0 0; }
details.why > summary {
  cursor: pointer; list-style: none; display: inline-flex; align-items: center;
  gap: 5px; font-size: 12px; font-weight: 600; color: var(--text-2);
  padding: 3px 5px; margin: -3px -5px; border-radius: 4px; user-select: none;
}
details.why > summary::-webkit-details-marker { display: none; }
details.why > summary:hover { color: var(--ink); background: var(--wash-hover); }
details.why > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.why__caret { display: inline-block; font-size: 10px; transition: transform 0.15s ease; }
details.why[open] > summary .why__caret { transform: rotate(90deg); }
.why__body p { margin: 6px 0 0; max-width: 68ch; color: var(--text-2); font-size: 12px; line-height: 1.55; }

/* -------------------------------------------------------------- settings: split bar */
/* ui.js splitBar: one track split into labelled segments, the caption beneath repeating every
   figure in words — the bar illustrates, the caption is the record a screen reader gets too. */
.splitbar-wrap { margin-top: 12px; }
.splitbar {
  display: flex; height: 20px; border-radius: var(--radius-sm); overflow: hidden;
  border: 1px solid var(--hairline); background: rgba(0, 0, 0, 0.04);
}
.splitbar__seg { height: 100%; }
/* Severity segments ride the same --sev-* fill tokens as every other severity mark in the app —
   never a bespoke hue, so a segment here means what it means everywhere else. */
.splitbar__seg--CRITICAL { background: var(--sev-critical); }
.splitbar__seg--HIGH { background: var(--sev-high); }
.splitbar__seg--MEDIUM { background: var(--sev-medium); }
.splitbar__seg--LOW { background: var(--sev-low); }
.splitbar__seg--INFO { background: var(--sev-info); }
.splitbar__seg--UNKNOWN { background: var(--sev-unknown); }
.splitbar__seg--in { background: var(--accent); }
/* Excluded/"not scanned": a hatched neutral rather than a second solid hue, so "not counted"
   reads as an absence rather than a category competing with the severities beside it. */
.splitbar__seg--out {
  background-image: repeating-linear-gradient(135deg, var(--text-3) 0, var(--text-3) 2px, transparent 2px, transparent 6px);
  background-color: transparent; opacity: 0.6;
}
.splitbar__caption { margin: 6px 0 0; }

/* -------------------------------------------------------------- settings: filter grid */
/* The vendor-fix and end-of-life filters side by side, so neither is a full-bleed card for one
   switch and a sentence. Same auto-fit idiom as .chart-grid / .kpi-row — collapses to a single
   column once a card would drop under the 280px floor. */
.settings-grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }

/* -------------------------------------------------------------- settings: risk breakdown */
.risk-breakdown { margin: 14px 0 8px; display: flex; flex-direction: column; gap: 6px; }
.risk-row {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  font-size: 13px; padding: 2px 0;
}
.risk-row__name { color: var(--ink); }
.risk-row__count { font-variant-numeric: tabular-nums; white-space: nowrap; }
.risk-row__missing { color: var(--text-2); font-size: 12px; margin-left: 8px; }
.risk-sentence { margin: 10px 0 0; font-size: 13px; }

/* Square-root scaled — EPSS is right-skewed enough that a linear scale flattens everything past

   (see createRiskReadout's own comment) — only its value and the bars around it are rewritten. */
.epss-hist-wrap { margin-top: 14px; position: relative; }
.epss-hist-scroll { overflow-x: auto; }
.epss-hist {

}

/* -------------------------------------------------------------- settings: retention timeline */
.retention-timeline-scroll { overflow-x: auto; margin-top: 14px; }
/* Left-aligned and capped, NOT stretched to fill. A register with seven scans drew seven
   185px slabs across the card, which reads as a striped placeholder rather than a sequence in
   time; the timeline's width should say how many scans there are. It still grows to the
   available room for a long history, and scrolls past it. */
.retention-timeline {
  display: flex; gap: 6px; min-width: 340px; align-items: flex-end; height: 48px;
  justify-content: flex-start;
}
.retention-tick {
  flex: 1 1 0; min-width: 16px; max-width: 44px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.retention-tick__glyph { font-size: 10px; color: var(--text-3); line-height: 1; }
.retention-tick__bar {
  width: 100%; height: 26px; border-radius: 2px;
  background: rgba(0, 0, 0, 0.1); border: 1px solid transparent;
}
/* Sealed: solid neutral. Would-seal: the same hatch as splitbar's "out" segment (excluded once
   the next pass runs). Pinned: a faint accent wash — the one state that never depends on the
   window, so it borrows the data/state accent rather than a severity or plain neutral tone.
   Every state also carries a glyph (see renderRetentionReadout) — never fill alone. */
.retention-tick.is-sealed .retention-tick__bar { background: var(--text-3); opacity: 0.35; }
.retention-tick.is-would .retention-tick__bar {
  background-image: repeating-linear-gradient(135deg, var(--text-3) 0, var(--text-3) 2px, transparent 2px, transparent 6px);
  opacity: 0.7;
}
/* The wash alone is 8% alpha and all but disappears on the card's own tint, which left "pinned"
   readable only from the legend. The border carries it; the glyph still does the real work. */
.retention-tick.is-pinned .retention-tick__bar {
  background: var(--accent-wash); border-color: rgba(37, 99, 235, 0.35);
}

/* -------------------------------------------------------------- settings: jobs console */
/* Today History backfill / Domain-tag backfill / Support group refresh consolidate into one
   table: Job / Last run / Status / action. Each job's full former paragraph lives verbatim in
   its row's "Why this matters" disclosure rather than sitting open on the page. */
.job-name { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 2px; }
table.data.jobs-table td:last-child { text-align: right; white-space: nowrap; }
/* The status cell can carry a longer sentence (the domain-tag three-figure line, a failure
   message) than the table's default nowrap-ellipsis cell allows for. */
table.data.jobs-table td.job-status-cell { white-space: normal; max-width: 420px; overflow: visible; }
