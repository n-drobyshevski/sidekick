<style>
/* Wiz Sidekick OS — the DESIGN.md visual system ("The Audit Ledger") ported to the GAS
   web app. Light theme only; neutral field; saturated color rationed to severity,
   state, and SLA verdicts. Two-token severity rule: --sev-* fills for marks/dots,
   --sev-*-text for any colored label. */

:root {
  /* The icon rail's own track. It never moves: the second tier is a panel BESIDE the rail,
     not a wider version of it. Sized by its longest label rather than by its icons — "Security"
     and "Executive" have to sit on one line at 11px, because a rail that ellipsised its own
     item names would be an icon rail with decoration under it. */
  --rail-icon-w: 76px;
  /* The nav panel — wide enough for the longest thing it lists ("Program performance"). */
  --nav-flyout-w: 280px;
  /* HOW MUCH CHROME IS ON THE LEFT, which is what this has always meant and why the route
     overlay can clear it with `left: var(--rail-w)` and nothing else. The rail alone while the
     panel floats; rail + panel once the panel is pinned into the flow, which navFlyout.js
     writes onto the root. */
  --rail-w: var(--rail-icon-w);
  /* The app header's height. A token rather than a literal because the shell's rows and the
     sticky offset below 800px have to agree on one number. */
  --appbar-h: 48px;
  --accent: #2563eb;
  /* The accent at two tints, for the one control that reports a STATE rather than an identity:
     the scope switcher's trigger while the register is narrowed. Rationed deliberately — the
     accent is otherwise focus and identity only. */
  --accent-wash: rgba(37, 99, 235, 0.08);
  --accent-wash-hover: rgba(37, 99, 235, 0.13);
  /* The neutral hover ground for nav links and icon buttons, previously written out at four
     call sites and now named once. */
  --wash-hover: rgba(0, 0, 0, 0.045);
  --ink: #171717;
  --graphite: #0a0a0a;
  --graphite-hover: #27272a;
  --on-graphite: #fafafa;
  --page: #ffffff;
  --surface: #f8f8fa;
  --hairline: #e6e6e9;
  --text-2: rgba(0, 0, 0, 0.65);
  /* Tertiary text: 0.6 alpha clears WCAG AA (~5.4:1 on the surface tint) for the 11-13px
     labels, captions, and sub-values it carries. 0.5 resolved to ~3.95:1 and failed. */
  --text-3: rgba(0, 0, 0, 0.6);

  --sev-critical: #dc2626;  --sev-critical-text: #b91c1c;
  --sev-high: #ea580c;      --sev-high-text: #c2410c;
  --sev-medium: #d97706;    --sev-medium-text: #b45309;
  --sev-low: #2563eb;       --sev-low-text: #1d4ed8;
  --sev-info: #64748b;      --sev-info-text: #475569;
  --sev-unknown: #475569;   --sev-unknown-text: #334155;

  /* Categorical hues for the grouping charts (pie + group trend). charts.js CATEGORICAL is
     the copy the canvas actually consumes (canvas can't read CSS vars); these mirror it and
     are kept in sync by convention. Chosen outside the severity band above so a group is never
     mistaken for a severity. Five hues (not more): the colored groups are capped at five and
     the tail folds into --cat-other — the accessible ceiling for a warm-band-free, light-tuned,
     colorblind-safe categorical set (see the CATEGORICAL comment in charts.js). */
  --cat-1: #2563eb;  --cat-2: #0d9488;  --cat-3: #90396a;  --cat-4: #7fba04;  --cat-5: #f66bb9;
  --cat-other: #94a3b8;

  --ok: #15803d;
  --warn: #a16207;
  --bad: #b91c1c;

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 10px;
  --radius-xl: 14px;

  /* Semantic z-index scale. The route-overlay outranks transient popovers so a reload
     veil reliably absorbs clicks even over an open menu; sheets and toasts sit above it. */
  --z-popover: 30;
  --z-overlay: 40;
  /* The nav panel: above the route overlay, because a panel open while a page refetches has to
     stay readable and clickable; below the scrim, so a finding sheet still covers it.
     Deliberately NOT --z-popover — that rank is for surfaces the overlay is meant to absorb
     clicks over, and this one is chrome the reader is standing in. */
  --z-nav-flyout: 44;
  --z-topbar: 45; /* mobile top-bar: above the route overlay, below sheets/toasts */
  /* The app header. Above the route overlay for the same reason the top bar is: on the
     <=800px layout the veil goes full-width and fixed, and the header is sticky above it. On
     the wide layout the overlay lives inside .app-body and never reaches the header at all. */
  --z-appbar: 45;
  --z-splash: 55; /* boot splash: above the route overlay (40) and topbar (45), below toast (60) */
  --z-scrim: 50;
  --z-sheet: 51;
  --z-toast: 60;

  --shadow-card: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-button: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
  --shadow-sheet: -8px 0 24px -8px rgba(0, 0, 0, 0.18), -2px 0 8px -4px rgba(0, 0, 0, 0.1);
  /* The sheet's shadow, mirrored: the nav panel floats out to the RIGHT of the rail. */
  --shadow-flyout: 8px 0 24px -8px rgba(0, 0, 0, 0.18), 2px 0 8px -4px rgba(0, 0, 0, 0.1);

  /* The brand mark's three colours. The artwork's own, and deliberately NOT severity or
     categorical tokens — they name a picture, not a level. brandMark.js keeps the same literals
     on the presentation attributes underneath, so the mark draws correctly with no stylesheet
     at all; these exist so the three stay retintable from one place. */
  --mark-map-blue: #5cb2e3;
  --mark-map-red: #f32b2b;
  --mark-ink: var(--graphite);

  --font: -apple-system, BlinkMacSystemFont, Inter, "Segoe UI", Roboto, "Helvetica Neue",
    sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--font);
  font-size: 0.875rem;
  line-height: 1.5;
  font-feature-settings: "cv02", "cv03", "cv04", "cv11";
}

/* ------------------------------------------------------------------ shell / nav */
/* Fixed viewport-height shell: a header row across the top, then a body row holding the rail
   (which fills what is left, pinning the scan zone to its bottom) beside a content pane that
   scrolls on its own.
   .app-body, not #app, is the positioning context for the route overlay — the overlay veils
   the content while a page refetches, and the header above it stays live. */
#app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.app-body { flex: 1; min-height: 0; display: flex; position: relative; }

/* The app header: whose product this is, and which slice of the register you are reading.
   Deliberately just those two things — the reference screens' search box, notification icons
   and avatar have nothing behind them here, and the scan controls stay in the rail where they
   have always been. */
.appbar {
  flex: 0 0 var(--appbar-h);
  display: flex; align-items: center; gap: 12px;
  padding: 0 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--hairline);
  z-index: var(--z-appbar);
}
.appbar-name {
  font-weight: 600; font-size: 1rem; letter-spacing: -0.02em; color: var(--ink);
  white-space: nowrap;
}
/* The rule between the product and the scope it is showing — two different kinds of fact, and
   without it the scope name reads as part of the wordmark. */
.appbar-sep { width: 1px; height: 20px; flex: 0 0 auto; background: var(--hairline); }

.sidebar {
  width: var(--rail-icon-w);
  flex: 0 0 var(--rail-icon-w);
  height: 100%;
  overflow-y: auto;
  background: var(--surface);
  border-right: 1px solid var(--hairline);
  padding: 8px 6px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

/* The product mark. Its paint is on the presentation attributes too (brandMark.js), so it
   draws correctly with no stylesheet at all — which is the case index.html's first paint is
   closest to. These rules exist so the three colours stay retintable from one place, not
   because the mark needs them. */
.brand-mark { display: block; flex: none; }
.brand-mark .mark-map { stroke: var(--mark-map-blue); }
.brand-mark .mark-map--warm { stroke: var(--mark-map-red); }
.brand-mark .mark-ink { stroke: var(--mark-ink); }
.brand-mark .mark-ink-fill { fill: var(--mark-ink); }
.brand-mark .mark-knockout { stroke: var(--page); }

/* ------------------------------------------------------- the header scope switcher */
/* In the app header, beside the wordmark, because it scopes every page rather than any one of
   them. A row, not a column: the caption reads as a subtitle to the trigger when it is under
   it, and as the trigger's denominator when it is beside it, and the second is what it is. */
.scope-switch {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.scope-combo { width: clamp(180px, 22vw, 280px); flex: 0 1 auto; }
/* 13px/500 — one step down from the wordmark it sits beside. It names the slice every page is
   showing, so it must not read as an afterthought; equally it is not the product's name, so it
   stops short of that weight. */
.scope-switch .combobox-trigger { min-height: 32px; font-size: 13px; font-weight: 500; }
.scope-combo-icon { display: inline-flex; flex: 0 0 auto; color: var(--text-3); }
/* SCOPED: a value chain or a support group is narrowing the register, and every figure on
   every page is counted over it. The trigger is the only thing on screen that is true on all
   of them, so it is where the state belongs. Unscoped it is the plain field above — "showing
   everything" is the resting state, and a control that were always lit would report nothing.
   Never colour alone: the trigger names the scope and the caption carries the count. */
.scope-combo.scoped .combobox-trigger {
  background: var(--accent-wash);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}
.scope-combo.scoped .combobox-trigger:hover { background: var(--accent-wash-hover); }
.scope-combo.scoped .scope-combo-icon,
.scope-combo.scoped .combobox-caret { color: var(--accent); }
.scope-caption {
  font-size: 11px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  min-width: 0; overflow: hidden; text-overflow: ellipsis;
}
/* A stored scope naming something the register no longer holds. Amber, and the caption already
   says so in words — the colour is the second signal, never the only one. */
.scope-caption.stale { color: var(--warn); }
/* On a phone the caption is down to "1,2…", which is worse than absent: a denominator you can
   only half-read tells you nothing, and the trigger beside it still names the scope. */
@media (max-width: 560px) { .scope-caption { display: none; } }

/* A lane heading. An <h2> since the rail's grouping is real structure — margin: 0 because
   nothing else in this stylesheet resets a bare h2 and the UA's 0.83em would land here. */
.nav-group {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 12px 10px 4px;
  margin: 0;
}
/* The chrome tail's separator, drawn by both shapes of the nav: above Settings on the icon
   rail, and above the same link in the stacked list below 800px. Decorative in the strict
   sense — what it marks is a change of kind the reader can see (a page that names itself), so
   nothing here is the only carrier of anything. */
.nav-rule {
  height: 1px;
  flex: 0 0 auto;
  background: var(--hairline);
  margin: 8px 8px 4px;
}
.nav-link {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: var(--radius-md);
  color: var(--ink);
  font-size: 13px;
  text-decoration: none;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  cursor: pointer;
  font-family: inherit;
}
.nav-link:hover { background: var(--wash-hover); }
/* Active nav reads by position + weight, not a ~2.5% tint alone: a 2px accent rail anchors
   "you are here". Inset shadow keeps color rationing intact (accent = focus/data). */
.nav-link.active {
  background: rgba(0, 0, 0, 0.07);
  font-weight: 600;
  box-shadow: inset 2px 0 0 var(--accent);
}
.nav-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------------------------------------------------------------- the two-tier rail */

/* A rail item is a box holding the link that navigates and, where the item has a panel, the
   trigger that discloses it — they are one control. The box is what the pointer hovers, so the
   link keeps its whole width as a target. */
.rail-item { position: relative; display: block; }
/* The rail's own link: the mark OVER its name, because at 76px there is no room beside it and
   a name is what stops an icon rail being a rebus. */
.rail-link {
  flex-direction: column;
  gap: 2px;
  padding: 8px 2px;
  text-align: center;
}
.rail-link .nav-label {
  font-size: 11px;
  line-height: 1.2;
  letter-spacing: -0.005em;
  color: var(--text-2);
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* `.current` is the lane holding the page you are on; `.active` is the link that IS that page.
   They look the same on the rail on purpose — the rail answers "whereabouts", and the panel
   beside it answers "which one" — and they are two classes rather than one because only the
   second may ever carry aria-current. */
.rail-item.current > .rail-link,
.rail-link.active {
  background: rgba(0, 0, 0, 0.07);
  box-shadow: inset 2px 0 0 var(--accent);
}
.rail-item.current > .rail-link .nav-label,
.rail-link.active .nav-label { color: var(--ink); font-weight: 600; }
.rail-item.current > .rail-link .nav-icon,
.rail-link.active .nav-icon { color: var(--ink); }
/* An item whose panel is showing. This is the only mark the rail draws for "there is more
   here" — and it is drawn at the moment the panel is on screen beside it, which is the moment
   it means anything. */
.rail-item.open > .rail-link { background: var(--wash-hover); }

/* --------------------------------------------------------------------- the nav panel */

/* The second tier: a full-height column, so it has no placement problem to solve. Unpinned it
   floats over the content pane with the one real shadow this system allows an overlay; pinned
   it joins the flex row and `main` shrinks beside it, at which point it is a surface like the
   rail and drops the shadow for a hairline. */
.nav-flyout {
  position: absolute;
  left: var(--rail-icon-w); top: 0; bottom: 0;
  width: var(--nav-flyout-w);
  z-index: var(--z-nav-flyout);
  display: flex;
  flex-direction: column;
  background: var(--page);
  border-right: 1px solid var(--hairline);
  box-shadow: var(--shadow-flyout);
  opacity: 0;
  transform: translateX(-6px);
  transition: opacity 0.12s ease, transform 0.12s ease;
}
/* display:flex above would otherwise beat the UA's [hidden] rule and leave a closed panel on
   screen at opacity 0, eating every click along the left edge of the page. */
.nav-flyout[hidden] { display: none; }
.nav-flyout.open { opacity: 1; transform: none; }
.nav-flyout.pinned {
  position: relative;
  left: auto; top: auto; bottom: auto;
  flex: 0 0 var(--nav-flyout-w);
  opacity: 1;
  transform: none;
  box-shadow: none;
}
.nav-flyout-head {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 8px 8px 12px;
  flex: 0 0 auto;
}
.nav-flyout-title {
  font-size: 1rem; font-weight: 600; letter-spacing: -0.01em;
  color: var(--ink); margin: 0;
}
.nav-flyout-pin {
  margin-left: auto; flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; min-height: 0; padding: 0;
  border: 1px solid transparent; border-radius: var(--radius-md);
  background: none; color: var(--text-2); cursor: pointer; box-shadow: none;
}
.nav-flyout-pin:hover { background: var(--wash-hover); border-color: var(--hairline); }
.nav-flyout-pin:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.nav-flyout-pin[aria-pressed="true"] { color: var(--ink); border-color: var(--hairline); }
.nav-flyout-body {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  display: flex; flex-direction: column; gap: 2px;
  padding: 0 8px 12px;
}
/* The panel's own group headings reuse the rail's, because they are the same kind of label in
   the same nav — DESIGN.md's one sanctioned uppercase slot, spent once. */
.nav-flyout-body .nav-group { padding: 12px 8px 4px; }
/* A row with no mark of its own keeps the slot, so its name starts where every other name
   does. */
.nav-icon-blank { visibility: hidden; }

.sidebar .scan-zone {
  margin-top: auto;
  border-top: 1px solid var(--hairline);
  padding-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.scan-caption { font-size: 12px; color: var(--text-2); }
.scan-controls { display: flex; flex-direction: column; gap: 8px; }
.scan-buttons { display: flex; gap: 8px; }

/* ------------------------------------------------------------------- combobox */
/* Searchable dropdown (ui.js filterCombobox). The trigger matches the app's field look
   (white, hairline border, 36px min-height); the list is portaled to <body> because the
   region a trigger sits in may scroll and would clip it. */
.combobox { position: relative; }
.combobox-trigger {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; min-height: 36px; padding: 4px 10px;
  font-family: var(--font); font-size: 0.875rem; font-weight: 400; text-align: left;
  background: var(--page); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: var(--radius-md); box-shadow: none;
}
.combobox-trigger:hover { background: #f1f1f4; }
.combobox-trigger.active { border-color: var(--accent); }
.combobox-trigger-text { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.combobox-caret { font-size: 0.7rem; color: var(--text-3); flex: 0 0 auto; }

/* Popover: portaled to <body> and positioned `fixed`. It opens DOWNWARD and flips above only
   when there is no room below (ui.js position()) — it grew upward unconditionally while its
   only two callers were filters at the bottom of the rail. Card-surface recipe matching
   .helptip-bubble, but with --shadow-sheet since it floats fully detached from any panel. */
.combobox-pop {
  position: fixed; z-index: var(--z-popover);
  display: flex; flex-direction: column; gap: 6px;
  padding: 6px; background: var(--page); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sheet);
  font-family: var(--font);
}
.combobox-search { width: 100%; margin: 0; }
/* The list itself scrolls (max-height set inline by ui.js position()) so the head above it —
   heading, note, search — stays pinned. */
.combobox-list { list-style: none; margin: 0; padding: 2px; overflow-y: auto; }
.combobox-option {
  display: flex; align-items: baseline; gap: 8px;
  padding: 6px 8px; border-radius: var(--radius-sm);
  font-size: 0.8125rem; line-height: 1.3; color: var(--ink); cursor: pointer;
}
.combobox-option:hover, .combobox-option.active { background: var(--surface); }
/* Selected option: meaning is text weight + accent color together, not color alone —
   aria-selected already carries it for assistive tech. */
.combobox-option[aria-selected="true"] { font-weight: 600; color: var(--accent); }
.combobox-option-body { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
.combobox-option-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* What a row has to say that its name cannot: which kind it is, and how much of the register
   it covers. Muted and to the right, so a scan down the list reads names first. */
.combobox-option-hint {
  margin-left: auto; font-size: 11px; color: var(--text-3); flex: 0 0 auto;
  font-variant-numeric: tabular-nums;
}
/* A row's own mark, and the check on the row in force. Both are decoration by contract — the
   row says in words whatever they suggest — so they are muted, and only the check takes the
   accent, because it reports a state rather than naming a kind. `align-self: center` because
   the row is baseline-aligned for its text and a glyph has no baseline to sit on. */
.combobox-option-icon { display: inline-flex; flex: 0 0 auto; align-self: center; color: var(--text-3); }
.combobox-option-check {
  display: inline-flex; flex: 0 0 auto; align-self: center; margin-left: 4px; color: var(--accent);
}
.combobox-option[aria-selected="true"] .combobox-option-icon { color: var(--accent); }
.combobox-option--reset { border-bottom: 1px solid var(--hairline); margin-bottom: 2px; padding-bottom: 8px; }
/* A group heading inside the list. role="presentation", so the keyboard walk steps over it —
   DESIGN.md's one sanctioned uppercase slot again, and the same type as .nav-group. */
.combobox-group {
  padding: 8px 8px 2px; font-size: 11px; font-weight: 600;
  letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-3);
}
.combobox-empty { padding: 6px 8px; font-size: 0.8125rem; color: var(--text-3); cursor: default; }

/* The panel's heading: what this list is, and what picking from it does. Opt-in (`header`),
   because most lists here choose a value and have nothing to add — this exists for the one
   that changes what every figure in the app is counted over. */
.combobox-head {
  padding: 8px 8px 4px;
  border-bottom: 1px solid var(--hairline);
  margin-bottom: 2px;
}
.combobox-head-title {
  font-size: 0.8125rem; font-weight: 600; color: var(--ink); letter-spacing: -0.01em;
}
.combobox-head-note { margin: 2px 0 0; font-size: 11px; line-height: 1.45; color: var(--text-2); }
/* The scope switcher's panel. Wider than the trigger it hangs from: position() sizes a popover
   from its anchor (floored at 240px), and the note above needs two lines rather than five. A
   min-width beats the inline width without teaching the widget a width option that exactly one
   caller would ever pass. */
.combobox-pop--scope { min-width: 360px; }

/* The mark on a nav row, at the one size every one of them draws: rail item, panel row and
   stacked-list link alike. */
.nav-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; flex: 0 0 18px; color: var(--text-2);
}
.nav-icon svg { width: 18px; height: 18px; display: block; }
.nav-link.active .nav-icon { color: var(--ink); }
.sidebar .scan-buttons button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.sidebar .scan-buttons .primary .nav-icon { color: inherit; width: 16px; height: 16px; flex-basis: 16px; }
.sidebar .scan-buttons .primary .nav-icon svg { width: 16px; height: 16px; }
.rail-status-dot { display: none; width: 9px; height: 9px; border-radius: 50%; align-self: center; }
.rail-status-dot.ok { background: var(--ok); }
.rail-status-dot.neutral { background: var(--text-3); }

/* The rail proper — everything here used to be the .collapsed variant of a rail that could
   also be 232px wide. It cannot any more: the second tier is a panel BESIDE the rail, not a
   wider rail, so this IS the rail above 800px. Below that the nav is a stacked list where
   every one of these would be wrong, which is what the media query is holding back.

   The two data-URI glyph masks that used to live here went with the filters they dressed —
   the Value Chain funnel and the Support group figures are rows in the header switcher's list
   now, drawn from uiIcons.js like every other mark in the app. */
@media (min-width: 801px) {
  .sidebar .scan-caption,
  .sidebar .btn-label,
  .sidebar .scan-buttons button:not(.primary) { display: none; }
  .sidebar .scan-buttons { justify-content: center; }
  .sidebar .scan-buttons .primary { padding: 8px; }
  .sidebar .rail-status-dot { display: block; }
  /* Loading panel in the icon rail: drop the full card chrome and its text/bar/buttons,
     leaving the compact ring indicator centered — the card's phase, counts and controls are
     too wide for 76px, so they collapse to the ring (status) + its Details button. */
  .sidebar .scan-progress {
    padding: 6px 0; gap: 0; align-items: center;
    background: transparent; border: none; box-shadow: none;
  }
  .sidebar .scan-progress-bar-slot,
  .sidebar .scan-progress-counts,
  .sidebar .scan-progress-actions { display: none; }
  /* The phase line is the card's aria-live announcement target — visually hide it rather than
     display:none it, so screen readers still hear phase transitions in the icon rail. */
  .sidebar .scan-progress-head {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }
  .sidebar .scan-progress-mini { display: inline-flex; }
}
@media (prefers-reduced-motion: reduce) {
  .nav-flyout { transition: none; transform: none; }
}

/* Scan progress card (persistent, non-modal; lives in the scan zone while a job runs) */
.scan-progress {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 10px 12px;
  background: var(--page);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}
.scan-progress-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.scan-progress-phase { font-size: 13px; font-weight: 600; color: var(--ink); }
.scan-progress-elapsed { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.scan-progress-counts { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.scan-progress.failed .scan-progress-counts { color: var(--bad); }
/* A run with no progress for minutes: flag it amber on the always-visible card, not only
   behind the details drawer, so a likely-dead scan is legible at a glance. */
.scan-progress.stuck { border-color: rgba(161, 98, 7, 0.4); }
.scan-progress.stuck .scan-progress-phase,
.scan-progress.stuck .scan-progress-counts { color: var(--warn); }
.scan-progress-actions { display: flex; gap: 12px; }

/* Compact icon-rail indicator: a ring (spinner / arc / filled) with a centered glyph or
   percent. Hidden by default; the min-width:801px rule above reveals it in the rail. The
   ring is a masked conic-gradient donut so a single element carries both the track and
   the coloured arc; --ring is re-tinted per run state, matching the progress-bar colours. */
.scan-progress-mini {
  display: none; position: relative; align-items: center; justify-content: center;
  width: 100%; padding: 2px 0; border: none; background: none; cursor: pointer;
}
.scan-progress-mini:disabled { cursor: default; }
.scan-progress-mini:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 3px; border-radius: var(--radius-md);
}
.scan-spinner {
  --ring: var(--accent);
  --track: rgba(0, 0, 0, 0.10);
  width: 28px; height: 28px; border-radius: 50%;
  /* Terminal states show a full ring; a running scan with no percent yet spins a 25% arc. */
  background: conic-gradient(var(--ring) 0 100%, var(--track) 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 3.5px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 3.5px));
}
.scan-progress.running .scan-spinner {
  background: conic-gradient(var(--ring) 0 25%, var(--track) 0);
  animation: scan-spin 0.9s linear infinite;
}
/* A known percent freezes the spin into a static arc filled to that share. */
.scan-progress.running .scan-spinner.is-determinate {
  background: conic-gradient(var(--ring) calc(var(--scan-pct, 0) * 1%), var(--track) 0);
  animation: none;
}
.scan-progress.done .scan-spinner { --ring: var(--ok); }
.scan-progress.failed .scan-spinner { --ring: var(--bad); }
.scan-progress.cancelled .scan-spinner { --ring: var(--text-3); }
.scan-progress.stuck .scan-spinner { --ring: var(--warn); }
.scan-progress-mini-pct {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums;
}
.scan-progress.done .scan-progress-mini-pct { color: var(--ok); font-size: 13px; }
.scan-progress.failed .scan-progress-mini-pct { color: var(--bad); font-size: 12px; }
.scan-progress.stuck .scan-progress-mini-pct { color: var(--warn); font-size: 12px; }
@keyframes scan-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  /* No spin: a calm 40% arc still reads as "working" without motion. */
  .scan-progress.running .scan-spinner {
    animation: none; background: conic-gradient(var(--ring) 0 40%, var(--track) 0);
  }
}
.linklike {
  background: none; border: none; padding: 0; font-size: 12px; font-weight: 600;
  color: var(--accent); cursor: pointer;
}
.linklike.danger { color: var(--bad); }
.linklike:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* Track/fill progress bar. Fill is Signal Blue — the data color. */
.progress-track {
  position: relative;
  height: 8px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.07);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--accent);
  transition: width 300ms ease-out;
}
.progress-track.done .progress-fill { background: var(--ok); }
.progress-track.failed .progress-fill { background: var(--bad); }
.progress-track.cancelled .progress-fill { background: var(--text-3); }
/* Indeterminate: a travelling band. Under reduced motion the band is replaced by a
   calm static striped fill so "working" still reads without animation. */
.progress-track.indeterminate .progress-fill {
  width: 40%;
  animation: progress-indeterminate 1.4s ease-in-out infinite;
}
@keyframes progress-indeterminate {
  0% { margin-left: -40%; }
  100% { margin-left: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .progress-track.indeterminate .progress-fill {
    width: 100%;
    margin-left: 0;
    background: repeating-linear-gradient(
      45deg, var(--accent), var(--accent) 8px,
      color-mix(in srgb, var(--accent) 55%, white) 8px,
      color-mix(in srgb, var(--accent) 55%, white) 16px);
  }
}

/* Details drawer: phase stepper + fact grid */
.scan-steps { display: flex; gap: 14px; margin: 4px 0 14px; }
.scan-step { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-3); }
.scan-step.done { color: var(--ok); }
.scan-step.active { color: var(--accent); font-weight: 600; }
.scan-step-dot { font-size: 12px; }
.scan-detail-grid {
  display: grid; grid-template-columns: auto 1fr; gap: 6px 16px;
  margin-top: 14px; font-size: 13px;
}
.scan-detail-grid dt { color: var(--text-3); }
.scan-detail-grid dd { margin: 0; font-variant-numeric: tabular-nums; }
.scan-detail-error {
  margin-top: 14px; padding: 10px 12px; font-size: 13px;
  color: var(--bad); background: rgba(185, 28, 28, 0.06);
  border-radius: var(--radius-md);
}

main {
  flex: 1;
  min-width: 0;
  /* 100% of the body ROW, not of the viewport: the header takes --appbar-h off the top and
     main scrolls inside what is left. 100vh here would push the pane's own scrollbar an
     app-header's worth below the fold. */
  height: 100%;
  overflow-y: auto;
  padding: 28px 32px 48px;
  /* No max-width: main fills whatever the rail and the pinned panel leave, so pinning the
     panel narrows the content (charts drop columns from their auto-fit grids) instead of
     just eating the left margin. */
}

/* Route-reload overlay: a translucent veil + indeterminate top bar over the content pane
   while the active page refetches. Positioned against .app-body, so the app header above it
   is outside its box entirely and stays live; the rail stays clear via left:var(--rail-w),
   which widens with the panel when the panel is pinned. */
.route-overlay {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: var(--rail-w);
  z-index: var(--z-overlay);
  display: flex;
  justify-content: center;
  background: color-mix(in srgb, var(--surface) 72%, transparent);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 140ms ease-out, visibility 0s linear 140ms;
}
.route-overlay.visible {
  opacity: 1;
  visibility: visible;
  pointer-events: auto; /* absorb clicks on stale content while it reloads */
  transition: opacity 140ms ease-out;
}
.route-overlay-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.06);
}
.route-overlay-fill {
  width: 40%;
  height: 100%;
  background: var(--accent);
  animation: progress-indeterminate 1.2s ease-in-out infinite;
}
.route-overlay-label {
  margin-top: 84px;
  align-self: flex-start;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  background: var(--page);
  border: 1px solid var(--hairline);
  border-radius: 999px;
  padding: 5px 12px;
  box-shadow: var(--shadow-card);
}
.route-overlay-label:empty { display: none; }
@media (prefers-reduced-motion: reduce) {
  /* No travelling band under reduced motion — a calm static striped fill still
     reads as "working" (mirrors the scan progress bar's fallback). */
  .route-overlay-fill {
    width: 100%;
    animation: none;
    background: repeating-linear-gradient(
      45deg, var(--accent), var(--accent) 8px,
      color-mix(in srgb, var(--accent) 55%, white) 8px,
      color-mix(in srgb, var(--accent) 55%, white) 16px);
  }
  .route-overlay { transition: none; }
}

/* Boot splash: branded first-paint veil while api_bootstrap resolves. Baked into index.html
   so it paints on first style application (no blank flash); JS owns removal. Same loader
   family as .route-overlay — reuses .progress-track.indeterminate (inherits its reduced-motion
   striped fallback). */
.boot-splash {
  position: fixed; inset: 0; z-index: var(--z-splash);
  display: flex; align-items: center; justify-content: center;
  background: var(--page); opacity: 1; transition: opacity 180ms ease-out;
}
.boot-splash.hiding { opacity: 0; }
.boot-splash-inner {
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  padding: 24px; width: min(280px, 80vw);
}
/* The splash takes the FULL mark, not the header's compact crop: it has a whole screen, and
   the 307-dot globe the crop leaves out is legible at 112px in a way it never is at 22. */
.boot-brand {
  display: flex; flex-direction: column; align-items: center; gap: 10px; font-weight: 600;
  font-size: 1.0625rem; letter-spacing: -0.02em; color: var(--ink);
}
.boot-splash-bar { width: 100%; }
.boot-splash-note { margin: 0; font-size: 12px; color: var(--text-2); }
@media (prefers-reduced-motion: reduce) { .boot-splash { transition: none; } }

/* Skeleton placeholders: calm opacity pulse only — NO diagonal shimmer sweep (the SaaS tell
   DESIGN.md forbids). Reduced motion → a static hairline block. Blocks are aria-hidden. */
.skeleton {
  background: color-mix(in srgb, var(--ink) 7%, var(--surface));
  border-radius: var(--radius-md); animation: skeleton-pulse 1.6s ease-in-out infinite;
}
@keyframes skeleton-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.skeleton--line { height: 12px; border-radius: 4px; }
.skeleton--title { height: 30px; border-radius: 6px; }
.skeleton--stat { height: 18px; border-radius: 5px; }
.skeleton--pill { height: 30px; border-radius: 999px; }
.skeleton--chart { position: absolute; inset: 0; }
@media (prefers-reduced-motion: reduce) {
  .skeleton {
    animation: none; background: color-mix(in srgb, var(--ink) 5%, var(--surface));
    border: 1px solid var(--hairline);
  }
}

@media (max-width: 800px) {
  /* Top-bar layout: the rail stacks above the content and the page scrolls
     normally, so opt back out of the fixed viewport-height shell. */
  #app { height: auto; min-height: 100vh; overflow: visible; }
  .app-body { flex-direction: column; min-height: 0; overflow: visible; }
  /* The header follows the page down rather than scrolling off it: the scope switcher is the
     one control that answers "what am I even looking at", and at this width the page below it
     is long. Sticky rather than fixed so it still takes part in the flow. */
  .appbar { position: sticky; top: 0; }
  .sidebar {
    width: auto;
    flex: none;
    height: auto;
    overflow: visible;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    border-right: none;
    border-bottom: 1px solid var(--hairline);
    padding: 12px;
  }
  /* No panel down here at all. The nav is a stacked list at this width — there is nothing to
     fly out from and nowhere to put it, and a pinned panel left over from a wider window would
     land as a 280px block across the top of the page. */
  .nav-flyout, .nav-flyout.pinned { display: none; }
  .sidebar .scan-zone { margin-top: 0; border-top: none; padding-top: 0; }
  /* The rail turns into a ROW here, but `.nav-link` is width:100%, so the links go on stacking
     one per line and the lane headings read as words. The tail's rule is the one thing that
     does not survive the switch: an empty div in a row container shrink-to-fits to nothing, so
     it needs a line of its own, and takes it with zero side margins. */
  .sidebar .nav-rule { flex: 0 0 100%; margin: 8px 0; }
  /* The top bar must stay above the full-width route overlay so nav + scan controls remain
     visible and clickable during a reload (desktop clears the rail via left:var(--rail-w)). */
  .sidebar { position: relative; z-index: var(--z-topbar); }
  main { height: auto; overflow: visible; padding: 20px 16px 40px; }
  /* Sidebar is a top bar here, so the veil spans the full width. Pin it to the
     viewport since .app-body is no longer a fixed-height positioning frame. */
  .route-overlay { position: fixed; left: 0; }
}

/* ------------------------------------------------------------------- typography */
h1 { font-size: 1.5rem; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 4px; }
.page-sub { color: var(--text-2); margin: 0 0 20px; }
h2.section-label { font-size: 0.9375rem; font-weight: 600; margin: 28px 0 10px; }
/* A note that sits directly under a section label (structural, not a pixel nudge). */
.section-note { margin: -4px 0 12px; font-size: 12px; color: var(--text-2); }
h3 { font-size: 1rem; font-weight: 600; margin: 0 0 8px; }
.label {
  font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text-3);
}
.num, .kpi-value, td.num, .hero-value, .mini-value { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.small { font-size: 12px; }

/* ---------------------------------------------------------------------- buttons */
button, .btn {
  font-family: inherit;
  font-size: 0.875rem;
  border-radius: var(--radius-md);
  min-height: 36px;
  padding: 6px 14px;
  cursor: pointer;
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-button);
}
button:hover, .btn:hover { background: #f1f1f4; border-color: #d9d9de; }
button:focus-visible, .btn:focus-visible, a:focus-visible, input:focus-visible,
select:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
button.primary {
  background: var(--graphite);
  color: var(--on-graphite);
  border: none;
}
button.primary:hover { background: var(--graphite-hover); }
button.danger { color: var(--bad); border-color: rgba(185, 28, 28, 0.35); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.link {
  background: none; border: none; box-shadow: none; color: var(--accent);
  padding: 2px 4px; min-height: 0;
}

/* ----------------------------------------------------------------------- inputs */
input[type="text"], input[type="search"], input[type="number"], select {
  font-family: inherit;
  font-size: 0.875rem;
  background: var(--page);
  color: var(--ink);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  min-height: 36px;
  padding: 4px 10px;
}
label.field-label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }

/* Invalid input state — border + focus ring pair the color with the field position, and
   .field-error carries the plain-language reason in text (never color alone). */
input[aria-invalid="true"], select[aria-invalid="true"], textarea[aria-invalid="true"] {
  border-color: var(--bad);
}
input[aria-invalid="true"]:focus-visible, select[aria-invalid="true"]:focus-visible {
  outline-color: var(--bad);
}
.field-error { color: var(--bad); font-size: 12px; margin-top: 4px; }

/* ------------------------------------------------------------------------ cards */
.card {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-xl);
  padding: 16px;
  box-shadow: var(--shadow-card);
}
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 0 0 20px; }
/* Fixed two-up. For a four-tile row sitting in half the page width beside a chart, where
   auto-fit lands on three columns and orphans the fourth tile on a line of its own. */
.kpi-row--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kpi-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius-xl); padding: 14px 16px; box-shadow: var(--shadow-card); }
.kpi-label { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-3); }
.kpi-value { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; margin-top: 2px; }
.kpi-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }

/* -------------------------------------------------------------------- hero stat */
.hero { margin: 4px 0 24px; }
.hero .label { margin-bottom: 2px; }
.hero-value { font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
.hero-src { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.hero-minis {
  display: flex; flex-wrap: wrap; gap: 28px;
  border-top: 1px solid var(--hairline);
  margin-top: 14px; padding-top: 12px;
}
.mini-label { font-size: 12px; color: var(--text-3); }
.mini-value { font-size: 18px; font-weight: 600; }

/* ---------------------------------------------------------------- executive view */
/* The default landing page: a centered single-column summary. This is the one place the
   shell gets a max-width, centered container — every other page is full-bleed against the
   left rail. Leadership landing page, so hierarchy is dominated by one big number. */
.exec { max-width: 720px; margin: 0 auto; text-align: center; }
.exec .page-sub { margin: 0 0 24px; }
/* .scope-bar is a flex row, so it ignores .exec's text-align and would sit hard-left in an
   otherwise centered column. The chip qualifies these figures — it centers with them. */
.exec .scope-bar { justify-content: center; }
/* The single hero value (DESIGN.md: at most one per page). A deliberate exec-only step above
   the 2rem .hero-value cap — this page *is* that number, so the larger size earns its place;
   it is still the only hero value on the page. Tabular figures so it never jitters. */
.exec-hero { margin: 8px 0 18px; }
.exec-hero .label { margin-bottom: 4px; }
.exec-hero-value {
  font-size: clamp(2.5rem, 6vw, 4rem);
  font-weight: 600; letter-spacing: -0.02em; line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.exec-hero .hero-src { margin-top: 6px; }
/* Hero value + week-over-week trend badge. The badge is taken OUT of flow (absolute, at the
   metric's bottom-right) so the big number stays centred under its label — an inline-flex row
   would group number+badge and shift the number left by the badge's width. The row shrink-wraps
   the metric and is centred by .exec's text-align. */
.exec-hero-row { position: relative; display: inline-block; }
.exec-trend {
  position: absolute; left: 100%; bottom: 10px; margin-left: 12px;
  display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap;
}
.exec-trend .chg { margin-left: 0; }
.exec-trend-arrow { margin-right: 2px; font-weight: 700; }
.exec-trend-note { font-size: 12px; color: var(--text-3); }
/* Narrow viewports: the out-of-flow badge would overflow the right edge, so drop it back into
   flow and stack it centred under the number instead (still centred, no horizontal scroll). */
@media (max-width: 600px) {
  .exec-hero-row { display: flex; flex-direction: column; align-items: center; }
  .exec-trend { position: static; margin: 6px 0 0; }
}
/* Scan bar: last-scan caption + a single primary Run scan, centered under the hero. */
.exec-scan { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 0 0 8px; }
.exec-scan .primary { display: inline-flex; align-items: center; gap: 6px; }
.exec-scan .btn-icon { display: inline-flex; width: 16px; height: 16px; }
.exec-scan .btn-icon svg { width: 16px; height: 16px; display: block; }
/* Open-vulns-by-severity tiles: dot + count + label. Colour rides only on the dot — the
   count and name carry the meaning too (DESIGN two-token + non-colour-signal rules). */
.exec-sev-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 0 0 4px; }
.exec-sev-tile {
  min-width: 108px;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius-xl); box-shadow: var(--shadow-card);
  padding: 12px 16px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.exec-sev-count {
  font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.exec-sev-name {
  display: inline-flex; align-items: center;
  font-size: 12px; font-weight: 600; color: var(--text-2);
}
/* The by-domain table reads left-to-right even inside the centered column. */
.exec-by-domain { text-align: left; margin-top: 4px; }
/* The KM median is this table's headline number — size it up (a step above the body rows)
   so the per-domain MTTR reads as the figure to scan, echoing the page's single big hero.
   Tabular nums keep the column from jittering across rows. */
.exec-by-domain td.num--key {
  font-size: 1.25rem; line-height: 1.15; letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}

/* Help explainer (how a headline metric is calculated). The wrapped metric itself is the
   hover/focus target — no separate glyph; the bubble is the neutral popover recipe (white /
   hairline / --shadow-card). Revealed on hover/focus-within; the bubble stays in the DOM
   (opacity only) so aria-describedby text is announced. See ui.js
   helpTip(). */
.helptip { position: relative; }
/* Metric variant: shrink-to-content so only the metric area is the hover zone, not the row. */
.hero-metric { display: inline-block; cursor: help; }
/* Non-hero definition trigger: a chart title, table header, or stat-card row that's the
   term itself (not a separate "i" glyph or link) — cursor:help is the only affordance,
   matching .hero-metric's minimalism at inline/row scale instead of the 2rem hero. */
.help-label { cursor: help; }
/* FIXED AT REST, NOT ONLY ONCE REVEALED — and that is a layout fix, not a positioning one.
   ui.js place() already pins the bubble with `position: fixed` on hover/focus, and its comment
   says why: "an opacity-0 fixed bubble can't affect layout". True — but the bubble was
   `absolute` until the first reveal, and an absolutely-positioned descendant DOES contribute to
   its scroll container's scrollable overflow. Inside a `.table-wrap` (whose `overflow-x: auto`
   makes it a scroll container on BOTH axes, per the CSS Overflow computed-value rule) an
   at-rest bubble hanging below a short table's header gave that table a vertical scroll range
   of the overhang — measured at 65px on MTTR and 85px on Program performance, on tables that
   fit their box perfectly. Fixed from the start, it contributes nothing and the range is 0.

   The parked coordinates are arbitrary: place() overwrites left/top before every reveal, and
   both reveal paths (:hover and :focus-within) fire it via onmouseenter / onfocusin. */
.helptip-bubble {
  position: fixed; left: 0; top: 0; z-index: var(--z-popover);
  width: max-content; max-width: 268px; padding: 10px;
  display: flex; flex-direction: column; gap: 5px;
  background: var(--page); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  font-size: 12px; font-weight: 400; line-height: 1.45;
  letter-spacing: 0; text-transform: none; text-align: left;
  white-space: normal; /* table headers set nowrap — the bubble must wrap, not overflow */
  opacity: 0; pointer-events: none; transform: translateY(-2px);
  transition: opacity 0.14s ease, transform 0.14s ease;
}
.helptip-line { display: block; }
.helptip:hover > .helptip-bubble,
.helptip:focus-within > .helptip-bubble { opacity: 1; pointer-events: auto; transform: translateY(0); }
@media (prefers-reduced-motion: reduce) {
  .helptip-bubble { transition: none; transform: none; }
  .helptip:hover .helptip-bubble, .helptip:focus-within .helptip-bubble { transform: none; }
}

/* change chips */
.chg { font-size: 12px; font-weight: 600; border-radius: var(--radius-sm); padding: 1px 6px; margin-left: 6px; }
.chg.up { color: var(--bad); background: rgba(185, 28, 28, 0.12); }
.chg.down { color: var(--ok); background: rgba(21, 128, 61, 0.12); }
.chg.flat { color: var(--text-3); background: rgba(0, 0, 0, 0.06); }

/* --------------------------------------------------------------------- severity */
.sev-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.sev-badge {
  display: inline-flex; align-items: center;
  border-radius: 999px; padding: 2px 9px;
  font-size: 12px; font-weight: 600;
}
.sev-CRITICAL { background: rgba(220, 38, 38, 0.14); color: var(--sev-critical-text); }
.sev-CRITICAL .sev-dot { background: var(--sev-critical); }
.sev-HIGH { background: rgba(234, 88, 12, 0.14); color: var(--sev-high-text); }
.sev-HIGH .sev-dot { background: var(--sev-high); }
.sev-MEDIUM { background: rgba(217, 119, 6, 0.14); color: var(--sev-medium-text); }
.sev-MEDIUM .sev-dot { background: var(--sev-medium); }
.sev-LOW { background: rgba(37, 99, 235, 0.14); color: var(--sev-low-text); }
.sev-LOW .sev-dot { background: var(--sev-low); }
.sev-INFO { background: rgba(100, 116, 139, 0.14); color: var(--sev-info-text); }
.sev-INFO .sev-dot { background: var(--sev-info); }
.sev-UNKNOWN { background: rgba(71, 85, 105, 0.14); color: var(--sev-unknown-text); }
.sev-UNKNOWN .sev-dot { background: var(--sev-unknown); }

/* ------------------------------------------- severity breakdown stat list (+ delta) */
/* A bordered card of one row per severity: dot + label (left), count over an
   open/resolved sub-line (right), and a signed delta chip. Mirrors the Streamlit
   .stat-card so the two visual systems stay in sync. */
.stat-card {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-xl);
  padding: 0 16px;
  box-shadow: var(--shadow-card);
}
.stat-card__row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-top: 1px solid var(--hairline);
}
.stat-card__row:first-child { border-top: none; }
.stat-card__name {
  display: flex;
  align-items: center;
  flex: 1;
  min-width: 0;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
}
.stat-card__value-group { display: flex; flex-direction: column; align-items: flex-end; }
.stat-card__value { font-size: 18px; font-weight: 600; line-height: 1.2; }
.stat-card__sub-value { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.sev-delta {
  min-width: 58px; text-align: right;
  font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.sev-delta.bad { color: var(--bad); }
.sev-delta.good { color: var(--ok); }
.sev-delta.flat { color: var(--text-3); }
.sev-delta-pct { color: var(--text-3); font-weight: 500; }

/* Expandable breakdown tree: a caret affordance in the Group cell (spacer keeps leaf
   rows aligned with their parents). */
.tree-caret {
  cursor: pointer; color: var(--text-3); font-size: 10px;
  width: 12px; display: inline-block; text-align: center; user-select: none;
}
.tree-caret:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.tree-caret-spacer { display: inline-block; width: 12px; }

/* status pills */
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: rgba(21, 128, 61, 0.12); }
.pill.warn { color: var(--warn); background: rgba(161, 98, 7, 0.12); }
.pill.bad { color: var(--bad); background: rgba(185, 28, 28, 0.12); }
.pill.neutral { color: var(--text-2); background: rgba(0, 0, 0, 0.06); }

.domain-chip {
  display: inline-block; border-radius: var(--radius-sm); padding: 1px 7px;
  font-size: 12px; background: rgba(0, 0, 0, 0.06); color: var(--text-2);
}

/* ------------------------------------------------------------------------- severity pills */
.pill-row { display: flex; flex-wrap: wrap; gap: 6px; }
.sev-pill {
  border-radius: 999px; padding: 3px 12px; min-height: 0;
  font-size: 12px; font-weight: 600;
  background: var(--page); border: 1px solid var(--hairline); box-shadow: none;
  color: var(--text-2);
}
.sev-pill[aria-pressed="true"].sev-CRITICAL { background: rgba(220,38,38,.14); color: var(--sev-critical-text); border-color: rgba(220,38,38,.3); }
.sev-pill[aria-pressed="true"].sev-HIGH { background: rgba(234,88,12,.14); color: var(--sev-high-text); border-color: rgba(234,88,12,.3); }
.sev-pill[aria-pressed="true"].sev-MEDIUM { background: rgba(217,119,6,.14); color: var(--sev-medium-text); border-color: rgba(217,119,6,.3); }
.sev-pill[aria-pressed="true"].sev-LOW { background: rgba(37,99,235,.14); color: var(--sev-low-text); border-color: rgba(37,99,235,.3); }
.sev-pill[aria-pressed="true"].sev-INFO { background: rgba(100,116,139,.14); color: var(--sev-info-text); border-color: rgba(100,116,139,.3); }
.sev-pill[aria-pressed="true"].sev-UNKNOWN { background: rgba(71,85,105,.14); color: var(--sev-unknown-text); border-color: rgba(71,85,105,.3); }
/* A leading check makes on/off legible without relying on the ~14% color tint alone. */
.sev-pill[aria-pressed="true"]::before { content: "✓"; margin-right: 4px; font-weight: 700; }

/* A locked pill: a display severity outside the scan scope (Settings). Greyed only when
   it's also unselected, so a locked-selected pill keeps its pressed look. */
.sev-pill[aria-disabled="true"] { cursor: not-allowed; }
.sev-pill[aria-disabled="true"][aria-pressed="false"] { opacity: 0.5; }

/* Header scope bar: dismissible chips echoing the active global filters where the numbers
   are, so a scoped dashboard never silently reads as the whole register. Blue is the
   data/scope accent (rationed), used here to make an active filter unmistakable. */
.scope-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
.scope-chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; padding: 3px 4px 3px 10px; border-radius: 999px;
  background: rgba(37, 99, 235, 0.08); color: var(--sev-low-text);
  border: 1px solid rgba(37, 99, 235, 0.22);
}
.scope-chip b { font-weight: 600; }
.scope-chip-x {
  border: none; background: none; box-shadow: none; color: inherit;
  min-height: 0; padding: 2px 4px; font-size: 11px; line-height: 1; border-radius: 999px;
}
.scope-chip-x:hover { background: rgba(37, 99, 235, 0.14); }

/* The global filter combobox triggers gain an accent border when active (see
   .combobox-trigger.active above), and the scan zone a hairline accent, so the source of
   a scoped view is visible in the rail too. */
.scan-zone.filtering { border-top-color: var(--accent); }

/* ------------------------------------------------------------------ filter bar */
.filter-bar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
  padding: 12px; border: 1px solid var(--hairline); border-radius: var(--radius-lg);
  background: var(--surface); margin-bottom: 14px;
}
.filter-bar .field { display: flex; flex-direction: column; }

/* Segmented toggle (e.g. report format): the pressed option reads as selected without
   borrowing the graphite of the primary action sitting beside it. */
.seg-btn[aria-pressed="true"] {
  background: var(--page);
  border-color: var(--ink);
  color: var(--ink);
  font-weight: 600;
}
/* Compact variant for inline section-level controls: body-small type, tighter box. */
.seg-btn--sm { min-height: 26px; padding: 2px 10px; font-size: 0.8125rem; }
/* Section label + inline control on one row, title left and control right.
   The wrapper owns the section-label's vertical rhythm; the h2 margin resets to 0. */
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin: 28px 0 10px;
}
.section-head .section-label { margin: 0; }
/* Unboxed row for segmented buttons (the .pill-row shape, no .filter-bar chrome). */
.seg-row { display: flex; gap: 6px; }
/* Card title + inline toggle on one row — the in-card variant of .section-head with no
   outer margin (the .chart-card padding owns the rhythm). */
.chart-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin: 0 0 8px;
}
.chart-head h3 { margin: 0; }
/* Single icon toggle in a chart head (swaps the panel's lens) — the compact icon-button shape
   from the rail toggle, vertically centered against the baseline-aligned title. */
.chart-swap {
  flex: 0 0 auto; align-self: center;
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; padding: 0;
  border: 1px solid var(--hairline); border-radius: var(--radius-md);
  background: var(--page); color: var(--text-2); cursor: pointer;
}
.chart-swap:hover { background: rgba(0, 0, 0, 0.045); color: var(--ink); }
.chart-swap:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chart-swap svg { width: 15px; height: 15px; display: block; }

/* ----------------------------------------------------------------------- tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--hairline); border-radius: var(--radius-lg); }
table.data {
  border-collapse: collapse; width: 100%;
  font-size: 13px;
}
table.data th {
  text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--text-3);
  background: var(--surface);
  padding: 8px 10px; border-bottom: 1px solid var(--hairline);
  position: sticky; top: 0;
  white-space: nowrap;
}
table.data td {
  padding: 7px 10px; border-bottom: 1px solid var(--hairline);
  white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis;
}
table.data tbody tr:last-child td { border-bottom: none; }
table.data tbody tr:hover { background: rgba(0, 0, 0, 0.025); }
table.data tbody tr.clickable { cursor: pointer; }
table.data td.clickable { cursor: pointer; }
td.num { text-align: right; }
/* The principal KPI cell in a comparison pair (e.g. KM median beside the muted naive median):
   heavier weight + full ink so the eye lands on it first while the .muted comparison recedes. */
td.num--key { font-weight: 600; color: var(--ink); }
a { color: var(--accent); }

.pager { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; color: var(--text-2); }

/* History: a sticky delete bar stays reachable no matter how far the table is scrolled;
   the table header sticks just beneath it (its height offsets the header's own sticky top). */
.history-actionbar {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: center; gap: 12px;
  padding: 8px 0; margin-bottom: 8px;
  background: var(--page); border-bottom: 1px solid var(--hairline);
}
.history-table th { top: 53px; }
/* Above the mobile breakpoint, take the history table out of its own scroll context so the
   sticky <th> reference becomes `main` (which scrolls). A wide table still scrolls inside the
   content pane via main's own overflow. At <=800px the inherited .table-wrap contained scroll
   stays (the fixed-viewport shell is off there and sticky headers aren't expected). */
@media (min-width: 801px) { .history-table-wrap { overflow: visible; } }
.th-sort {
  background: none; border: none; box-shadow: none; padding: 0; min-height: 0;
  font: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--text-3); cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px;
}
.th-sort:hover { color: var(--ink); }
.th-sort:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* ---------------------------------------------------- insight ranks & mix strips */
.rank-list { margin-top: 4px; }
.rank-row {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  padding: 10px 0; border-bottom: 1px solid var(--hairline);
}
.rank-row > div:first-child { flex: 1; min-width: 0; }
.rank-row:last-of-type { border-bottom: none; }
.mix-strip {
  display: flex; height: 8px; max-width: 420px; border-radius: 999px;
  overflow: hidden; background: rgba(0, 0, 0, 0.07);
}
.mix-strip span { height: 100%; }
/* Breakdown severity cell: the proportional strip over its exact per-severity counts. */
.mix-cell { display: flex; flex-direction: column; gap: 4px; }
.mix-text { white-space: nowrap; }
/* Concentration rows carry a name over a proportional bar over a meta line, so the name
   needs its own weight and the value needs to hold the right edge. */
.rank-row__name { font-weight: 500; margin-bottom: 5px; }
.rank-row__value { font-weight: 600; font-size: 15px; flex: none; }

/* ------------------------------------------------------------- risk tiers & funnel */
/* Tier swatches. One saturated status colour (tier 1) over a monotone neutral ramp — see
   the note above TIER_COLORS in charts.js for why this is not the severity ramp. The
   unclassified swatch is HATCHED rather than filled: it is a measurement gap, not a low
   score, and a flat swatch would read as one more rung on the ladder. */
.tier-swatch {
  display: inline-block; width: 10px; height: 10px; border-radius: 3px;
  margin-right: 8px; flex: none; vertical-align: 0;
}
.tier-swatch--hatch {
  background-image: repeating-linear-gradient(
    45deg, #9ca3af 0 2px, #e4e4e9 2px 4px);
  border: 1px solid #9ca3af;
}

/* The triage funnel: rungs that narrow. The bar is proportional to the widest step so the
   narrowing is visible at a glance; the "% of the step above" line underneath is what stays
   legible when a step drops two orders of magnitude, which on a Critical-only register it
   routinely does. */
.funnel { display: flex; flex-direction: column; gap: 14px; margin: 4px 0 8px; }
.funnel-step__head {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 5px;
}
.funnel-step__label { font-weight: 500; flex: 1 1 auto; min-width: 0; }
.funnel-step__value { font-size: 16px; font-weight: 600; }
.funnel-step__pct { font-size: 12px; flex: none; min-width: 84px; text-align: right; }
.funnel-step__note { margin: 5px 0 0; }
.funnel-track {
  height: 10px; border-radius: 999px; background: rgba(0, 0, 0, 0.06); overflow: hidden;
}
.funnel-fill { display: block; height: 100%; background: #6b7280; border-radius: 999px; }
/* The last rung is the one the hero counts, so it takes the page's single saturated mark. */
.funnel-step--act .funnel-fill { background: var(--sev-critical); }
.funnel-step--act .funnel-step__value { color: var(--sev-critical-text); }

/* Tier trend small multiples: one frame per tier, each on its own scale. A shared axis
   would flatten the smallest tier onto the baseline and read as "nothing here", which is
   the opposite of what a handful of known-exploited findings means. */
.spark-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 10px;
}
.spark {
  border: 1px solid var(--hairline); border-radius: var(--radius-lg);
  background: var(--page); padding: 8px 10px 6px;
}
.spark__head { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
.spark__glyph { font-size: 11px; line-height: 1; flex: none; }
.spark__label {
  font-size: 11px; color: var(--text-2); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.spark__box { position: relative; height: 34px; }
.spark__value { font-size: 15px; font-weight: 600; }

/* ------------------------------------------------------------------ chart cards */
.chart-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius-xl); padding: 16px; box-shadow: var(--shadow-card); }
.chart-card h3 { margin-bottom: 10px; }
/* Cap at 3 columns: each track is at least a third of the row (minus the two 14px gaps),
   so a 4th never fits and the extra width from a collapsed rail widens the charts instead
   of adding columns. The 320px floor still lets it drop to 2 then 1 as the pane narrows. */
.chart-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(320px, (100% - 28px) / 3), 1fr));
  gap: 14px;
}
/* Two-up variant — two cards per row (one 14px gutter), collapsing to a single column on a
   narrow pane. Used by the Trends section. */
.chart-grid--2 {
  grid-template-columns: repeat(auto-fit, minmax(max(320px, (100% - 14px) / 2), 1fr));
}
.chart-box { position: relative; height: 240px; }
/* Distribution row: the survival curve spans 2 of the 3 chart blocks, the time-to-resolve
   histogram takes the third. align-items:start keeps each card at its natural height (the
   survival caption doesn't stretch the histogram); the span clamps to 1 when the grid drops
   to a single column, so the two cards stack on a narrow pane. */
.dist-grid { align-items: start; }
.chart-grid .dist-main { grid-column: span 2; }
/* Survival curve gets a little more vertical room than the 240px trend boxes so the
   staircase reads clearly, especially zoomed into a 5w window. */
.chart-box.chart-box--tall { height: 300px; }
/* Aging card: let the age histogram grow into the height the stretched grid gives it
   (its toggle-table sibling is taller) instead of a fixed 240px box. The canvas is taken
   out of flow so its rendered height never feeds back into the card's own height — the
   sibling panel drives the row height per view, and the chart just fills what's left. */
.chart-card.fill-height { display: flex; flex-direction: column; }
.chart-card.fill-height .chart-box { flex: 1 1 auto; height: auto; min-height: 240px; }
.chart-card.fill-height .chart-box > canvas { position: absolute; inset: 0; }
.chart-caption { margin-top: 10px; font-size: 12px; }
.chart-empty {
  position: absolute; inset: 0; margin: 0;
  display: flex; align-items: center; justify-content: center;
  text-align: center; font-size: 13px; padding: 0 24px;
}

/* --------------------------------------------------------------- finding sheet */
.sheet-scrim {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.28); z-index: var(--z-scrim);
  opacity: 0; transition: opacity 180ms ease-out;
}
.sheet-scrim.open { opacity: 1; }
.sheet {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: var(--z-sheet);
  width: min(520px, 92vw);
  background: var(--page);
  box-shadow: var(--shadow-sheet);
  transform: translateX(100%);
  transition: transform 220ms ease-out;
  display: flex; flex-direction: column;
}
.sheet.open { transform: translateX(0); }
/* Resize handle: a slim hit-strip on the sheet's left edge (the sheet itself is `position:
   fixed`, which is enough of a containing block for this absolutely-positioned child — no
   extra positioning context needed). The hit area is 6px so it's easy to grab, but the visible
   hairline is a slender 1px centered in it, brightening to the accent on hover/focus so it
   reads as "grabbable" without competing with the sheet's own left border at rest. No width
   transition here (or anywhere on .sheet) — live drag updates would look laggy if animated. */
.sheet-resize-handle {
  position: absolute; top: 0; left: 0; bottom: 0; width: 6px;
  cursor: ew-resize; touch-action: none; z-index: 1;
  background: transparent;
}
.sheet-resize-handle::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px;
  background: var(--hairline);
}
.sheet-resize-handle:hover::before {
  background: var(--accent);
}
.sheet-resize-handle:focus-visible {
  outline: 2px solid var(--accent); outline-offset: -2px;
}
.sheet-resize-handle:focus-visible::before,
.sheet-resize-handle:active::before {
  background: var(--accent); width: 2px;
}
.sheet-header {
  padding: 16px 20px 12px; border-bottom: 1px solid var(--hairline);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  flex: 0 0 auto;
}
.sheet-heading { min-width: 0; }
.sheet-title { font-size: 1rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.sheet-subtitle { margin-top: 2px; }
.sheet-close {
  flex: 0 0 auto; border: none; background: none; cursor: pointer;
  font-size: 15px; line-height: 1; color: var(--text-3); padding: 4px;
  border-radius: var(--radius-sm); margin: -4px -4px 0 0;
}
.sheet-close:hover { background: rgba(0, 0, 0, 0.045); color: var(--ink); }
.sheet-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sheet-body { padding: 14px 20px 24px; overflow-y: auto; flex: 1 1 auto; }
.sheet-actions { display: flex; justify-content: flex-end; gap: 8px; }
.scan-stall-note {
  margin: 12px 0 4px; padding: 8px 10px; font-size: 13px;
  color: var(--warn); background: rgba(161, 98, 7, 0.08);
  border: 1px solid rgba(161, 98, 7, 0.18); border-radius: var(--radius-md);
}
.sheet-section { margin-bottom: 18px; }
.sheet-section .label { margin-bottom: 6px; display: block; }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--text-3); margin: 0; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.raw-json {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius-lg); padding: 10px; font-size: 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space: pre-wrap; word-break: break-all; max-height: 320px; overflow: auto;
}

/* ---------------------------------------------------------------------- dialogs */
dialog {
  border: 1px solid var(--hairline);
  border-radius: var(--radius-xl);
  padding: 20px;
  max-width: min(560px, 94vw);
  /* Never grow past the viewport; a tall dialog scrolls instead of clipping its actions. */
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.2);
  font-family: var(--font);
}
dialog::backdrop { background: rgba(0, 0, 0, 0.28); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

/* Domains editor dialog: pin the heading and the Apply/Cancel row, scroll only the middle,
   so a domain with several rules keeps its actions reachable. */
dialog.domains-dialog { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
dialog.domains-dialog > h3 { margin: 0; padding: 20px 20px 10px; }
dialog.domains-dialog .dialog-scroll { flex: 1 1 auto; overflow-y: auto; padding: 0 20px 4px; }
dialog.domains-dialog .dialog-actions {
  margin: 0; padding: 14px 20px; border-top: 1px solid var(--hairline);
}

/* ----------------------------------------------------------------------- toasts */
#toasts { position: fixed; bottom: 18px; right: 18px; z-index: var(--z-toast); display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--graphite); color: var(--on-graphite);
  border-radius: var(--radius-lg); padding: 10px 16px; font-size: 13px;
  box-shadow: 0 6px 18px -6px rgba(0, 0, 0, 0.35);
  animation: toast-in 200ms ease-out;
  max-width: 380px;
}
.toast.warn { background: #3f2d04; }
.toast.error { background: #450a0a; }
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ------------------------------------------------------------------ empty state */
.empty {
  border: 1px dashed var(--hairline); border-radius: var(--radius-xl);
  padding: 40px 24px; text-align: center; color: var(--text-2);
}

/* domain editor rows */
.domain-row {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--hairline); border-radius: var(--radius-lg);
  padding: 8px 12px; margin-bottom: 8px; background: var(--page);
}
.domain-row .grow { flex: 1; min-width: 0; }

/* -------------------------------------------------------------- subscription picker */
.sub-picker {
  border: 1px solid var(--hairline); border-radius: var(--radius-md);
  max-height: 180px; overflow-y: auto; padding: 6px 8px; background: var(--page);
}
.sub-picker label {
  display: flex; align-items: center; gap: 6px; padding: 2px 0; font-size: 13px;
  cursor: pointer;
}
.sub-picker label.claimed { opacity: 0.55; cursor: not-allowed; }
.sub-picker .sub-name {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sub-owner { color: var(--text-2); font-size: 11px; margin-left: auto; white-space: nowrap; }
.sub-add { display: flex; gap: 6px; margin-top: 6px; }

/* --------------------------------------------------------- settings panels */
/* A shadcn-style settings card (ui.js settingsPanel): the .card recipe with a header
   (title + description), a body of controls, and an optional hairline-topped footer for the
   action. One topic per card, action in the footer — the standard settings layout. Neutral
   surface + hairline + card whisper only (no side-stripe, no heavier float). */
.settings-panel {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 18px 20px;
  margin: 0 0 16px;
}
.settings-panel__title { font-size: 0.9375rem; font-weight: 600; margin: 0; }
.settings-panel__desc { margin: 4px 0 0; max-width: 72ch; }
.settings-panel__body { margin-top: 14px; }
/* No description → the body sits directly under the title with tighter rhythm. */
.settings-panel__head:not(:has(.settings-panel__desc)) + .settings-panel__body { margin-top: 12px; }
.settings-panel__foot {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--hairline);
}

/* Two labeled sub-blocks inside the Severity scope panel (scan scope / display filter),
   split by a hairline so the coupled pair reads as one control with two zones. */
.scope-block__note { margin: 4px 0 8px; }
.scope-block--divided {
  margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--hairline);
}

/* Setting row (ui.js settingRow): a bold label over a muted description on the left, the
   control (a switch / number input) on the right. Rows within one panel body are separated by
   a hairline, echoing the stat-card list. */
.setting-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; padding: 12px 0;
}
.setting-row + .setting-row { border-top: 1px solid var(--hairline); }
.settings-panel__body > .setting-row:first-child { padding-top: 0; }
.settings-panel__body > .setting-row:last-child { padding-bottom: 0; }
.setting-row__label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.setting-row__title { font-size: 13px; font-weight: 600; color: var(--ink); }
.setting-row__desc { max-width: 64ch; }
.setting-row__control { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }

/* Accessible on/off switch (ui.js switchToggle). The real checkbox overlays the track
   (opacity 0, still focusable/clickable); the track + thumb are the painted control. */
.switch {
  position: relative; display: inline-block; flex: none;
  width: 36px; height: 20px; cursor: pointer;
}
.switch__input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.switch__track {
  position: absolute; inset: 0; border-radius: 999px;
  background: rgba(0, 0, 0, 0.16); border: 1px solid transparent;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.switch__thumb {
  position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--page); box-shadow: var(--shadow-button);
  transition: transform 0.15s ease;
}
.switch__input:checked + .switch__track { background: var(--accent); }
.switch__input:checked + .switch__track .switch__thumb { transform: translateX(16px); }
.switch__input:focus-visible + .switch__track {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.switch__input:disabled { cursor: not-allowed; }
.switch__input:disabled + .switch__track { opacity: 0.5; }
.switch:has(.switch__input:disabled) { cursor: not-allowed; }

/* Capacity meter (ui.js usageMeter): caption over a track/fill bar reusing .progress-track.
   The warn/bad state recolors the fill AND the note text — meaning never rides on color alone
   (the number and note carry it too). */
.usage-meter__head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  margin-bottom: 6px;
}
.usage-meter__caption { font-size: 13px; color: var(--text-2); }
.usage-meter__track.warn .progress-fill { background: var(--warn); }
.usage-meter__track.bad .progress-fill { background: var(--bad); }
.usage-meter__note { margin: 8px 0 0; color: var(--text-2); }
.usage-meter__note.warn { color: var(--warn); }
.usage-meter__note.bad { color: var(--bad); }

/* Per-tab capacity breakdown (capacity.js renderCapacity). Nine tabs is past the point where
   hue can carry identity, so this is a table and every bar wears the same accent: the reader's
   job is comparing magnitude, not telling series apart, and the cell counts beside each bar
   are the authoritative reading. Bars are scaled against the largest tab, not the 10M ceiling
   — against the ceiling every row would be an identical hairline. */
.capacity-table { margin-top: 16px; }
.capacity-share { white-space: nowrap; }
.capacity-bar {
  display: inline-block; vertical-align: middle; margin-right: 8px;
  width: 64px; height: 6px; border-radius: 999px;
  background: rgba(0, 0, 0, 0.07); overflow: hidden;
}
.capacity-bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
@media (max-width: 560px) { .capacity-bar { display: none; } }

/* Domain-row polish: compact inline buttons so the reorder/edit/delete cluster reads tighter
   than page-scale actions (no structural change — see domainsEditor.js renderList). */
.domain-row button { min-height: 30px; padding: 4px 10px; }
.domain-row__actions { display: flex; gap: 6px; flex: 0 0 auto; }

/* ---------------------------------------------------- domain rule builder (dialog) */
/* The Add/Edit domain dialog's rule authoring UI (domainsEditor.js openEditor). Rules are
   OR-ed (shown by an OR divider between cards); a rule's conditions are AND-ed (shown by the
   IF/AND connector on each condition row). Neutral surface cards, hairline borders, dashed
   "add" affordances, and a pinned live-match preview above the actions. */
.rules-host { display: flex; flex-direction: column; }
.rule-card {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  padding: 12px 14px;
}
.rule-card__head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-bottom: 10px;
}
.rule-card__title {
  display: inline-flex; align-items: baseline; gap: 8px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase;
  color: var(--text-2);
}
.rule-card__hint {
