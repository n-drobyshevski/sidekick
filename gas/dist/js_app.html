ced. Mean remediation time (KM \xB7 RMST) is marked on the survival curve rather than published as a second headline."]},{id:"naive-median",term:"Median (naive, closed)",lines:["Median days from first detection to remediation, counting closed findings only \u2014 no censoring.","A wave of fresh open findings biases this down, which is exactly what the Kaplan\u2013Meier headline corrects for.","It is published because it is the one MTTR figure with a saved history series, not because it is the better number."]},{id:"vendor-fix-wait",term:"Wait for a vendor fix",lines:["Kaplan\u2013Meier median wait for a fix to become available, measured from our first detection and from CVE publication.","Findings still awaiting one are censored, not dropped: excluding them would leave only the vulnerabilities that got fixed and measure how fast the fixed ones were fixed.","This is the vendor's half of the exposure \u2014 our half is the actionable clock, which starts where this one ends. A wait whose origin or availability date was never captured is unmeasured and excluded, never counted as a zero-length wait."]},{id:"mttr-by-dimension",term:"MTTR by dimension",lines:["The same remediation clock, split by whichever dimension the page is grouped on and replayed as of each scan.","KM is the principal figure: per-group Kaplan\u2013Meier medians, still-open findings censored. Naive is the median of closed findings only, kept alongside as the biased comparison KM corrects for."]},{id:"mttr-contribution",term:"Contribution to MTTR",lines:["Each group's resolved findings \xD7 (its KM median \u2212 the overall KM median), in finding\xB7days. Right of the zero line the group dragged the headline MTTR up; left of it, it held MTTR down.","Leverage, not rate: a slightly-slow group that closes a lot outweighs a very-slow one that closes little.","A proxy rather than an exact split \u2014 the overall KM median is a censored-survival statistic, not a weighted average of the per-group ones \u2014 "Outside the 2\xD72 on purpose: these findings are not low risk, they are unscored.","Counting them as low risk would inflate efficiency and deflate coverage at the same time, so they are excluded from both and reported separately.","Absent is never zero. A signal nobody evaluated is a different fact from a signal that came back clean."]},{id:"coverage-efficiency-trend",term:"Coverage & efficiency over time",lines:["Both rates recomputed at each date over the findings that existed then: a finding counts as remediated from its resolution date onward, and as open before it.","Risk classification is NOT re-evaluated per date: each finding carries the signals ever observed for it, so a CVE that only reached the KEV catalog later counts as high risk in earlier points too.","That reads pessimistically early, and it is what stops last week's plotted value from moving every time a scan lands. The shaded stretch before the first saved scan is reconstructed from first-detection dates, so closures there are under-counted."]},{id:"rule-sensitivity",term:"How much the rule choice matters",lines:["Each point is one combination of signals scored over this same register: how much of what THAT rule calls high risk got fixed (coverage, across) against how much of the fixing it would credit (efficiency, up).","Up and to the right is better, and no rule reaches the corner \u2014 that trade-off is the whole reason both numbers are published.","It measures sensitivity to the rule, not which rule is right: the ground truth here is the rule itself, so a narrow rule can look flattering simply by flagging less."]},{id:"sla-band",term:"SLA band",lines:["An SLA is a band the population is kept inside, not a wall a single finding hits.","Read it as a distribution: how much of the window each open finding has consumed, and how many are already past it."]},{id:"capacity",term:"Remediation capacity",lines:["Only capacity absorbs inflow: the verdict compares the close rate with the arrival rate, no
