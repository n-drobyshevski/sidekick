g rule performed against this scan, under first-match priority: a finding is claimed by the first rule that matches it, so a rule's health is relative to the ones above it.","Fires \u2014 the rule claims findings. Shadowed \u2014 it matches findings, but an earlier rule or group claims them first. Never matches \u2014 it matches nothing in this scan, a dead rule.","Malformed \u2014 the rule failed to compile, so it never matches anything. Malformed and Never matches both claim nothing, and only one of them is a typo."]},{id:"km-median",term:"Median MTTR (Kaplan\u2013Meier)",lines:["Median days from first detection to remediation, read off a Kaplan\u2013Meier survival curve. Still-open findings count as censored observations instead of being ignored, so a wave of fresh open findings can't bias it down.",'"> X d" means the curve never dropped to 50% within the observed window \u2014 over half of tracked findings are still open, so the true median is at least that many days out.',"A vuln that disappears between scans counts as resolved, dated to the scan that noticed. Mean remediation time (KM \xB7 RMST) is marked on the survival curve rather than published as a second headline."]},{id:"naive-median",term:"Median (naive, closed)",lines:["Median days from first detection to remediation, counting closed findings only \u2014 no censoring.","A wave of fresh open findings biases this down, which is exactly what the Kaplan\u2013Meier headline corrects for.","It is published because it is the one MTTR figure with a saved history series, not because it is the better number."]},{id:"vendor-fix-wait",term:"Wait for a vendor fix",lines:["Kaplan\u2013Meier median wait for a fix to become available, measured from our first detection and from CVE publication.","Findings still awaiting one are censored, not dropped: excluding them would leave only the vulnerabilities that got fixed and measure how fast the fixed ones were fixed.","This is the vendor's half of the exposure \u2014 our half is the actionable clock, which starts where this one ends. A wait whose origin or availability date was never captured is unmeasured and excluded, never counted as a zero-length wait."]},{id:"mttr-by-dimension",term:"MTTR by dimension",lines:["The same remediation clock, split by whichever dimension the page is grouped on and replayed as of each scan.","KM is the principal figure: per-group Kaplan\u2013Meier medians, still-open findings censored. Naive is the median of closed findings only, kept alongside as the biased comparison KM corrects for."]},{id:"mttr-contribution",term:"Contribution to MTTR",lines:["Each group's resolved findings \xD7 (its KM median \u2212 the overall KM median), in finding\xB7days. Right of the zero line the group dragged the headline MTTR up; left of it, it held MTTR down.","Leverage, not rate: a slightly-slow group that closes a lot outweighs a very-slow one that closes little.","A proxy rather than an exact split \u2014 the overall KM median is a censored-survival statistic, not a weighted average of the per-group ones \u2014 so read the magnitudes as relative."]},{id:"median-mttr-by-dimension",term:"Median MTTR by dimension",lines:["Each group's Kaplan\u2013Meier median, ranked slowest first against a dashed line at the overall KM median. Bars past the line take longer than the register median.","The pure rate, ignoring volume: a very-slow group tops this even if it closed only a handful. Contribution to MTTR is the same medians weighted by resolved count, which is where the real leverage shows."]},{id:"triage-funnel",term:"Triage funnel",lines:["Open findings only. Each step is a strict subset of the one above it, so the counts narrow rather than overlapping.","Exploit intelligence comes from the durable ledger; internet exposure comes from the current scan and cannot be replayed over history.","Which is why the funnel STOPS rather than reading zero when a scan did not capture exposure: two steps of zero would say none, and none is not what was measured."]},{id:"risk-tiers",term:"Risk tiers",lines:["A refinement of the same high-risk rule the Program page scores against, applied one finding at a time.","A finding takes its strongest signal, so the tiers partition the backlog rather than overlapping \u2014 every open finding sits in exactly one.","The unclassified count here and on the Program page always agree, because they are the same population read through the same rule."]},{id:"coverage",term:"Remediation coverage",lines:["Of every finding the active rule calls high risk, the share that has been remediated: TP / (TP + FN).","The bracketed range is what coverage would be if every unclassified finding turned out to be high risk (low end) or not (high end). It closes to a single number once every finding carries a captured exploit signal.","Higher is better, but coverage alone is easy to buy by fixing everything \u2014 it is never published apart from efficiency."]},{id:"efficiency",term:"Efficiency",lines:["Of everything remediated, the share that was actually high risk: TP / (TP + FP).","The remainder is effort spent on findings the rule did not flag. Some of that is unavoidable \u2014 one patch often closes several CVEs at once, and only one of them may be the dangerous one.","Picking findings at random would score about the prevalence of high risk among classified findings, so efficiency at or below that means the program is not prioritizing."]},{id:"cell-tp",term:"Fixed, and it mattered (TP)",lines:["High risk under the active rule, and remediated.","The numerator of both coverage and efficiency \u2014 the one cell that moves both numbers the same way."]},{id:"cell-fp",term:"Fixed, but low risk (FP)",lines:["Not high risk under the active rule, but remediated anyway.","Effort that may have been more productive elsewhere \u2014 this is what pulls efficiency down. It leaves coverage untouched, which is why efficiency has to be read beside it."]},{id:"cell-fn",term:"High risk, still open (FN)",lines:["High risk under the active rule and not yet remediated.","Unremediated risk \u2014 this is what pulls coverage down, and the only cell that shrinks by doing the work rather than by moving the rule."]},{id:"cell-tn",term:"Correctly deprioritized (TN)",lines:["Not high risk under the active rule, and still open.","Work correctly left undone. It appears in neither rate's numerator nor either denominator, so a large TN is neither good news nor bad on its own."]},{id:"cell-unclassified-remediated",term:"Unclassified, remediated",lines:["Remediated, but no exploit signal was ever captured for it, so it cannot be scored either way.","Excluded from both rates and reflected in their published ranges \u2014 never folded into a corner of the 2\xD72."]},{id:"cell-unclassified-open",term:"Unclassified, still open",lines:["Still open, and no exploit signal was ever captured for it.","Excluded from both rates and reflected in their published ranges. Still open is not the same claim as not high risk."]},{id:"no-captured-signal",term:"No captured signal",lines:["Outside the 2\xD72 on purpose: these findings are not low risk, they are unscored.","Counting them as low risk would inflate efficiency and deflate coverage at the same time, so they are excluded from both and reported separately.","Absent is never zero. A signal nobody evaluated is a different fact from a signal that came back clean."]},{id:"coverage-efficiency-trend",term:"Coverage & efficiency over time",lines:["Both rates recomputed at each date over the findings that existed then: a finding counts as remediated from its resolution date onward, and as open before it.","Risk classification is NOT re-evaluated per date: each finding carries the signals ever observed for it, so a CVE that only reached the KEV catalog later counts as high risk in earlier points too.","That reads pessimistically early, and it is what stops last week's plotted value from moving every time a scan lands. The shaded stretch before the first saved scan is reconstructed from first-detection dates, so closures there are under-counted."]},{id:"rule-sensitivity",term:"How much the rule choice matters",lines:["Each point is one combination of signals scored over this same register: how much of what THAT rule calls high risk got fixed (coverage, across) against how much of the fixing it would credit (efficiency, up).","Up and to the right is better, and no rule reaches the corner \u2014 that trade-off is the whole reason both numbers are published.","It measures sensitivity to the rule, not which rule is right: the ground truth here is the rule itself, so a narrow rule can look flattering simply by flagging less."]},{id:"sla-band",term:"SLA band",lines:["An SLA is a band the population is kept inside, not a wall a single finding hits.","Read it as a distribution: how much of the window each open finding has consumed, and how many are already past it."]},{id:"capacity",term:"Remediation capacity",lines:["Only capacity absorbs inflow: the verdict compares the close rate with the arrival rate, not a count.","Gaining ground, keeping up and falling behind are the three readings of that comparison, with a dead band so a flat month is not a verdict."]},{id:"half-life",term:"Remediation half-life",lines:["How long it takes for half of what is open today to be remediated.","Read off a Kaplan\u2013Meier survival curve, so findings that are still open count as evidence rather than being dropped.","Preferred to a mean because remediation is long-tailed: a mean moves when a batch of easy findings closes, and can improve while real exposure does not."]},{id:"lower-bound",term:"Lower bound",lines:["A duration the curve never reached: more than half of what was tracked is still open, so the median is at least this far out and cannot be read exactly.",'Prose says "at least N days" and a figure says "\u2265 N" \u2014 one notation per context, and inclusive either way, which is why "more than" would be a different claim.']},{id:"censoring",term:"Censored",lines:["A finding that is still open has been open at least this long, but we do not know how long it will end up taking.","Dropping those rows and averaging what is left is the single most common way a remediation figure flatters its owner.","The curve keeps them as right-censored observations, which is what makes the half-life honest."]},{id:"fix-next",term:"Fix next",lines:["Ranked by what cannot wait rather than by severity: a known-exploited finding on a reachable host, then an exploitable finding already past its window, then a critical one already past its window.","Grouped by the team or subscription that would be asked, because that is the smallest unit somebody can be asked to own."]},{id:"movement",term:"Movement",lines:["The open backlog now against the same register a week or more of scanning ago. A rising count is worse.","The comparison is between two scans, not between two calendar dates \u2014 a register only learns anything on the days it looks.","The two scans have to be at least a week apart. Closer than that and no comparison is published rather than a noisy one."]},{id:"scan",term:"Scan",lines:["The act, and the record it leaves: running one reads the register from Wiz and saves a row in Scan History for what it found.","Wiz's own detectors run continuously and are a different thing \u2014 this word names the read-and-save operation this app runs, on demand."]},{id:"disappearance",term:"Dated by disappearance",lines:["A finding dated resolved at the first scan that stopped returning it, because the API publishes no resolution date for it.",'An upper bound whose error is the interval between two scans: "gone by 12 Aug", never "resolved 12 Aug".',"Until two scans have run and findings have begun to disappear between them, a register dated this way reads near-zero \u2014 an absence of observations, not a fast team."]},{id:"sla-target",term:"SLA target",lines:["The remediation window for a severity, in days.","In SLA means resolved on or before the target \u2014 the comparison is inclusive."]},{id:"awaiting-fix",term:"Awaiting a vendor fix",lines:["An open finding whose vendor has not published a fixed version yet.","Counting the wait for a vendor as remediation time measures the vendor, not the team, so these findings are reported separately."]},{id:"two-clocks",term:"The two clocks",lines:["Detection to remediation is one clock; it includes any time spent waiting for a vendor fix to exist.","The actionable clock is the second: it starts once a fix becomes available, and is the only one the team controls.","Both are published, because either alone can be read as the whole story."]},{id:"kev",term:"On KEV",lines:["CISA's Known Exploited Vulnerabilities catalogue: CVEs with reliable evidence that someone, somewhere, has actually exploited them.","Observed exploitation of the CVE \u2014 not a statement that this finding is reachable here. It raises the priority of a finding; it does not decide it.","A row Wiz never evaluated against the catalogue is unknown, not absent from it, which is why these counts are reported as a floor."]},{id:"known-exploit",term:"Known exploit",lines:["Public exploit code exists for the CVE.","A weaker claim than KEV and a different one: code being published is not the same as exploitation having been observed. A CVE can carry this and not be on KEV, and the reverse."]},{id:"epss",term:"EPSS score",lines:["Exploit Prediction Scoring System: the estimated probability that a CVE will be exploited in the next 30 days.","A FORECAST, not an observation \u2014 the one signal here that says what may happen rather than what has. It is a probability, so a high score on a large register still describes many findings that will never be attacked."]},{id:"sla-edge",term:"SLA edge",lines:["The day count that splits one severity's open findings into late and not late \u2014 its own SLA target, read against the age buckets.","A deadline rarely lands on a bucket's boundary, so a bucket is usually part in and part out; a rule is drawn on the chart only where every severity shares one exact edge."]},{id:"returned",term:"Returned",lines:["Seen again after it had been resolved. Its clock restarted on this sighting.","The earlier episode is not in this figure \u2014 a returned finding's age counts only from the return."]},{id:"rail-status",term:"Rail status",lines:["Only exceptions speak: a scan running, a scan that failed, no register collected, never scanned, an unreadable date, or stale.","Never-scanned outranks stale: a register nobody has looked at is unmeasured, not old."]},{id:"compaction",term:"Compaction",lines:["Sealing rolls the oldest closed findings into exact episode rows and prunes their raw archives \u2014 MTTR and every trend stay identical.","The two most recent full scans are never candidates, and the dry run states what would go before anything goes."]},{id:"sealed",term:"Sealed",lines:["A saved scan whose closed findings compaction has already rolled into episode rows and whose raw archive has been pruned.","A sealed scan can't be deleted from Scan History \u2014 its archive was reclaimed when it was sealed."]},{id:"episode",term:"Episode",lines:["One finding's settled lifetime \u2014 first seen, how it ended, when \u2014 kept after the scan that carried it was sealed.","The clock survives compaction; the per-scan observations behind it do not. A finding seen again after its episode begins a new one."]},{id:"unclassified",term:"Unclassified",lines:["A finding no exploit signal was ever captured for, so the high-risk rule could not place it either way.","Not the same as low risk: absent is never zero. It is reported separately rather than folded into a corner of the matrix or the tier breakdown."]},{id:"reconstructed",term:"Reconstructed",lines:["A point whose figures were rebuilt rather than directly observed, because it falls before this register's first saved scan.","Marked so it is not read as measured \
