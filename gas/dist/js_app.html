laimed by the first rule that matches it, so a rule's health is relative to the ones above it.","Fires \u2014 the rule claims findings. Shadowed \u2014 it matches findings, but an earlier rule or group claims them first. Never matches \u2014 it matches nothing in this scan, a dead rule.","Malformed \u2014 the rule failed to compile, so it never matches anything. Malformed and Never matches both claim nothing, and only one of them is a typo."]},{id:"km-median",term:"Median MTTR (Kaplan\u2013Meier)",lines:["Median days from first detection to remediation, read off a Kaplan\u2013Meier survival curve. Still-open findings count as censored observations instead of being ignored, so a wave of fresh open findings can't bias it down.",'"> X d" means the curve never dropped to 50% within the observed window \u2014 over half of tracked findings are still open, so the true median is at least that many days out.',"A vuln that disappears between scans counts as resolved, dated to the scan that noticed. Mean remediation time (KM \xB7 RMST) is marked on the survival curve rather than published as a second headline."]},{id:"naive-median",term:"Median (naive, closed)",lines:["Median days from first detection to remediation, counting closed findings only \u2014 no censoring.","A wave of fresh open findings biases this down, which is exactly what the Kaplan\u2013Meier headline corrects for.","It is published because it is the one MTTR figure with a saved history series, not because it is the better number."]},{id:"vendor-fix-wait",term:"Wait for a vendor fix",lines:["Kaplan\u2013Meier median wait for a fix to become available, measured from our first detection and from CVE publication.","Findings still awaiting one are censored, not dropped: excluding them would leave only the vulnerabilities that got fixed and measure how fast the fixed ones were fixed.","This is the vendor's half of the exposure \u2014 our half is the actionable clock, which starts where this one ends. A wait whose origin or availability date was never captured is unmeasured and excluded, never counted as a zero-length wait."]},{id:"mttr-by-dimension",term:"MTTR by dimension",lines:["The same remediation clock, split by whichever dimension the page is grouped on and replayed as of each scan.","KM is the principal figure: per-group Kaplan\u2013Meier medians, still-open findings censored. Naive is the median of closed findings only, kept alongside as the biased comparison KM corrects for."]},{id:"mttr-contribution",term:"Contribution to MTTR",lines:["Each group's resolved findings \xD7 (its KM median \u2212 the overall KM median), in finding\xB7days. Right of the zero line the group dragged the headline MTTR up; left of it, it held MTTR down.","Leverage, not rate: a slightly-slow group that closes a lot outweighs a very-slow one that closes little.","A proxy rather than an exact split \u2014 the overall KM median is a censored-survival statistic, not a weighted average of the per-group ones \u2014 so read the magnitudes as relative."]},{id:"median-mttr-by-dimension",term:"Median MTTR by dimension",lines:["Each group's Kaplan\u2013Meier median, ranked slowest first against a dashed line at the overall KM median. Bars past the line take longer than the register median.","The pure rate, ignoring volume: a very-slow group tops this even if it closed only a handful. Contribution to MTTR is the same medians weighted by resolved count, which is where the real leverage shows."]},{id:"triage-funnel",term:"Triage funnel",lines:["Open findings only. Each step is a strict subset of the one above it, so the counts narrow rather than overlapping.","Exploit intelligence comes from the durable ledger; internet exposure comes from the current scan and cannot be replayed over history.","Which is why the funnel STOPS rather than reading zero when a scan did not capture exposure: two steps of zero would say none, and none is not what was measured."]},{id:"risk-tiers",term:"Risk tiers",lines:["A refinement of the same high-risk rule the Program page scores against, applied one finding at a time.","A finding takes its strongest signal, so the tiers partition the backlog rather than overlapping \u2014 every open finding sits in exactly one.","The unclassified count here and on the Program page always agree, because they are the same population read through the same rule."]},{id:"coverage",term:"Remediation coverage",lines:["Of every finding the active rule calls high risk, the share that has been remediated: TP / (TP + FN).","The bracketed range is what coverage would be if every unclassified finding turned out to be high risk (low end) or not (high end). It closes to a single number once every finding carries a captured exploit signal.","Higher is better, but coverage alone is easy to buy by fixing everything \u2014 it is never published apart from efficiency."]},{id:"efficiency",term:"Efficiency",lines:["Of everything remediated, the share that was actually high risk: TP / (TP + FP).","The remainder is effort spent on findings the rule did not flag. Some of that is unavoidable \u2014 one patch often closes several CVEs at once, and only one of them may be the dangerous one.","Picking findings at random would score about the prevalence of high risk among classified findings, so efficiency at or below that means the program is not prioritizing."]},{id:"cell-tp",term:"Fixed, and it mattered (TP)",lines:["High risk under the active rule, and remediated.","The numerator of both coverage and efficiency \u2014 the one cell that moves both numbers the same way."]},{id:"cell-fp",term:"Fixed, but low risk (FP)",lines:["Not high risk under the active rule, but remediated anyway.","Effort that may have been more productive elsewhere \u2014 this is what pulls efficiency down. It leaves coverage untouched, which is why efficiency has to be read beside it."]},{id:"cell-fn",term:"High risk, still open (FN)",lines:["High risk under the active rule and not yet remediated.","Unremediated risk \u2014 this is what pulls coverage down, and the only cell that shrinks by doing the work rather than by moving the rule."]},{id:"cell-tn",term:"Correctly deprioritized (TN)",lines:["Not high risk under the active rule, and still open.","Work correctly left undone. It appears in neither rate's numerator nor either denominator, so a large TN is neither good news nor bad on its own."]},{id:"cell-unclassified-remediated",term:"Unclassified, remediated",lines:["Remediated, but no exploit signal was ever captured for it, so it cannot be scored either way.","Excluded from both rates and reflected in their published ranges \u2014 never folded into a corner of the 2\xD72."]},{id:"cell-unclassified-open",term:"Unclassified, still open",lines:["Still open, and no exploit signal was ever captured for it.","Excluded from both rates and reflected in their published ranges. Still open is not the same claim as not high risk."]},{id:"no-captured-signal",term:"No captured signal",lines:["Outside the 2\xD72 on purpose: these findings are not low risk, they are unscored.","Counting them as low risk would inflate efficiency and deflate coverage at the same time, so they are excluded from both and reported separately.","Absent is never zero. A signal nobody evaluated is a different fact from a signal that came back clean."]},{id:"coverage-efficiency-trend",term:"Coverage & efficiency over time",lines:["Both rates recomputed at each date over the findings that existed then: a finding counts as remediated from its resolution date onward, and as open before it.","Risk classification is NOT re-evaluated per date: each finding carries the signals ever observed for it, so a CVE that only reached the KEV catalog later counts as high risk in earlier points too.","That reads pessimistically early, and it is what stops last week's plotted value from moving every time a scan lands. The shaded stretch before the first saved scan is reconstructed from first-detection dates, so closures there are under-counted."]},{id:"rule-sensitivity",term:"How much the rule choice matters",lines:["Each point is one combination of signals scored over this same register: how much of what THAT rule calls high risk got fixed (coverage, across) against how much of the fixing it would credit (efficiency, up).","Up and to the right is better, and no rule reaches the corner \u2014 that trade-off is the whole reason both numbers are published.","It measures sensitivity to the rule, not which rule is right: the ground truth here is the rule itself, so a narrow rule can look flattering simply by flagging less."]}];function Ki(t){let n=String(t||"").trim().toLowerCase();return n&&Vi.find(s=>s.id===n)||null}function Wi(){return Vi.slice()}function _c(t){return t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}function ka(t){return String(t==null?"":t).trim().toLowerCase()}function Ic(t,n){if(!n.length)return!0;let s=(t.term+" "+t.lines.join(" ")).toLowerCase();return n.every(a=>new RegExp("\\b"+_c(a)).test(s))}function $c(t,n,s){let a=Array.isArray(t)?t:[],o=ka(n).split(/\s+/).filter(Boolean),i=ka(s),p=[...a.filter(h=>Ic(h,o))].sort((h,d)=>h.term.localeCompare(d.term)).map(h=>({id:h.id,term:h.term,lines:h.lines.slice(),linked:!!i&&h.id===i}));return{groups:p.length?[{family:null,entries:p}]:[],match:i&&a.some(h=>h.id===i)?i:null,total:a.length}}function zi(t){return"term-"+t}function Oc(t){let n=e("div",{class:"help-entry"+(t.linked?" help-entry--linked":""),id:zi(t.id),tabindex:"-1","aria-current":t.linked?"true":null});n.append(e("div",{class:"help-entry-term"},e("span",{},t.term),t.linked?e("span",{class:"help-entry-linked-tag"},"\u21B3 linked"):null));for(let s of t.lines)n.append(e("p",{class:"help-entry-line"},s));return n}function Pc(t,n){M(t);for(let s of n){s.family&&n.length>1&&t.append(e("h2",{class:"section-label"},s.family));let a=e("div",{class:"help-list"});for(let o of s.entries)a.append(Oc(o));t.append(a)}}function Dc(t){if(!t)return!1;let n=t.tagName;return n==="INP
