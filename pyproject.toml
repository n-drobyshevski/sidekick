[project]
name = "wiz-dashboard"
version = "0.1.0"
description = "Python domain and test support for the Wiz registers and GAS ports."
requires-python = ">=3.10"
wiz_sdk = { url = "https://downloads.wiz.io/customer-files/wiz-sdk-python/wiz-sdk-0.9.22.tar.gz" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
# brick/notebooks/*.ipynb: 154 findings -> 3 (measured). All but the 3 real F541 (fixed in
# import_bundle.py) are inherent: F821 (87) is spark/dbutils/displayHTML, injected by the
# Databricks runtime; E401/E402 (18+8) is the boot cell's required import shape, asserted
# byte-identical by a test. 36 are invalid-syntax -- ruff parses %sql cells as Python, a
# parse error has no rule code, so per-file-ignores can't reach it; extend-exclude can.
# brick/tests/test_notebooks.py is the real gate: it runs every %sql cell against real
# pipeline output, requires all nine page boot cells byte-identical, and bans metric
# arithmetic and matplotlib in a cell.
extend-exclude = ["brick/notebooks"]
